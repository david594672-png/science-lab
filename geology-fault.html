<!DOCTYPE html>
<html lang="zh-Hant" data-subject="earth">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>斷層、褶皺與地球構造</title>
<link rel="stylesheet" href="lab-kit.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="cv" aria-label="地層斷層、褶皺與地球內部的 3D 模型"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g9">← 回課程總覽</a>
  <h1>斷層與褶皺</h1>
  <p class="sub">國三地科 · 板塊運動與地球歷史</p>

  <div class="body">
    <div class="modes" style="--n:3">
      <button class="mode" data-k="fault" aria-pressed="true">斷層</button>
      <button class="mode" data-k="fold" aria-pressed="false">褶皺</button>
      <button class="mode" data-k="earth" aria-pressed="false">地球<br>內部</button>
    </div>

    <div data-mode="fault">
      <div class="group">
        <div class="seg" style="--n:3" id="ftype">
          <button data-k="normal" aria-pressed="true">正斷層</button>
          <button data-k="reverse" aria-pressed="false">逆斷層</button>
          <button data-k="strike" aria-pressed="false">平移斷層</button>
        </div>
        <div class="ctrl" style="margin-top:10px">
          <label for="slip">錯動量 <output id="slipVal"></output></label>
          <input type="range" id="slip" min="0" max="1" step="0.01" value="0.6">
        </div>
        <div class="result" id="faultInfo"></div>
      </div>
    </div>

    <div data-mode="fold" hidden>
      <div class="group">
        <div class="ctrl">
          <label for="squeeze">擠壓程度 <output id="squeezeVal"></output></label>
          <input type="range" id="squeeze" min="0" max="1" step="0.01" value="0.7">
        </div>
        <div class="result">地層受到兩側<b>擠壓</b>而彎曲，但沒有斷裂，就是<b>褶皺</b>。往上拱起的部分叫<b>背斜</b>，往下凹的部分叫<b>向斜</b>。</div>
      </div>
    </div>

    <div data-mode="earth" hidden>
      <div class="group">
        <dl class="live" id="layers"></dl>
        <p class="note" style="margin-top:8px">點地球的各層看說明。科學家主要是靠<b>地震波</b>在地球內部傳播的情形，推測地球內部的構造。</p>
        <div class="result" id="earthInfo" style="margin-top:8px">點一層看看。</div>
      </div>
    </div>

    <div class="group">
      <p class="note">地層通常是<b>下面老、上面新</b>（疊置定律）。岩層受力超過它能承受的程度就會<b>斷裂並錯動</b>，形成斷層；斷層突然錯動時就會發生<b>地震</b>。</p>
    </div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script type="module">
import { start3D, THREE } from './lab3d.js';
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const $ = id => document.getElementById(id);
const S = { mode: 'fault', type: 'normal', slip: 0.6, squeeze: 0.7 };

const L = start3D({ background: 0x0e1218, camera: [7, 5.5, 10], target: [0, 0, 0], minDist: 5, maxDist: 30, frame, ui, tap });
const { scene } = L;

// ---------- 地層顏色（由下往上：老 → 新） ----------
const LAYERS = [
  { h: 0.7, c: 0x6b5a4a, name: '最老' }, { h: 0.55, c: 0xb98a5a }, { h: 0.5, c: 0xd9c08a },
  { h: 0.45, c: 0x8a7d70 }, { h: 0.5, c: 0xc9a06f }, { h: 0.3, c: 0x5f8f4a, name: '地表' }
];
const W = 4, D = 3, DIP = 60 * Math.PI / 180, X0 = 0;
const tot = LAYERS.reduce((s, l) => s + l.h, 0), Y0 = -tot / 2;

// ---------- 斷層：每一層切成上盤、下盤兩塊（橫切面擠出成立體） ----------
const faultG = new THREE.Group(); scene.add(faultG);
const foot = new THREE.Group(), hang = new THREE.Group();
faultG.add(foot, hang);
let fx;                                     // 斷層線 x(y)
function buildFault() {
  foot.clear(); hang.clear();
  const vertical = S.type === 'strike';
  fx = y => X0 + (vertical ? 0 : (y - Y0 - tot / 2) / Math.tan(DIP));
  let y = Y0;
  LAYERS.forEach(l => {
    const y0 = y, y1 = y + l.h; y = y1;
    const mk = pts => {
      const sh = new THREE.Shape(pts.map(([a, b]) => new THREE.Vector2(a, b)));
      const g = new THREE.ExtrudeGeometry(sh, { depth: D * 2, bevelEnabled: false });
      g.translate(0, 0, -D);
      return new THREE.Mesh(g, L.mat(l.c, { roughness: 0.9, flatShading: true }));
    };
    foot.add(mk([[-W, y0], [fx(y0), y0], [fx(y1), y1], [-W, y1]]));
    hang.add(mk([[fx(y0), y0], [W, y0], [W, y1], [fx(y1), y1]]));
  });
}
buildFault();
const footLbl = L.label('下盤', () => V(-W * 0.6, tot / 2 + 0.6, D * 0.6).add(foot.position), 'big');
const hangLbl = L.label('上盤', () => V(W * 0.6, tot / 2 + 0.6, D * 0.6).add(hang.position), 'big');
const planeLbl = L.label('斷層面', () => V(fx(0), 0, D + 0.3));
const oldLbl = L.label('老 ↓　新 ↑', V(-W - 0.9, 0, D), 'plain');
// 受力箭頭
const forceA = L.arrow(0xff6b5e, 0.5, 0.35), forceB = L.arrow(0xff6b5e, 0.5, 0.35);
const forceLbl = L.label('', () => V(0, tot / 2 + 1.6, 0));

// ---------- 褶皺 ----------
const foldG = new THREE.Group(); scene.add(foldG);
const foldMeshes = [];
{
  let y = Y0;
  LAYERS.forEach(l => {
    const g = new THREE.BoxGeometry(W * 2, l.h, D * 2, 60, 1, 1);
    g.userData.base = g.attributes.position.array.slice();
    const m = new THREE.Mesh(g, L.mat(l.c, { roughness: 0.9 }));
    m.userData.y = y + l.h / 2; y += l.h;
    foldG.add(m); foldMeshes.push(m);
  });
}
const antiLbl = L.label('背斜', () => V(-W * 0.5 * (1 - S.squeeze * 0.25), tot / 2 + 0.35 + S.squeeze * 1.1, D));
const synLbl = L.label('向斜', () => V(W * 0.5 * (1 - S.squeeze * 0.25), tot / 2 + 0.35 - S.squeeze * 1.1, D));
const foldA = L.arrow(0xff6b5e, 0.5, 0.35), foldB = L.arrow(0xff6b5e, 0.5, 0.35);
function updateFold() {
  const sq = S.squeeze, A = sq * 1.1, k = Math.PI / W;
  foldMeshes.forEach(m => {
    const p = m.geometry.attributes.position, b = m.geometry.userData.base;
    for (let i = 0; i < p.count; i++) {
      const x = b[i * 3], yy = b[i * 3 + 1];
      p.setX(i, x * (1 - sq * 0.25));
      p.setY(i, yy + m.userData.y + A * Math.cos(k * (x + W / 2) - Math.PI) * -1);
    }
    p.needsUpdate = true; m.geometry.computeVertexNormals();
  });
}

// ---------- 地球內部（切掉四分之一） ----------
const earthG = new THREE.Group(); scene.add(earthG);
const SHELLS = [
  { r: 3.2, c: 0x4f8a5a, key: 'crust', name: '地殼', depth: '約 5～70 km', txt: '最外層，由岩石組成；大陸地殼較厚、海洋地殼較薄。我們就住在地殼上。' },
  { r: 3.0, c: 0xd9792e, key: 'mantle', name: '地函', depth: '到約 2900 km', txt: '固態岩石，但在高溫高壓下能非常緩慢地流動，帶動板塊移動。' },
  { r: 1.7, c: 0xffb347, key: 'outer', name: '外核', depth: '到約 5100 km', txt: '<b>液態</b>的鐵、鎳。地震的橫波（S 波）不能通過液體，因此知道外核是液態。' },
  { r: 0.75, c: 0xfff0a8, key: 'inner', name: '內核', depth: '到約 6400 km', txt: '<b>固態</b>的鐵、鎳，溫度很高，但壓力極大所以是固態。' }
];
const INFO = {};
SHELLS.forEach(s => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(s.r, 48, 32, 0, Math.PI * 1.5), L.mat(s.c, { side: THREE.DoubleSide, roughness: 0.8 }));
  m.userData.key = s.key; earthG.add(m);
  INFO[s.key] = `<b>${s.name}</b>（${s.depth}）：${s.txt}`;
  // 標籤放在切開的缺口裡（朝向鏡頭）
  const r = s.key === 'crust' ? s.r * 1.08 : (s.r + (SHELLS[SHELLS.indexOf(s) + 1]?.r ?? 0)) / 2;
  s.lbl = L.label(s.name, V(0.6 * r, [2.7, 1.9, 1.0, 0][SHELLS.indexOf(s)], 0.8 * r));
});
earthG.rotation.y = 3.0;               // 缺口朝向鏡頭
$('layers').innerHTML = SHELLS.map(s => `<dt>${s.name}</dt><dd>${s.depth}</dd>`).join('');

// ---------- 每一幀 ----------
const tmp0 = V(0, 0, 0), tmp1 = V(0, 0, 0);
function frame() {
  const m = S.mode;
  faultG.visible = m === 'fault'; foldG.visible = m === 'fold'; earthG.visible = m === 'earth';
  [footLbl, hangLbl, planeLbl, oldLbl, forceLbl].forEach(l => (l.show = m === 'fault'));
  if (m === 'fault') { hangLbl.show = footLbl.show = S.type !== 'strike'; oldLbl.show = true; }
  [antiLbl, synLbl].forEach(l => (l.show = m === 'fold' && S.squeeze > 0.15));
  SHELLS.forEach(s => (s.lbl.show = m === 'earth'));
  forceA.visible = forceB.visible = foldA.visible = foldB.visible = false;
  if (m === 'fault') {
    const s = S.slip * 1.2;
    const up = V(Math.cos(DIP), Math.sin(DIP), 0);           // 沿斷層面往上
    hang.position.set(0, 0, 0); foot.position.set(0, 0, 0);
    if (S.type === 'normal') hang.position.copy(up).multiplyScalar(-s);
    else if (S.type === 'reverse') hang.position.copy(up).multiplyScalar(s);
    else { hang.position.set(0, 0, -s / 2); foot.position.set(0, 0, s / 2); }
    const y = 0.2;
    if (S.type === 'strike') {
      forceA.point(V(2, tot / 2 + 0.4, 2.4), V(2, tot / 2 + 0.4, 0.6));
      forceB.point(V(-2, tot / 2 + 0.4, -2.4), V(-2, tot / 2 + 0.4, -0.6));
      forceLbl.set('兩側水平錯動');
    } else if (S.type === 'normal') {
      forceA.point(V(-W - 0.3, y, 0), V(-W - 2, y, 0)); forceB.point(V(W + 0.3, y, 0), V(W + 2, y, 0));
      forceLbl.set('張力：往兩側拉開');
    } else {
      forceA.point(V(-W - 2, y, 0), V(-W - 0.3, y, 0)); forceB.point(V(W + 2, y, 0), V(W + 0.3, y, 0));
      forceLbl.set('擠壓：從兩側推擠');
    }
    forceA.visible = forceB.visible = true;
  } else if (m === 'fold') {
    const e = W * (1 - S.squeeze * 0.25);
    foldA.point(V(-e - 2, 0, 0), V(-e - 0.3, 0, 0)); foldB.point(V(e + 2, 0, 0), V(e + 0.3, 0, 0));
    foldA.visible = foldB.visible = S.squeeze > 0.05;
  } else {
  }
}

const FINFO = {
  normal: '<b>正斷層</b>：受<b>張力</b>（往兩側拉）作用，<b>上盤相對往下</b>滑。',
  reverse: '<b>逆斷層</b>：受<b>擠壓</b>作用，<b>上盤相對往上</b>推。台灣位在板塊擠壓處，逆斷層很多（例如車籠埔斷層）。',
  strike: '<b>平移斷層</b>：兩側岩層沿著斷層面<b>水平錯動</b>，上下沒有明顯移動。'
};
Lab.bindGroup('.mode', k => {
  S.mode = k; Lab.showMode(k);
  if (k === 'earth') L.fly([6, 4, 8], [0, 0, 0]); else L.fly([7, 5.5, 10], [0, 0, 0]);
});
Lab.bindGroup('#ftype button', k => { S.type = k; buildFault(); $('faultInfo').innerHTML = FINFO[k]; });
Lab.bindSlider('slip', x => { S.slip = x; }, x => Math.round(x * 100) + '%');
Lab.bindSlider('squeeze', x => { S.squeeze = x; updateFold(); }, x => Math.round(x * 100) + '%');
function tap(x, y) {
  if (S.mode !== 'earth') return;
  const hit = L.pick(x, y, earthG.children);
  if (hit) $('earthInfo').innerHTML = INFO[hit.object.userData.key];
}
function ui() {}
window.geoSim = S;
</script>
<script src="lesson.js" defer></script>
</body>
</html>
