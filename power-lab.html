<!DOCTYPE html>
<html lang="zh-Hant" data-subject="phy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>電功率與電流的熱效應</title>
<link rel="stylesheet" href="lab-kit.css">
<style>
  .app { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; font-size: .86rem; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .app input { width: 100%; }
</style>
</head>
<body>
<canvas id="cv" aria-label="電熱線加熱水與家電耗電的模擬"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g9">← 回課程總覽</a>
  <h1>電功率與熱效應</h1>
  <p class="sub">國三理化 · 電的應用</p>

  <div class="body">
    <div class="modes" style="--n:2">
      <button class="mode" data-k="heat" aria-pressed="true">電流的<br>熱效應</button>
      <button class="mode" data-k="bill" aria-pressed="false">家電的<br>電費</button>
    </div>

    <div data-mode="heat">
      <div class="group">
        <div class="ctrl"><label for="V">電壓 V <output id="VVal"></output></label><input type="range" id="V" min="2" max="12" step="1" value="6"></div>
        <div class="ctrl"><label for="R">電熱線電阻 R <output id="RVal"></output></label><input type="range" id="R" min="2" max="12" step="1" value="6"></div>
        <div class="row"><button class="btn primary grow" id="go">▶ 通電加熱</button><button class="btn" id="reset">重來</button></div>
        <dl class="live" style="margin-top:8px">
          <dt>電流 I = V ÷ R</dt><dd id="I">—</dd>
          <dt>電功率 P = I × V</dt><dd id="P">—</dd>
          <dt>通電時間</dt><dd id="t">—</dd>
          <dt>產生的熱 ≈ 0.24 × P × t</dt><dd id="H">—</dd>
          <dt>200 g 水的溫度</dt><dd id="T">—</dd>
        </dl>
      </div>
    </div>

    <div data-mode="bill" hidden>
      <div class="group" id="apps"></div>
      <div class="group">
        <div class="ctrl"><label for="price">每度電價 <output id="priceVal"></output></label><input type="range" id="price" min="2" max="6" step="0.5" value="3"></div>
        <dl class="live"><dt>一個月（30 天）用電</dt><dd id="kwh">—</dd><dt>電費</dt><dd id="cost">—</dd></dl>
      </div>
    </div>

    <div class="group"><div class="result" id="info"></div></div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script>
(() => {
  const $ = Lab.$;
  const APPS = [['冷氣', 1000, 8, '❄'], ['電鍋', 800, 1, '🍚'], ['吹風機', 1200, 0.2, '💨'], ['電視', 100, 4, '📺'], ['LED 燈', 10, 6, '💡'], ['冰箱', 150, 24, '🧊']];
  const S = { mode: 'heat', V: 6, R: 6, run: false, t: 0, T: 25, hist: [], hours: APPS.map(a => a[2]), on: APPS.map(() => true), price: 3 };

  function drawHeat(ctx, w, h, dt) {
    const I = S.V / S.R, P = I * S.V;
    if (S.run) { S.t += dt * 20; S.T = 25 + 0.24 * P * S.t / 200; if (Math.floor(S.t / 10) >= S.hist.length) S.hist.push(S.T); if (S.T >= 100) { S.T = 100; S.run = false; } }
    const bx = w * 0.12, by = 90, bw = Math.min(220, w * 0.3), bh = Math.min(260, h * 0.45);
    // 燒杯與水
    const heat = Math.min(1, (S.T - 25) / 60);
    ctx.fillStyle = `rgba(${95 + 160 * heat},${170 - 60 * heat},${255 - 150 * heat},.4)`; ctx.fillRect(bx, by + bh * 0.2, bw, bh * 0.8);
    ctx.strokeStyle = 'rgba(220,235,255,.8)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx, by + bh); ctx.lineTo(bx + bw, by + bh); ctx.lineTo(bx + bw, by); ctx.stroke();
    // 電熱線（線圈），通電發紅
    const glow = S.run ? Math.min(1, P / 40) : 0;
    ctx.strokeStyle = `rgb(${150 + 105 * glow},${150 - 80 * glow},${150 - 120 * glow})`; ctx.lineWidth = 4; ctx.beginPath();
    const cx0 = bx + 40, cy0 = by + bh * 0.65;
    for (let i = 0; i <= 60; i++) { const a = i / 60 * Math.PI * 12; ctx.lineTo(cx0 + i * (bw - 80) / 60, cy0 + Math.sin(a) * 16); }
    ctx.stroke();
    // 電源與導線
    const px = bx + bw / 2, py = by - 50;
    Lab.card(px - 50, py - 18, 100, 36, 'rgba(255,255,255,.1)', '#fff', 8);
    Lab.text(`電源 ${S.V} V`, px, py, '#ffd34d', 14, 'center', 'bold');
    Lab.line(px - 50, py, cx0, py, '#d9b46a', 3); Lab.line(cx0, py, cx0, cy0, '#d9b46a', 3);
    Lab.line(px + 50, py, bx + bw - 40, py, '#d9b46a', 3); Lab.line(bx + bw - 40, py, bx + bw - 40, cy0, '#d9b46a', 3);
    if (S.run) for (let i = 0; i < 6; i++) Lab.circle(bx + 30 + i * (bw - 60) / 5, by + bh * 0.4 - ((S.t * 3 + i * 17) % 40), 3, null, 'rgba(255,255,255,.7)', 1.5);
    Lab.text(`${S.T.toFixed(1)} °C`, bx + bw / 2, by + bh + 26, '#ff8a7a', 22, 'center', 'bold');
    // 溫度－時間圖
    const gx = bx + bw + 50, gw = w - gx - 20;
    if (gw > 160) Lab.chart(gx, by, gw, bh + 40, [{ data: S.hist, color: '#ff8a5c', n: 60 }], { min: 20, max: 100, xLabel: '時間 →', yLabel: '水溫（°C）' });
    $('I').textContent = I.toFixed(2) + ' A'; $('P').textContent = P.toFixed(1) + ' W';
    $('t').textContent = S.t.toFixed(0) + ' 秒'; $('H').textContent = (0.24 * P * S.t).toFixed(0) + ' cal'; $('T').textContent = S.T.toFixed(1) + ' °C';
    $('info').innerHTML = '電流通過電阻會產生熱，這是<b>電流的熱效應</b>（電能 → 熱能）。<br><b>P = IV = I²R = V²/R</b>：電壓固定時，<b>電阻越小</b>、電流越大，發熱功率反而越大。<br>1 焦耳 ≈ 0.24 卡，所以 H ≈ 0.24 × P × t（卡）。';
  }

  function drawBill(ctx, w, h) {
    const daily = APPS.map((a, i) => (S.on[i] ? a[1] * S.hours[i] / 1000 : 0));
    const month = daily.map(d => d * 30), tot = month.reduce((x, y) => x + y, 0);
    const x0 = 40, y0 = 60, bw = w - 100, rowH = Math.min(70, (h - 120) / APPS.length);
    Lab.text('每個月用電（度 = 千瓦小時）', x0, 30, '#eef1fa', 15, 'left', 'bold');
    const max = Math.max(...month, 1);
    APPS.forEach((a, i) => {
      const y = y0 + i * rowH;
      Lab.text(`${a[3]} ${a[0]}`, x0, y + rowH / 2 - 6, '#eef1fa', 15, 'left');
      Lab.text(`${a[1]} W × ${S.hours[i]} 小時/天`, x0, y + rowH / 2 + 14, 'rgba(238,241,250,.5)', 12, 'left');
      const L = month[i] / max * (bw - 260);
      Lab.card(x0 + 180, y + rowH * 0.2, Math.max(2, L), rowH * 0.5, S.on[i] ? '#5fa2ff' : 'rgba(255,255,255,.1)', null, 6);
      Lab.text(`${month[i].toFixed(1)} 度`, x0 + 190 + L, y + rowH * 0.45, '#9fc4ff', 13, 'left');
    });
    $('kwh').textContent = tot.toFixed(1) + ' 度';
    $('cost').textContent = '約 ' + Math.round(tot * S.price) + ' 元';
    $('info').innerHTML = '<b>電能 = 電功率 × 時間</b>。1 度 = 1 千瓦小時（kWh）= 1000 W 的電器用 1 小時。<br>冷氣功率大、使用時間又長，通常最耗電；吹風機功率雖大，但用的時間短。';
  }

  Lab.init({ draw(ctx, w, h, dt) { S.mode === 'heat' ? drawHeat(ctx, w, h, dt) : drawBill(ctx, w, h); } });
  $('apps').innerHTML = APPS.map((a, i) => `<div class="app"><label class="sw" style="min-height:36px"><input type="checkbox" data-on="${i}" checked><span class="track"></span>${a[3]} ${a[0]}（${a[1]} W）</label><span></span><input type="range" data-h="${i}" min="0" max="24" step="0.5" value="${a[2]}" aria-label="${a[0]}每天使用時數"><output data-ho="${i}">${a[2]} 小時</output></div>`).join('');
  document.querySelectorAll('[data-on]').forEach(el => el.addEventListener('change', () => (S.on[el.dataset.on] = el.checked)));
  document.querySelectorAll('[data-h]').forEach(el => { Lab.paint(el); el.addEventListener('input', () => { S.hours[el.dataset.h] = Number(el.value); Lab.paint(el); document.querySelector(`[data-ho="${el.dataset.h}"]`).textContent = el.value + ' 小時'; }); });
  const reset = () => { S.run = false; S.t = 0; S.T = 25; S.hist = [25]; $('go').textContent = '▶ 通電加熱'; };
  Lab.bindSlider('V', v => { S.V = v; reset(); }, v => v + ' V');
  Lab.bindSlider('R', v => { S.R = v; reset(); }, v => v + ' Ω');
  Lab.bindSlider('price', v => (S.price = v), v => v + ' 元');
  $('go').addEventListener('click', () => { if (S.T >= 100) reset(); S.run = !S.run; $('go').textContent = S.run ? '❚❚ 暫停' : '▶ 繼續'; });
  $('reset').addEventListener('click', reset);
  Lab.bindGroup('.mode', k => { S.mode = k; Lab.showMode(k); });
  reset();
  window.powerSim = S;
})();
</script>
<script src="lesson.js" defer></script>
</body>
</html>
