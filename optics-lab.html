<!DOCTYPE html>
<html lang="zh-Hant" data-subject="phy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>光的實驗室</title>
<link rel="stylesheet" href="lab-kit.css">
<style>.bar { height: 10px; border-radius: 5px; background: var(--accent); margin: 2px 0 8px; transition: width .3s; }</style>
</head>
<body>
<canvas id="cv" aria-label="針孔成像、反射、折射與透鏡成像的光線圖"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g8">← 回課程總覽</a>
  <h1>光的實驗室</h1>
  <p class="sub">國二理化 · 光</p>

  <div class="body">
    <div class="modes" style="--n:4">
      <button class="mode" data-k="pinhole" aria-pressed="true">針孔</button>
      <button class="mode" data-k="reflect" aria-pressed="false">反射</button>
      <button class="mode" data-k="refract" aria-pressed="false">折射</button>
      <button class="mode" data-k="lens" aria-pressed="false">透鏡</button>
    </div>

    <div data-mode="pinhole">
      <div class="group">
        <div class="ctrl"><label for="pObj">物體到針孔 <output id="pObjVal"></output></label><input type="range" id="pObj" min="80" max="320" step="5" value="200"></div>
        <div class="ctrl"><label for="pScr">針孔到屏幕 <output id="pScrVal"></output></label><input type="range" id="pScr" min="60" max="300" step="5" value="150"></div>
        <div class="ctrl"><label for="pHole">孔的大小 <output id="pHoleVal"></output></label><input type="range" id="pHole" min="1" max="30" step="1" value="3"></div>
      </div>
    </div>

    <div data-mode="reflect" hidden>
      <div class="group">
        <div class="ctrl"><label for="rAng">入射角 <output id="rAngVal"></output></label><input type="range" id="rAng" min="0" max="80" step="1" value="40"></div>
        <label class="sw"><input type="checkbox" id="rImg" checked><span class="track"></span>鏡子後方的像</label>
        <p class="note">在畫面上拖動<b>蠟燭</b>可以改變物體位置。</p>
      </div>
    </div>

    <div data-mode="refract" hidden>
      <div class="group">
        <div class="group-title">下方介質</div>
        <div class="chips" style="--n:3" id="media">
          <button class="btn" data-k="water" aria-pressed="true">水</button>
          <button class="btn" data-k="glass" aria-pressed="false">玻璃</button>
          <button class="btn" data-k="diamond" aria-pressed="false">鑽石</button>
        </div>
        <div class="ctrl" style="margin-top:8px"><label for="fAng">入射角 <output id="fAngVal"></output></label><input type="range" id="fAng" min="0" max="80" step="1" value="45"></div>
        <div class="seg" style="--n:2" id="fDir">
          <button data-k="down" aria-pressed="true">空氣 → 介質</button>
          <button data-k="up" aria-pressed="false">介質 → 空氣</button>
        </div>
      </div>
      <div class="group">
        <div class="group-title">光在各介質中的速度（萬 km/s）</div>
        <div id="speeds"></div>
      </div>
    </div>

    <div data-mode="lens" hidden>
      <div class="group">
        <div class="seg" style="--n:2" id="lensType">
          <button data-k="convex" aria-pressed="true">凸透鏡</button>
          <button data-k="concave" aria-pressed="false">凹透鏡</button>
        </div>
        <div class="ctrl" style="margin-top:8px"><label for="lf">焦距 <output id="lfVal"></output></label><input type="range" id="lf" min="60" max="160" step="5" value="100"></div>
        <p class="note">在畫面上<b>左右拖動物體（箭頭）</b>改變物距。</p>
        <dl class="live" style="margin-top:8px">
          <dt>物距</dt><dd id="do">—</dd><dt>像距</dt><dd id="di">—</dd><dt>像的性質</dt><dd id="kind">—</dd>
        </dl>
      </div>
    </div>

    <div class="group"><div class="result" id="info"></div></div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script>
(() => {
  const $ = Lab.$;
  const MED = { air: [30, '空氣'], water: [22.5, '水'], glass: [20, '玻璃'], diamond: [12.4, '鑽石'] };
  const S = { mode: 'pinhole', pObj: 200, pScr: 150, pHole: 3, rAng: 40, rObj: null, med: 'water', fAng: 45, fDir: 'down', lens: 'convex', f: 100, obj: 260, drag: null, t: 0 };
  const LIGHT = '#ffd34d', D2R = Math.PI / 180;
  let W = 600, H = 400;

  function candle(ctx, x, y, hgt, flip = false, alpha = 1, color = '#ff8a5c') {
    ctx.globalAlpha = alpha;
    const s = flip ? -1 : 1;
    Lab.card(x - 7, flip ? y : y - hgt * 0.75, 14, hgt * 0.75, '#f2e6c9', null, 3);
    ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x, y - s * hgt * 0.87, 7, hgt * 0.13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function arrowObj(x, base, hh, color, dashed) {
    Lab.line(x, base, x, base - hh, color, 4, dashed ? [6, 5] : null);
    const s = hh >= 0 ? 1 : -1;
    Lab.ctx.fillStyle = color; Lab.ctx.beginPath(); Lab.ctx.moveTo(x, base - hh); Lab.ctx.lineTo(x - 9, base - hh + s * 14); Lab.ctx.lineTo(x + 9, base - hh + s * 14); Lab.ctx.fill();
  }

  function pinhole(ctx) {
    const cy = H * 0.45, hx = W * 0.5, ox = hx - S.pObj * (W / 900), sx = hx + S.pScr * (W / 900), oh = 90;
    candle(ctx, ox, cy + oh / 2, oh);
    // 板子與孔
    const hole = S.pHole;
    Lab.card(hx - 5, cy - 150, 10, 150 - hole / 2, '#55606e', null, 2); Lab.card(hx - 5, cy + hole / 2, 10, 150 - hole / 2, '#55606e', null, 2);
    // 屏幕
    Lab.card(sx, cy - 150, 8, 300, 'rgba(240,240,255,.85)', null, 2);
    // 光線：火焰頂端、蠟燭底部各通過孔的上下緣
    const top = [ox, cy + oh / 2 - oh], bot = [ox, cy + oh / 2];
    [[top, '#ff8a5c'], [bot, '#f2e6c9']].forEach(([p, c]) => {
      [-hole / 2, hole / 2].forEach(d => {
        const k = (cy + d - p[1]) / (hx - p[0]), yS = cy + d + k * (sx - hx);
        Lab.line(p[0], p[1], sx, yS, c === '#ff8a5c' ? 'rgba(255,138,92,.7)' : 'rgba(242,230,201,.6)', 1.5);
      });
    });
    // 屏幕上的像（倒立）
    const m = (sx - hx) / (hx - ox), ih = oh * m, blur = hole * (1 + m);
    ctx.save(); ctx.filter = `blur(${Math.min(12, blur / 3)}px)`;
    candle(ctx, sx - 12, cy - oh / 2 * m + 0, ih, true, 0.9);
    ctx.restore();
    $('info').innerHTML = `屏幕上是<b>倒立的實像</b>。像的大小 = 物體 × (屏幕距離 ÷ 物體距離) = <b>${m.toFixed(2)} 倍</b>。<br>${S.pHole > 12 ? '孔太大：光線重疊，像變<b>模糊</b>（但比較亮）。' : '孔越小，像越清楚，但越暗。'}<br>這說明光是<b>直線前進</b>的。`;
  }

  function reflect(ctx) {
    const my = H * 0.62, cx = W * 0.5;
    ctx.fillStyle = 'rgba(180,210,255,.25)'; ctx.fillRect(40, my, W - 80, 14);
    Lab.line(40, my, W - 40, my, '#cfe3ff', 3);
    for (let x = 50; x < W - 40; x += 16) Lab.line(x, my + 14, x - 10, my + 26, 'rgba(207,227,255,.4)', 1.5);
    // 法線
    Lab.line(cx, my - 230, cx, my, 'rgba(255,255,255,.5)', 1.5, [6, 6]);
    Lab.text('法線', cx + 22, my - 220, 'rgba(255,255,255,.6)', 13);
    const a = S.rAng * D2R, L = 220;
    const sx = cx - Math.sin(a) * L, sy = my - Math.cos(a) * L, ex = cx + Math.sin(a) * L, ey = sy;
    Lab.arrow(sx, sy, cx, my, LIGHT, 3, 14); Lab.arrow(cx, my, ex, ey, LIGHT, 3, 14);
    // 角度弧
    ctx.strokeStyle = '#5cc8ff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, my, 60, -Math.PI / 2 - a, -Math.PI / 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, my, 66, -Math.PI / 2, -Math.PI / 2 + a); ctx.stroke();
    Lab.text(`入射角 ${S.rAng}°`, cx - 70 - 40 * Math.sin(a), my - 80, '#5cc8ff', 14, 'right', 'bold');
    Lab.text(`反射角 ${S.rAng}°`, cx + 70 + 40 * Math.sin(a), my - 80, '#5cc8ff', 14, 'left', 'bold');
    // 物體與像
    if (!S.rObj) S.rObj = [W * 0.22, my - 140];
    const [ox, oy] = S.rObj;
    candle(ctx, ox, oy + 30, 60);
    if ($('rImg').checked) {
      const iy = 2 * my - oy;
      candle(ctx, ox, iy - 30, 60, true, 0.45);
      Lab.line(ox, oy, ox, iy, 'rgba(255,255,255,.25)', 1, [4, 4]);
      Lab.text('像（虛像）', ox + 40, iy, 'rgba(238,241,250,.7)', 13, 'left');
      // 一條從物體反射進眼睛的光線
      const eye = [W * 0.8, my - 150];
      const t = (my - oy) / ((my - oy) + (my - eye[1])), px = ox + (eye[0] - ox) * t;
      Lab.line(ox, oy, px, my, 'rgba(255,138,92,.8)', 2); Lab.arrow(px, my, eye[0], eye[1], 'rgba(255,138,92,.8)', 2, 10);
      Lab.line(px, my, ox, iy, 'rgba(255,138,92,.4)', 1.5, [5, 5]);
      Lab.text('👁', eye[0] + 16, eye[1], '#fff', 24);
    }
    $('info').innerHTML = '<b>反射定律</b>：入射角 = 反射角，入射光、反射光和法線在同一平面上。<br>平面鏡成<b>正立、等大的虛像</b>，像和物體到鏡面的距離相等、左右相反。';
  }

  function refract(ctx, dt) {
    S.t += dt;
    const iy = H * 0.5, cx = W * 0.5;
    const up = S.fDir === 'up';
    const [vTop, vBot] = [MED.air[0], MED[S.med][0]];
    ctx.fillStyle = 'rgba(92,200,255,.18)'; ctx.fillRect(0, iy, W, H - iy);
    Lab.text('空氣', 30, iy - 24, '#eef1fa', 16, 'left', 'bold');
    Lab.text(MED[S.med][1], 30, iy + 26, '#9fd8ff', 16, 'left', 'bold');
    Lab.line(cx, 30, cx, H - 30, 'rgba(255,255,255,.45)', 1.5, [6, 6]);
    const a1 = S.fAng * D2R, vin = up ? vBot : vTop, vout = up ? vTop : vBot;
    const s2 = Math.sin(a1) * vout / vin, L = Math.min(iy - 40, 240);
    const dirIn = up ? 1 : -1;                       // 入射光從上方（-1）或下方（+1）來
    const sx = cx - Math.sin(a1) * L, sy = iy + dirIn * Math.cos(a1) * L;
    Lab.arrow(sx, sy, cx, iy, LIGHT, 3, 14);
    let msg;
    if (s2 >= 1) {
      Lab.arrow(cx, iy, cx + Math.sin(a1) * L, sy, LIGHT, 3, 14);
      msg = '入射角太大，光<b>全部反射</b>回介質中，沒有折射出去（全反射）。';
    } else {
      const a2 = Math.asin(s2), ex = cx + Math.sin(a2) * L, ey = iy - dirIn * Math.cos(a2) * L;
      Lab.arrow(cx, iy, ex, ey, LIGHT, 3, 14);
      Lab.arrow(cx, iy, cx + Math.sin(a1) * L * 0.5, iy + dirIn * Math.cos(a1) * L * 0.5, 'rgba(255,211,77,.3)', 2, 10);
      // 光脈衝：在各介質中以不同速度前進
      const seg1 = L, seg2 = L, total = seg1 / vin + seg2 / vout, tt = (S.t * 12) % total;
      let px, py;
      if (tt < seg1 / vin) { const f = tt * vin / seg1; px = sx + (cx - sx) * f; py = sy + (iy - sy) * f; }
      else { const f = (tt - seg1 / vin) * vout / seg2; px = cx + (ex - cx) * f; py = iy + (ey - iy) * f; }
      Lab.circle(px, py, 8, '#fff'); Lab.circle(px, py, 16, 'rgba(255,255,255,.25)');
      const toward = vout < vin;
      msg = `光從${up ? MED[S.med][1] : '空氣'}進入${up ? '空氣' : MED[S.med][1]}，速度變${toward ? '<b>慢</b>' : '<b>快</b>'}，所以折射光${toward ? '<b>偏向法線</b>' : '<b>偏離法線</b>'}。<br>入射角 ${S.fAng}°，折射角約 ${(Math.asin(s2) / D2R).toFixed(0)}°。白點是光：看它在哪一邊走得比較慢。`;
      if (S.fAng === 0) msg = '光<b>垂直</b>射入時，方向不改變，但速度仍然改變。';
    }
    $('info').innerHTML = msg;
  }

  function lens(ctx) {
    const ay = H * 0.5, lx = W * 0.55, f = S.f * (S.lens === 'convex' ? 1 : -1);
    Lab.line(20, ay, W - 20, ay, 'rgba(255,255,255,.35)', 1.5);
    // 透鏡
    ctx.strokeStyle = '#9fd8ff'; ctx.lineWidth = 3; ctx.fillStyle = 'rgba(160,215,255,.15)';
    ctx.beginPath();
    if (f > 0) { ctx.ellipse(lx, ay, 14, 150, 0, 0, Math.PI * 2); }
    else { ctx.moveTo(lx - 16, ay - 150); ctx.quadraticCurveTo(lx - 2, ay, lx - 16, ay + 150); ctx.lineTo(lx + 16, ay + 150); ctx.quadraticCurveTo(lx + 2, ay, lx + 16, ay - 150); ctx.closePath(); }
    ctx.fill(); ctx.stroke();
    [-1, 1].forEach(s => { [1, 2].forEach(m => { const x = lx + s * m * S.f; Lab.circle(x, ay, 4, '#ffd34d'); Lab.text(m === 1 ? 'F' : '2F', x, ay + 18, '#ffd34d', 13); }); });
    // 物體
    const dO = S.obj, ox = lx - dO, oh = 70;
    arrowObj(ox, ay, oh, '#ff8a5c');
    const top = [ox, ay - oh];
    const invalid = f > 0 && Math.abs(dO - f) < 2;
    const di = invalid ? Infinity : 1 / (1 / f - 1 / dO), m = -di / dO, ix = lx + di, ihh = oh * m;
    const clipX = x => Math.max(10, Math.min(W - 10, x));
    // 三條主要光線
    const rays = [];
    // 1. 平行主軸 → 經過焦點（凸）／好像從焦點發出（凹）
    rays.push([[top, [lx, top[1]]], [lx, top[1]], [lx + f, ay]]);
    // 2. 經過光心直進
    rays.push([[top, [lx, ay - oh * (lx - lx) / dO]], top, [lx, ay]]);
    rays.forEach(([seg, from, to], i) => {
      if (i === 0) {
        Lab.line(top[0], top[1], lx, top[1], LIGHT, 2.5);
        const dx = (lx + f) - lx, dy = ay - top[1], k = dy / dx;
        const ex = W - 10, ey = top[1] + k * (ex - lx) * (f > 0 ? 1 : 1);
        Lab.line(lx, top[1], ex, top[1] + (ay - top[1]) / f * (ex - lx), LIGHT, 2.5);
        if (f < 0 || di < 0) Lab.line(lx, top[1], 10, top[1] + (ay - top[1]) / f * (10 - lx), 'rgba(255,211,77,.4)', 1.5, [6, 5]);
      } else {
        const k = (ay - top[1]) / (lx - top[0]);
        Lab.line(top[0], top[1], W - 10, top[1] + k * (W - 10 - top[0]), LIGHT, 2.5);
        if (di < 0) Lab.line(top[0], top[1], 10, top[1] + k * (10 - top[0]), 'rgba(255,211,77,.4)', 1.5, [6, 5]);
      }
    });
    // 像
    let kind;
    if (invalid) kind = '物體在焦點上：光線平行，<b>不成像</b>';
    else {
      const real = di > 0;
      arrowObj(ix, ay, ihh, real ? '#5cc8ff' : 'rgba(92,200,255,.6)', !real);
      Lab.text(real ? '實像' : '虛像', ix, ay + (ihh > 0 ? 22 : -22) * -1 + (ihh > 0 ? 20 : -20) + (ihh > 0 ? 0 : 0), '#9fd8ff', 13);
      kind = `${real ? '<b>實像</b>' : '<b>虛像</b>'}、${m < 0 ? '倒立' : '正立'}、${Math.abs(m) > 1.02 ? '放大' : Math.abs(m) < 0.98 ? '縮小' : '等大'}（${Math.abs(m).toFixed(2)} 倍）`;
    }
    $('do').textContent = (dO / S.f).toFixed(2) + ' f';
    $('di').textContent = invalid ? '無限遠' : (Math.abs(di) / S.f).toFixed(2) + ' f' + (di < 0 ? '（和物體同側）' : '');
    $('kind').innerHTML = kind;
    $('info').innerHTML = f > 0
      ? '<b>凸透鏡</b>：平行主軸的光線折射後<b>經過焦點</b>，經過光心的光線直進。物體在焦點外成<b>倒立實像</b>（可投影在屏幕上，例：投影機、相機）；在焦點內成<b>正立放大虛像</b>（例：放大鏡）。'
      : '<b>凹透鏡</b>：平行主軸的光線折射後<b>發散</b>，好像從焦點發出。不論物體在哪裡，都成<b>正立縮小的虛像</b>（例：近視眼鏡）。';
    S.lensGeom = { lx, ay, oh };
  }

  Lab.init({
    draw(ctx, w, h, dt) {
      W = w; H = h;
      if (S.mode === 'pinhole') pinhole(ctx); else if (S.mode === 'reflect') reflect(ctx); else if (S.mode === 'refract') refract(ctx, dt); else lens(ctx);
    },
    down(x, y) {
      if (S.mode === 'lens' && S.lensGeom) { const ox = S.lensGeom.lx - S.obj; if (Math.abs(x - ox) < 40) { S.drag = 'obj'; return true; } }
      if (S.mode === 'reflect' && S.rObj && Math.hypot(x - S.rObj[0], y - S.rObj[1]) < 60) { S.drag = 'r'; return true; }
      return false;
    },
    move(x, y) {
      if (S.drag === 'obj') S.obj = Math.max(20, Math.min(S.lensGeom.lx - 20, S.lensGeom.lx - x));
      if (S.drag === 'r') S.rObj = [Math.max(40, Math.min(W - 40, x)), Math.max(60, Math.min(H * 0.62 - 50, y))];
    },
    up() { S.drag = null; }
  });

  // 速度長條
  $('speeds').innerHTML = Object.entries(MED).map(([k, [v, n]]) => `<div style="display:flex;justify-content:space-between;font-size:.86rem"><span>${n}</span><span>${v}</span></div><div class="bar" style="width:${v / 30 * 100}%"></div>`).join('');
  Lab.bindSlider('pObj', v => (S.pObj = v), v => v + ' 單位');
  Lab.bindSlider('pScr', v => (S.pScr = v), v => v + ' 單位');
  Lab.bindSlider('pHole', v => (S.pHole = v), v => v + ' mm');
  Lab.bindSlider('rAng', v => (S.rAng = v), v => v + '°');
  Lab.bindSlider('fAng', v => (S.fAng = v), v => v + '°');
  Lab.bindSlider('lf', v => (S.f = v), v => v + ' 單位');
  Lab.bindGroup('#media .btn', k => (S.med = k));
  Lab.bindGroup('#fDir button', k => (S.fDir = k));
  Lab.bindGroup('#lensType button', k => (S.lens = k));
  const MODES = ['pinhole', 'reflect', 'refract', 'lens'];
  Lab.bindGroup('.mode', k => { S.mode = k; Lab.showMode(k); history.replaceState(null, '', '#' + k); });
  const hash = location.hash.slice(1);
  if (MODES.includes(hash)) document.querySelector(`.mode[data-k="${hash}"]`).click();
  window.opticsSim = S;
})();
</script>
<script src="lesson.js" defer></script>
</body>
</html>
