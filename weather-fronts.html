<!DOCTYPE html>
<html lang="zh-Hant" data-subject="earth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鋒面剖面模擬器</title>
<style>
  :root {
    --ink: #1c1c1e;
    --ink-soft: #6e6e73;
    --line: rgba(60,60,67,.12);
    --card: rgba(255,255,255,.72);
    --red: #e5484d;
    --blue: #3b82f6;
    --green: #34c759;
    --track: #e5e5ea;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: linear-gradient(#87ceeb, #ffffff);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #scene { position: absolute; inset: 0; width: 100vw; height: 100vh; }
  #scene canvas { display: block; }

  /* ===== 晨間天氣 App 風格面板 ===== */
  .panel {
    position: absolute; top: 16px; left: 16px; width: 320px; max-height: calc(100vh - 32px); overflow-y: auto; z-index: 10;
    background: var(--card); backdrop-filter: blur(10px) saturate(160%); -webkit-backdrop-filter: blur(10px) saturate(160%);
    border: 1px solid rgba(255,255,255,.7); border-radius: 22px; padding: 18px 18px 16px;
    box-shadow: 0 10px 30px rgba(30,60,90,.15);
  }
  .back { font-size: .8rem; color: var(--blue); text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .title { font-size: 1.25rem; font-weight: 700; margin-top: 6px; }
  .sub { font-size: .8rem; color: var(--ink-soft); }

  .now { display: flex; align-items: center; gap: 14px; margin: 14px 0 12px; background: rgba(255,255,255,.75); border-radius: 18px; padding: 14px 16px; }
  .now .icon { font-size: 2.5rem; line-height: 1; }
  .now .big { font-size: 1.45rem; font-weight: 700; line-height: 1.2; }
  .now .desc { font-size: .8rem; color: var(--ink-soft); margin-top: 2px; }
  .cold { color: var(--blue); } .warm { color: var(--red); }

  .group { background: rgba(255,255,255,.75); border-radius: 16px; padding: 4px 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); font-size: .9rem; }
  .row:first-child { border-top: none; }
  .row.col { flex-direction: column; align-items: stretch; gap: 8px; }
  .row small { color: var(--ink-soft); font-size: .75rem; }

  /* iOS 下拉選單 */
  select {
    font: inherit; font-size: .9rem; color: var(--blue); background: rgba(118,118,128,.12);
    border: none; border-radius: 9px; padding: 6px 28px 6px 12px; cursor: pointer; outline: none;
    appearance: none; -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--blue) 50%), linear-gradient(135deg, var(--blue) 50%, transparent 50%);
    background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat;
  }
  select:focus-visible { box-shadow: 0 0 0 3px rgba(59,130,246,.35); }

  /* iOS 滑桿 */
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 999px; cursor: pointer;
    background: linear-gradient(90deg, var(--blue) 0%, var(--blue) var(--fill, 0%), var(--track) var(--fill, 0%)); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 0 0 .5px rgba(0,0,0,.06); }
  input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: #fff; border: none; box-shadow: 0 3px 8px rgba(0,0,0,.15); }
  input[type=range]:focus-visible { box-shadow: 0 0 0 3px rgba(59,130,246,.35); }
  .scale { display: flex; justify-content: space-between; font-size: .72rem; color: var(--ink-soft); }

  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .btn {
    border: none; border-radius: 12px; padding: 10px; cursor: pointer;
    font: inherit; font-size: .86rem; font-weight: 600; color: var(--blue); background: rgba(59,130,246,.1);
    transition: background .2s, transform .1s;
  }
  .btn:hover { background: rgba(59,130,246,.18); }
  .btn:active { transform: scale(.97); }
  .btn.primary { color: #fff; background: var(--blue); }
  .btn.primary:hover { background: #2f74e6; }

  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: .78rem; background: rgba(255,255,255,.75); border-radius: 14px; overflow: hidden; }
  th, td { padding: 6px 8px; text-align: left; border-top: 1px solid var(--line); }
  thead th { border-top: none; font-weight: 600; color: var(--ink-soft); font-size: .72rem; }
  td.on { font-weight: 600; }
  /* 收合鈕：桌機與手機都可收合，避免擋住畫面 */
  .collapse {
    position: absolute; top: 16px; right: 16px; z-index: 2; cursor: pointer;
    border: none; border-radius: 999px; padding: 4px 12px;
    font: inherit; font-size: .78rem; font-weight: 600; color: var(--blue); background: rgba(59,130,246,.1);
  }
  .collapse:hover { background: rgba(59,130,246,.18); }
  .panel.collapsed .body { display: none; }
  .panel.collapsed { width: auto; min-width: 230px; }
  .panel .title { padding-right: 60px; }

  .tag {
    position: absolute; z-index: 5; pointer-events: none; transform: translate(-50%, -50%);
    font-size: .75rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap;
    background: rgba(255,255,255,.85); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  .tag.c { color: #1d4ed8; } .tag.w { color: #c0262d; }
  .hint { position: absolute; right: 16px; bottom: 14px; z-index: 5; font-size: .75rem; color: rgba(28,28,30,.55); }
  .fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--ink-soft); line-height: 1.8; }

  @media (max-width: 640px) {
    .panel { top: auto; bottom: 10px; left: 10px; right: 10px; width: auto; max-height: 52vh; border-radius: 20px; }
    .panel.collapsed .body { display: none; }
    .collapse { display: block; position: absolute; top: 14px; right: 16px; border: none; background: none; font: inherit; font-size: .8rem; color: var(--blue); cursor: pointer; }
    .hint { display: none; }
    .tag { font-size: .66rem; }
  }
</style>
<script src="mobile.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<body>

<div id="scene"></div>

<aside class="panel" id="panel">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g9">‹ 課程總覽</a>
  <div class="title">鋒面剖面模擬器</div>
  <div class="sub">側面剖面 · 拖曳畫面可旋轉觀察</div>

  <div class="body">
    <div class="now">
      <div class="icon" id="nowIcon">⛈️</div>
      <div>
        <div class="big" id="nowBig"></div>
        <div class="desc" id="nowDesc"></div>
      </div>
    </div>

    <div class="group">
      <div class="row">
        <span>鋒面類型</span>
        <select id="frontType" aria-label="鋒面類型">
          <option value="cold">冷鋒</option>
          <option value="warm">暖鋒</option>
        </select>
      </div>
      <div class="row col">
        <div style="display:flex;justify-content:space-between"><span>時間推演</span><small id="timeVal">0 小時</small></div>
        <input type="range" id="time" min="0" max="1" step="0.005" value="0.15" aria-label="時間推演">
        <div class="scale"><span>開始</span><span>鋒面通過</span></div>
      </div>
    </div>

    <div class="btns">
      <button class="btn primary" id="playBtn">▶ 自動推演</button>
      <button class="btn" id="viewBtn">重設視角</button>
    </div>

    <table aria-label="冷鋒與暖鋒比較">
      <thead><tr><th></th><th>冷鋒</th><th>暖鋒</th></tr></thead>
      <tbody id="cmp"></tbody>
    </table>
  </div>

<div class="hint">拖曳旋轉 · 滾輪縮放</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

window.__frontsReady = true;

/* =========================================================
   參數
   ========================================================= */
const BOX = { xl: -14, xr: 14, top: 7, depth: 6 };   // 剖面水族箱
const HC = 3.4;                                      // 冷氣團最大厚度
const S = THREE.MathUtils.smoothstep;
const clamp = THREE.MathUtils.clamp;
const $ = id => document.getElementById(id);

/**
 * 冷氣團頂部高度 h(d)，d = 鋒線到該點的水平距離（往冷氣團方向，d ≥ 0）
 * 冷鋒：前緣陡峭、像鏟子（坡度大）
 * 暖鋒：坡度平緩、綿延很遠
 */
const PROFILE = {
  cold: d => HC * (1 - Math.exp(-d / 0.75)),
  warm: d => Math.min(HC, d * 0.3)
};
/** 鋒線位置：冷鋒向右推進、暖鋒向左推進 */
const FRONT_X = { cold: t => -5 + 9 * t, warm: t => 5 - 9 * t };

/* =========================================================
   渲染器 / 場景 / 相機（無 Bloom）
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
$('scene').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 300);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 8;
controls.maxDistance = 60;
function resetView() {
  camera.position.set(1.5, 6, 26);
  controls.target.set(-1.5, 3, 0);
  controls.update();
  window.MobileView?.frame(camera, controls, 1.4);
}

// 天空穹頂：天藍 → 白
const sky = new THREE.Mesh(new THREE.SphereGeometry(150, 32, 16), new THREE.ShaderMaterial({
  uniforms: { top: { value: new THREE.Color(0x4fa8e0) }, bottom: { value: new THREE.Color(0xffffff) } },
  side: THREE.BackSide, depthWrite: false,
  vertexShader: `varying vec3 vPos; void main(){ vPos = (modelMatrix * vec4(position,1.0)).xyz; gl_Position = projectionMatrix * viewMatrix * vec4(vPos,1.0); }`,
  fragmentShader: `uniform vec3 top; uniform vec3 bottom; varying vec3 vPos;
    void main(){ float h = clamp(pow(max(normalize(vPos).y, 0.0), 0.3) * 1.5, 0.0, 1.0); gl_FragColor = vec4(mix(bottom, top, h), 1.0); }`
}));
scene.add(sky);
scene.fog = new THREE.Fog(0xffffff, 50, 130);

// 燈光：半球光 + 陽光（柔和陰影）
scene.add(new THREE.HemisphereLight(0xeaf6ff, 0x7aa86a, 1.45));
const sunLight = new THREE.DirectionalLight(0xfff3dd, 1.4);
sunLight.position.set(-10, 22, 14);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
Object.assign(sunLight.shadow.camera, { left: -20, right: 20, top: 16, bottom: -10, near: 1, far: 70 });
sunLight.shadow.radius = 6;
sunLight.shadow.bias = -0.0005;
scene.add(sunLight);

// Low-Poly 大地
const groundGeo = new THREE.PlaneGeometry(90, 70, 40, 32);
groundGeo.rotateX(-Math.PI / 2);
{
  const pos = groundGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const away = Math.max(S(Math.abs(x), 15, 30), S(Math.abs(z), 5, 20));
    pos.setY(i, -0.02 + away * (Math.sin(x * 0.3) * Math.cos(z * 0.35) * 1.3 + Math.random() * 0.7));
  }
  groundGeo.computeVertexNormals();
}
const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({ color: 0x88cc88, flatShading: true, roughness: 0.95 }));
ground.receiveShadow = true;
scene.add(ground);

// 水族箱玻璃框
const boxGeo = new THREE.BoxGeometry(BOX.xr - BOX.xl, BOX.top, BOX.depth);
boxGeo.translate(0, BOX.top / 2, 0);
scene.add(new THREE.LineSegments(new THREE.EdgesGeometry(boxGeo), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 })));
const glass = new THREE.Mesh(boxGeo, new THREE.MeshPhysicalMaterial({
  color: 0xffffff, transparent: true, opacity: 0.06, roughness: 0.05, clearcoat: 1, depthWrite: false
}));
scene.add(glass);

// 點綴：Low-Poly 小樹
const treeMat = new THREE.MeshStandardMaterial({ color: 0x4f9a4f, flatShading: true });
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b6a4a, flatShading: true });
for (let i = 0; i < 26; i++) {
  // 只種在水族箱後方與兩側，不擋住剖面
  const behind = i < 18;
  const x = behind ? -26 + Math.random() * 52 : (i % 2 ? 1 : -1) * (17 + Math.random() * 8);
  const z = behind ? -(5 + Math.random() * 12) : -4 + Math.random() * 6;
  const t = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 0.7, 5), trunkMat);
  trunk.position.y = 0.35;
  const crown = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.8, 6), treeMat);
  crown.position.y = 1.5;
  t.add(trunk, crown);
  t.traverse(o => { o.castShadow = true; });
  t.position.set(x, 0, z);
  t.scale.setScalar(0.8 + Math.random() * 0.6);
  scene.add(t);
}

/* =========================================================
   氣團（擠出的剖面實體，隨時間重建）
   ========================================================= */
const coldMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.42, roughness: 0.4, depthWrite: false, side: THREE.DoubleSide });
const warmMat = new THREE.MeshStandardMaterial({ color: 0xef4444, transparent: true, opacity: 0.24, roughness: 0.4, depthWrite: false, side: THREE.DoubleSide });
const coldMesh = new THREE.Mesh(new THREE.BufferGeometry(), coldMat);
const warmMesh = new THREE.Mesh(new THREE.BufferGeometry(), warmMat);
coldMesh.renderOrder = 1; warmMesh.renderOrder = 2;
scene.add(coldMesh, warmMesh);

// 交界面（鋒面面）+ 剖面上的交界線
const surfMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false });
const frontSurface = new THREE.Mesh(new THREE.BufferGeometry(), surfMat);
frontSurface.renderOrder = 3;
scene.add(frontSurface);
const boundaryMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 });
const boundaryTube = new THREE.Mesh(new THREE.BufferGeometry(), boundaryMat);
scene.add(boundaryTube);

const extrude = shape => {
  const g = new THREE.ExtrudeGeometry(shape, { depth: BOX.depth, bevelEnabled: false, curveSegments: 1 });
  g.translate(0, 0, -BOX.depth / 2);
  return g;
};

function boundaryPoints(type, xf, n = 80) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const x = BOX.xl + (xf - BOX.xl) * i / n;
    pts.push(new THREE.Vector2(x, PROFILE[type](xf - x)));
  }
  return pts;   // 由左（冷氣團深處）到鋒線（地面）
}

function rebuildAirMasses(type, xf) {
  const b = boundaryPoints(type, xf);
  // 冷氣團：地面以上、交界面以下
  const cold = new THREE.Shape([new THREE.Vector2(BOX.xl, 0), ...b, new THREE.Vector2(xf, 0)]);
  // 暖氣團：交界面以上與鋒線右側，直到箱頂
  const warm = new THREE.Shape([
    new THREE.Vector2(xf, 0), new THREE.Vector2(BOX.xr, 0), new THREE.Vector2(BOX.xr, BOX.top),
    new THREE.Vector2(BOX.xl, BOX.top), ...b.slice(0, -1)
  ]);
  coldMesh.geometry.dispose(); coldMesh.geometry = extrude(cold);
  warmMesh.geometry.dispose(); warmMesh.geometry = extrude(warm);

  // 交界面：把交界線沿 z 拉成一片曲面
  const verts = [], idx = [];
  b.forEach((p, i) => {
    verts.push(p.x, p.y, -BOX.depth / 2, p.x, p.y, BOX.depth / 2);
    if (i > 0) { const a = (i - 1) * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  });
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  sg.setIndex(idx);
  sg.computeVertexNormals();
  frontSurface.geometry.dispose(); frontSurface.geometry = sg;

  // 剖面正面上的交界線
  const curve = new THREE.CatmullRomCurve3(b.filter((_, i) => i % 2 === 0 || i === b.length - 1).map(p => new THREE.Vector3(p.x, p.y, BOX.depth / 2 + 0.02)));
  boundaryTube.geometry.dispose();
  boundaryTube.geometry = new THREE.TubeGeometry(curve, 120, 0.045, 6, false);
}

/* ----- 地面鋒線符號（天氣圖畫法） ----- */
const symbolGroup = new THREE.Group();
scene.add(symbolGroup);
function buildSymbol(type) {
  symbolGroup.children.slice().forEach(c => { symbolGroup.remove(c); c.geometry?.dispose(); });
  const color = type === 'cold' ? 0x2563eb : 0xdc2626;
  const mat = new THREE.MeshStandardMaterial({ color, flatShading: true, side: THREE.DoubleSide });
  const line = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, BOX.depth), mat);
  line.position.y = 0.06;
  symbolGroup.add(line);
  for (const z of [-2, 0, 2]) {
    let geo;
    if (type === 'cold') {
      // 三角形：尖端指向冷鋒前進方向（+x）
      geo = new THREE.ShapeGeometry(new THREE.Shape([new THREE.Vector2(0, -0.45), new THREE.Vector2(0.6, 0), new THREE.Vector2(0, 0.45)]));
    } else {
      // 半圓：凸出方向指向暖鋒前進方向（−x）
      geo = new THREE.CircleGeometry(0.42, 20, Math.PI / 2, Math.PI);
    }
    geo.rotateX(-Math.PI / 2);
    const m = new THREE.Mesh(geo, mat);
    m.position.set(0, 0.07, z);
    symbolGroup.add(m);
  }
}

/* =========================================================
   雲：冷鋒 → 深灰積雨雲；暖鋒 → 綿延層狀雲
   ========================================================= */
const cbMat = new THREE.MeshStandardMaterial({ color: 0x6b7280, flatShading: true, roughness: 0.9 });
const cumulonimbus = new THREE.Group();
{
  const puff = (r, x, y, z, sy = 1) => {
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), cbMat);
    m.position.set(x, y, z); m.scale.y = sy; m.castShadow = true;
    cumulonimbus.add(m);
  };
  // 高聳的雲柱
  for (let i = 0; i < 7; i++) {
    const y = 2.4 + i * 0.6;
    puff(0.85 - i * 0.04, -0.15 + Math.sin(i) * 0.25, y, 0.6);
    puff(0.75 - i * 0.03, 0.35 + Math.cos(i) * 0.2, y + 0.2, -0.7);
    puff(0.7, -0.6, y + 0.1, -0.1);
  }
  // 頂部砧狀雲
  for (let i = 0; i < 8; i++) puff(0.7, -2.2 + i * 0.55, 6.5 + Math.sin(i * 1.7) * 0.12, (i % 2 ? 0.8 : -0.8), 0.5);
}
scene.add(cumulonimbus);

const stMat = new THREE.MeshStandardMaterial({ color: 0xc3cad4, flatShading: true, roughness: 0.95, vertexColors: false });
const STRATUS_N = 18;
const stratus = Array.from({ length: STRATUS_N }, (_, i) => {
  const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.9, 1), stMat.clone());
  m.scale.set(1.5, 0.42, 1.9);
  m.castShadow = true;
  m.userData.jitter = (Math.random() - 0.5) * 0.25;
  scene.add(m);
  return m;
});

/* =========================================================
   雨滴（InstancedMesh）
   ========================================================= */
const RAIN = 520;
const rainMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.02, 0.02, 0.38, 4),
  new THREE.MeshBasicMaterial({ color: 0x2f6fe0, transparent: true, opacity: 0.75 }), RAIN);
rainMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(rainMesh);
const drops = Array.from({ length: RAIN }, () => ({ f: Math.random(), y: Math.random(), z: (Math.random() - 0.5) * (BOX.depth - 0.4), v: 0.8 + Math.random() * 0.4 }));

/* =========================================================
   動態箭頭（沿氣流路徑移動）
   ========================================================= */
const arrowShape = new THREE.Shape([
  new THREE.Vector2(-0.45, -0.09), new THREE.Vector2(0.12, -0.09), new THREE.Vector2(0.12, -0.24),
  new THREE.Vector2(0.5, 0), new THREE.Vector2(0.12, 0.24), new THREE.Vector2(0.12, 0.09), new THREE.Vector2(-0.45, 0.09)
]);
const arrowGeo = new THREE.ExtrudeGeometry(arrowShape, { depth: 0.08, bevelEnabled: false });
function makeArrowSet(color, count) {
  const mesh = new THREE.InstancedMesh(arrowGeo, new THREE.MeshStandardMaterial({ color, flatShading: true }), count);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(mesh);
  return { mesh, count, u: Array.from({ length: count }, (_, i) => i / count), path: null, speed: 1 };
}
const coldArrows = makeArrowSet(0x1d4ed8, 7);
const warmArrows = makeArrowSet(0xc0262d, 11);

const polyPath = pts => {
  const p = new THREE.CurvePath();
  for (let i = 0; i < pts.length - 1; i++) p.add(new THREE.LineCurve3(pts[i], pts[i + 1]));
  return p;
};
const ZA = BOX.depth / 2 + 0.12;   // 箭頭畫在剖面正面

function rebuildPaths(type, xf) {
  const h = PROFILE[type];
  const V = (x, y) => new THREE.Vector3(x, y, ZA);
  if (type === 'cold') {
    // 冷空氣：在地面附近強勢向右推進
    coldArrows.path = polyPath([V(BOX.xl + 0.8, 0.7), V(xf - 0.7, 0.7)]);
    coldArrows.speed = 2.2;
    // 暖空氣：被迫沿陡峭的鋒面急速抬升
    const pts = [V(Math.min(BOX.xr - 0.5, xf + 4), 0.55), V(xf + 0.35, 0.55)];
    for (let d = 0; d <= 2.6; d += 0.2) pts.push(V(xf - d + 0.1, h(d) + 0.5));
    pts.push(V(xf - 2.7, BOX.top - 0.5));
    warmArrows.path = polyPath(pts);
    warmArrows.speed = 2.4;
  } else {
    // 冷空氣：緩慢後退（向左）
    coldArrows.path = polyPath([V(xf - 0.8, 0.6), V(BOX.xl + 0.8, 0.6)]);
    coldArrows.speed = 0.9;
    // 暖空氣：向左推進，平緩地爬升到冷空氣上方
    const pts = [V(Math.min(BOX.xr - 0.5, xf + 5), 0.55), V(xf + 0.35, 0.55)];
    for (let d = 0; d <= 13; d += 0.5) {
      const x = xf - d;
      if (x < BOX.xl + 0.5) break;
      pts.push(V(x, h(d) + 0.5));
    }
    warmArrows.path = polyPath(pts);
    warmArrows.speed = 1.8;
  }
}

const dummy = new THREE.Object3D();
function updateArrowSet(set, dt) {
  const len = set.path.getLength();
  for (let i = 0; i < set.count; i++) {
    set.u[i] = (set.u[i] + dt * set.speed / len) % 1;
    const u = set.u[i];
    const p = set.path.getPointAt(u), tg = set.path.getTangentAt(u);
    dummy.position.copy(p);
    dummy.rotation.set(0, 0, Math.atan2(tg.y, tg.x));
    dummy.scale.setScalar(Math.max(0.001, S(u, 0, 0.08) * (1 - S(u, 0.9, 1))));
    dummy.updateMatrix();
    set.mesh.setMatrixAt(i, dummy.matrix);
  }
  set.mesh.instanceMatrix.needsUpdate = true;
}

/* =========================================================
   標籤
   ========================================================= */
const labels = {};
['cold', 'warm', 'front', 'cloud', 'rain', 'move'].forEach(k => {
  const el = document.createElement('div');
  el.className = 'tag';
  document.body.appendChild(el);
  labels[k] = { el, pos: new THREE.Vector3() };
});
function setLabel(k, text, x, y, z = BOX.depth / 2, cls = '') {
  const L = labels[k];
  L.el.textContent = text;
  L.el.className = 'tag ' + cls;
  L.pos.set(x, y, z);
}
const tmpV = new THREE.Vector3();
function placeLabels() {
  for (const L of Object.values(labels)) {
    tmpV.copy(L.pos).project(camera);
    L.el.style.display = tmpV.z < 1 ? '' : 'none';
    L.el.style.left = ((tmpV.x + 1) / 2 * window.innerWidth) + 'px';
    L.el.style.top = ((1 - tmpV.y) / 2 * window.innerHeight) + 'px';
  }
}

/* =========================================================
   UI 文字
   ========================================================= */
const INFO = {
  cold: { icon: '⛈️', big: '<span class="cold">冷鋒</span> 通過', desc: '冷氣團推進 · 雷陣雨 · 過境後降溫' },
  warm: { icon: '🌧️', big: '<span class="warm">暖鋒</span> 通過', desc: '暖氣團推進 · 連續性降雨 · 過境後升溫' }
};
const CMP = [
  ['推進的氣團', '冷氣團', '暖氣團'],
  ['鋒面坡度', '陡峭', '平緩'],
  ['主要雲類', '積雨雲', '層狀雲'],
  ['降雨位置', '鋒面後方', '鋒面前方'],
  ['降雨特性', '範圍窄、時間短、強', '範圍廣、時間長、弱'],
  ['過境後氣溫', '下降', '上升']
];

/* =========================================================
   狀態與更新
   ========================================================= */
let type = 'cold', t = Number($('time').value), playing = false;
let xf = FRONT_X[type](t);

function paint(el) { el.style.setProperty('--fill', ((el.value - el.min) / (el.max - el.min) * 100) + '%'); }

function rebuild() {
  xf = FRONT_X[type](t);
  rebuildAirMasses(type, xf);
  rebuildPaths(type, xf);
  symbolGroup.position.x = xf;

  const dev = S(t, 0.02, 0.3);         // 雲雨的發展程度
  // 冷鋒：積雨雲在鋒線正上方稍後方（冷側）
  cumulonimbus.visible = type === 'cold' && dev > 0.01;
  cumulonimbus.position.set(xf - 0.8, 0, 0);
  cumulonimbus.scale.set(1, Math.max(0.01, dev), 1);
  // 暖鋒：層狀雲沿平緩的鋒面延伸到前方（冷側）
  stratus.forEach((m, i) => {
    const d = 0.4 + i * 0.6;
    const x = xf - d;
    m.visible = type === 'warm' && dev > 0.01 && x > BOX.xl + 0.6;
    m.position.set(x, PROFILE.warm(d) + 0.85 + m.userData.jitter, (i % 3 - 1) * 1.5);
    m.scale.set(1.5 * dev, 0.42 * dev, 1.9);
    m.material.color.set(0x9aa3b0).lerp(new THREE.Color(0xe8ecf1), i / STRATUS_N);   // 近鋒線較厚較暗（雨層雲），遠處較薄
  });

  const hours = Math.round(t * 48);
  $('timeVal').textContent = `第 ${hours} 小時`;
  const I = INFO[type];
  $('nowIcon').textContent = I.icon;
  $('nowBig').innerHTML = I.big;
  $('nowDesc').textContent = I.desc;
  $('cmp').innerHTML = CMP.map(([k, c, w]) =>
    `<tr><th>${k}</th><td class="${type === 'cold' ? 'on cold' : ''}">${c}</td><td class="${type === 'warm' ? 'on warm' : ''}">${w}</td></tr>`).join('');

  if (type === 'cold') {
    setLabel('cold', '冷氣團', Math.max(BOX.xl + 2.5, xf - 6), 1.6, BOX.depth / 2, 'c');
    setLabel('warm', '暖氣團', Math.min(BOX.xr - 3, xf + 5), 4.5, BOX.depth / 2, 'w');
    setLabel('cloud', '積雨雲（雷雨）', xf - 0.8, 7.6, 0);
    setLabel('rain', '降雨區：鋒面後方', xf - 1.3, 1.5, BOX.depth / 2 + 0.3);
    setLabel('move', '冷空氣推進 →', Math.max(BOX.xl + 3, xf - 4), 0.2, BOX.depth / 2, 'c');
  } else {
    setLabel('cold', '冷氣團', Math.max(BOX.xl + 2.5, xf - 10), 1.0, BOX.depth / 2, 'c');
    setLabel('warm', '暖氣團', Math.min(BOX.xr - 3, xf + 5), 4.5, BOX.depth / 2, 'w');
    setLabel('cloud', '層狀雲（綿延）', xf - 5, PROFILE.warm(5) + 2.0, 0);
    setLabel('rain', '降雨區：鋒面前方（範圍廣）', xf - 4.5, 1.3, BOX.depth / 2 + 0.3);
    setLabel('move', '← 暖空氣推進', Math.min(BOX.xr - 3, xf + 3), 0.2, BOX.depth / 2, 'w');
  }
  setLabel('front', type === 'cold' ? '冷鋒鋒線' : '暖鋒鋒線', xf, -0.55, BOX.depth / 2 + 0.6);
}

/** 降雨：冷鋒 → 鋒後窄帶、密集、急；暖鋒 → 鋒前寬帶、稀疏、緩 */
function updateRain(dt) {
  const dev = S(t, 0.05, 0.3);
  const cfg = type === 'cold'
    ? { a: xf - 2.4, b: xf - 0.2, count: Math.floor(RAIN * dev), speed: 9 }
    : { a: Math.max(BOX.xl + 0.5, xf - 9), b: xf - 0.5, count: Math.floor(RAIN * 0.32 * dev), speed: 5 };
  for (let i = 0; i < RAIN; i++) {
    const d = drops[i];
    if (i >= cfg.count) { dummy.scale.setScalar(0.0001); dummy.position.set(0, -10, 0); dummy.updateMatrix(); rainMesh.setMatrixAt(i, dummy.matrix); continue; }
    const x = cfg.a + (cfg.b - cfg.a) * d.f;
    const base = type === 'cold' ? 2.4 : PROFILE.warm(xf - x) + 0.5;   // 從雲底落下
    d.y -= dt * cfg.speed * d.v / Math.max(base, 0.5);
    if (d.y < 0) { d.y += 1; d.f = Math.random(); }
    dummy.position.set(x, d.y * base, d.z);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.set(1, type === 'cold' ? 1.3 : 0.9, 1);
    dummy.updateMatrix();
    rainMesh.setMatrixAt(i, dummy.matrix);
  }
  rainMesh.instanceMatrix.needsUpdate = true;
}

$('frontType').addEventListener('change', e => { type = e.target.value; buildSymbol(type); rebuild(); });
$('time').addEventListener('input', e => { t = Number(e.target.value); paint(e.target); rebuild(); });
$('playBtn').addEventListener('click', () => {
  playing = !playing;
  if (playing && t >= 1) t = 0;
  $('playBtn').textContent = playing ? '⏸ 暫停' : '▶ 自動推演';
});
$('viewBtn').addEventListener('click', resetView);
$('collapse').addEventListener('click', () => {
  const c = $('panel').classList.toggle('collapsed');
  $('collapse').textContent = c ? '展開' : '收合';
});

/* =========================================================
   主迴圈
   ========================================================= */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = w < h ? 70 : 42;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

const clock = new THREE.Clock();
function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (playing) {
    t = Math.min(1, t + dt * 0.06);
    $('time').value = t; paint($('time'));
    rebuild();
    if (t >= 1) { playing = false; $('playBtn').textContent = '▶ 自動推演'; }
  }
  updateArrowSet(coldArrows, dt);
  updateArrowSet(warmArrows, dt);
  updateRain(dt);
  controls.update();
  placeLabels();
  window.MobileView?.offset(camera);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.fronts = { PROFILE, FRONT_X, get state() { return { type, t, xf }; } };   // 除錯 / 驗證用

paint($('time'));
buildSymbol(type);
rebuild();
resize();
resetView();
animate();
</script>

<script>
setTimeout(() => {
  if (!window.__frontsReady) {
    document.getElementById('scene').innerHTML = '<div class="fallback">無法載入 Three.js。<br>請確認電腦已連上網路後重新整理。</div>';
  }
}, 6000);
</script>
<script src="lesson.js" defer></script>
