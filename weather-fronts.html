<!DOCTYPE html>
<html lang="zh-Hant" data-subject="earth">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鋒面與天氣</title>
<link rel="stylesheet" href="lab-kit.css">
</head>
<body>
<canvas id="cv" aria-label="鋒面剖面與天氣變化模擬"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g9">← 回課程總覽</a>
  <h1>鋒面與天氣</h1>
  <p class="sub">國三地科 · 千變萬化的天氣</p>

  <div class="body">
    <div class="modes" style="--n:3">
      <button class="mode" data-k="cold" aria-pressed="true">冷鋒</button>
      <button class="mode" data-k="warm" aria-pressed="false">暖鋒</button>
      <button class="mode" data-k="stat" aria-pressed="false">滯留鋒</button>
    </div>

    <div class="group">
      <div class="row">
        <button class="btn primary grow" id="play">▶ 讓鋒面移動</button>
        <button class="btn" id="reset">重來</button>
      </div>
      <div class="result" id="info" style="margin-top:10px"></div>
    </div>

    <div class="group">
      <div class="group-title">小鎮（圖中的房子）現在的天氣</div>
      <dl class="live">
        <dt>氣溫</dt><dd id="tmp">—</dd>
        <dt>天氣</dt><dd id="wx">—</dd>
        <dt>在哪個氣團裡</dt><dd id="mass">—</dd>
      </dl>
    </div>

    <div class="group">
      <p class="note"><b>鋒面</b>是冷、暖兩個氣團交界的地方。暖空氣比較輕，會沿著鋒面<b>往上爬升</b>，冷卻後形成雲和雨，所以鋒面附近常常下雨。</p>
    </div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script>
(() => {
  const $ = Lab.$;
  const S = { kind: 'cold', x: 0.22, play: false, hist: [], tick: 0 };
  const TOWN = 0.62;                              // 小鎮位置（畫面寬度比例）
  const INFO = {
    cold: '<b>冷鋒</b>：<b>冷氣團推著暖氣團</b>前進。冷空氣鑽到暖空氣下面，把暖空氣<b>猛力往上推</b>，形成高大的積雨雲，常有<b>短時間大雨、雷雨</b>。冷鋒過境後<b>氣溫下降</b>。',
    warm: '<b>暖鋒</b>：<b>暖氣團推著冷氣團</b>前進。暖空氣沿著緩緩的鋒面<b>慢慢爬升</b>，形成大範圍的層狀雲，降雨<b>範圍廣、時間長但雨勢較小</b>。暖鋒過境後<b>氣溫上升</b>。',
    stat: '<b>滯留鋒</b>：冷、暖氣團<b>勢力相當</b>，鋒面幾乎不動，會在同一地區<b>連續下雨</b>好幾天。台灣五、六月的<b>梅雨</b>就是滯留鋒造成的。'
  };
  let W = 600, H = 400, G = 300;                  // G：地面高度

  // 鋒面形狀：高度 h → 往後（冷空氣那側）的距離
  function frontX(fx, h) {
    const sh = h / (G * 0.75);
    if (S.kind === 'cold') return fx - W * 0.10 * Math.pow(sh, 0.6);     // 冷鋒：陡、前端圓鈍
    if (S.kind === 'warm') return fx + W * 0.55 * sh;                     // 暖鋒：坡度很緩，冷空氣在前方
    return fx - W * 0.3 * sh;                                            // 滯留鋒：暖空氣爬在冷空氣上方
  }
  const coldLeft = () => S.kind !== 'warm';        // 冷氣團在左邊？

  function cloud(ctx, x, y, r, a = 0.9) {
    ctx.fillStyle = `rgba(235,240,248,${a})`;
    [[0, 0, 1], [-0.8, 0.2, 0.7], [0.8, 0.25, 0.75], [-0.3, -0.45, 0.7], [0.4, -0.4, 0.65]].forEach(([dx, dy, s]) => { ctx.beginPath(); ctx.arc(x + dx * r, y + dy * r, r * s, 0, Math.PI * 2); ctx.fill(); });
  }
  function rain(ctx, x0, x1, top, t, heavy) {
    ctx.strokeStyle = heavy ? 'rgba(120,180,255,.9)' : 'rgba(150,195,255,.6)';
    ctx.lineWidth = heavy ? 2 : 1.3;
    const step = heavy ? 9 : 16;
    for (let x = x0; x < x1; x += step) {
      for (let k = 0; k < 3; k++) {
        const y = top + ((t * (heavy ? 260 : 160) + x * 7 + k * 60) % (G - top));
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 3, y + (heavy ? 12 : 8)); ctx.stroke();
      }
    }
  }

  function draw(ctx, w, h, dt, t) {
    W = w; H = h; G = h * 0.72;
    if (S.play) {
      const v = S.kind === 'cold' ? 0.05 : S.kind === 'warm' ? 0.03 : 0;
      S.x = Math.min(0.95, S.x + v * dt);
      if (S.kind === 'stat') S.x = 0.5 + Math.sin(t * 0.6) * 0.01;
      if (S.x >= 0.95) S.play = false, playBtn();
    }
    const fx = S.x * W, top = 30;
    // 天空
    ctx.fillStyle = '#16233a'; ctx.fillRect(0, 0, W, G);
    // 兩個氣團
    const cl = coldLeft();
    const poly = [];
    for (let hh = 0; hh <= G - top; hh += 6) poly.push([frontX(fx, hh), G - hh]);
    // 冷空氣區（藍）
    ctx.beginPath();
    if (cl) { ctx.moveTo(0, G); poly.forEach(([x, y]) => ctx.lineTo(x, y)); ctx.lineTo(0, top); }
    else { ctx.moveTo(W, G); poly.forEach(([x, y]) => ctx.lineTo(x, y)); ctx.lineTo(W, top); }
    ctx.closePath(); ctx.fillStyle = 'rgba(70,140,255,.28)'; ctx.fill();
    // 暖空氣區（橘）
    ctx.beginPath();
    if (cl) { ctx.moveTo(W, G); ctx.lineTo(fx, G); poly.forEach(([x, y]) => ctx.lineTo(x, y)); ctx.lineTo(W, top); }
    else { ctx.moveTo(0, G); ctx.lineTo(fx, G); poly.forEach(([x, y]) => ctx.lineTo(x, y)); ctx.lineTo(0, top); }
    ctx.closePath(); ctx.fillStyle = 'rgba(255,140,70,.22)'; ctx.fill();
    // 鋒面線
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); poly.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
    // 暖空氣爬升箭頭（沿鋒面）
    const along = k => { const i = Math.min(poly.length - 1, Math.floor(k * poly.length)); return poly[i]; };
    const [ax, ay] = along(0.15), [bx, by] = along(0.55);
    const off = cl ? 30 : -30;
    Lab.arrow(ax + off, ay - 10, bx + off * 0.6, by - 10, '#ffa64d', 4, 14);
    // 氣團推進箭頭
    const push = (S.kind === 'stat') ? 0 : 1;
    if (push) {
      if (cl) Lab.arrow(fx - 170, G - 40, fx - 60, G - 40, '#7fb2ff', 5, 16);
      else Lab.arrow(fx - 160, G - 60, fx - 50, G - 60, '#ffa64d', 5, 16);
    } else { Lab.arrow(fx - 150, G - 40, fx - 60, G - 40, '#7fb2ff', 4, 14); Lab.arrow(fx + 150, G - 40, fx + 60, G - 40, '#ffa64d', 4, 14); }
    Lab.text(cl ? '冷氣團' : '暖氣團', Math.max(70, fx - 230), G - 90, cl ? '#9cc4ff' : '#ffc08a', 18, 'center', 'bold');
    Lab.text(cl ? '暖氣團' : '冷氣團', Math.min(W - 70, fx + (cl ? 200 : 330)), G - 90, cl ? '#ffc08a' : '#9cc4ff', 18, 'center', 'bold');

    // 雲與雨
    let rainX0, rainX1, heavy;
    if (S.kind === 'cold') {
      // 積雨雲：鋒面正上方、高大
      for (let k = 0; k < 5; k++) cloud(ctx, fx + 10 + (k % 2) * 25, G * 0.25 + k * 28, 34 - k * 2);
      rainX0 = fx - 40; rainX1 = fx + 50; heavy = true;
    } else if (S.kind === 'warm') {
      // 層狀雲：沿緩坡往前延伸
      for (let k = 0; k < 9; k++) { const [x, y] = along(0.08 + k * 0.1); cloud(ctx, x, y - 26, 26, 0.75); }
      rainX0 = fx + 10; rainX1 = fx + W * 0.25; heavy = false;
    } else {
      for (let k = 0; k < 7; k++) { const [x, y] = along(0.05 + k * 0.1); cloud(ctx, x, y - 24, 28, 0.85); }
      rainX0 = fx - W * 0.2; rainX1 = fx + 20; heavy = false;
    }
    rain(ctx, rainX0, rainX1, G * 0.45, t, heavy);
    // 地面
    ctx.fillStyle = '#3d5a35'; ctx.fillRect(0, G, W, H - G);
    // 小鎮
    const tx = TOWN * W;
    ctx.fillStyle = '#e8d9b5'; ctx.fillRect(tx - 14, G - 22, 28, 22);
    ctx.fillStyle = '#c0573f'; ctx.beginPath(); ctx.moveTo(tx - 18, G - 22); ctx.lineTo(tx, G - 38); ctx.lineTo(tx + 18, G - 22); ctx.fill();
    Lab.text('小鎮', tx, G + 16, '#eef1fa', 13);

    // 天氣圖符號
    const sy = G + 48, sx0 = 30, sx1 = Math.min(W - 30, 330);
    Lab.text('天氣圖上的符號：', sx0, sy - 18, 'rgba(238,241,250,.6)', 13, 'left');
    ctx.lineWidth = 3;
    for (let x = sx0; x < sx1; x += 40) {
      if (S.kind === 'cold') { ctx.strokeStyle = ctx.fillStyle = '#5c9cff'; ctx.beginPath(); ctx.moveTo(x, sy); ctx.lineTo(x + 40, sy); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x + 10, sy); ctx.lineTo(x + 20, sy - 14); ctx.lineTo(x + 30, sy); ctx.fill(); }
      else if (S.kind === 'warm') { ctx.strokeStyle = ctx.fillStyle = '#ff6b5e'; ctx.beginPath(); ctx.moveTo(x, sy); ctx.lineTo(x + 40, sy); ctx.stroke(); ctx.beginPath(); ctx.arc(x + 20, sy, 10, Math.PI, 0); ctx.fill(); }
      else {
        const odd = ((x - sx0) / 40) % 2;
        ctx.strokeStyle = ctx.fillStyle = odd ? '#ff6b5e' : '#5c9cff';
        ctx.beginPath(); ctx.moveTo(x, sy); ctx.lineTo(x + 40, sy); ctx.stroke();
        ctx.beginPath(); if (odd) ctx.arc(x + 20, sy, 10, Math.PI, 0); else { ctx.moveTo(x + 10, sy); ctx.lineTo(x + 20, sy + 14); ctx.lineTo(x + 30, sy); } ctx.fill();
      }
    }
    Lab.text(S.kind === 'stat' ? '（三角朝暖、半圓朝冷，鋒面不動）' : '（三角形或半圓形朝向鋒面前進的方向）', sx1 + 50, sy, 'rgba(238,241,250,.55)', 12, 'left');

    // 小鎮天氣
    const inCold = cl ? tx < frontX(fx, 0) : tx > frontX(fx, 0);
    const raining = tx > rainX0 && tx < rainX1;
    S.town = { inCold, raining, heavy };
    const target = inCold ? 14 : 24;
    S.temp = S.temp == null ? target : S.temp + (target - S.temp) * Math.min(1, dt * 1.5);
    if (S.play && (S.tick += dt) > 0.2) { S.tick = 0; S.hist.push(S.temp); if (S.hist.length > 120) S.hist.shift(); }
    // 氣溫紀錄
    const cw = Math.min(260, W * 0.35), chh = H - G - 90;
    if (chh > 60 && S.hist.length > 1) Lab.chart(W - cw - 16, G + 76, cw, chh, [{ data: S.hist, color: '#ffa64d', n: 120 }], { min: 10, max: 28, yLabel: '小鎮氣溫', xLabel: '時間 →' });
  }

  Lab.init({
    draw,
    ui() {
      const tw = S.town; if (!tw) return;
      $('tmp').textContent = S.temp.toFixed(1) + ' °C';
      $('wx').textContent = tw.raining ? (tw.heavy ? '雷陣雨、大雨' : '下雨（綿綿細雨）') : '沒有下雨';
      $('mass').textContent = tw.inCold ? '冷氣團' : '暖氣團';
    }
  });
  function playBtn() { $('play').textContent = S.play ? '❚❚ 暫停' : '▶ 讓鋒面移動'; }
  function reset() { S.x = S.kind === 'warm' ? 0.12 : S.kind === 'stat' ? 0.5 : 0.22; S.hist = []; S.temp = null; S.play = false; playBtn(); }
  $('play').addEventListener('click', () => { if (S.x >= 0.95) reset(); S.play = !S.play; playBtn(); });
  $('reset').addEventListener('click', reset);
  Lab.bindGroup('.mode', k => { S.kind = k; $('info').innerHTML = INFO[k]; reset(); });
  window.frontSim = S;
})();
</script>
<script src="lesson.js" defer></script>
</body>
</html>
