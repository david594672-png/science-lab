<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

window.__ecReady = true;
const $ = id => document.getElementById(id);
const V3 = (x, y, z = 0) => new THREE.Vector3(x, y, z);
const clamp = THREE.MathUtils.clamp, lerp = THREE.MathUtils.lerp;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rnd = (a, b) => a + Math.random() * (b - a);

/* =========================================================
   場景
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
$('scene').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3eff8);
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0xf2f3f7);
const envLight = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
envLight.position.set(3, 5, 4); envLight.scale.setScalar(2.6); envScene.add(envLight);
scene.environment = pmrem.fromScene(envScene, 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0xd5d9e3, 1.0));
const sun = new THREE.DirectionalLight(0xfff6ea, 2.0);
sun.position.set(-5, 13, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -8, near: 1, far: 50 });
sun.shadow.radius = 5;
scene.add(sun);
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 4; controls.maxDistance = 50;

const table = new THREE.Mesh(new RoundedBoxGeometry(16, 0.5, 8, 5, 0.24), new THREE.MeshPhysicalMaterial({ color: 0xdfe2ea, roughness: 0.6, clearcoat: 0.3 }));
table.position.y = -0.25; table.receiveShadow = true; scene.add(table);

/* ----- 材質 ----- */
const clay = (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.5, metalness: 0.03, clearcoat: 0.3, ...o });
const glow = (color, k = 0.8) => clay(color, { emissive: color, emissiveIntensity: k });
/** 金屬：金屬度不要太高（泡在透射溶液裡時才不會變黑），用清漆層做出光澤 */
const metal = (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.35, metalness: 0.35, clearcoat: 1, clearcoatRoughness: 0.15, ...o });
const glassT = (o = {}) => new THREE.MeshPhysicalMaterial({ color: 0xffffff, transmission: 0.9, roughness: 0.1, thickness: 0.3, ior: 1.5, clearcoat: 1, side: THREE.DoubleSide, ...o });
const glassA = () => new THREE.MeshPhysicalMaterial({ color: 0xf6fbff, roughness: 0.05, clearcoat: 1, transparent: true, opacity: 0.2, depthWrite: false, side: THREE.DoubleSide });
const COPPER = new THREE.Color(0xb87333), CU_ION = new THREE.Color(0x0055ff), WHITE = new THREE.Color(0xffffff);
const shadowed = m => { m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); return m; };

/* ----- 標籤 ----- */
const labels = [];
let buildLabels = null;                        // 建構實驗站時收集標籤，切換時一併移除
function addLabel(html = '', cls = '', style = '') {
  const el = document.createElement('div');
  el.className = 'tag ' + cls; el.innerHTML = html;
  if (style) el.style.cssText += style;
  document.body.appendChild(el);
  const L = { el, pos: V3(0, 0, 0), visible: true };
  labels.push(L);
  if (buildLabels) buildLabels.push(L);
  return L;
}
function removeLabels(arr) { arr.forEach(L => { L.el.remove(); const i = labels.indexOf(L); if (i >= 0) labels.splice(i, 1); }); }
const tmpV = V3(0, 0, 0);
function placeLabels() {
  for (const L of labels) {
    if (!L.visible) { L.el.style.display = 'none'; continue; }
    tmpV.copy(L.pos).project(camera);
    if (tmpV.z > 1) { L.el.style.display = 'none'; continue; }
    L.el.style.display = '';
    L.el.style.left = ((tmpV.x + 1) / 2 * window.innerWidth) + 'px';
    L.el.style.top = ((1 - tmpV.y) / 2 * window.innerHeight) + 'px';
  }
}
function banner(html, ms = 4000) {
  $('banner').innerHTML = html; $('banner').classList.add('show');
  clearTimeout(banner.t);
  if (ms) banner.t = setTimeout(() => $('banner').classList.remove('show'), ms);
}
const hideBanner = () => { clearTimeout(banner.t); $('banner').classList.remove('show'); };

/* =========================================================
   共用器材
   ========================================================= */
function makeBeaker(r, h) {
  const g = new THREE.Group();
  const wall = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 0.97, h, 56, 1, true), glassA());
  wall.position.y = h / 2; wall.renderOrder = 5;
  const bottom = new THREE.Mesh(new THREE.CircleGeometry(r * 0.97, 56), glassA());
  bottom.rotation.x = -Math.PI / 2; bottom.position.y = 0.01; bottom.renderOrder = 5;
  const rim = new THREE.Mesh(new THREE.TorusGeometry(r, 0.05, 12, 72), clay(0xffffff, { transparent: true, opacity: 0.8, roughness: 0.1, clearcoat: 1 }));
  rim.rotation.x = Math.PI / 2; rim.position.y = h; rim.renderOrder = 6;
  g.add(wall, bottom, rim);
  return g;
}
/** 果凍溶液：transmission 0.9；c = 銅離子濃度（0 無色 → 1 湛藍） */
function makeSolution(r, h, c = 1) {
  const mat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transmission: 0.9, roughness: 0.03, thickness: 1.2, ior: 1.2, clearcoat: 1,
    attenuationColor: new THREE.Color(0xffffff), attenuationDistance: 30 });
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 56), mat);
  m.position.y = h / 2 + 0.02;
  m.userData.setConc = k => {
    // color 會乘到所有「看穿過去」的東西上 → 只淡淡上色，藍色主要靠 attenuation（厚度越厚越藍）
    mat.color.copy(WHITE).lerp(new THREE.Color(0xc9dcff), k);
    mat.attenuationColor.copy(WHITE).lerp(new THREE.Color(0x7aa4ff), k);
    mat.attenuationDistance = lerp(40, 2.2, Math.pow(k, 0.6));
  };
  m.userData.setConc(c);
  return m;
}
/** 電極板：浸在溶液中的下段（會變胖／變瘦）+ 露出液面的上段 */
function makePlate({ w = 0.14, d = 0.85, sub = 1.6, top = 1.4, y0 = 0.25, mat, rod = false }) {
  const g = new THREE.Group();
  const geo = (h) => rod ? new THREE.CylinderGeometry(w, w, h, 28) : new RoundedBoxGeometry(w, h, d, 3, Math.min(w, d) * 0.35);
  const subM = new THREE.Mesh(geo(sub), mat); subM.position.y = y0 + sub / 2;
  const topM = new THREE.Mesh(geo(top), mat); topM.position.y = y0 + sub + top / 2;
  const clip = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 12), clay(0xd14b4b));
  clip.position.y = y0 + sub + top;
  g.add(subM, topM, clip);
  g.userData = { subM, topM, w, d, sub, y0, topY: y0 + sub + top, rod };
  return shadowed(g);
}
/** 粗糙紅褐色銅沉積層：包在電極下段外面，thickness 越大越胖 */
function makeCoat(plate) {
  const { w, d, sub, y0, rod } = plate.userData;
  const geo = rod ? new THREE.CylinderGeometry(w, w, sub * 0.96, 40, 12) : new RoundedBoxGeometry(w, sub * 0.96, d, 6, Math.min(w, d) * 0.35);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {      // 表面凹凸 → 粗糙
    const k = 1 + (Math.random() - 0.5) * 0.18;
    pos.setX(i, pos.getX(i) * k); pos.setZ(i, pos.getZ(i) * (1 + (Math.random() - 0.5) * 0.06));
  }
  geo.computeVertexNormals();
  const coat = new THREE.Mesh(geo, clay(0xb87333, { roughness: 0.92, metalness: 0.25, clearcoat: 0.05 }));
  coat.position.y = y0 + sub * 0.48;
  coat.visible = false;
  plate.add(coat);
  coat.userData.set = t => {               // t：厚度
    coat.visible = t > 0.004;
    if (rod) coat.scale.set((w + t) / w, 1, (w + t) / w);
    else coat.scale.set((w + 2 * t) / w, 1, (d + 2 * t * 0.6) / d);
  };
  coat.castShadow = true;
  return coat;
}
/** 導線：清透玻璃外皮（高透光、低粗糙、略降不透明度）＋細金屬芯，讓內部發光電子完全透出 */
function makeWire(points, color = 0x3a3f4a) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal', 0.5);
  const mesh = new THREE.Group();
  const sheath = new THREE.Mesh(new THREE.TubeGeometry(curve, 160, 0.09, 14, false), new THREE.MeshPhysicalMaterial({
    color: 0xfffdf6, transmission: 0.97, roughness: 0.03, thickness: 0.1, ior: 1.15, clearcoat: 1, clearcoatRoughness: 0.05, transparent: true, opacity: 0.88 }));
  const core = new THREE.Mesh(new THREE.TubeGeometry(curve, 160, 0.02, 8, false), clay(color, { roughness: 0.4 }));
  sheath.castShadow = true;
  mesh.add(core, sheath);
  return { mesh, curve };
}
/* ----- 電子 VFX：金黃色高亮膠囊，長軸對齊導線切線，移動時拉長成速度拖影 ----- */
const UPV = V3(0, 1, 0), tanV = V3(0, 0, 0);
const electronGeo = new THREE.CapsuleGeometry(0.03, 0.11, 4, 10);
const electronMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0xffcc00, emissiveIntensity: 1.2, roughness: 0.3, toneMapped: false });
electronGeo.userData.shared = electronMat.userData.shared = true;
/** 導線上的電子：沿曲線 u 前進（數量為原本 2 倍，分內外兩層） */
function makeElectrons(parent, curve, n = 12) {
  n = Math.round(n * 2);
  const list = Array.from({ length: n }, (_, i) => {
    const m = new THREE.Mesh(electronGeo, electronMat); parent.add(m);
    const a = Math.random() * Math.PI * 2, r = (i % 2 ? 0.045 : 0.012) * (0.7 + Math.random() * 0.3);
    return { m, u0: (i + Math.random() * 0.6) / n, ox: Math.cos(a) * r, oy: Math.sin(a) * r, len: 0.75 + Math.random() * 0.6 };
  });
  let u = 0;
  const api = {
    update(du) {
      u += du;
      const st = du ? 0.9 : 0;
      list.forEach(e => {
        const t = ((e.u0 + u) % 1 + 1) % 1;
        curve.getPointAt(t, e.m.position);
        curve.getTangentAt(t, tanV);
        e.m.quaternion.setFromUnitVectors(UPV, tanV);
        e.m.scale.set(1, e.len * (1 + st), 1);
        e.m.translateX(e.ox); e.m.translateZ(e.oy);
      });
    },
    first: list[0].m
  };
  api.update(0);
  return api;
}
function makeBulb() {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.24, 0.36, 24), metal(0xb9bcc4));
  base.position.y = 0.18;
  const glassM = new THREE.Mesh(new THREE.SphereGeometry(0.44, 32, 24), glassT({ thickness: 0.2 }));
  glassM.position.y = 0.72;
  const filMat = clay(0xffd27a, { emissive: 0xffb02e, emissiveIntensity: 0.1 });

const ionGeo = new THREE.SphereGeometry(1, 22, 16); ionGeo.userData.shared = true;
const ionCapGeo = new THREE.CapsuleGeometry(1, 1.8, 6, 14); ionCapGeo.userData.shared = true;   // 鹽橋內流動的離子用膠囊
const ionMats = {};
for (const [k, v] of Object.entries(ION)) {
  // 高強度自發光；toneMapped:false 讓顏色保持飽和、不被洗白
  ionMats[k] = new THREE.MeshStandardMaterial({ color: v.color, emissive: v.color, emissiveIntensity: 0.55 + 0.45 * v.k, roughness: 0.25, toneMapped: false });

/** 離子系統：free 布朗運動｜seek 游向目標｜drift 漂移並淡出 */
function makeIons(parent) {
  const list = [], tmp = V3(0, 0, 0);
  const api = {
    list,
    add(kind, p, region, v) {
      const m = new THREE.Mesh(ionGeo, ionMats[kind]);
      m.scale.setScalar(ION[kind].r);
      parent.add(m);
      const o = { kind, m, p: p.clone(), v: v ? v.clone() : V3(rnd(-0.2, 0.2), rnd(-0.2, 0.2), rnd(-0.2, 0.2)), mode: 'free', region };
      m.position.copy(o.p);
      list.push(o); return o;
    },
    remove(o) { const i = list.indexOf(o); if (i >= 0) list.splice(i, 1); parent.remove(o.m); },
    randomIn(R) { const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * R.r; return V3(R.x + Math.cos(a) * r, rnd(R.y0, R.y1), R.z + Math.sin(a) * r); },
    fill(kind, n, R) { for (let i = 0; i < n; i++) api.add(kind, api.randomIn(R), R); },
    nearestFree(kind, R, target) {
      let best = null, bd = 1e9;
      for (const o of list) if (o.kind === kind && o.region === R && o.mode === 'free') { const d = o.p.distanceToSquared(target); if (d < bd) { bd = d; best = o; } }
      return best;
    },
    count(kind, R) { return list.filter(o => o.kind === kind && (!R || o.region === R)).length; },
    seek(o, target, cb, speed = 1.2) { o.mode = 'seek'; o.target = target.clone(); o.cb = cb; o.speed = speed; },
    /** dt：真實時間（布朗運動）；flow：反應時間（游向電極、只有通電才前進） */
    update(dt, flow) {
      for (const o of list.slice()) {
        if (o.mode === 'seek') {
          if (flow > 0) {
            tmp.copy(o.target).sub(o.p);
            const d = tmp.length(), step = o.speed * flow;
            if (d <= step) { o.p.copy(o.target); o.mode = 'done'; if (o.cb) o.cb(o); continue; }
            o.p.addScaledVector(tmp, step / d);
            o.p.y += Math.sin(performance.now() / 300 + o.p.x * 5) * 0.004;
          }
        } else if (o.mode === 'drift') {
          o.p.addScaledVector(o.v, dt);
          o.ttl -= dt;
          o.m.scale.setScalar(ION[o.kind].r * clamp(o.ttl / 0.6, 0, 1));
          if (o.ttl <= 0) { api.remove(o); continue; }
        } else if (o.mode === 'free') {
          const R = o.region;
          o.v.x += (Math.random() - 0.5) * 2.2 * dt; o.v.y += (Math.random() - 0.5) * 2.2 * dt; o.v.z += (Math.random() - 0.5) * 2.2 * dt;
          o.v.multiplyScalar(Math.pow(0.55, dt));
          if (o.v.length() > 0.5) o.v.setLength(0.5);
          o.p.addScaledVector(o.v, dt);
          if (R) {
            const dx = o.p.x - R.x, dz = o.p.z - R.z, rr = Math.hypot(dx, dz);
            if (rr > R.r) { o.p.x = R.x + dx / rr * R.r; o.p.z = R.z + dz / rr * R.r; const vn = (o.v.x * dx + o.v.z * dz) / rr; if (vn > 0) { o.v.x -= 2 * vn * dx / rr; o.v.z -= 2 * vn * dz / rr; } }
            if (o.p.y < R.y0) { o.p.y = R.y0; o.v.y = Math.abs(o.v.y); }
            if (o.p.y > R.y1) { o.p.y = R.y1; o.v.y = -Math.abs(o.v.y); }
          }
        }
        o.m.position.copy(o.p);
      }
    }
  };
  return api;
}
/** 電極板表面上的一點（朝向 from 的那一面） */
function plateSurface(plate, from, R) {
  const { w, d, sub, y0, rod } = plate.userData;
  const P = plate.position;
  const y = rnd(y0 + 0.15, y0 + Math.min(sub, R ? R.y1 - y0 : sub) - 0.1);
  if (rod) { const a = Math.atan2(from.z - P.z, from.x - P.x) + rnd(-0.6, 0.6); return V3(P.x + Math.cos(a) * (w + 0.06), y, P.z + Math.sin(a) * (w + 0.06)); }
  const side = from.x >= P.x ? 1 : -1;
  return V3(P.x + side * (w / 2 + 0.07), y, P.z + rnd(-d * 0.42, d * 0.42));
}

/* =========================================================
   模組二／三：電解槽（電池 + 大燒杯 + 兩電極）
   左電極接電池負極（陰極：還原）；右電極接電池正極（陽極：氧化）
   ========================================================= */
function electroCell(g, { cathode, anode, cathodeName, anodeName }) {
  const BR = 2.0, BH = 3.0, LH = 2.3;
  const b = makeBeaker(BR, BH), s = makeSolution(BR - 0.08, LH, 1);
  g.add(b, s);
  cathode.position.set(-1.05, 0, 0); anode.position.set(1.05, 0, 0);
  g.add(cathode, anode);
  const bat = makeBattery(); bat.position.set(0, 5.35, 0); g.add(bat);
  const cTop = cathode.userData.topY ?? 4.0, aTop = anode.userData.topY ?? 4.0;
  const w1 = makeWire([V3(-1.28, 5.35, 0), V3(-1.75, 5.2, 0), V3(-1.05, 4.6, 0), V3(-1.05, cTop, 0)], 0x2b3a67);
  const w2 = makeWire([V3(1.05, aTop, 0), V3(1.05, 4.6, 0), V3(1.8, 5.2, 0), V3(1.45, 5.35, 0)], 0xb03a3a);
  g.add(w1.mesh, w2.mesh);
  const e1 = makeElectrons(g, w1.curve, 7), e2 = makeElectrons(g, w2.curve, 7);
  const lE = addLabel('e⁻', 'e');
  const lNeg = addLabel('－ 負極', '', 'color:#2b3a67;font-size:.8rem'), lPos = addLabel('＋ 正極', '', 'color:#b03a3a;font-size:.8rem');
  lNeg.pos.set(-1.75, 5.85, 0); lPos.pos.set(1.6, 5.85, 0);
  const lC = addLabel(cathodeName, '', 'color:#2b3a67'), lA = addLabel(anodeName, '', 'color:#b03a3a');
  lC.pos.set(-2.6, 3.4, 0); lA.pos.set(2.6, 3.4, 0);
  const lS = addLabel('CuSO₄ 溶液', '', 'color:#0047d6'); lS.pos.set(0, -0.05, 2.2);
  const RG = { x: 0, z: 0, r: 1.75, y0: 0.35, y1: LH - 0.12 };
  return {
    s, RG, LH,
    update(dt, on, flow) {
      e1.update(on ? flow * 0.12 : 0); e2.update(on ? flow * 0.12 : 0);
      lE.pos.copy(e1.first.position).add(V3(0, 0.22, 0));
    }
  };
}

        if (o) ions.seek(o, keyPts(), ion => { ions.remove(ion); sparkle = 1; }, 1.1);
      }
      ions.update(dt, flow);
      // 材質漸變：鐵的銀灰 → 閃亮的銅紅褐
      const p = smooth(0, 1, xi / XFULL);
      keyMat.color.copy(IRON).lerp(COPPER, p);
      keyMat.metalness = lerp(0.35, 0.45, p);
      keyMat.roughness = lerp(0.32, 0.2, p);
      sparkle = Math.max(0, sparkle - dt * 3);
      keyMat.emissive.copy(COPPER); keyMat.emissiveIntensity = 0.4 * p + 0.3 * sparkle;
      key.scale.setScalar(1 + 0.04 * clamp(xi / XEND, 0, 1));
      const f = xi / XEND;
      anode.userData.subM.scale.set(1 - 0.7 * f, 1, 1 - 0.2 * f);          // 銅板溶解變薄
      cell.s.userData.setConc(1);
      cell.update(dt, on, flow);
    },
    monitor() {
      const dm = 63.5 * xi, p = clamp(xi / XFULL, 0, 1);
      return {
        sub: '電鍍：以銅鍍鐵鑰匙',
        rows: [['鐵鑰匙（陰極）', `${fmt(8 + dm)} g ${delta(8 + dm, 8)}`], ['厚銅板（陽極）', `${fmt(15 - dm)} g ${delta(15 - dm, 15)}`], ['鍍層覆蓋率', `${(p * 100).toFixed(0)} %`]],
        conc: ['Cu²⁺ 濃度（藍色深淺）', 1],
        eq: [['陰極（鑰匙）', 'Cu²⁺ + 2e⁻ → Cu'], ['陽極（銅板）', 'Cu → Cu²⁺ + 2e⁻']],
        note: '電鍍三原則：<b>被鍍物接負極</b>、<b>鍍上去的金屬接正極</b>、<b>電解液含鍍層金屬的離子</b>。溶液顏色不變。',
        blue: true,
        legend: ['Cu', 'SO4']
      };
    }
  };
};

/* =========================================================
   模組四：電解水（倒立試管排水集氣法）
   兩支試管半徑相同 → 收集的氣體體積 ∝ 水面下降的高度
   負極（H₂）水面下降速度 = 正極（O₂）的 2 倍；氣泡產生速率也是 2 倍
   ========================================================= */
function waterBuilder(electrolyte) {
  return (g) => {
    const TR = 2.4, TH = 2.4, LH = 1.8, TUBE_R = 0.42, Y_MOUTH = 0.75, Y_TOP = 3.75, XS = 1.1;
    const RATE = 0.1;                 // 負極試管水面下降速度（單位／秒）；正極恰為一半
    const DMAX = 2.6;                 // 負極最多排開的高度
    const ML = 20;                    // 1 單位高度 = 20 mL（兩支試管截面積相同）
    const BUB = 7;                    // 正極每秒氣泡數；負極 = 2 × BUB
    const tank = makeBeaker(TR, TH), sol = makeSolution(TR - 0.08, LH, 0);
    sol.material.color.set(0xeef8ff);
    g.add(tank, sol);

    // 碳棒（從水槽底部的橡皮塞往上伸）
    const rod = x => {
      const grp = new THREE.Group();
      const rmat = clay(0x45464d, { roughness: 0.75 });
      const r = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 1.2, 24), rmat); r.position.y = 0.2 + 0.6;
      const cap = new THREE.Mesh(new THREE.SphereGeometry(0.13, 20, 12), rmat); cap.position.y = 1.4;
      const stopper = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.34, 0.16, 28), clay(0x6b4f3a, { roughness: 0.85 })); stopper.position.y = 0.09;
      grp.add(r, cap, stopper); grp.position.x = x;
      return shadowed(grp);
    };
    g.add(rod(-XS), rod(XS));

    // 倒立試管：透射玻璃（不寫入深度，管內的水柱、氣體與氣泡才看得到）
    const tubeWaterMat = new THREE.MeshPhysicalMaterial({ color: 0x5aaee8, roughness: 0.08, clearcoat: 1, transparent: true, opacity: 0.6, depthWrite: false, emissive: 0x6fb8e0, emissiveIntensity: 0.12 });
    const meniscusMat = new THREE.MeshPhysicalMaterial({ color: 0xd6f1ff, roughness: 0.05, clearcoat: 1, transparent: true, opacity: 0.75, depthWrite: false, side: THREE.DoubleSide, emissive: 0x9fd8f5, emissiveIntensity: 0.3 });
    const tube = (x, gasColor) => {
      const grp = new THREE.Group(); grp.position.x = x;
      const R = TUBE_R, t = 0.045;
      const prof = [new THREE.Vector2(R + t, Y_MOUTH), new THREE.Vector2(R + t, Y_TOP - 0.06), new THREE.Vector2(R + t - 0.02, Y_TOP + 0.015),
        new THREE.Vector2(R - 0.06, Y_TOP + t), new THREE.Vector2(0, Y_TOP + t)];
      const glassM = new THREE.Mesh(new THREE.LatheGeometry(prof, 56), glassT({ thickness: 0.08, roughness: 0.06, depthWrite: false }));
      glassM.renderOrder = 7;
      const lip = new THREE.Mesh(new THREE.TorusGeometry(R + t, 0.03, 10, 48), glassT({ depthWrite: false }));
      lip.rotation.x = Math.PI / 2; lip.position.y = Y_MOUTH; lip.renderOrder = 7;
      const water = new THREE.Mesh(new THREE.CylinderGeometry(R - 0.005, R - 0.005, 1, 48, 1, true), tubeWaterMat); water.renderOrder = 8;
      const men = new THREE.Mesh(new THREE.CircleGeometry(R - 0.005, 48), meniscusMat); men.rotation.x = -Math.PI / 2; men.renderOrder = 9;
      const gas = new THREE.Mesh(new THREE.CylinderGeometry(R - 0.01, R - 0.01, 1, 48), new THREE.MeshBasicMaterial({ color: gasColor, transparent: true, opacity: 0.35, depthWrite: false }));
      gas.renderOrder = 6;
      // 刻度：每 0.25 單位 = 5 mL
      const tickMat = clay(0x5b6170);
      for (let i = 1; i <= 11; i++) {
        const big = i % 2 === 0;
        const tk = new THREE.Mesh(new THREE.TorusGeometry(R + t + 0.004, big ? 0.011 : 0.006, 4, 40, Math.PI * (big ? 0.55 : 0.32)), tickMat);
        tk.rotation.set(Math.PI / 2, 0, Math.PI / 2 - Math.PI * (big ? 0.275 : 0.16));
        tk.position.y = Y_TOP - i * 0.25;
        grp.add(tk);
      }
      // 水面亮環：一眼看出水位
      const ring = new THREE.Mesh(new THREE.TorusGeometry(R - 0.01, 0.025, 10, 48), glow(0x2f8fe0, 0.9));
      ring.rotation.x = Math.PI / 2;
      grp.add(glassM, lip, water, men, gas, ring);
      let level = Y_TOP;
      grp.userData = {
        get level() { return level; },
        set(lv) {
          level = lv;
          water.scale.y = lv - Y_MOUTH; water.position.y = (lv + Y_MOUTH) / 2;
          men.position.y = lv; ring.position.y = lv;
          const h = Y_TOP - lv;
          gas.visible = h > 0.01; gas.scale.y = Math.max(h, 0.001); gas.position.y = Y_TOP - h / 2;
        }
      };
      grp.userData.set(Y_TOP);
      return grp;
    };
    const tH = tube(-XS, 0xfff4cc), tO = tube(XS, 0xfff4cc);
    g.add(tH, tO);

    // 電池放在水槽後方桌面上，導線從水槽底部接到碳棒（不擋住試管）
    const bat = makeBattery(); bat.position.set(0, 0.42, -3.4); g.add(bat);
    const wNeg = makeWire([V3(-1.28, 0.42, -3.4), V3(-1.8, 0.28, -3.15), V3(-1.55, 0.07, -2.1), V3(-1.15, 0.07, -0.7), V3(-XS, 0.1, -0.25)], 0x2b3a67);
    const wPos = makeWire([V3(XS, 0.1, -0.25), V3(1.15, 0.07, -0.7), V3(1.55, 0.07, -2.1), V3(1.9, 0.28, -3.15), V3(1.45, 0.42, -3.4)], 0xb03a3a);
    g.add(wNeg.mesh, wPos.mesh);
    const e1 = makeElectrons(g, wNeg.curve, 7), e2 = makeElectrons(g, wPos.curve, 7);
    const lE = addLabel('e⁻', 'e');
    const lBN = addLabel('－', '', 'color:#2b3a67;font-size:.9rem'), lBP = addLabel('＋', '', 'color:#b03a3a;font-size:.9rem');
    lBN.pos.set(-1.0, 1.05, -3.4); lBP.pos.set(1.0, 1.05, -3.4);
    const lN = addLabel('負極（接電池 −）', '', 'color:#2b3a67'), lP = addLabel('正極（接電池 ＋）', '', 'color:#b03a3a');
    lN.pos.set(-XS - 0.2, -0.15, 2.55); lP.pos.set(XS + 0.2, -0.15, 2.55);
    const lGH = addLabel('', '', 'color:#8a6a00;font-size:.8rem'), lGO = addLabel('', '', 'color:#1f5fa8;font-size:.8rem');
    const lSol = addLabel(electrolyte === 'naoh' ? '水 ＋ 少量 NaOH（幫助導電）' : '水 ＋ 少量 H₂SO₄（幫助導電）', '', 'color:#3d6fd8');
    lSol.pos.set(0, 1.0, 2.5);

    const ions = makeIons(g), bub = makeBubbles(g, 120);
    const RG = { x: 0, z: 0, r: 2.05, y0: 0.35, y1: LH - 0.12 };
    if (electrolyte === 'naoh') { ions.fill('Na', 7, RG); ions.fill('OH', 7, RG); } else { ions.fill('H', 10, RG); ions.fill('SO4', 5, RG); }
    const levelH = () => tH.userData.level, levelO = () => tO.userData.level;
    const rodPoint = x => { const a = rnd(0, Math.PI * 2); return V3(x + Math.cos(a) * 0.15, rnd(0.45, 1.4), Math.sin(a) * 0.15); };

    let dH = 0, hAcc = 0, oAcc = 0, nH = 0, nO = 0, done = false;
    return {
      intro: '純水幾乎不導電，所以加入少量電解質。按「啟動」，比一比兩支試管收集到的氣體！',
      camera: { pos: [0, 4.2, 11.5], target: [0, 2.1, 0] },
      update(dt, flow) {
        if (flow > 0 && dH < DMAX) dH = Math.min(DMAX, dH + RATE * flow);
        const dO = dH / 2;                                   // 正極下降量恰為負極的一半
        const on = flow > 0 && dH < DMAX;
        if (dH >= DMAX && !done) { done = true; banner(`收集完成：氫氣 ${fmt(dH * ML, 0)} mL ： 氧氣 ${fmt(dO * ML, 0)} mL ＝ <b>2 ： 1</b>`, 0); }
        if (on) {
          hAcc += 2 * BUB * flow; oAcc += BUB * flow;       // 負極氣泡產生速率 = 正極的 2 倍
          while (hAcc >= 1) { hAcc--; nH++; bub.spawn(rodPoint(-XS), levelH, 0.06); }
          while (oAcc >= 1) { oAcc--; nO++; bub.spawn(rodPoint(XS), levelO, 0.06); }
        }
        tH.userData.set(Y_TOP - dH);
        tO.userData.set(Y_TOP - dO);
        bub.update(dt); ions.update(dt, flow);
        e1.update(on ? flow * 0.12 : 0); e2.update(on ? flow * 0.12 : 0);
        lE.pos.copy(e1.first.position).add(V3(0, 0.22, 0));
        lGH.visible = lGO.visible = dH > 0.02;
        lGH.pos.set(-XS - 0.95, Y_TOP - dH / 2, 0); lGH.el.innerHTML = `H₂ 氫氣<br>${fmt(dH * ML, 1)} mL`;
        lGO.pos.set(XS + 0.95, Y_TOP - dO / 2, 0); lGO.el.innerHTML = `O₂ 氧氣<br>${fmt(dO * ML, 1)} mL`;
      },
      monitor() {
        const dO = dH / 2;
        return {
          sub: `電解水（${electrolyte === 'naoh' ? '加少量 NaOH' : '加少量 H₂SO₄'}，排水集氣法）`,
          rows: [['負極試管：氫氣 H₂', `${fmt(dH * ML, 1)} mL`], ['正極試管：氧氣 O₂', `${fmt(dO * ML, 1)} mL`],
            ['體積比 H₂ : O₂', dO > 0.005 ? `<span class="up">${(dH / dO).toFixed(1)} : 1</span>` : '—'], ['氣泡數 負極 : 正極', `${nH} : ${nO}`]],
          conc: ['負極試管已排開的水', dH / DMAX],
          eq: [['全反應', '2H₂O → 2H₂↑ + O₂↑'], ['負極（陰極）產生氫氣', '4H₂O + 4e⁻ → 2H₂ + 4OH⁻'], ['正極（陽極）產生氧氣', '2H₂O → O₂ + 4H⁺ + 4e⁻']],
          note: '🧠 必背口訣：<b>負氫正氧（父親正癢）</b><br>體積比 氫 ： 氧 ＝ <b>2 ： 1</b>',
          note2: `純水難導電，需加入少量${electrolyte === 'naoh' ? ' NaOH' : ' H₂SO₄'} 等電解質幫助導電；電解質本身不會被消耗。`,
          legend: electrolyte === 'naoh' ? ['Na', 'OH'] : ['H', 'SO4']
        };
      }
    };
  };
}
BUILDERS.water_naoh = waterBuilder('naoh');
BUILDERS.water_h2so4 = waterBuilder('h2so4');

/* =========================================================
   監測儀
   ========================================================= */
let monT = 0;
function renderMonitor() {
  const m = cur.monitor();
  $('monSub').textContent = m.sub;
  $('monBody').innerHTML = `
    <div class="mcard"><h4>巨觀：電極質量</h4><div class="kv">${m.rows.map(([k, v]) => `<span>${k}</span><b>${v}</b>`).join('')}</div></div>
    ${m.conc ? `<div class="mcard"><h4>${m.conc[0]}：${(m.conc[1] * 100).toFixed(0)} %</h4><div class="bar"><i style="width:${(m.conc[1] * 100).toFixed(1)}%"></i></div></div>` : ''}
    <div class="mcard"><h4>微觀：反應式</h4><div class="eq">${m.eq.map(([t, e]) => `<div><span class="t">${t}</span><br>${e}</div>`).join('')}</div>${legend(m.legend)}</div>
    <div class="note ${m.blue ? 'blue' : ''}">${m.note}</div>${m.note2 ? `<div class="note blue">${m.note2}</div>` : ''}`;
}

/* =========================================================
   切換、控制與主迴圈
   ========================================================= */
let station = 's1', running = false, simT = 0, speed = 1;
function variantOf(s) { return s === 's1' ? $('s1Var').value : s === 's2' ? $('s2Var').value : s === 's4' ? $('s4Var').value : 'plating'; }
function setStation(s) {
  station = s;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.mode === s));
  document.querySelectorAll('.section').forEach(x => { x.hidden = x.dataset.mode !== s; });
  build(variantOf(s));
  updateDesc();
}
function updateDesc() {
  $('s1Desc').innerHTML = DESC1[$('s1Var').value];
  $('s2Desc').innerHTML = $('s2Var').value === 'carbon'
    ? '兩根<b>碳棒</b>（不參與反應）。陰極：Cu²⁺ 得到電子變成銅；陽極：<b>水</b>失去電子產生氧氣。'
    : '兩根<b>銅棒</b>。陰極：Cu²⁺ 變成銅（變胖）；陽極：銅失去電子變成 Cu²⁺（變瘦）。';
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setStation(b.dataset.mode)));
$('s1Var').addEventListener('change', () => { build(variantOf('s1')); updateDesc(); });
$('s2Var').addEventListener('change', () => { build(variantOf('s2')); updateDesc(); });
$('s4Var').addEventListener('change', () => build(variantOf('s4')));
$('runBtn').addEventListener('click', () => { running = !running; $('runBtn').textContent = running ? '⏸ 暫停' : '▶ 繼續'; });
$('resetBtn').addEventListener('click', () => build(cur.key));
document.querySelectorAll('#speedRow .btn').forEach(b => b.addEventListener('click', () => {
  speed = Number(b.dataset.s);
  document.querySelectorAll('#speedRow .btn').forEach(x => x.classList.toggle('on', x === b));
}));
$('viewBtn').addEventListener('click', resetView);
$('collapse').addEventListener('click', () => { const c = $('panel').classList.toggle('collapsed'); $('collapse').textContent = c ? '展開' : '收合'; });
$('monCollapse').addEventListener('click', () => { const c = $('monitor').classList.toggle('collapsed'); $('monCollapse').textContent = c ? '展開' : '收合'; });

function resetView() {
  if (!cur) return;
  const c = cur.camera;
  const pos = V3(...c.pos), tgt = V3(...c.target);
  if (!window.MobileView?.isMobile()) {
    const visW = 2 * pos.distanceTo(tgt) * Math.tan(camera.fov * Math.PI / 360) * camera.aspect;
    const left = $('panel').classList.contains('collapsed') ? 0 : $('panel').getBoundingClientRect().right;
    const right = $('monitor').classList.contains('collapsed') ? 0 : window.innerWidth - $('monitor').getBoundingClientRect().left;
    const shift = -((left - right) / 2) / window.innerWidth * visW;
    pos.x += shift; tgt.x += shift;
  }
  camera.position.copy(pos); controls.target.copy(tgt); controls.update();
  window.MobileView?.frame(camera, controls, 1.35);
}
function resize() {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.fov = 40;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

const clock = new THREE.Clock();
function frame(dt) {
  const flow = running ? dt * speed : 0;
  if (running) simT += flow;
  cur.update(dt, flow);
  monT -= dt;
  if (monT <= 0) { monT = 0.12; renderMonitor(); }
  controls.update();
  placeLabels();
  window.MobileView?.offset(camera);
  renderer.render(scene, camera);
}
function animate() { frame(Math.min(clock.getDelta(), 0.05)); requestAnimationFrame(animate); }

window.ec = { setStation, build, frame, get cur() { return cur; }, run: v => { running = v; }, setSpeed: v => { speed = v; } };

resize();
setStation('s1');
animate();
</script>

<script>
setTimeout(() => {
  if (!window.__ecReady) {
    document.getElementById('scene').innerHTML = '<div class="fallback">無法載入 Three.js。<br>請確認電腦已連上網路後重新整理。</div>';
  }
}, 6000);
</script>
