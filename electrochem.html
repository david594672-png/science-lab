<!DOCTYPE html>
<html lang="zh-Hant" data-subject="chem">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>電流的化學效應</title>
<link rel="stylesheet" href="lab-kit.css">
</head>
<body>
<canvas id="cv" aria-label="電池、電解與電鍍的離子與電子流動模擬"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g9">← 回課程總覽</a>
  <h1>電流的化學效應</h1>
  <p class="sub">國三理化 · 電的應用</p>

  <div class="body">
    <div class="modes" style="--n:3">
      <button class="mode" data-k="cell" aria-pressed="true">鋅銅電池</button>
      <button class="mode" data-k="water" aria-pressed="false">電解水</button>
      <button class="mode" data-k="plate" aria-pressed="false">電鍍</button>
    </div>

    <div class="group">
      <div class="row">
        <button class="btn primary grow" id="run">▶ 開始反應</button>
        <button class="btn" id="reset">重來</button>
      </div>
      <label class="sw"><input type="checkbox" id="showE" checked><span class="track"></span>電子流動方向</label>
      <label class="sw"><input type="checkbox" id="showI" checked><span class="track"></span>正負離子移動</label>
    </div>

    <div class="group">
      <div class="result" id="info"></div>
      <dl class="live" style="margin-top:8px" id="live"></dl>
    </div>

    <div class="group">
      <p class="note"><b>電池</b>：化學能 → 電能（自己產生電流）。<b>電解、電鍍</b>：電能 → 化學能（要外加電源）。電子在<b>導線</b>中流動，離子在<b>溶液</b>中移動；電流方向和電子流動方向<b>相反</b>。</p>
    </div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script>
(() => {
  const $ = Lab.$;
  const S = { mode: 'cell', run: false, t: 0, ions: [], bubbles: [] };
  const INFO = {
    cell: '<b>鋅銅電池</b>：鋅比銅活潑，<b>鋅失去電子</b>變成 Zn²⁺ 溶入溶液（鋅片變輕），電子經導線流到銅片；溶液中的 <b>Cu²⁺ 得到電子</b>變成銅附著在銅片上（銅片變重）。鹽橋讓離子移動，保持溶液電中性。<br>鋅是<b>負極</b>、銅是<b>正極</b>。',
    water: '<b>電解水</b>：水中加少量氫氧化鈉幫助導電。<b>負極（陰極）產生氫氣</b>、<b>正極（陽極）產生氧氣</b>，體積比約 <b>氫：氧 = 2：1</b>。',
    plate: '<b>電鍍（以鍍銅為例）</b>：要鍍的鐵湯匙接<b>負極</b>，銅片接<b>正極</b>，用硫酸銅溶液。正極的銅失去電子變成 Cu²⁺ 溶出；溶液中的 Cu²⁺ 在負極得到電子，<b>銅鍍在湯匙上</b>。溶液的藍色深淺幾乎不變。'
  };
  let geo = {};

  function reset() {
    S.t = 0; S.run = false; S.ions = []; S.bubbles = []; S.h2 = 0; S.o2 = 0;
    for (let i = 0; i < 26; i++) S.ions.push({ side: i % 2, x: Math.random(), y: Math.random(), kind: i % 3 === 0 ? 'neg' : 'pos', ph: Math.random() * 6 });
    $('run').textContent = '▶ 開始反應';
  }

  function beaker(ctx, x, y, w, h, color) {
    ctx.fillStyle = color; ctx.fillRect(x, y + h * 0.18, w, h * 0.82);
    ctx.strokeStyle = 'rgba(220,235,255,.7)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y); ctx.stroke();
  }
  function electrode(ctx, x, y, h, color, label, thick = 16) {
    Lab.card(x - thick / 2, y, thick, h, color, 'rgba(255,255,255,.4)', 3);
    Lab.text(label, x, y + h + 18, '#eef1fa', 13, 'center', 'bold');
  }
  // 沿導線移動的電子
  function electrons(ctx, path, t, dir = 1) {
    if (!$('showE').checked || !S.run) return;
    const seg = []; let tot = 0;
    for (let i = 1; i < path.length; i++) { const l = Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]); seg.push(l); tot += l; }
    for (let k = 0; k < 10; k++) {
      let d = ((t * 90 * dir + k * tot / 10) % tot + tot) % tot, i = 0;
      while (d > seg[i]) { d -= seg[i]; i++; }
      const f = d / seg[i], x = path[i][0] + (path[i + 1][0] - path[i][0]) * f, y = path[i][1] + (path[i + 1][1] - path[i][1]) * f;
      Lab.circle(x, y, 6, '#5cc8ff'); Lab.text('−', x, y, '#0b1020', 11, 'center', 'bold');
    }
  }
  function wire(ctx, path) { ctx.strokeStyle = '#d9b46a'; ctx.lineWidth = 4; ctx.beginPath(); path.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke(); }
  function ion(ctx, x, y, txt, pos) {
    Lab.circle(x, y, 13, pos ? 'rgba(255,107,94,.85)' : 'rgba(92,156,255,.85)');
    Lab.text(txt, x, y, '#fff', 10, 'center', 'bold');
  }

  function draw(ctx, w, h, dt, t) {
    if (S.run) S.t += dt;
    const cx = w / 2, top = S.mode === 'water' ? Math.max(200, h * 0.38) : Math.max(130, h * 0.25), bh = Math.min(S.mode === 'water' ? 230 : 260, h * 0.48);
    const p = Math.min(1, S.t / 30);                   // 反應進度
    if (S.mode === 'cell') {
      const bw = Math.min(220, w * 0.3), gap = Math.min(160, w * 0.18);
      const lx = cx - gap / 2 - bw, rx = cx + gap / 2;
      beaker(ctx, lx, top, bw, bh, 'rgba(200,220,255,.12)');
      beaker(ctx, rx, top, bw, bh, `rgba(70,140,255,${0.42 - 0.2 * p})`);
      Lab.text('ZnSO₄ 溶液', lx + bw / 2, top + bh + 40, 'rgba(238,241,250,.7)', 13);
      Lab.text('CuSO₄ 溶液（藍色變淡）', rx + bw / 2, top + bh + 40, 'rgba(238,241,250,.7)', 13);
      // 鹽橋
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 18; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(lx + bw - 30, top + bh * 0.5); ctx.lineTo(lx + bw - 30, top - 20); ctx.lineTo(rx + 30, top - 20); ctx.lineTo(rx + 30, top + bh * 0.5); ctx.stroke(); ctx.lineCap = 'butt';
      Lab.text('鹽橋', cx, top - 40, 'rgba(238,241,250,.75)', 13);
      const zx = lx + 60, ux = rx + bw - 60, eh = bh * 0.78;
      electrode(ctx, zx, top - 30, eh + 30, '#b8bcc8', `鋅（負極）${(-6.5 * p).toFixed(1)} g`, 18 - 6 * p);
      electrode(ctx, ux, top - 30, eh + 30, '#d9894a', `銅（正極）+${(6.4 * p).toFixed(1)} g`, 16 + 6 * p);
      const path = [[zx, top - 30], [zx, top - 80], [ux, top - 80], [ux, top - 30]];
      wire(ctx, path);
      // 燈泡
      Lab.circle(cx, top - 80, 16, S.run ? '#ffd34d' : 'rgba(255,255,255,.2)', '#fff', 2);
      if (S.run) Lab.circle(cx, top - 80, 28, 'rgba(255,211,77,.18)');
      electrons(ctx, path, t);
      if ($('showE').checked && S.run) Lab.text('電子：鋅 → 導線 → 銅', cx, top - 112, '#5cc8ff', 14, 'center', 'bold');
      // 離子
      if ($('showI').checked) S.ions.forEach((o, i) => {
        if (o.side === 0) { // 鋅這邊：Zn2+ 從鋅片溶出往外擴散
          const k = (o.x + (S.run ? S.t * 0.05 : 0)) % 1;
          ion(ctx, zx + 14 + k * (bw - 100), top + bh * 0.25 + o.y * bh * 0.65, 'Zn²⁺', true);
        } else {            // 銅這邊：Cu2+ 往銅片移動
          const k = (o.x + (S.run ? S.t * 0.05 : 0)) % 1;
          if (i / S.ions.length < 1 - p * 0.6) ion(ctx, ux - 14 - k * (bw - 100), top + bh * 0.25 + o.y * bh * 0.65, 'Cu²⁺', true);
        }
      });
      $('live').innerHTML = `<dt>鋅片</dt><dd>${(-6.5 * p).toFixed(1)} g（變輕）</dd><dt>銅片</dt><dd>+${(6.4 * p).toFixed(1)} g（變重）</dd><dt>能量轉換</dt><dd>化學能 → 電能</dd>`;
    } else if (S.mode === 'water') {
      const bw = Math.min(380, w * 0.55), bx = cx - bw / 2;
      beaker(ctx, bx, top, bw, bh, 'rgba(160,210,255,.16)');
      const nx = bx + bw * 0.3, px = bx + bw * 0.7, eh = bh * 0.5, ey = top + bh * 0.45;
      // 收集試管
      const tubeH = bh * 0.8;
      [[nx, S.h2, '氫氣 H₂'], [px, S.o2, '氧氣 O₂']].forEach(([x, gas, name]) => {
        ctx.strokeStyle = 'rgba(220,235,255,.6)'; ctx.lineWidth = 2; Lab.rr(x - 22, top - tubeH * 0.45, 44, tubeH, 18); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x - 20, top - tubeH * 0.45 + 2, 40, Math.min(tubeH - 6, gas * (tubeH - 6)));
        Lab.text(name, x, top - tubeH * 0.45 - 16, '#eef1fa', 13, 'center', 'bold');
      });
      electrode(ctx, nx, ey, eh, '#8a8f99', '負極（陰極）', 12);
      electrode(ctx, px, ey, eh, '#8a8f99', '正極（陽極）', 12);
      // 電源
      const by = top - tubeH * 0.45 - 60;
      Lab.card(cx - 40, by - 18, 80, 36, 'rgba(255,255,255,.1)', '#fff', 8);
      Lab.text('－  電源  ＋', cx, by, '#eef1fa', 13, 'center', 'bold');
      const pathL = [[cx - 40, by], [bx - 20, by], [bx - 20, ey + eh * 0.2], [nx - 6, ey + eh * 0.2]];
      const pathR = [[px + 6, ey + eh * 0.2], [bx + bw + 20, ey + eh * 0.2], [bx + bw + 20, by], [cx + 40, by]];
      wire(ctx, pathL); wire(ctx, pathR);
      electrons(ctx, pathL, t); electrons(ctx, pathR, t);
      if (S.run) {
        S.h2 = Math.min(1, S.h2 + dt * 0.03); S.o2 = S.h2 / 2;
        if (Math.random() < 0.6) S.bubbles.push({ x: nx + (Math.random() - 0.5) * 10, y: ey + eh * Math.random(), s: 3 + Math.random() * 2 });
        if (Math.random() < 0.3) S.bubbles.push({ x: px + (Math.random() - 0.5) * 10, y: ey + eh * Math.random(), s: 3 + Math.random() * 2 });
      }
      S.bubbles.forEach(b => { b.y -= dt * 70; Lab.circle(b.x, b.y, b.s, null, 'rgba(255,255,255,.8)', 1.5); });
      S.bubbles = S.bubbles.filter(b => b.y > top - tubeH * 0.4 + Math.random() * 40);
      if ($('showI').checked) S.ions.forEach((o, i) => {
        const pos = o.kind === 'pos', k = S.run ? (S.t * 0.06 + o.x) % 1 : o.x;
        const x = pos ? px - 20 - k * (px - nx - 40) : nx + 20 + k * (px - nx - 40);
        ion(ctx, x, top + bh * 0.3 + o.y * bh * 0.6, pos ? 'Na⁺' : 'OH⁻', pos);
      });
      $('live').innerHTML = `<dt>氫氣</dt><dd>${(S.h2 * 20).toFixed(1)} mL</dd><dt>氧氣</dt><dd>${(S.o2 * 20).toFixed(1)} mL</dd><dt>體積比</dt><dd>2 : 1</dd><dt>能量轉換</dt><dd>電能 → 化學能</dd>`;
    } else {
      const bw = Math.min(380, w * 0.55), bx = cx - bw / 2;
      beaker(ctx, bx, top, bw, bh, 'rgba(70,140,255,.38)');
      const sx = bx + bw * 0.28, cxp = bx + bw * 0.72, ey = top - 30;
      // 湯匙（負極）：越鍍越銅色
      const cu = p;
      ctx.fillStyle = `rgb(${150 + 70 * cu},${155 - 20 * cu},${165 - 90 * cu})`;
      ctx.beginPath(); ctx.ellipse(sx, top + bh * 0.62, 26, 40, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(sx - 5, ey, 10, bh * 0.4);
      Lab.text('鐵湯匙（負極）', sx, top + bh + 20, '#eef1fa', 13, 'center', 'bold');
      electrode(ctx, cxp, ey, bh * 0.8, '#d9894a', '銅片（正極）', 18 - 8 * p);
      const by = ey - 60;
      Lab.card(cx - 40, by - 18, 80, 36, 'rgba(255,255,255,.1)', '#fff', 8);
      Lab.text('－  電源  ＋', cx, by, '#eef1fa', 13, 'center', 'bold');
      const pathL = [[cx - 40, by], [sx, by], [sx, ey]], pathR = [[cxp, ey], [cxp, by], [cx + 40, by]];
      wire(ctx, pathL); wire(ctx, pathR);
      electrons(ctx, pathL, t); electrons(ctx, pathR, t);
      if ($('showI').checked) S.ions.forEach(o => {
        const k = S.run ? (S.t * 0.06 + o.x) % 1 : o.x;
        ion(ctx, cxp - 24 - k * (cxp - sx - 60), top + bh * 0.3 + o.y * bh * 0.6, 'Cu²⁺', true);
      });
      $('live').innerHTML = `<dt>湯匙表面</dt><dd>${cu < 0.1 ? '銀灰色' : cu < 0.6 ? '開始變紅' : '鍍上一層銅'}</dd><dt>銅片</dt><dd>${cu > 0.3 ? '慢慢變薄' : '—'}</dd><dt>溶液顏色</dt><dd>藍色幾乎不變</dd>`;
    }
  }

  Lab.init({ draw });
  $('run').addEventListener('click', () => { S.run = !S.run; $('run').textContent = S.run ? '❚❚ 暫停' : '▶ 開始反應'; });
  $('reset').addEventListener('click', reset);
  Lab.bindGroup('.mode', k => { S.mode = k; $('info').innerHTML = INFO[k]; reset(); });
  window.echemSim = S;
})();
</script>
<script src="lesson.js" defer></script>
</body>
</html>
