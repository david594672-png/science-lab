<!DOCTYPE html>
<html lang="zh-Hant" data-subject="chem">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>探索物質組成</title>
<link rel="stylesheet" href="lab-kit.css">
<style>.formula { font-size: 1.6rem; font-weight: 800; color: var(--accent); text-align: center; letter-spacing: .05em; }</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="cv" aria-label="分子模型、純物質與混合物、原子結構的 3D 模型"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g8">← 回課程總覽</a>
  <h1>探索物質組成</h1>
  <p class="sub">國二理化 · 原子、分子與元素</p>

  <div class="body">
    <div class="modes" style="--n:3">
      <button class="mode" data-k="mol" aria-pressed="true">分子模型</button>
      <button class="mode" data-k="mix" aria-pressed="false">純物質與<br>混合物</button>
      <button class="mode" data-k="atom" aria-pressed="false">原子結構</button>
    </div>

    <div data-mode="mol">
      <div class="group">
        <div class="chips" style="--n:3" id="molSeg"></div>
        <div class="formula" id="formula" style="margin-top:12px"></div>
        <div class="result" id="molInfo" style="margin-top:8px"></div>
      </div>
    </div>

    <div data-mode="mix" hidden>
      <div class="group">
        <div class="chips" style="--n:3" id="mixSeg"></div>
        <div class="result" id="mixInfo" style="margin-top:10px"></div>
      </div>
    </div>

    <div data-mode="atom" hidden>
      <div class="group">
        <div class="ctrl">
          <label for="z">原子序 <output id="zVal"></output></label>
          <input type="range" id="z" min="1" max="12" step="1" value="6">
        </div>
        <dl class="live">
          <dt>質子（＋）</dt><dd id="np">—</dd>
          <dt>中子（不帶電）</dt><dd id="nn">—</dd>
          <dt>電子（－）</dt><dd id="ne">—</dd>
          <dt>電子排列</dt><dd id="shell">—</dd>
        </dl>
        <p class="note" style="margin-top:8px">原子中<b>質子數 = 電子數</b>，所以原子不帶電。<b>原子序 = 質子數</b>，決定它是哪一種元素。（模型不按比例：原子核其實非常非常小。）</p>
      </div>
    </div>

    <div class="group">
      <p class="note"><b>元素</b>：只由一種原子組成的純物質。<b>化合物</b>：由兩種以上的原子以固定比例結合的純物質。<b>混合物</b>：由兩種以上的物質混在一起，沒有固定組成。</p>
    </div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script type="module">
import { start3D, THREE } from './lab3d.js';
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const $ = id => document.getElementById(id);
const S = { mode: 'mol', mol: 'H2O', mix: 'air', z: 6 };

const L = start3D({ background: 0x140b1c, camera: [0, 1.5, 8], target: [0, 0, 0], minDist: 3, maxDist: 25, frame, ui });
const { scene } = L;

// 原子顏色與大小（教科書常用配色）
const ATOM = { H: [0xf2f2f2, 0.32, '氫'], O: [0xff4d4d, 0.5, '氧'], C: [0x3a3a3a, 0.5, '碳'], N: [0x4d7dff, 0.48, '氮'], Na: [0xb27aff, 0.6, '鈉'], Cl: [0x4fd18b, 0.58, '氯'], He: [0xffd34d, 0.36, '氦'] };
const sphere = new THREE.SphereGeometry(1, 32, 20);
function atom(el) { const m = new THREE.Mesh(sphere, L.mat(ATOM[el][0], { roughness: 0.35 })); m.scale.setScalar(ATOM[el][1]); return m; }
function bond(a, b) {
  const d = b.clone().sub(a), m = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, d.length(), 10), L.mat(0xcfcfcf));
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize());
  return m;
}
// 分子：原子位置
const t = 109.5 * Math.PI / 180;
const MOL = {
  H2:  { f: 'H₂', name: '氫氣', kind: '元素', atoms: [['H', -0.37, 0, 0], ['H', 0.37, 0, 0]] },
  O2:  { f: 'O₂', name: '氧氣', kind: '元素', atoms: [['O', -0.6, 0, 0], ['O', 0.6, 0, 0]] },
  H2O: { f: 'H₂O', name: '水', kind: '化合物', atoms: [['O', 0, 0.15, 0], ['H', -0.78, -0.45, 0], ['H', 0.78, -0.45, 0]] },
  CO2: { f: 'CO₂', name: '二氧化碳', kind: '化合物', atoms: [['C', 0, 0, 0], ['O', -1.15, 0, 0], ['O', 1.15, 0, 0]] },
  NH3: { f: 'NH₃', name: '氨', kind: '化合物', atoms: [['N', 0, 0.3, 0], ['H', 0.9, -0.15, 0], ['H', -0.45, -0.15, 0.78], ['H', -0.45, -0.15, -0.78]] },
  CH4: { f: 'CH₄', name: '甲烷', kind: '化合物', atoms: [['C', 0, 0, 0], ['H', 0.63, 0.63, 0.63], ['H', -0.63, -0.63, 0.63], ['H', -0.63, 0.63, -0.63], ['H', 0.63, -0.63, -0.63]] }
};
function buildMol(key, scale = 1) {
  const g = new THREE.Group(), M = MOL[key];
  const pos = M.atoms.map(a => V(a[1], a[2], a[3]).multiplyScalar(scale));
  M.atoms.forEach((a, i) => { const m = atom(a[0]); m.position.copy(pos[i]); m.scale.multiplyScalar(scale); g.add(m); if (i) g.add(bond(pos[0], pos[i])); });
  if (key === 'H2' || key === 'O2') g.add(bond(pos[0], pos[1]));
  return g;
}

// ---------- 模式一：單一分子 ----------
const molG = new THREE.Group(); scene.add(molG);
const molLbls = [];
function showMol(key) {
  molG.clear(); molLbls.forEach(l => (l.show = false));
  const g = buildMol(key, 1.6); molG.add(g);
  MOL[key].atoms.forEach((a, i) => {
    const l = molLbls[i] || (molLbls[i] = L.label('', null));
    l.set(ATOM[a[0]][2] + ' ' + a[0]);
    l.where = () => g.children.filter(c => c.geometry === sphere)[i].getWorldPosition(V(0, 0, 0)).add(V(0, 0.75, 0));
    l.show = true;
  });
  const M = MOL[key], cnt = {};
  M.atoms.forEach(a => (cnt[a[0]] = (cnt[a[0]] || 0) + 1));
  $('formula').textContent = M.f;
  $('molInfo').innerHTML = `<b>${M.name}</b>是<b>${M.kind}</b>。一個分子由 ` + Object.entries(cnt).map(([e, n]) => `${n} 個${ATOM[e][2]}原子`).join('、') + ' 組成。' +
    (M.kind === '元素' ? '只有一種原子，所以是元素。' : '有兩種以上的原子，所以是化合物。');
}

// ---------- 模式二：容器裡的粒子 ----------
const box = new THREE.Group(); scene.add(box);
const glass = new THREE.Mesh(new THREE.BoxGeometry(6, 4, 4), new THREE.MeshPhysicalMaterial({ color: 0xbfe6ff, transparent: true, opacity: 0.1, roughness: 0.1, depthWrite: false }));
box.add(glass);
box.add(new THREE.LineSegments(new THREE.EdgesGeometry(glass.geometry), new THREE.LineBasicMaterial({ color: 0x9fd8ff, transparent: true, opacity: 0.5 })));
const MIX = {
  o2:   { name: '氧氣', parts: [['O2', 14]], kind: '純物質（元素）', txt: '容器裡只有<b>一種分子</b>，而且只有一種原子。' },
  h2o:  { name: '水（水蒸氣）', parts: [['H2O', 14]], kind: '純物質（化合物）', txt: '只有<b>一種分子</b>（H₂O），所以是純物質；分子由兩種原子組成，所以是化合物。' },
  air:  { name: '空氣', parts: [['N2', 11], ['O2', 4], ['CO2', 1], ['H2O', 1]], kind: '混合物', txt: '空氣裡有氮氣、氧氣、二氧化碳、水蒸氣等<b>多種分子</b>，是混合物。氮氣最多（約 78%），氧氣約 21%。' },
  ch4o2:{ name: '甲烷＋氧氣', parts: [['CH4', 6], ['O2', 8]], kind: '混合物', txt: '兩種物質混在一起，但<b>還沒有反應</b>，各自保有原來的分子，是混合物。' },
  he:   { name: '氦氣', parts: [['He', 16]], kind: '純物質（元素）', txt: '氦氣是由<b>單一原子</b>直接構成的元素，沒有形成分子。' },
  nacl: { name: '食鹽水', parts: [['H2O', 12], ['Na', 3], ['Cl', 3]], kind: '混合物', txt: '食鹽溶在水中，有水分子和鈉、氯離子，是<b>混合物</b>（水溶液）。' }
};
MOL.N2 = { f: 'N₂', name: '氮氣', kind: '元素', atoms: [['N', -0.55, 0, 0], ['N', 0.55, 0, 0]] };
const particles = [];
function showMix(key) {
  particles.forEach(p => box.remove(p.g)); particles.length = 0;
  MIX[key].parts.forEach(([k, n]) => {
    for (let i = 0; i < n; i++) {
      const g = MOL[k] ? buildMol(k, 0.42) : (() => { const a = atom(k); a.scale.multiplyScalar(0.5); return a; })();
      g.position.set((Math.random() - 0.5) * 5, (Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3);
      g.rotation.set(Math.random() * 6, Math.random() * 6, 0);
      box.add(g);
      particles.push({ g, v: V(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(1.4), w: V(Math.random(), Math.random(), 0) });
    }
  });
  const M = MIX[key];
  $('mixInfo').innerHTML = `<b>${M.name}</b>：<b>${M.kind}</b>。${M.txt}`;
}

// ---------- 模式三：原子結構 ----------
const atomG = new THREE.Group(); scene.add(atomG);
const nucleus = new THREE.Group(); atomG.add(nucleus);
const electrons = [], rings = [];
const NEUT = [0, 0, 2, 4, 5, 5, 6, 7, 8, 10, 10, 12, 12];
const SYM = ['', 'H 氫', 'He 氦', 'Li 鋰', 'Be 鈹', 'B 硼', 'C 碳', 'N 氮', 'O 氧', 'F 氟', 'Ne 氖', 'Na 鈉', 'Mg 鎂'];
function shells(z) { const s = []; let r = z; for (const cap of [2, 8, 8]) { if (r <= 0) break; s.push(Math.min(cap, r)); r -= cap; } return s; }
function showAtom(z) {
  nucleus.clear(); electrons.forEach(e => atomG.remove(e.m)); electrons.length = 0; rings.forEach(r => atomG.remove(r)); rings.length = 0;
  const n = NEUT[z], tot = z + n;
  for (let i = 0; i < tot; i++) {
    const m = new THREE.Mesh(sphere, L.mat(i < z ? 0xff5d6c : 0xb8bcc8, { roughness: 0.4 }));
    m.scale.setScalar(0.17);
    const p = new THREE.Vector3().setFromSphericalCoords(0.13 * Math.cbrt(tot) * Math.cbrt(i + 1) / Math.cbrt(tot) * 2.2, Math.acos(1 - 2 * (i + 0.5) / tot), i * 2.4);
    m.position.copy(p); nucleus.add(m);
  }
  shells(z).forEach((cnt, k) => {
    const r = 1.4 + k * 1.1;
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.012, 6, 96), L.glow(0x8fa3c9, { transparent: true, opacity: 0.5 }));
    ring.rotation.x = Math.PI / 2; atomG.add(ring); rings.push(ring);
    for (let i = 0; i < cnt; i++) {
      const m = new THREE.Mesh(sphere, L.glow(0x5cc8ff)); m.scale.setScalar(0.12);
      atomG.add(m); electrons.push({ m, r, a: i / cnt * Math.PI * 2, w: 1.2 / (k + 1) });
    }
  });
  $('np').textContent = z; $('nn').textContent = n; $('ne').textContent = z;
  $('shell').textContent = shells(z).join('、');
  $('zVal').textContent = `${z}（${SYM[z]}）`;
}
const nucLbl = L.label('原子核', () => V(0, 0.75, 0));

function frame(dt) {
  molG.visible = S.mode === 'mol'; box.visible = S.mode === 'mix'; atomG.visible = S.mode === 'atom';
  molLbls.forEach(l => { if (S.mode !== 'mol') l.show = false; });
  nucLbl.show = S.mode === 'atom';
  if (S.mode === 'mol') molG.rotation.y += dt * 0.4;
  if (S.mode === 'mix') particles.forEach(p => {
    p.g.position.addScaledVector(p.v, dt);
    ['x', 'y', 'z'].forEach((ax, i) => { const lim = [2.7, 1.7, 1.7][i]; if (Math.abs(p.g.position[ax]) > lim) { p.v[ax] *= -1; p.g.position[ax] = Math.sign(p.g.position[ax]) * lim; } });
    p.g.rotation.x += p.w.x * dt; p.g.rotation.y += p.w.y * dt;
  });
  if (S.mode === 'atom') { electrons.forEach(e => { e.a += e.w * dt; e.m.position.set(Math.cos(e.a) * e.r, 0, Math.sin(e.a) * e.r); }); nucleus.rotation.y += dt * 0.3; }
}

// 面板按鈕
const molBox = $('molSeg');
Object.entries(MOL).filter(([k]) => k !== 'N2').forEach(([k, m], i) => molBox.insertAdjacentHTML('beforeend', `<button class="btn" data-k="${k}" aria-pressed="${k === 'H2O'}">${m.name}<br>${m.f}</button>`));
const mixBox = $('mixSeg');
Object.entries(MIX).forEach(([k, m]) => mixBox.insertAdjacentHTML('beforeend', `<button class="btn" data-k="${k}" aria-pressed="${k === 'air'}">${m.name}</button>`));
Lab.bindGroup('#molSeg .btn', k => { S.mol = k; showMol(k); });
Lab.bindGroup('#mixSeg .btn', k => { S.mix = k; showMix(k); });
Lab.bindSlider('z', v => { S.z = v; showAtom(v); }, v => `${v}（${SYM[v]}）`);
Lab.bindGroup('.mode', k => {
  S.mode = k; Lab.showMode(k);
  if (k === 'mol') showMol(S.mol);
  L.fly(k === 'mix' ? [0, 3, 10] : k === 'atom' ? [0, 4, 7] : [0, 1.5, 8], [0, 0, 0]);
});
function ui() {}
window.matterSim = S;
</script>
<script src="lesson.js" defer></script>
</body>
</html>
