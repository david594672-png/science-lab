<!DOCTYPE html>
<html lang="zh-Hant" data-subject="earth">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>月相的變化</title>
<link rel="stylesheet" href="lab-kit.css">
<style>
  #view { display: block; width: 150px; height: 150px; margin: 0 auto; }
  .phase-name { text-align: center; font-size: 1.3rem; font-weight: 800; color: var(--accent); margin-top: 4px; }
  .ph-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .ph-grid .btn { min-height: 44px; padding: 0 4px; font-size: .82rem; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="cv" aria-label="日地月位置與月相的 3D 模型"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g9">← 回課程總覽</a>
  <h1>月相的變化</h1>
  <p class="sub">國三地科 · 宇宙中的天體 ｜ <a class="back" href="daily-motion.html" style="display:inline">換看周日運動 →</a></p>

  <div class="body">
    <div class="group">
      <div class="group-title">從地球上看</div>
      <canvas id="view" width="300" height="300" aria-label="從地球看到的月亮"></canvas>
      <div class="phase-name" id="phaseName">—</div>
      <dl class="live" style="margin-top:8px">
        <dt>農曆約</dt><dd id="lunar">—</dd>
        <dt>亮面比例</dt><dd id="frac">—</dd>
        <dt>大約月出</dt><dd id="rise">—</dd>
      </dl>
    </div>

    <div class="group">
      <div class="ctrl">
        <label for="day">新月後第幾天 <output id="dayVal"></output></label>
        <input type="range" id="day" min="0" max="29.5" step="0.1" value="7.4">
      </div>
      <div class="row">
        <button class="btn primary grow" id="play" aria-pressed="false">▶ 播放一個月</button>
      </div>
    </div>

    <div class="group">
      <div class="group-title">直接跳到</div>
      <div class="ph-grid" id="jumps"></div>
    </div>

    <div class="group">
      <div class="group-title">顯示</div>
      <label class="sw"><input type="checkbox" id="showHalf" checked><span class="track"></span>月球被照亮的一半（黃線）</label>
      <label class="sw"><input type="checkbox" id="showSee" checked><span class="track"></span>地球看得到的一半（藍線）</label>
      <label class="sw"><input type="checkbox" id="showOrbit" checked><span class="track"></span>月球公轉軌道</label>
      <div class="seg" style="--n:2;margin-top:6px" id="camSeg">
        <button data-k="space" aria-pressed="true">太空俯視</button>
        <button data-k="earth" aria-pressed="false">站在地球看</button>
      </div>
    </div>

    <div class="group">
      <p class="note">月球<b>永遠有一半</b>被太陽照亮（黃線那一半）。月相不同，是因為從地球看過去，<b>看得到的那一半（藍線）</b>和亮面重疊的多寡不同。兩條線重疊越多，月亮越圓。</p>
    </div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script type="module">
import { start3D, THREE } from './lab3d.js';

const MONTH = 29.53, R = 7;               // 朔望月（天）、示意軌道半徑
const PHASES = [
  [0, '新月', '初一'], [3.7, '眉月', '初四'], [7.4, '上弦月', '初八'], [11.1, '盈凸月', '十一'],
  [14.8, '滿月', '十五'], [18.5, '虧凸月', '十九'], [22.1, '下弦月', '廿二'], [25.8, '殘月', '廿六']
];
const S = { day: 7.4, play: false, cam: 'space' };

const L = start3D({
  background: 0x05070f, camera: [2.5, 21, -15], target: [2.2, 0, 0], minDist: 6, maxDist: 40,
  ambient: 0.08, key: 0,
  frame, ui
});
const { scene } = L;

// 太陽光：從 +X 方向照過來
const sunLight = new THREE.DirectionalLight(0xffffff, 3);
sunLight.position.set(50, 0, 0);
scene.add(sunLight);
const sunBall = new THREE.Mesh(new THREE.SphereGeometry(1.6, 32, 16), L.glow(0xffc94d));
sunBall.position.set(12.5, 0, 0);
scene.add(sunBall);
const halo = new THREE.Mesh(new THREE.SphereGeometry(2.4, 32, 16), L.glow(0xffa64d, { transparent: true, opacity: 0.18 }));
halo.position.copy(sunBall.position);
scene.add(halo);
L.label('太陽光從這邊來', () => sunBall.position.clone().add(new THREE.Vector3(0, 2.6, 0)));
// 平行光線示意
for (let i = -2; i <= 2; i++) {
  const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(10.5, 0, i * 2.2), new THREE.Vector3(-10, 0, i * 2.2)]);
  scene.add(new THREE.Line(g, new THREE.LineDashedMaterial({ color: 0xffc94d, dashSize: 0.4, gapSize: 0.5, transparent: true, opacity: 0.25 })).computeLineDistances());
}

// 星空
{
  const pts = [];
  for (let i = 0; i < 900; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(120 + Math.random() * 60);
    pts.push(v);
  }
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.6, sizeAttenuation: true, transparent: true, opacity: 0.7 })));
}

// 地球：程式產生的海陸貼圖
function earthTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#1f5fa8'; g.fillRect(0, 0, 512, 256);
  g.fillStyle = '#3f9a5a';
  const blobs = [[90, 80, 60, 40], [130, 150, 35, 55], [270, 70, 70, 35], [290, 150, 40, 50], [400, 90, 60, 40], [430, 180, 30, 20]];
  blobs.forEach(([x, y, rx, ry]) => { g.beginPath(); g.ellipse(x, y, rx, ry, 0.3, 0, Math.PI * 2); g.fill(); });
  g.fillStyle = '#e9f2ff'; g.fillRect(0, 0, 512, 14); g.fillRect(0, 242, 512, 14);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const earth = new THREE.Mesh(new THREE.SphereGeometry(1.3, 48, 24), new THREE.MeshStandardMaterial({ map: earthTexture(), roughness: 0.8 }));
scene.add(earth);
L.label('地球', () => new THREE.Vector3(0, 0, -2.3));

// 月球
function moonTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#c9c6bd'; g.fillRect(0, 0, 256, 128);
  for (let i = 0; i < 70; i++) {
    g.fillStyle = `rgba(90,88,82,${0.15 + Math.random() * 0.25})`;
    g.beginPath(); g.arc(Math.random() * 256, Math.random() * 128, 2 + Math.random() * 9, 0, Math.PI * 2); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const moon = new THREE.Mesh(new THREE.SphereGeometry(0.75, 48, 24), new THREE.MeshStandardMaterial({ map: moonTexture(), roughness: 1 }));
scene.add(moon);
const moonLbl = L.label('', () => moon.position.clone().add(new THREE.Vector3(0, 1.4, 0)));

// 軌道
const orbit = new THREE.Mesh(new THREE.TorusGeometry(R, 0.02, 6, 160), L.glow(0x8fa3c9, { transparent: true, opacity: 0.5 }));
orbit.rotation.x = Math.PI / 2;
scene.add(orbit);
// 八個位置的小點
PHASES.forEach(([d]) => {
  const a = d / MONTH * Math.PI * 2;
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), L.glow(0x8fa3c9));
  dot.position.set(R * Math.cos(a), 0, -R * Math.sin(a));
  orbit.parent.add(dot); dot.userData.orbitDot = true;
});

// 兩個「一半」：用半圓環表示
function halfRing(color) {
  // 半圓環平放、開口朝 -Z；外層群組負責轉向
  const m = new THREE.Mesh(new THREE.TorusGeometry(0.95, 0.045, 8, 48, Math.PI), L.glow(color));
  m.rotation.x = Math.PI / 2;
  const g = new THREE.Group(); g.add(m); scene.add(g); return g;
}
const litRing = halfRing(0xffd34d), seeRing = halfRing(0x5cc8ff);
const sightLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
  new THREE.LineDashedMaterial({ color: 0x5cc8ff, dashSize: 0.25, gapSize: 0.2 }));
scene.add(sightLine);

const v = new THREE.Vector3();
function place() {
  const a = S.day / MONTH * Math.PI * 2;
  moon.position.set(R * Math.cos(a), 0, -R * Math.sin(a));
  moon.rotation.y = a + Math.PI;           // 同步自轉：同一面朝地球
  // 照亮的一半：朝向太陽（+X）
  litRing.position.copy(moon.position); litRing.rotation.y = Math.PI / 2;
  // 看得到的一半：朝向地球
  seeRing.position.copy(moon.position); seeRing.rotation.y = a + Math.PI * 1.5;
  sightLine.geometry.setFromPoints([new THREE.Vector3(), moon.position]);
  sightLine.computeLineDistances();
}

function frame(dt) {
  if (S.play) {
    S.day = (S.day + dt * 2.2) % MONTH;
    dayEl.value = S.day; Lab.paint(dayEl);
  }
  earth.rotation.y += dt * 0.6;
  place();
  const fromEarth = S.cam === 'earth';
  litRing.visible = !fromEarth && $('showHalf').checked;
  seeRing.visible = sightLine.visible = !fromEarth && $('showSee').checked;
  orbit.visible = $('showOrbit').checked;
  if (S.cam === 'earth') {
    // 站在地球表面，看向月球
    v.copy(moon.position).normalize().multiplyScalar(1.45);
    L.camera.position.copy(v).add(new THREE.Vector3(0, 0.25, 0));
    L.controls.target.copy(moon.position);
  }
  drawView();
}

// 從地球看到的月亮（平面圖）
const vc = document.getElementById('view').getContext('2d');
function drawView() {
  const W = 300, r = 110, cx = 150, cy = 150, th = S.day / MONTH * Math.PI * 2;
  vc.clearRect(0, 0, W, W);
  vc.fillStyle = '#0a0e1c'; vc.beginPath(); vc.arc(cx, cy, 145, 0, Math.PI * 2); vc.fill();
  vc.fillStyle = '#2b2e38'; vc.beginPath(); vc.arc(cx, cy, r, 0, Math.PI * 2); vc.fill();
  const waxing = th <= Math.PI;
  const k = waxing ? Math.cos(th) : -Math.cos(th);   // 明暗交界線的 x 比例
  vc.fillStyle = '#f3ead0';
  vc.beginPath();
  const N = 60;
  for (let i = 0; i <= N; i++) {                        // 亮邊緣
    const y = -r + 2 * r * i / N, x = Math.sqrt(Math.max(0, r * r - y * y));
    vc.lineTo(cx + (waxing ? x : -x), cy + y);
  }
  for (let i = N; i >= 0; i--) {                        // 明暗交界線
    const y = -r + 2 * r * i / N, x = k * Math.sqrt(Math.max(0, r * r - y * y));
    vc.lineTo(cx + (waxing ? x : -x), cy + y);
  }
  vc.closePath(); vc.fill();
}

const $ = id => document.getElementById(id);
const dayEl = Lab.bindSlider('day', x => { S.day = x; }, x => x.toFixed(1) + ' 天');
$('play').addEventListener('click', e => {
  S.play = !S.play;
  e.currentTarget.setAttribute('aria-pressed', String(S.play));
  e.currentTarget.textContent = S.play ? '❚❚ 暫停' : '▶ 播放一個月';
});
const jumps = $('jumps');
PHASES.forEach(([d, name]) => {
  const b = document.createElement('button');
  b.className = 'btn'; b.textContent = name;
  b.addEventListener('click', () => { S.day = d; dayEl.value = d; Lab.paint(dayEl); $('dayVal').textContent = d.toFixed(1) + ' 天'; });
  jumps.appendChild(b);
});
Lab.bindGroup('#camSeg button', k => {
  S.cam = k;
  L.controls.enabled = k === 'space';
  L.camera.fov = k === 'space' ? 45 : 34; L.camera.updateProjectionMatrix();
  if (k === 'space') L.fly([2.5, 21, -15], [2.2, 0, 0]);
});

function phaseOf(d) {
  let best = PHASES[0];
  PHASES.forEach(p => { if (Math.abs(((d - p[0] + MONTH / 2) % MONTH + MONTH) % MONTH - MONTH / 2) < Math.abs(((d - best[0] + MONTH / 2) % MONTH + MONTH) % MONTH - MONTH / 2)) best = p; });
  return best;
}
function ui() {
  const p = phaseOf(S.day), th = S.day / MONTH * Math.PI * 2;
  $('phaseName').textContent = p[1];
  moonLbl.set(p[1]);
  $('lunar').textContent = `${p[2]} 前後`;
  $('frac').textContent = Math.round((1 - Math.cos(th)) / 2 * 100) + '%';
  const rise = (6 + S.day * 24 / MONTH) % 24;          // 每天約晚 50 分鐘
  $('rise').textContent = `${String(Math.floor(rise)).padStart(2, '0')}:${String(Math.round(rise % 1 * 60) % 60).padStart(2, '0')}`;
  if (!S.play) $('dayVal').textContent = S.day.toFixed(1) + ' 天';
}
window.moonSim = S;
</script>
<script src="lesson.js" defer></script>
</body>
</html>
