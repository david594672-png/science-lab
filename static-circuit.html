<!DOCTYPE html>
<html lang="zh-Hant" data-subject="phy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>靜電與電路</title>
<link rel="stylesheet" href="lab-kit.css">
</head>
<body>
<canvas id="cv" aria-label="摩擦起電、靜電感應與串並聯電路的模擬"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g9">← 回課程總覽</a>
  <h1>靜電與電路</h1>
  <p class="sub">國三理化 · 基本的靜電現象與電路</p>

  <div class="body">
    <div class="modes" style="--n:3">
      <button class="mode" data-k="rub" aria-pressed="true">摩擦起電</button>
      <button class="mode" data-k="induce" aria-pressed="false">靜電感應</button>
      <button class="mode" data-k="circuit" aria-pressed="false">電路與<br>歐姆定律</button>
    </div>

    <div data-mode="rub">
      <div class="group">
        <div class="seg" style="--n:2" id="pair">
          <button data-k="glass" aria-pressed="true">玻璃棒＋絲絹</button>
          <button data-k="plastic" aria-pressed="false">塑膠尺＋毛皮</button>
        </div>
        <div class="row" style="margin-top:8px"><button class="btn primary grow" id="rubBtn">摩擦一下</button><button class="btn" id="rubReset">重來</button></div>
        <dl class="live" style="margin-top:8px"><dt>棒子</dt><dd id="rodQ">—</dd><dt>布料</dt><dd id="clothQ">—</dd></dl>
      </div>
    </div>

    <div data-mode="induce" hidden>
      <div class="group">
        <div class="ctrl"><label for="near">帶負電的棒子靠近 <output id="nearVal"></output></label><input type="range" id="near" min="0" max="1" step="0.01" value="0.3"></div>
        <label class="sw"><input type="checkbox" id="ground"><span class="track"></span>用手碰金屬球（接地）</label>
        <p class="note">試試看：棒子靠近 → 碰手 → 放開手 → 拿走棒子，驗電器最後帶什麼電？</p>
      </div>
    </div>

    <div data-mode="circuit" hidden>
      <div class="group">
        <div class="seg" style="--n:2" id="conn">
          <button data-k="series" aria-pressed="true">串聯</button>
          <button data-k="parallel" aria-pressed="false">並聯</button>
        </div>
        <div class="ctrl" style="margin-top:8px"><label for="V">電池電壓 <output id="VVal"></output></label><input type="range" id="V" min="1.5" max="9" step="1.5" value="6"></div>
        <div class="ctrl"><label for="R1">燈泡 1 電阻 <output id="R1Val"></output></label><input type="range" id="R1" min="2" max="12" step="1" value="4"></div>
        <div class="ctrl"><label for="R2">燈泡 2 電阻 <output id="R2Val"></output></label><input type="range" id="R2" min="2" max="12" step="1" value="4"></div>
        <label class="sw"><input type="checkbox" id="b2out"><span class="track"></span>把燈泡 2 轉鬆（斷路）</label>
        <dl class="live"><dt>總電流 I</dt><dd id="I">—</dd><dt>燈 1：電壓／電流</dt><dd id="L1">—</dd><dt>燈 2：電壓／電流</dt><dd id="L2">—</dd><dt>總電阻</dt><dd id="Rt">—</dd></dl>
      </div>
    </div>

    <div class="group"><div class="result" id="info"></div></div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script>
(() => {
  const $ = Lab.$;
  const S = { mode: 'rub', pair: 'glass', moved: 0, rubT: 0, near: 0.3, ground: false, trapped: 0, conn: 'series', V: 6, R1: 4, R2: 4, out: false, t: 0 };
  const plus = (x, y, c = '#ff6b5e') => { Lab.circle(x, y, 9, c); Lab.text('+', x, y, '#fff', 13, 'center', 'bold'); };
  const minus = (x, y) => { Lab.circle(x, y, 9, '#5c9cff'); Lab.text('−', x, y, '#fff', 13, 'center', 'bold'); };

  function drawRub(ctx, w, h, dt) {
    if (S.rubT > 0) { S.rubT -= dt; if (S.moved < 6) S.moved += dt * 6; }
    const n = Math.floor(S.moved), glass = S.pair === 'glass';
    // 玻璃失去電子給絲絹；毛皮失去電子給塑膠
    const rodX = w * 0.32, clothX = w * 0.32 + Math.sin(S.rubT * 20) * 30 * (S.rubT > 0) + 150, cy = h * 0.4;
    Lab.card(rodX - 30, cy - 160, 60, 320, glass ? 'rgba(200,230,255,.35)' : '#ffd166', '#fff', 14);
    Lab.text(glass ? '玻璃棒' : '塑膠尺', rodX, cy + 182, '#eef1fa', 14);
    Lab.card(clothX - 50, cy - 100, 100, 200, glass ? '#f2e6c9' : '#8a6a4a', null, 22);
    Lab.text(glass ? '絲絹' : '毛皮', clothX, cy + 122, '#eef1fa', 14);
    // 每一邊原本 6 正 6 負，摩擦後移動 n 個電子
    const rodE = 6 + (glass ? -n : n), clothE = 6 + (glass ? n : -n);
    for (let i = 0; i < 6; i++) plus(rodX - 12, cy - 120 + i * 44);
    for (let i = 0; i < rodE; i++) minus(rodX + 12, cy - 130 + i * (260 / Math.max(rodE, 1)));
    for (let i = 0; i < 6; i++) plus(clothX - 22, cy - 80 + i * 30);
    for (let i = 0; i < clothE; i++) minus(clothX + 22, cy - 85 + i * (170 / Math.max(clothE, 1)));
    if (S.rubT > 0) Lab.arrow(glass ? rodX + 40 : clothX - 60, cy, glass ? clothX - 60 : rodX + 40, cy, '#5cc8ff', 4, 14);
    const q = r => r === 0 ? '不帶電（電中性）' : r > 0 ? `帶正電（+${r}）` : `帶負電（${r}）`;
    $('rodQ').textContent = q(6 - rodE); $('clothQ').textContent = q(6 - clothE);
    $('info').innerHTML = `摩擦時移動的是<b>電子</b>（帶負電），正電荷（原子核）不會移動。<br>${glass ? '玻璃棒<b>失去電子帶正電</b>，絲絹得到電子帶負電。' : '塑膠尺<b>得到電子帶負電</b>，毛皮失去電子帶正電。'}<br>兩者帶的電量<b>相等、電性相反</b>（電荷守恆）。同性電相斥、異性電相吸。`;
  }

  function drawInduce(ctx, w, h) {
    const cx = w * 0.42, ballY = h * 0.25;
    // 驗電器
    Lab.circle(cx, ballY, 34, '#c8ccd6', '#fff', 2);
    Lab.line(cx, ballY + 34, cx, ballY + 200, '#c8ccd6', 6);
    ctx.strokeStyle = 'rgba(220,235,255,.6)'; ctx.lineWidth = 3; ctx.strokeRect(cx - 120, ballY + 90, 240, 220);
    // 電子分布：棒子靠近把電子往下推；接地時電子流走
    // 接地時：被排斥的電子流到地面（棒子拿遠時電子流回來）
    const push = S.near;
    if (S.ground) S.trapped = push > 0.05 ? Math.round(push * 4.5) : 0;
    const stay = 8 - S.trapped;                              // 驗電器裡剩下的自由電子
    const top = Math.round(stay * (0.5 - push * 0.45)), bottom = stay - top;
    const netCharge = S.trapped;                             // 少了幾個電子 → 帶正電
    const spread = Math.min(0.9, Math.abs(bottom - 4) * 0.18); // 葉片上多出的電荷越多，張得越開
    const ly = ballY + 200;
    [-1, 1].forEach(s => { ctx.save(); ctx.translate(cx, ly); ctx.rotate(s * spread); Lab.card(-5, 0, 10, 80, '#ffd166', null, 3); ctx.restore(); });
    for (let i = 0; i < 4; i++) plus(cx - 18 + (i % 2) * 36, ballY - 10 + Math.floor(i / 2) * 22, '#ff8a7a');
    for (let i = 0; i < top; i++) minus(cx - 22 + (i % 3) * 22, ballY - 24 + Math.floor(i / 3) * 18);
    for (let i = 0; i < bottom; i++) minus(cx + (i % 2 ? 22 : -22) * (1 + Math.floor(i / 2) * 0.25), ly + 30 + Math.floor(i / 2) * 18);
    for (let i = 0; i < 4; i++) plus(cx + (i % 2 ? 26 : -26), ly + 20 + Math.floor(i / 2) * 30, '#ff8a7a');
    // 棒子
    if (push > 0.02) {
      const rx = cx + 70 + (1 - push) * 260;
      Lab.card(rx, ballY - 20, 220, 40, '#ffd166', '#fff', 12);
      for (let i = 0; i < 6; i++) minus(rx + 20 + i * 34, ballY);
    }
    // 接地
    if (S.ground) { Lab.line(cx - 34, ballY, cx - 140, ballY, '#ffd9a8', 8); Lab.text('手（接地）', cx - 150, ballY - 20, '#ffd9a8', 13); }
    const state = push < 0.05 ? (S.trapped ? `驗電器<b>帶正電</b>，葉片張開。這就是<b>感應起電</b>：帶的電和棒子<b>相反</b>。` : '棒子拿遠了，電子回到均勻分布，葉片合起來。')
      : S.ground ? '手碰金屬球時，被排斥的電子<b>經由人體流到地面</b>。' : '帶負電的棒子靠近：金屬中的<b>電子被排斥到下方</b>，金屬球帶正電、葉片帶負電而張開（<b>靜電感應</b>）。';
    $('info').innerHTML = state;
  }

  function drawCircuit(ctx, w, h, dt) {
    S.t += dt;
    const series = S.conn === 'series', R1 = S.R1, R2 = S.out ? Infinity : S.R2;
    let I, V1, V2, I1, I2, Rt;
    if (series) { Rt = R1 + R2; I = isFinite(Rt) ? S.V / Rt : 0; I1 = I2 = I; V1 = I * R1; V2 = isFinite(R2) ? I * R2 : 0; }
    else { I1 = S.V / R1; I2 = isFinite(R2) ? S.V / R2 : 0; I = I1 + I2; V1 = V2 = S.V; Rt = S.V / I; }
    const x0 = w * 0.12, x1 = w * 0.82, y0 = h * 0.18, y1 = h * 0.72;
    const wire = pts => { ctx.strokeStyle = '#d9b46a'; ctx.lineWidth = 4; ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke(); };
    const bulb = (x, y, P, out, label) => {
      const glow = out ? 0 : Math.min(1, P / 9);
      if (glow > 0.02) Lab.circle(x, y, 30 + glow * 30, `rgba(255,211,77,${0.15 + glow * 0.3})`);
      Lab.circle(x, y, 22, out ? '#55606e' : `rgb(${120 + 135 * glow},${110 + 120 * glow},${60 + 40 * glow})`, '#fff', 2);
      Lab.text(label, x, y + 40, '#eef1fa', 13);
    };
    // 電池（左邊）
    const by = (y0 + y1) / 2;
    Lab.line(x0 - 20, by - 10, x0 + 20, by - 10, '#fff', 4); Lab.line(x0 - 10, by + 10, x0 + 10, by + 10, '#fff', 6);
    Lab.text(`${S.V} V`, x0 - 36, by, '#ffd34d', 15, 'right', 'bold');
    let path;
    if (series) {
      wire([[x0, by - 10], [x0, y0], [x1, y0], [x1, y1], [x0, y1], [x0, by + 10]]);
      bulb((x0 + x1) / 2, y0, I * I * R1, false, `燈 1（${R1} Ω）`);
      bulb(x1, by, isFinite(R2) ? I * I * R2 : 0, S.out, `燈 2（${S.R2} Ω）`);
      path = [[x0, by - 10], [x0, y0], [x1, y0], [x1, y1], [x0, y1], [x0, by + 10]];
    } else {
      const xm = (x0 + x1) / 2;
      wire([[x0, by - 10], [x0, y0], [x1, y0], [x1, y1], [x0, y1], [x0, by + 10]]);
      wire([[xm, y0], [xm, y1]]);
      bulb(xm, by, S.V * S.V / R1, false, `燈 1（${R1} Ω）`);
      bulb(x1, by, isFinite(R2) ? S.V * S.V / R2 : 0, S.out, `燈 2（${S.R2} Ω）`);
      path = [[x0, by - 10], [x0, y0], [xm, y0], [xm, y1], [x0, y1], [x0, by + 10]];
    }
    // 電流方向（正極 → 負極，沿外電路）
    if (I > 0.01) {
      const seg = []; let tot = 0;
      for (let i = 1; i < path.length; i++) { const l = Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]); seg.push(l); tot += l; }
      for (let k = 0; k < 14; k++) {
        let d = (S.t * 60 * I + k * tot / 14) % tot, i = 0;
        while (d > seg[i]) { d -= seg[i]; i++; }
        const f = d / seg[i];
        Lab.circle(path[i][0] + (path[i + 1][0] - path[i][0]) * f, path[i][1] + (path[i + 1][1] - path[i][1]) * f, 5, '#5cc8ff');
      }
    }
    Lab.text('藍點：電流方向（正極 → 負極）', x0, y1 + 40, 'rgba(238,241,250,.55)', 12, 'left');
    $('I').textContent = I.toFixed(2) + ' A';
    $('L1').textContent = `${V1.toFixed(1)} V／${I1.toFixed(2)} A`;
    $('L2').textContent = S.out ? '斷路：0 V？／0 A' : `${V2.toFixed(1)} V／${I2.toFixed(2)} A`;
    $('Rt').textContent = isFinite(Rt) ? Rt.toFixed(2) + ' Ω' : '無限大（斷路）';
    $('info').innerHTML = (series
      ? '<b>串聯</b>：電流只有一條路，<b>各處電流相等</b>；各燈泡的電壓<b>相加 = 電池電壓</b>；總電阻 = R₁ + R₂。'
      : '<b>並聯</b>：每個燈泡兩端的<b>電壓都等於電池電壓</b>；總電流 = 各支路電流相加；總電阻比任一個電阻小。')
      + (S.out ? (series ? '<br>串聯時一個燈泡壞掉，<b>整個電路斷路</b>，另一個也不亮。' : '<br>並聯時一個燈泡壞掉，<b>另一個照樣亮</b>（家裡的電器就是並聯）。') : '')
      + '<br><b>歐姆定律</b>：V = I × R。';
  }

  Lab.init({ draw(ctx, w, h, dt) { S.mode === 'rub' ? drawRub(ctx, w, h, dt) : S.mode === 'induce' ? drawInduce(ctx, w, h) : drawCircuit(ctx, w, h, dt); } });
  Lab.bindGroup('.mode', k => { S.mode = k; Lab.showMode(k); });
  Lab.bindGroup('#pair button', k => { S.pair = k; S.moved = 0; });
  $('rubBtn').addEventListener('click', () => { S.rubT = 0.6; });
  $('rubReset').addEventListener('click', () => { S.moved = 0; });
  Lab.bindSlider('near', v => (S.near = v), v => (v < 0.05 ? '拿遠' : Math.round(v * 100) + '%'));
  $('ground').addEventListener('change', e => { S.ground = e.target.checked; });
  Lab.bindGroup('#conn button', k => (S.conn = k));
  Lab.bindSlider('V', v => (S.V = v), v => v + ' V');
  Lab.bindSlider('R1', v => (S.R1 = v), v => v + ' Ω');
  Lab.bindSlider('R2', v => (S.R2 = v), v => v + ' Ω');
  $('b2out').addEventListener('change', e => (S.out = e.target.checked));
  window.circuitSim = S;
})();
</script>
<script src="lesson.js" defer></script>
</body>
</html>
