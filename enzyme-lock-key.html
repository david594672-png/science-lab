<!DOCTYPE html>
<html lang="zh-Hant" data-subject="bio">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>酵素與消化</title>
<link rel="stylesheet" href="lab-kit.css">
</head>
<body>
<canvas id="cv" aria-label="酵素分解養分的試管模擬"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g7">← 回課程總覽</a>
  <h1>酵素與消化</h1>
  <p class="sub">國一生物 · 養分（酵素的作用）</p>

  <div class="body">
    <div class="group">
      <div class="group-title">試管裡放哪一種酵素</div>
      <div class="chips" style="--n:3" id="enzSeg">
        <button class="btn" data-k="amy" aria-pressed="true">澱粉酶</button>
        <button class="btn" data-k="pro" aria-pressed="false">蛋白酶</button>
        <button class="btn" data-k="lip" aria-pressed="false">脂肪酶</button>
      </div>
      <p class="note" id="enzNote" style="margin-top:8px"></p>
    </div>

    <div class="group">
      <div class="group-title">加入養分</div>
      <div class="chips" style="--n:3">
        <button class="btn" data-add="starch">＋澱粉</button>
        <button class="btn" data-add="protein">＋蛋白質</button>
        <button class="btn" data-add="fat">＋脂肪</button>
      </div>
      <div class="row"><button class="btn grow" id="clear">清空試管</button></div>
    </div>

    <div class="group">
      <div class="ctrl">
        <label for="temp">溫度 <output id="tempVal"></output></label>
        <input type="range" id="temp" min="0" max="80" step="1" value="37">
      </div>
      <div class="ctrl">
        <label for="ph">酸鹼值 pH <output id="phVal"></output></label>
        <input type="range" id="ph" min="1" max="12" step="0.5" value="7">
      </div>
      <div class="row"><button class="btn grow" id="fresh">換一批新的酵素</button></div>
    </div>

    <div class="group">
      <dl class="live">
        <dt>酵素活性</dt><dd id="act">—</dd>
        <dt>已分解</dt><dd id="done">—</dd>
      </dl>
      <div class="result" id="msg" style="margin-top:8px"></div>
    </div>

    <div class="group">
      <p class="note">酵素的<b>活化位</b>形狀只能和特定養分吻合，像<b>鎖和鑰匙</b>，所以一種酵素只能分解一種養分（<b>專一性</b>）。溫度、pH 會影響酵素的活性；溫度太高時酵素<b>變性</b>，形狀改變就再也不能作用。</p>
    </div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script>
(() => {
  const $ = Lab.$;
  // 養分：由小單元組成的長鏈，接合處形狀和對應酵素吻合
  const FOOD = {
    starch:  { name: '澱粉',   unit: '葡萄糖', color: '#ffd166', shape: 'hex',   n: 4, prod: ['葡萄糖'] },
    protein: { name: '蛋白質', unit: '胺基酸', color: '#ff7aa8', shape: 'round', n: 4, prod: ['胺基酸'] },
    fat:     { name: '脂肪',   unit: '',       color: '#7ee0b4', shape: 'square', n: 3, prod: ['甘油', '脂肪酸'] }
  };
  const ENZ = {
    amy: { name: '澱粉酶', food: 'starch',  opt: 7, color: '#ffb84d', note: '唾液、胰液、小腸液中都有。把<b>澱粉</b>分解成<b>葡萄糖</b>（中間會先變成麥芽糖）。最適 pH 約 7。' },
    pro: { name: '蛋白酶', food: 'protein', opt: 2, color: '#ff5d8f', note: '胃液中的蛋白酶在<b>強酸（pH 約 2）</b>下最有效；胰液、小腸液也有。把<b>蛋白質</b>分解成<b>胺基酸</b>。' },
    lip: { name: '脂肪酶', food: 'fat',     opt: 8, color: '#4fd18b', note: '胰液、小腸液中有。把<b>脂肪</b>分解成<b>脂肪酸和甘油</b>。膽汁不是酵素，但能讓脂肪變成小油滴，幫助分解。' }
  };
  const S = { enz: 'amy', temp: 37, ph: 7, denatured: false, done: 0, foods: [], bits: [], enzymes: [], msg: '' };
  let W = 600, H = 500, tank = { x: 0, y: 0, w: 0, h: 0 };

  function activity() {
    if (S.denatured) return 0;
    const e = ENZ[S.enz];
    const t = S.temp <= 37 ? Math.exp(-(((S.temp - 37) / 18) ** 2)) : Math.exp(-(((S.temp - 37) / 10) ** 2));
    const p = Math.exp(-(((S.ph - e.opt) / 1.6) ** 2));
    return t * p;
  }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function addFood(kind, n = 4) {
    for (let i = 0; i < n; i++) S.foods.push({ kind, x: rnd(tank.x + 60, tank.x + tank.w - 60), y: rnd(tank.y + 60, tank.y + tank.h - 60), vx: rnd(-40, 40), vy: rnd(-40, 40), a: rnd(0, 6.28), va: rnd(-1, 1), lock: 0 });
  }
  function makeEnzymes() {
    S.enzymes = [];
    for (let i = 0; i < 3; i++) S.enzymes.push({ x: rnd(tank.x + 80, tank.x + tank.w - 80), y: rnd(tank.y + 80, tank.y + tank.h - 80), vx: rnd(-25, 25), vy: rnd(-25, 25), a: rnd(0, 6.28), hold: null, t: 0 });
  }

  // ---------- 畫圖 ----------
  function notch(ctx, shape, x, y, s) {           // 活化位／接合處的形狀
    ctx.beginPath();
    if (shape === 'hex') { for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2; ctx.lineTo(x + Math.cos(a) * s, y + Math.sin(a) * s); } ctx.closePath(); }
    else if (shape === 'round') ctx.arc(x, y, s, 0, Math.PI * 2);
    else ctx.rect(x - s * 0.85, y - s * 0.85, s * 1.7, s * 1.7);
  }
  function drawEnzyme(ctx, e) {
    const E = ENZ[S.enz], sh = FOOD[E.food].shape;
    ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.a);
    // 變性：形狀扭曲
    const wob = S.denatured ? 1 : 0;
    ctx.beginPath();
    for (let k = 0; k <= 40; k++) {
      const a = k / 40 * Math.PI * 2;
      const r = 34 + wob * 8 * Math.sin(a * 5 + 1) + wob * 5 * Math.sin(a * 3);
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fillStyle = S.denatured ? '#6b6f7a' : E.color; ctx.globalAlpha = 0.9; ctx.fill(); ctx.globalAlpha = 1;
    // 活化位（凹槽）
    ctx.globalCompositeOperation = 'destination-out';
    notch(ctx, S.denatured ? 'round' : sh, 30, 0, S.denatured ? 7 : 13);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.rotate(-e.a);
    Lab.text(E.name, 0, 4, '#0b1020', 12, 'center', 'bold');
    ctx.restore();
  }
  function drawFood(ctx, f) {
    const F = FOOD[f.kind];
    ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.a);
    const gap = 26, n = F.n;
    if (f.kind === 'fat') {
      // 甘油（直條）＋ 三條脂肪酸
      Lab.ctx.fillStyle = '#c9f2dd'; Lab.rr(-30, -24, 12, 48, 4); ctx.fill();
      for (let k = -1; k <= 1; k++) { ctx.strokeStyle = F.color; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-14, k * 16); for (let j = 1; j <= 4; j++) ctx.lineTo(-14 + j * 10, k * 16 + (j % 2 ? 4 : -4)); ctx.stroke(); }
      ctx.fillStyle = '#fff'; notch(ctx, F.shape, -16, 0, 6); ctx.fill();
    } else {
      for (let k = 0; k < n; k++) {
        const x = (k - (n - 1) / 2) * gap;
        if (k) { ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x - gap, 0); ctx.lineTo(x, 0); ctx.stroke(); }
        ctx.fillStyle = F.color; notch(ctx, F.shape, x, 0, 10); ctx.fill();
      }
    }
    ctx.restore();
  }

  // ---------- 模擬 ----------
  function move(o, dt, r) {
    o.x += o.vx * dt; o.y += o.vy * dt;
    o.vx += rnd(-60, 60) * dt; o.vy += rnd(-60, 60) * dt;      // 布朗運動
    const sp = Math.hypot(o.vx, o.vy), max = 30 + S.temp * 0.9;
    if (sp > max) { o.vx *= max / sp; o.vy *= max / sp; }
    if (o.x < tank.x + r) { o.x = tank.x + r; o.vx = Math.abs(o.vx); }
    if (o.x > tank.x + tank.w - r) { o.x = tank.x + tank.w - r; o.vx = -Math.abs(o.vx); }
    if (o.y < tank.y + r) { o.y = tank.y + r; o.vy = Math.abs(o.vy); }
    if (o.y > tank.y + tank.h - r) { o.y = tank.y + tank.h - r; o.vy = -Math.abs(o.vy); }
  }
  function step(dt) {
    if (S.temp >= 60 && !S.denatured) { S.denatured = true; S.msg = '溫度太高，酵素<b>變性</b>了！形狀改變，就算降溫也不能恢復。按「換一批新的酵素」。'; }
    const act = activity(), E = ENZ[S.enz];
    S.enzymes.forEach(e => {
      if (!e.hold) move(e, dt, 36);
      e.a += dt * 0.4;
      if (e.hold) {                                   // 正在分解
        e.t += dt * (0.6 + act);
        const f = e.hold, sx = e.x + Math.cos(e.a) * 58, sy = e.y + Math.sin(e.a) * 58;
        f.x += (sx - f.x) * 0.3; f.y += (sy - f.y) * 0.3; f.a = e.a;
        if (e.t > 1) {                                 // 分解完成，放出產物
          const F = FOOD[f.kind];
          const pieces = f.kind === 'fat' ? [['甘油', '#c9f2dd'], ['脂肪酸', F.color], ['脂肪酸', F.color], ['脂肪酸', F.color]] : Array.from({ length: F.n }, () => [F.unit, F.color]);
          pieces.forEach(([name, color]) => S.bits.push({ name, color, shape: F.shape, x: f.x, y: f.y, vx: rnd(-80, 80), vy: rnd(-80, 80), a: 0 }));
          S.foods.splice(S.foods.indexOf(f), 1);
          e.hold = null; e.t = 0; S.done++;
        }
        return;
      }
      // 碰到養分：形狀吻合才可能分解
      for (const f of S.foods) {
        if (f.lock) continue;
        if (Math.hypot(f.x - e.x, f.y - e.y) < 66) {
          if (f.kind === E.food && !S.denatured && Math.random() < act * 0.6) { e.hold = f; f.lock = 1; e.t = 0; }
          else { const dx = f.x - e.x, dy = f.y - e.y, d = Math.hypot(dx, dy) || 1; f.vx += dx / d * 60; f.vy += dy / d * 60; }
          if (f.kind !== E.food) S.msg = `${E.name}碰到<b>${FOOD[f.kind].name}</b>，形狀對不上，彈開了。`;
          break;
        }
      }
    });
    S.foods.forEach(f => { if (!f.lock) { move(f, dt, 40); f.a += f.va * dt; } });
    S.bits.forEach(b => move(b, dt, 12));
  }

  function draw(ctx, w, h, dt, t) {
    step(dt);
    // 試管
    Lab.card(tank.x, tank.y, tank.w, tank.h, 'rgba(120,200,255,.05)', 'rgba(160,220,255,.35)', 26);
    Lab.text(`試管（${S.temp}°C、pH ${S.ph}）`, tank.x + 16, tank.y + 18, 'rgba(238,241,250,.6)', 13, 'left');
    S.bits.forEach(b => { ctx.fillStyle = b.color; notch(ctx, b.shape, b.x, b.y, b.name === '脂肪酸' ? 6 : 9); ctx.fill(); });
    S.foods.forEach(f => drawFood(ctx, f));
    S.enzymes.forEach(e => drawEnzyme(ctx, e));
    // 產物計數
    const cnt = {}; S.bits.forEach(b => (cnt[b.name] = (cnt[b.name] || 0) + 1));
    const left = {}; S.foods.forEach(f => (left[FOOD[f.kind].name] = (left[FOOD[f.kind].name] || 0) + 1));
    let x = tank.x + 10;
    const y = tank.y + tank.h + 24;
    const tag = (str, color) => { ctx.font = `bold 13px ${Lab.FONT}`; const w = ctx.measureText(str).width + 20; Lab.pill(str, x + w / 2, y, color, 13); x += w + 8; };
    Object.entries(left).forEach(([k, v]) => tag(`${k} ×${v}`, '#eef1fa'));
    Object.entries(cnt).forEach(([k, v]) => tag(`${k} ×${v}`, '#4fd18b'));
    // 活性曲線：溫度、pH
    const cy = tank.y + tank.h + 50, ch = H - cy - 12, cw = (tank.w - 12) / 2;
    if (ch > 70) {
      const E = ENZ[S.enz];
      const tf = T => T <= 37 ? Math.exp(-(((T - 37) / 18) ** 2)) : Math.exp(-(((T - 37) / 10) ** 2));
      const pf = p => Math.exp(-(((p - E.opt) / 1.6) ** 2));
      const g1 = Lab.chart(tank.x, cy, cw, ch, [{ data: Array.from({ length: 81 }, (_, i) => tf(i)), color: '#ffb84d' }], { min: 0, max: 1.05, xLabel: '溫度 0~80°C', yLabel: '活性' });
      Lab.circle(g1.px + S.temp / 80 * g1.pw, g1.Y(S.denatured ? 0 : tf(S.temp)), 6, '#fff');
      const g2 = Lab.chart(tank.x + cw + 12, cy, cw, ch, [{ data: Array.from({ length: 23 }, (_, i) => pf(1 + i * 0.5)), color: '#ff5d8f' }], { min: 0, max: 1.05, xLabel: 'pH 1~12', yLabel: '活性' });
      Lab.circle(g2.px + (S.ph - 1) / 11 * g2.pw, g2.Y(S.denatured ? 0 : pf(S.ph)), 6, '#fff');
    }
  }

  Lab.init({
    draw,
    resize(w, h) {
      W = w; H = h;
      tank = { x: 20, y: 20, w: w - 40, h: Math.max(220, h * 0.58) };
      if (!S.enzymes.length) { makeEnzymes(); addFood('starch', 3); addFood('protein', 2); addFood('fat', 2); }
    },
    ui() {
      const a = activity();
      $('act').textContent = S.denatured ? '0%（變性）' : Math.round(a * 100) + '%';
      $('done').textContent = S.done + ' 個';
      $('msg').innerHTML = S.msg || '酵素和養分在試管中隨機碰撞，形狀吻合時才會分解。';
    }
  });
  Lab.bindGroup('#enzSeg .btn', k => { S.enz = k; S.denatured = S.temp >= 60; S.msg = ''; $('enzNote').innerHTML = ENZ[k].note; S.enzymes.forEach(e => { if (e.hold) { e.hold.lock = 0; e.hold = null; } }); });
  document.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => addFood(b.dataset.add, 3)));
  $('clear').addEventListener('click', () => { S.foods = []; S.bits = []; S.done = 0; S.enzymes.forEach(e => (e.hold = null)); });
  $('fresh').addEventListener('click', () => { S.denatured = S.temp >= 60; S.msg = S.denatured ? '溫度還是太高，新酵素也會馬上變性。先把溫度調低。' : '換上新的酵素了。'; makeEnzymes(); });
  Lab.bindSlider('temp', v => { S.temp = v; if (v < 60 && S.denatured) S.msg = '降溫了，可是變性的酵素<b>不會恢復</b>。'; else if (v < 15 && !S.denatured) S.msg = '溫度低，酵素活性變低、分解變慢；回溫後就會恢復。'; }, v => v + ' °C');
  Lab.bindSlider('ph', v => { S.ph = v; }, v => v.toFixed(1));
  window.enzSim = S;
})();
</script>
<script src="lesson.js" defer></script>
</body>
</html>
