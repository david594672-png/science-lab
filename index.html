<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>自然科互動動畫實驗室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ===== 色彩與基礎設定（沉浸式深色主題） ===== */
  :root {
    color-scheme: dark;
    --bg: #0b1020;          /* 深夜藍底 */
    --bg-2: #0f1630;
    --surface: #141c34;     /* 卡片底 */
    --surface-2: #1a2342;
    --ink: #eef1fa;         /* 主要文字 */
    --ink-soft: #a3abc4;    /* 次要文字 */
    --ink-faint: #6f7895;
    --line: rgba(255,255,255,.08);
    --line-2: rgba(255,255,255,.14);

    /* 科目色：物理藍、化學紅、生物綠、地科黃 */
    --phy: #5b9cff;
    --chem: #ff6b6b;
    --bio: #4fd18b;
    --earth: #f5c451;
    --accent: #a58bff;      /* 品牌點綴：紫光 */

    --radius: 18px;
    --ease: cubic-bezier(.22,.61,.36,1);
    --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 84px; }
  body {
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(165,139,255,.14), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(91,156,255,.12), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    line-height: 1.7;
    letter-spacing: .02em;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 8px; }

  /* ===== 導覽列 ===== */
  .navbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(11,16,32,.72);
    backdrop-filter: saturate(160%) blur(14px);
    -webkit-backdrop-filter: saturate(160%) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner {
    max-width: 1240px; margin: 0 auto; padding: 12px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.08rem; white-space: nowrap; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--phy), var(--accent));
    box-shadow: 0 0 18px rgba(165,139,255,.45);
  }
  .brand-mark svg { width: 18px; height: 18px; color: #fff; }
  .nav-links { display: flex; gap: 6px; }
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .area-switch { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
  .area-switch a { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 16px; border-radius: 999px; font-size: .9rem; color: var(--ink-soft); white-space: nowrap; transition: background .25s var(--ease), color .25s var(--ease); }
  .area-switch a svg { width: 17px; height: 17px; }
  .area-switch a:hover { color: var(--ink); }
  .area-switch a[aria-current="page"] { background: var(--ink); color: var(--bg); font-weight: 700; }
  @media (max-width: 1180px) { .nav-links { display: none; } }
  @media (max-width: 560px) { .brand .txt { display: none; } .area-switch a { padding: 0 12px; } }
  .nav-link {
    padding: 8px 16px; border-radius: 999px; font-size: .9rem; color: var(--ink-soft);
    border: 1px solid transparent; background: transparent; cursor: pointer; white-space: nowrap;
    min-height: 40px; display: inline-flex; align-items: center;
    transition: background .25s var(--ease), color .25s var(--ease), border-color .25s var(--ease);
  }
  .nav-link:hover { color: var(--ink); border-color: var(--line-2); }

  /* ===== 主視覺 ===== */
  .hero { max-width: 1240px; margin: 0 auto; padding: 56px 24px 28px; }
  .eyebrow { font-size: .78rem; letter-spacing: .3em; color: var(--ink-faint); margin-bottom: 12px; }
  .hero h1 { font-size: clamp(1.9rem, 4.4vw, 3rem); font-weight: 900; line-height: 1.3; margin-bottom: 14px; }
  .hero h1 .glow {
    background: linear-gradient(90deg, var(--phy), var(--accent) 50%, var(--chem));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero p { max-width: 600px; color: var(--ink-soft); }
  .legend { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 22px; font-size: .85rem; color: var(--ink-soft); }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }

  main { max-width: 1240px; margin: 0 auto; padding: 0 24px 80px; }
  .section-head {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    margin: 0 0 20px;
  }
  .section-head h2 { font-size: 1.45rem; font-weight: 700; display: flex; align-items: center; gap: 12px; }
  .section-head p { color: var(--ink-soft); font-size: .92rem; margin-top: 2px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 12px var(--c); flex: none; }

  /* ===== 年級分頁 ===== */
  .grades { scroll-margin-top: 84px; }
  .grade-tabs {
    display: inline-flex; gap: 4px; padding: 5px; margin-bottom: 22px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  }
  .grade-tab {
    border: 0; background: transparent; cursor: pointer; color: var(--ink-soft);
    padding: 8px 20px; min-height: 42px; border-radius: 999px; font-size: .92rem; white-space: nowrap;
    transition: background .25s var(--ease), color .25s var(--ease);
  }
  .grade-tab:hover { color: var(--ink); }
  .grade-tab[aria-selected="true"] { background: var(--ink); color: var(--bg); font-weight: 700; }

  .grade-panel { display: none; }
  .grade-panel.active { display: block; animation: fadeUp .45s var(--ease); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ===== 單元大圖卡片 ===== */
  .unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .unit-card {
    position: relative; display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; box-shadow: var(--shadow);
    transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s var(--ease);
  }
  .unit-card.linked:hover { transform: translateY(-5px); border-color: color-mix(in srgb, var(--c) 55%, transparent); box-shadow: 0 16px 40px rgba(0,0,0,.45), 0 0 24px color-mix(in srgb, var(--c) 30%, transparent); }
  .unit-art {
    position: relative; height: 112px; overflow: hidden;
    background:
      radial-gradient(90% 120% at 100% 100%, color-mix(in srgb, var(--c) 40%, transparent), transparent 65%),
      linear-gradient(135deg, color-mix(in srgb, var(--c) 18%, var(--bg-2)), var(--surface));
  }
  .unit-art svg {
    position: absolute; right: -10px; bottom: -14px; width: 120px; height: 120px;
    color: var(--c); opacity: .55; transition: transform .5s var(--ease), opacity .35s var(--ease);
  }
  .unit-card.linked:hover .unit-art svg { transform: rotate(-8deg) scale(1.08); opacity: .85; }
  .unit-no { position: absolute; left: 18px; top: 14px; font-size: 2rem; font-weight: 900; line-height: 1; color: var(--ink); opacity: .9; }
  .unit-tag {
    position: absolute; left: 18px; bottom: 14px; font-size: .72rem; font-weight: 700; letter-spacing: .08em;
    padding: 3px 10px; border-radius: 999px; color: var(--c);
    background: color-mix(in srgb, var(--c) 14%, rgba(11,16,32,.6)); border: 1px solid color-mix(in srgb, var(--c) 50%, transparent);
  }
  .unit-body { padding: 14px 18px 16px; display: flex; flex-direction: column; flex: 1; gap: 10px; }
  .unit-title { font-size: 1.02rem; font-weight: 500; line-height: 1.5; flex: 1; }
  .unit-foot { display: flex; align-items: center; justify-content: space-between; font-size: .8rem; color: var(--ink-soft); }
  .play {
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    border: 1.5px solid var(--c); color: var(--c);
    transition: background .3s var(--ease), color .3s var(--ease), transform .3s var(--ease);
  }
  .play svg { width: 12px; height: 12px; margin-left: 2px; }
  .unit-card.linked:hover .play { background: var(--c); color: var(--bg); transform: scale(1.06); }

  /* 整張卡可點：用撐滿卡片的連結；卡片裡若還有其他實驗按鈕，疊在它上面 */
  .stretch { position: absolute; inset: 0; z-index: 1; border-radius: inherit; }
  .stretch:focus-visible { outline-offset: -3px; }
  .more { position: relative; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px; }
  .more a {
    display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 4px 12px;
    font-size: .78rem; border-radius: 999px; color: var(--c);
    border: 1px solid color-mix(in srgb, var(--c) 50%, transparent);
    background: color-mix(in srgb, var(--c) 10%, transparent);
    transition: background .25s var(--ease), color .25s var(--ease);
  }
  .more a:hover { background: var(--c); color: var(--bg); }
  .more a svg { width: 10px; height: 10px; }

  .unit-card.soon { opacity: .55; }
  .unit-card.soon .unit-art { filter: grayscale(.7); }
  .soon-chip { font-size: .72rem; padding: 2px 10px; border-radius: 999px; border: 1px dashed var(--line-2); color: var(--ink-faint); }

  /* 主視覺：文字 + 示範動畫 */
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 32px; align-items: center; }
  .demo {
    display: block; border-radius: 22px; overflow: hidden; border: 1px solid var(--line-2);
    background: linear-gradient(180deg, var(--surface-2), var(--surface)); box-shadow: var(--shadow);
    transition: transform .35s var(--ease), border-color .35s var(--ease);
  }
  .demo:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--phy) 60%, transparent); }
  #demo { display: block; width: 100%; height: 230px; }
  .demo-cap { padding: 12px 16px 14px; border-top: 1px solid var(--line); }
  .demo-cap b { display: block; font-size: .95rem; }
  .demo-cap span { font-size: .82rem; color: var(--phy); }

  /* 找實驗：搜尋、主題、只看有動畫 */
  .finder { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .search { flex: 1 1 280px; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-2); }
  .search:focus-within { border-color: var(--phy); }
  .search svg { width: 18px; height: 18px; color: var(--ink-faint); flex: none; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; font-size: 1rem; }
  .search input::placeholder { color: var(--ink-faint); }
  .only { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: .9rem; color: var(--ink-soft); min-height: 44px; user-select: none; }
  .only input { position: absolute; opacity: 0; pointer-events: none; }
  .only .track { position: relative; width: 44px; height: 26px; border-radius: 999px; background: rgba(255,255,255,.14); transition: background .2s; }
  .only .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .only input:checked + .track { background: var(--phy); }
  .only input:checked + .track::after { transform: translateX(18px); }
  .only input:focus-visible + .track { outline: 2px solid var(--ink); outline-offset: 2px; }
  .topics { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
  .topic {
    min-height: 40px; padding: 0 16px; border-radius: 999px; cursor: pointer; font-size: .88rem;
    color: var(--ink-soft); background: transparent; border: 1px solid var(--line-2);
    transition: background .2s, color .2s, border-color .2s;
  }
  .topic:hover { color: var(--ink); }
  .topic[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
  .results-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; color: var(--ink-soft); font-size: .9rem; }
  .results-head button { min-height: 40px; padding: 0 14px; border-radius: 999px; cursor: pointer; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); }
  .empty { padding: 40px 20px; text-align: center; color: var(--ink-faint); border: 1px dashed var(--line-2); border-radius: var(--radius); }
  .where { font-size: .74rem; color: var(--ink-faint); }

  /* 高中：冊 → 章 → 節 */
  .book { margin-top: 34px; }
  .book:first-of-type { margin-top: 0; }
  .book-head { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
  .book-head h3 { font-size: 1.15rem; font-weight: 700; }
  .book-head span { font-size: .82rem; color: var(--ink-soft); margin-left: auto; }
  .chapter-title { font-size: .95rem; font-weight: 700; color: var(--ink-soft); margin: 20px 0 10px; display: flex; gap: 10px; align-items: baseline; }
  .chapter-title b { color: var(--c); font-weight: 700; }
  .unit-no.sec { font-size: 1.6rem; letter-spacing: .02em; }

  footer { border-top: 1px solid var(--line); text-align: center; padding: 28px 24px; font-size: .8rem; color: var(--ink-faint); }

  /* ===== RWD：平板與手機 ===== */
  @media (max-width: 960px) {
    .hero { grid-template-columns: 1fr; }
    .demo { max-width: 520px; }
  }
  @media (max-width: 760px) {
    .topics { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
    .topics::-webkit-scrollbar { display: none; }
    .topic { flex: none; }
    .nav-inner { padding: 10px 16px; }
    .nav-links { display: none; }
    .hero { padding: 36px 16px 20px; }
    main { padding: 0 16px 56px; }
    .grade-tabs { display: flex; width: 100%; overflow-x: auto; scrollbar-width: none; }
    .grade-tabs::-webkit-scrollbar { display: none; }
    .grade-tab { flex: none; padding: 8px 14px; font-size: .85rem; }
  }
  @media (max-width: 520px) {
    .unit-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    .unit-art { height: 90px; }
    .unit-art svg { width: 90px; height: 90px; }
    .unit-no { font-size: 1.5rem; left: 14px; }
    .unit-tag { left: 14px; bottom: 10px; }
    .unit-body { padding: 12px 14px 14px; }
    .unit-title { font-size: .92rem; }
    .unit-foot span:first-child { display: none; }
    .unit-foot { justify-content: flex-end; }
  }
  @media (max-width: 360px) { .unit-grid { grid-template-columns: 1fr; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>

<script>
/* ===== 工具函式 ===== */
const PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>';
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isExternal = url => /^https?:\/\//.test(url || '');

/* ===== 渲染：年級分頁與單元卡片 ===== */
// 同資料夾的動畫頁在本分頁開啟（動畫頁有「回課程總覽」）；外部網址才開新分頁
const extAttr = url => isExternal(url) ? 'target="_blank" rel="noopener"' : '';

/** 一張單元卡：no 是左上角的編號（國中 01、02…；高中 1-1、1-2…） */
function unitCard(u, subject, no, where = '') {
  const s = SUBJECTS[subject];
  const more = (u.more || []).map(m =>
    `<a href="${esc(m.url)}" ${extAttr(m.url)}>${PLAY_SVG}${esc(m.label)}</a>`).join('');
  const inner = `
    <div class="unit-art">${s.art}<span class="unit-no${no.includes('-') || no.includes('章') ? ' sec' : ''}">${esc(no)}</span><span class="unit-tag">${s.name}</span></div>
    <div class="unit-body">
      ${where ? `<span class="where">${esc(where)}</span>` : ''}
      <h3 class="unit-title">${esc(u.title)}</h3>
      ${more ? `<div class="more">${more}</div>` : ''}
      <div class="unit-foot">${u.url
        ? `<span>播放動畫</span><span class="play">${PLAY_SVG}</span>`
        : `<span></span><span class="soon-chip">製作中</span>`}</div>
    </div>`;
  if (!u.url) return `<div class="unit-card soon" style="--c:${s.color}">${inner}</div>`;
  return `<div class="unit-card linked" style="--c:${s.color}">
    <a class="stretch" href="${esc(u.url)}" ${extAttr(u.url)} aria-label="播放動畫：${esc(u.title)}"></a>${inner}</div>`;
}

/** 高中：冊 → 章 → 節 */
function renderBooks(books) {
  return books.map(b => {
    const n = b.chapters.reduce((t, [, secs]) => t + secs.length, 0);
    return `
      <div class="book" style="--c:${SUBJECTS[b.subject].color}">
        <div class="book-head"><span class="dot" style="margin:0"></span><h3>${esc(b.name)}</h3><span>${n} 個單元</span></div>
        ${b.chapters.map(([title, secs], ci) => `
          <h4 class="chapter-title"><b>第 ${ci + 1} 章</b>${esc(title)}</h4>
          <div class="unit-grid">${secs.map(([no, name, url]) => unitCard({ title: name, url }, b.subject, no)).join('')}</div>`).join('')}
      </div>`;
  }).join('');
}

const unitCount = c => c.units ? c.units.length
  : c.books.reduce((t, b) => t + b.chapters.reduce((u, [, secs]) => u + secs.length, 0), 0);

function renderCourses() {
  document.getElementById('gradeTabs').innerHTML = COURSES.map(c => `
    <button class="grade-tab" role="tab" id="tab-${c.id}" data-target="${c.id}"
            aria-controls="panel-${c.id}" aria-selected="false">${esc(c.tabLabel)}</button>`).join('');

  document.getElementById('courseRoot').innerHTML = COURSES.map(c => `
    <section class="grade-panel" id="panel-${c.id}" role="tabpanel" aria-labelledby="tab-${c.id}">
      <div class="section-head">
        <div><h2 style="font-size:1.2rem">${esc(c.title)}</h2><p>${esc(c.desc)}</p></div>
        <span style="font-size:.85rem;color:var(--ink-soft)">共 ${unitCount(c)} 個單元</span>
      </div>
      ${c.units
        ? `<div class="unit-grid">${c.units.map((u, i) => unitCard(u, u.subject, pad(i + 1))).join('')}</div>`
        : renderBooks(c.books)}
    </section>`).join('');
}

/* =========================================================
   找實驗：搜尋 ＋ 依主題 ＋ 只看有動畫
   主題用單元名稱的關鍵字判斷，一個單元可以屬於好幾個主題
   ========================================================= */
const TOPICS = [
  ['all',     '全部'],
  ['measure', '測量與方法', /測量|不確定|因次|科學的|物理學簡介/],
  ['motion',  '運動與力',   /運動|力|牛頓|慣性|摩擦|壓力|浮力|動量|碰撞|靜力|向量|拋射|位移|速度|加速度|落體|簡諧|角動量/],
  ['energy',  '能量',       /能|功率|功與|作的功/],
  ['wave',    '波動與光',   /波|光|聲|透鏡|折射|干涉|繞射|共鳴|共振|都卜勒|色散|惠更斯/],
  ['heat',    '熱',         /熱|溫度|氣體/],
  ['em',      '電與磁',     /電|磁/],
  ['chem',    '物質與化學', /物質|化學|溶液|溶解|酸鹼|氧化|有機|原子|分子|元素|反應|莫耳|資源/],
  ['life',    '生命',       null, 'bio'],
  ['earth',   '地球與天氣', /地球|板塊|斷層|地震|天氣|氣壓|鋒面|颱風|海洋|海水|大氣|陸地|氣候|地殼|地表|氣象/],
  ['space',   '天文與宇宙', /宇宙|天體|月相|周日|星|行星|衛星|克卜勒|萬有引力/],
  ['modern',  '近代物理',   /量子|光電|原子核|波粒|物質波|X 射線|黑體|電子的發現|密立坎|質能|拉塞福|波耳/]
];

/** 把國中、高中所有單元攤平成一張清單 */
const ALL_UNITS = COURSES.flatMap(c => c.units
  ? c.units.map((u, i) => ({ ...u, no: pad(i + 1), where: c.title }))
  : c.books.flatMap(b => b.chapters.flatMap(([, secs]) => secs.map(([no, title, url]) =>
      ({ title, url, subject: b.subject, no, where: `${c.tabLabel} · ${b.name.split('　')[0]}` })))));

function setupFinder() {
  let topic = 'all';
  const q = document.getElementById('q'), only = document.getElementById('onlyAnim');
  const results = document.getElementById('results'), gradeView = document.getElementById('gradeView');
  document.getElementById('topics').innerHTML = TOPICS.map(([k, n]) =>
    `<button class="topic" data-k="${k}" aria-pressed="${k === topic}">${n}</button>`).join('');

  const inTopic = u => {
    if (topic === 'all') return true;
    const [, , re, subj] = TOPICS.find(t => t[0] === topic);
    return subj ? u.subject === subj : re.test(u.title);
  };
  function update() {
    const term = q.value.trim().toLowerCase();
    const active = term || topic !== 'all' || only.checked;
    results.hidden = !active;
    gradeView.hidden = !!active;
    if (!active) return;
    const list = ALL_UNITS.filter(u => inTopic(u) && (!only.checked || u.url) &&
      (!term || `${u.title} ${u.where} ${SUBJECTS[u.subject].name}`.toLowerCase().includes(term)));
    const anim = list.filter(u => u.url).length;
    results.innerHTML = `
      <div class="results-head"><span>找到 ${list.length} 個單元，其中 ${anim} 個有動畫</span><button id="clearFind">回到依年級瀏覽</button></div>
      ${list.length
        ? `<div class="unit-grid">${list.map(u => unitCard(u, u.subject, u.no, u.where)).join('')}</div>`
        : '<div class="empty">找不到符合的單元，換個關鍵字試試。</div>'}`;
  }
  document.getElementById('topics').addEventListener('click', e => {
    const b = e.target.closest('.topic');
    if (!b) return;
    topic = b.dataset.k;
    document.querySelectorAll('.topic').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    update();
  });
  q.addEventListener('input', update);
  only.addEventListener('change', update);
  results.addEventListener('click', e => {
    if (!e.target.closest('#clearFind')) return;
    q.value = ''; only.checked = false; topic = 'all';
    document.querySelectorAll('.topic').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.k === 'all')));
    update();
  });
}

/* =========================================================
   主視覺示範：參考圓的影子 → 正弦曲線
   ========================================================= */
function setupDemo() {
  const cv = document.getElementById('demo'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, dpr = 1, visible = true, last = performance.now(), th = 0;
  const trail = [];
  function size() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
  }
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const R = Math.min(70, H * 0.32), cx = R + 28, cy = H / 2, ax = cx + R + 40;
    const px = cx + R * Math.cos(th), py = cy - R * Math.sin(th);
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(91,156,255,.55)';
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([4, 5]); ctx.strokeStyle = 'rgba(238,241,250,.3)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(ax, py); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(16, cy); ctx.lineTo(W - 12, cy); ctx.stroke();
    ctx.setLineDash([]);
    // 正弦曲線：最新的點在影子點，往右是較早的時間
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2.5; ctx.beginPath();
    trail.forEach((y, i) => { const x = ax + i * 1.6; i ? ctx.lineTo(x, cy - y * R) : ctx.moveTo(x, cy - y * R); });
    ctx.stroke();
    ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(ax, py, 7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(91,156,255,.7)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px, py); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI * 2); ctx.fill();
  }
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (visible && !document.hidden) {
      th += dt * 2.2;
      trail.unshift(Math.sin(th));
      if (trail.length > Math.max(10, (W - 150) / 1.6)) trail.pop();
      draw();
    }
    requestAnimationFrame(loop);
  }
  size();
  addEventListener('resize', size);
  if ('IntersectionObserver' in window) new IntersectionObserver(es => { visible = es[0].isIntersecting; }).observe(cv);
  if (reduce) { th = 0.8; for (let i = 0; i < 200; i++) trail.push(Math.sin(th - i * 0.035)); draw(); }
  else requestAnimationFrame(loop);
}

/* ===== 切換年級 ===== */
function switchGrade(id, { scroll = false, remember = true } = {}) {
  if (!COURSES.some(c => c.id === id)) id = COURSES[0].id;
  document.querySelectorAll('.grade-tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.target === id)));
  document.querySelectorAll('.grade-panel').forEach(p => p.classList.toggle('active', p.id === `panel-${id}`));
  if (remember) try { history.replaceState(null, '', `#${id}`); } catch (e) { /* file:// 下可能不允許 */ }
  if (scroll) document.getElementById('grades').scrollIntoView({ behavior: 'smooth' });
}

function bindEvents() {
  document.getElementById('gradeTabs').addEventListener('click', e => {
    const tab = e.target.closest('.grade-tab');
    if (tab) switchGrade(tab.dataset.target);
  });
  window.addEventListener('hashchange', () => {
    const id = location.hash.slice(1);
    if (COURSES.some(c => c.id === id)) switchGrade(id, { scroll: true });
  });
  document.querySelectorAll('.nav-link[data-grade]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    switchGrade(a.dataset.grade, { scroll: true });
  }));
}

/* ===== 初始化 ===== */
renderCourses();
bindEvents();
setupFinder();
setupDemo();
const hash = location.hash.slice(1);
// 從實驗頁「回課程總覽」（#g7 / #g8 / #g9）回來時，切到該年級並直接捲過去
const fromLab = COURSES.some(c => c.id === hash);
switchGrade(hash, { remember: fromLab });
if (fromLab) {
  // 關掉瀏覽器的「還原捲動位置」，並在字型等資源載入完後再對齊一次
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  const go = () => document.getElementById('grades').scrollIntoView({ behavior: 'instant' });
  go();
  window.addEventListener('load', go, { once: true });
}
</script>
