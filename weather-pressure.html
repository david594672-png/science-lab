<!DOCTYPE html>
<html lang="zh-Hant" data-subject="earth">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>高氣壓與低氣壓</title>
<link rel="stylesheet" href="lab-kit.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="cv" aria-label="高氣壓與低氣壓氣流的 3D 模型"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g9">← 回課程總覽</a>
  <h1>高氣壓與低氣壓</h1>
  <p class="sub">國三地科 · 千變萬化的天氣</p>

  <div class="body">
    <div class="modes" style="--n:3">
      <button class="mode" data-k="H" aria-pressed="false">高氣壓</button>
      <button class="mode" data-k="L" aria-pressed="false">低氣壓</button>
      <button class="mode" data-k="both" aria-pressed="true">一起比較</button>
    </div>

    <div class="group">
      <div class="result" id="info"></div>
    </div>

    <div class="group">
      <div class="group-title">顯示</div>
      <label class="sw"><input type="checkbox" id="lIso" checked><span class="track"></span>等壓線</label>
      <label class="sw"><input type="checkbox" id="lSurf" checked><span class="track"></span>地面的風</label>
      <label class="sw"><input type="checkbox" id="lVert" checked><span class="track"></span>上升、下沉氣流</label>
      <label class="sw"><input type="checkbox" id="lCloud" checked><span class="track"></span>雲</label>
      <div class="seg" style="--n:2;margin-top:6px" id="hemi">
        <button data-k="N" aria-pressed="true">北半球</button>
        <button data-k="S" aria-pressed="false">南半球</button>
      </div>
    </div>

    <div class="group">
      <p class="note">空氣會從<b>高壓吹向低壓</b>，但受地球自轉影響，在北半球會<b>向右偏</b>：高氣壓的風<b>順時針向外吹出</b>，低氣壓的風<b>逆時針向內吹入</b>。南半球方向相反。</p>
    </div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script type="module">
import { start3D, THREE } from './lab3d.js';
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const $ = id => document.getElementById(id);
const S = { mode: 'both', hemi: 1 };
const R = 4.6, TOPH = 4;

const L = start3D({ background: 0x9cc3e6, camera: [0, 10, 18], target: [0, 1.2, 0], minDist: 6, maxDist: 40, maxPolar: Math.PI * 0.48, ambient: 1, key: 1.2, frame, ui });
const { scene } = L;

// 地面
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 18), L.mat(0x6f9a5a, { roughness: 1 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);

function puffTex() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.5, 'rgba(255,255,255,.6)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
}
const PUFF = puffTex();

// 一個氣壓中心
function center(kind) {
  const g = new THREE.Group(); scene.add(g);
  const high = kind === 'H';
  // 等壓線
  const iso = new THREE.Group(); g.add(iso);
  [1.4, 2.8, 4.2].forEach((r, i) => {
    const m = new THREE.Mesh(new THREE.TorusGeometry(r, 0.035, 6, 96), L.glow(high ? 0xd9493f : 0x2f6fd0));
    m.rotation.x = Math.PI / 2; m.position.y = 0.03; iso.add(m);
    const p = high ? 1020 - i * 4 : 1000 + i * 4;
    const lb = L.label(p + '', () => g.position.clone().add(V(r, 0.15, 0)), 'plain'); lb.iso = true;
    (g.userData.isoLbl ||= []).push(lb);
  });
  const big = L.label(high ? '高' : '低', () => g.position.clone().add(V(0, 0.4, 0)), 'big');
  big.el.style.color = high ? '#ff7b6e' : '#7fb2ff';
  // 粒子
  const N = 520, pos = new Float32Array(N * 3), P = [];
  for (let i = 0; i < N; i++) P.push(spawn({}, true));
  function spawn(p, init) {
    p.a = Math.random() * Math.PI * 2;
    if (high) { p.stage = init ? (Math.random() < 0.4 ? 0 : 1) : 0; p.r = Math.random() * 0.8; p.h = init && p.stage ? 0.25 : TOPH * (0.6 + Math.random() * 0.4); if (init && p.stage) p.r = Math.random() * R; }
    else { p.stage = init ? (Math.random() < 0.6 ? 0 : 1) : 0; p.r = init && p.stage ? Math.random() * 0.8 : R * (0.8 + Math.random() * 0.2); p.h = init && p.stage ? Math.random() * TOPH : 0.25; if (!init) p.r = R * (0.85 + Math.random() * 0.15); }
    return p;
  }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color: high ? 0xffe0d9 : 0xd9e8ff, size: 0.09 }));
  g.add(pts);
  // 雲（低氣壓上方）
  const clouds = new THREE.Group(); g.add(clouds);
  if (!high) for (let i = 0; i < 60; i++) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: PUFF, color: 0xf2f5fa, transparent: true, opacity: 0.85, depthWrite: false }));
    const a = Math.random() * Math.PI * 2, r = Math.random() * 2.2;
    sp.position.set(Math.cos(a) * r, 3.2 + Math.random() * 1.2, Math.sin(a) * r);
    sp.scale.setScalar(1.2 + Math.random() * 1.2); clouds.add(sp);
  } else {
    const sun = new THREE.Mesh(new THREE.SphereGeometry(0.45, 20, 14), L.glow(0xffd34d));
    sun.position.set(0.8, 5.2, -0.5); clouds.add(sun);
  }
  // 地面風箭頭
  const arrows = [];
  for (let i = 0; i < 8; i++) arrows.push(L.arrow(high ? 0xff7b6e : 0x5c9cff, 0.35, 0.25));
  // 垂直氣流箭頭
  const vArrow = L.arrow(high ? 0xff7b6e : 0x5c9cff, 0.5, 0.35);
  const vLbl = L.label(high ? '空氣下沉' : '空氣上升', () => g.position.clone().add(V(1.1, 2.4, 0)));

  return {
    g, high,
    update(dt) {
      const h = S.hemi;
      for (let i = 0; i < N; i++) {
        const p = P[i];
        if (high) {
          if (p.stage === 0) { p.h -= dt * 1.3; if (p.h <= 0.25) { p.h = 0.25; p.stage = 1; } }
          else { p.r += dt * 0.9; p.a -= h * dt * 0.5 / Math.max(0.6, p.r) * 2; if (p.r > R) spawn(p, false); }
        } else {
          if (p.stage === 0) { p.r -= dt * 0.9; p.a += h * dt * 0.5 / Math.max(0.6, p.r) * 2; if (p.r < 0.7) p.stage = 1; }
          else { p.h += dt * 1.3; p.a += h * dt * 0.6; if (p.h > TOPH) spawn(p, false); }
        }
        pos[i * 3] = Math.cos(p.a) * p.r; pos[i * 3 + 1] = p.h; pos[i * 3 + 2] = -Math.sin(p.a) * p.r;
      }
      geo.attributes.position.needsUpdate = true;
      const surf = $('lSurf').checked, vert = $('lVert').checked;
      pts.visible = surf || vert;
      iso.visible = $('lIso').checked;
      (g.userData.isoLbl || []).forEach(l => (l.show = iso.visible && g.visible));
      big.show = g.visible;
      clouds.visible = $('lCloud').checked;
      // 箭頭：向外（高）／向內（低），北半球偏右
      arrows.forEach((a, i) => {
        const ang = i / 8 * Math.PI * 2, r0 = high ? 1.8 : 4.0;
        const from = V(Math.cos(ang) * r0, 0.35, -Math.sin(ang) * r0).add(g.position);
        const out = V(Math.cos(ang), 0, -Math.sin(ang)), tan = V(-Math.sin(ang), 0, -Math.cos(ang)); // tan = 逆時針方向
        const dir = high ? out.multiplyScalar(0.8).addScaledVector(tan, -0.6 * h) : out.multiplyScalar(-0.8).addScaledVector(tan, 0.6 * h);
        a.point(from, from.clone().addScaledVector(dir, 1.5));
        a.visible = a.visible && surf && g.visible;
      });
      const base = g.position;
      if (high) vArrow.point(V(0, 3.8, 0).add(base), V(0, 1.4, 0).add(base)); else vArrow.point(V(0, 1.2, 0).add(base), V(0, 3.6, 0).add(base));
      vArrow.visible = vert && g.visible; vLbl.show = vert && g.visible;
    }
  };
}
const H = center('H'), Lo = center('L');

function frame(dt) {
  const both = S.mode === 'both';
  H.g.visible = S.mode !== 'L'; Lo.g.visible = S.mode !== 'H';
  H.g.position.x = both ? -5.2 : 0; Lo.g.position.x = both ? 5.2 : 0;
  H.update(dt); Lo.update(dt);
}

const INFO = {
  H: '<b>高氣壓</b>：中心氣壓比四周高。高空空氣<b>下沉</b>，到地面後向外吹出（北半球<b>順時針</b>）。下沉的空氣不容易形成雲，所以多半<b>天氣晴朗</b>。',
  L: '<b>低氣壓</b>：中心氣壓比四周低。地面空氣向中心吹入（北半球<b>逆時針</b>），在中心<b>上升</b>、冷卻後凝結成雲，容易<b>下雨</b>。',
  both: '左邊<b>高氣壓</b>空氣下沉、風往外吹，天氣晴；右邊<b>低氣壓</b>空氣上升、風往內吹，容易成雲下雨。等壓線的數字是氣壓（百帕）。'
};
Lab.bindGroup('.mode', k => { S.mode = k; $('info').innerHTML = INFO[k]; L.fly(k === 'both' ? [0, 10, 18] : [0, 7, 11], [0, 1.2, 0]); });
Lab.bindGroup('#hemi button', k => { S.hemi = k === 'N' ? 1 : -1; });
function ui() {}
window.pressureSim = S;
</script>
<script src="lesson.js" defer></script>
</body>
</html>
