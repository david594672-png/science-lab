<!DOCTYPE html>
<html lang="zh-Hant" data-subject="bio">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>細胞分裂與減數分裂</title>
<link rel="stylesheet" href="lab-kit.css">
<style>
  .steps { display: flex; flex-wrap: wrap; gap: 6px; }
  .steps button { flex: 1 1 auto; min-height: 40px; padding: 0 8px; font-size: .8rem; }
  .big-num { font-size: 1.6rem; font-weight: 800; color: var(--accent); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="cv" aria-label="染色體在細胞分裂中移動的 3D 模型"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g7">← 回課程總覽</a>
  <h1>細胞分裂</h1>
  <p class="sub">國一生物 · 生殖（細胞分裂與減數分裂）</p>

  <div class="body">
    <div class="modes" style="--n:2">
      <button class="mode" data-k="mit" aria-pressed="true">細胞分裂<br><small>長大、修補</small></button>
      <button class="mode" data-k="mei" aria-pressed="false">減數分裂<br><small>產生配子</small></button>
    </div>

    <div class="group">
      <div class="steps" id="steps"></div>
      <div class="ctrl" style="margin-top:10px">
        <label for="prog">進度 <output id="progVal"></output></label>
        <input type="range" id="prog" min="0" max="4" step="0.01" value="0">
      </div>
      <div class="row"><button class="btn primary grow" id="play" aria-pressed="false">▶ 自動播放</button></div>
      <div class="result" id="desc" style="margin-top:10px"></div>
    </div>

    <div class="group">
      <dl class="live">
        <dt>細胞數</dt><dd id="cells">—</dd>
        <dt>每個細胞的染色體</dt><dd id="chrom">—</dd>
        <dt>每條染色體</dt><dd id="chromatid">—</dd>
      </dl>
    </div>

    <div class="group">
      <label class="sw"><input type="checkbox" id="showSpindle" checked><span class="track"></span>紡錘絲</label>
      <label class="sw"><input type="checkbox" id="showLabel" checked><span class="track"></span>標示同源染色體</label>
      <p class="note" style="margin-top:6px">藍色來自<b>父親</b>、紅色來自<b>母親</b>；同樣長度的一藍一紅是一對<b>同源染色體</b>。這個細胞 2n = 4。</p>
    </div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script type="module">
import { start3D, THREE } from './lab3d.js';
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const $ = id => document.getElementById(id);

const L = start3D({ background: 0x08140f, camera: [4.2, 2.6, 7.6], target: [0, 0, 0], minDist: 4, maxDist: 20, frame, ui });
const { scene } = L;

// ---------- 染色體：4 條（長、短各一對），每條複製後有 2 條染色分體 ----------
const CHR = [
  { len: 1.0, color: 0x4d8dff, pair: 'A', from: '父' },
  { len: 1.0, color: 0xff5d6c, pair: 'A', from: '母' },
  { len: 0.55, color: 0x4d8dff, pair: 'B', from: '父' },
  { len: 0.55, color: 0xff5d6c, pair: 'B', from: '母' }
];
const R = 0.11;
const chromatids = [];            // [chr][sister]
CHR.forEach((c, i) => {
  chromatids[i] = [0, 1].map(j => {
    const m = new THREE.Mesh(new THREE.CapsuleGeometry(R, c.len, 6, 12), L.mat(c.color, { roughness: 0.4 }));
    scene.add(m); return m;
  });
  c.cen = new THREE.Mesh(new THREE.SphereGeometry(R * 1.25, 12, 8), L.mat(0xf2f2f2));
  scene.add(c.cen);
});
const pairLabels = ['A', 'B'].map(p => L.label('同源染色體 ' + p, () => null));

// 細胞膜（最多 4 個）、細胞核
const cellMat = () => L.mat(0x8fe0b0, { transparent: true, opacity: 0.12, depthWrite: false, side: THREE.DoubleSide });
const cells = [0, 1, 2, 3].map(() => { const m = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 24), cellMat()); scene.add(m); return m; });
const nuclei = [0, 1, 2, 3].map(() => { const m = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 20), L.mat(0xc7a6ff, { transparent: true, opacity: 0.14, depthWrite: false })); scene.add(m); return m; });
// 紡錘絲
const spindle = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xd8f5e4, transparent: true, opacity: 0.45 }));
scene.add(spindle);

// ---------- 關鍵畫面 ----------
// 每個畫面：pos[i][j] 染色分體位置、rot 方向、cells [位置, 半徑]、nuc 細胞核、poles 紡錘體兩極
const rnd = [[-0.6, 0.5, 0.2], [0.5, 0.3, -0.3], [-0.2, -0.55, 0.3], [0.55, -0.4, 0.1]];
function loose(sep) { return CHR.map((c, i) => [V(...rnd[i]).add(V(-sep, 0, 0)), V(...rnd[i]).add(V(sep, 0, 0))]); }
const Z = [-0.95, -0.32, 0.32, 0.95];      // 排在赤道板上時的前後位置
const PZ = { A: -0.5, B: 0.5 };            // 同源染色體配對時的位置
const MIT = [
  { name: '間期', txt: '細胞核裡的染色體還很細長，<b>DNA 正在複製</b>。複製後每條染色體都有兩份。',
    pos: loose(0), cells: [[V(0, 0, 0), 2]], nuc: [[V(0, 0, 0), 1.25]], cnt: [1, 4, 1], thin: true },
  { name: '前期', txt: '染色體變粗變短，可以看到每條由<b>兩條染色分體</b>組成，中間由著絲點相連。核膜消失。',
    pos: loose(0.13), cells: [[V(0, 0, 0), 2]], nuc: [[V(0, 0, 0), 1.25, 0.03]], cnt: [1, 4, 2] },
  { name: '中期', txt: '染色體<b>排列在細胞中央</b>，紡錘絲從兩極連到著絲點。',
    pos: CHR.map((c, i) => [V(-0.13, 0, Z[i]), V(0.13, 0, Z[i])]), cells: [[V(0, 0, 0), 2]], nuc: [], poles: [[V(-1.8, 0, 0), V(1.8, 0, 0)]], cnt: [1, 4, 2] },
  { name: '後期', txt: '每條染色體的<b>兩條染色分體分開</b>，被拉向細胞兩極。',
    pos: CHR.map((c, i) => [V(-1.25, 0, Z[i] * 0.7), V(1.25, 0, Z[i] * 0.7)]), cells: [[V(0, 0, 0), 2.1]], nuc: [], poles: [[V(-1.9, 0, 0), V(1.9, 0, 0)]], cnt: [1, 8, 1], stretch: 1.25 },
  { name: '末期', txt: '細胞質分裂，形成<b>兩個細胞</b>。每個細胞的染色體數目和原來<b>一樣（2n = 4）</b>。',
    pos: CHR.map((c, i) => [V(-1.6, 0, Z[i] * 0.5), V(1.6, 0, Z[i] * 0.5)]), cells: [[V(-1.6, 0, 0), 1.35], [V(1.6, 0, 0), 1.35]], nuc: [[V(-1.6, 0, 0), 0.85], [V(1.6, 0, 0), 0.85]], cnt: [2, 4, 1] }
];
// 減數分裂：第一次分開同源染色體，第二次分開染色分體
const side = [-1, 1, 1, -1];               // 中期 I 每對的排列方向（隨機其中一種）
const MEI = [
  MIT[0],
  { name: '前期 I', txt: '<b>同源染色體配對</b>（一藍一紅靠在一起），每條都已複製成兩條染色分體。',
    pos: CHR.map((c, i) => { const x = (i % 2 ? 0.2 : -0.2); return [V(x - 0.12, 0, PZ[c.pair]), V(x + 0.12, 0, PZ[c.pair])]; }),
    cells: [[V(0, 0, 0), 2]], nuc: [[V(0, 0, 0), 1.25, 0.03]], cnt: [1, 4, 2] },
  { name: '中期 I', txt: '<b>成對的同源染色體</b>排在細胞中央（注意：是一對一對排，不是一條一條排）。',
    pos: CHR.map((c, i) => { const x = side[i] * 0.32; return [V(x - 0.12, 0, PZ[c.pair]), V(x + 0.12, 0, PZ[c.pair])]; }),
    cells: [[V(0, 0, 0), 2]], nuc: [], poles: [[V(-1.8, 0, 0), V(1.8, 0, 0)]], cnt: [1, 4, 2] },
  { name: '後期 I', txt: '<b>同源染色體分開</b>，分別到兩極；每條染色體的兩條染色分體還連在一起。',
    pos: CHR.map((c, i) => { const x = side[i] * 1.3; return [V(x - 0.12, 0, PZ[c.pair] * 0.8), V(x + 0.12, 0, PZ[c.pair] * 0.8)]; }),
    cells: [[V(0, 0, 0), 2.1]], nuc: [], poles: [[V(-1.9, 0, 0), V(1.9, 0, 0)]], cnt: [1, 4, 2], stretch: 1.2 },
  { name: '末期 I', txt: '形成兩個細胞，每個細胞的染色體<b>剩一半（n = 2）</b>，但每條還有兩條染色分體。',
    pos: CHR.map((c, i) => { const x = side[i] * 1.7; return [V(x - 0.12, 0, PZ[c.pair] * 0.7), V(x + 0.12, 0, PZ[c.pair] * 0.7)]; }),
    cells: [[V(-1.7, 0, 0), 1.3], [V(1.7, 0, 0), 1.3]], nuc: [], cnt: [2, 2, 2] },
  { name: '中期 II', txt: '兩個細胞同時進行第二次分裂，染色體排在各自的中央。',
    pos: CHR.map((c, i) => { const x = side[i] * 1.7; return [V(x - 0.12, 0, PZ[c.pair] * 0.6), V(x + 0.12, 0, PZ[c.pair] * 0.6)]; }),
    cells: [[V(-1.7, 0, 0), 1.3], [V(1.7, 0, 0), 1.3]], nuc: [], poles: [[V(-2.8, 0, 0), V(-0.6, 0, 0)], [V(0.6, 0, 0), V(2.8, 0, 0)]], cnt: [2, 2, 2], rotZ: true },
  { name: '後期 II', txt: '<b>染色分體分開</b>，往兩極移動。',
    pos: CHR.map((c, i) => { const x = side[i] * 1.7; return [V(x - 0.75, 0, PZ[c.pair] * 0.6), V(x + 0.75, 0, PZ[c.pair] * 0.6)]; }),
    cells: [[V(-1.7, 0, 0), 1.35], [V(1.7, 0, 0), 1.35]], nuc: [], poles: [[V(-2.9, 0, 0), V(-0.5, 0, 0)], [V(0.5, 0, 0), V(2.9, 0, 0)]], cnt: [2, 4, 1], rotZ: true },
  { name: '末期 II', txt: '最後得到<b>四個配子</b>，每個只有 <b>n = 2</b> 條染色體，而且每對同源染色體只拿到一條。',
    pos: CHR.map((c, i) => { const x = side[i] * 1.7; return [V(x - 0.95, 0, PZ[c.pair] * 0.5), V(x + 0.95, 0, PZ[c.pair] * 0.5)]; }),
    cells: [[V(-2.65, 0, 0), 0.85], [V(-0.75, 0, 0), 0.85], [V(0.75, 0, 0), 0.85], [V(2.65, 0, 0), 0.85]],
    nuc: [[V(-2.65, 0, 0), 0.55], [V(-0.75, 0, 0), 0.55], [V(0.75, 0, 0), 0.55], [V(2.65, 0, 0), 0.55]], cnt: [4, 2, 1], rotZ: true }
];

const S = { mode: 'mit', p: 0, play: false };
const seq = () => (S.mode === 'mit' ? MIT : MEI);

const a = new THREE.Vector3(), b = new THREE.Vector3();
function frame(dt) {
  const K = seq(), max = K.length - 1;
  if (S.play) {
    S.p += dt * 0.35;
    if (S.p >= max) { S.p = max; S.play = false; playBtn(); }
    progEl.value = S.p; Lab.paint(progEl);
  }
  const i0 = Math.min(Math.floor(S.p), max - 1), f = THREE.MathUtils.smoothstep(S.p - i0, 0, 1);
  const k0 = K[i0], k1 = K[i0 + 1] || k0;
  // 染色分體
  CHR.forEach((c, i) => {
    [0, 1].forEach(j => {
      const m = chromatids[i][j];
      a.copy(k0.pos[i][j]).lerp(k1.pos[i][j], f);
      m.position.copy(a);
      const thin = (k0.thin ? 1 - f : 0) + (k1.thin ? f : 0);
      m.scale.set(1 - thin * 0.6, 1 + thin * 0.8, 1 - thin * 0.6);
      // 複製前只顯示一條
      m.visible = !(j === 1 && thin > 0.5);
    });
    // 著絲點：兩條染色分體連在一起時才顯示
    a.copy(chromatids[i][0].position); b.copy(chromatids[i][1].position);
    c.cen.position.copy(a).add(b).multiplyScalar(0.5);
    c.cen.visible = a.distanceTo(b) < 0.4 && chromatids[i][1].visible;
  });
  // 細胞與細胞核
  const n0 = k0.cells.length, n1 = k1.cells.length, n = Math.max(n0, n1);
  cells.forEach((m, ci) => {
    m.visible = ci < n;
    if (!m.visible) return;
    const c0 = k0.cells[Math.floor(ci * n0 / n)], c1 = k1.cells[Math.floor(ci * n1 / n)];
    m.position.copy(c0[0]).lerp(c1[0], f);
    const r = THREE.MathUtils.lerp(c0[1], c1[1], f);
    const st = THREE.MathUtils.lerp(k0.stretch || 1, k1.stretch || 1, f);
    m.scale.set(r * st, r, r);
  });
  nuclei.forEach((m, ni) => {
    const h0 = k0.nuc[ni], h1 = k1.nuc[ni];
    const op = (h0 ? (1 - f) * (h0[2] ?? 0.14) : 0) + (h1 ? f * (h1[2] ?? 0.14) : 0);
    m.visible = op > 0.01;
    if (!m.visible) return;
    const src = h0 || h1, dst = h1 || h0;
    m.position.copy(src[0]).lerp(dst[0], f);
    m.scale.setScalar(THREE.MathUtils.lerp(src[1], dst[1], f));
    m.material.opacity = op;
  });
  // 紡錘絲：兩極連到每條染色體的著絲點／染色分體
  const poles = (f < 0.5 ? k0.poles : k1.poles) || null;
  spindle.visible = !!poles && $('showSpindle').checked;
  if (spindle.visible) {
    const pts = [];
    poles.forEach(([p0, p1]) => {
      CHR.forEach((c, i) => {
        [0, 1].forEach(j => {
          const ch = chromatids[i][j].position;
          const near = ch.distanceTo(p0) < ch.distanceTo(p1) ? p0 : p1;
          if (ch.distanceTo(near) < 2.4) pts.push(near, ch);
        });
      });
    });
    spindle.geometry.setFromPoints(pts);
  }
  // 同源染色體標籤
  const showL = $('showLabel').checked;
  ['A', 'B'].forEach((p, k) => {
    const idx = CHR.map((c, i) => (c.pair === p ? i : -1)).filter(i => i >= 0);
    const ctr = chromatids[idx[0]][0].position.clone().add(chromatids[idx[1]][0].position).multiplyScalar(0.5);
    const together = chromatids[idx[0]][0].position.distanceTo(chromatids[idx[1]][0].position) < 1.2;
    pairLabels[k].where = ctr.add(V(0, CHR[idx[0]].len * 0.5 + 0.55, 0));
    pairLabels[k].show = showL && together;
  });
}

// ---------- 面板 ----------
const progEl = $('prog');
function buildSteps() {
  const K = seq(), box = $('steps');
  box.innerHTML = '';
  K.forEach((k, i) => {
    const b = document.createElement('button');
    b.className = 'btn'; b.textContent = k.name;
    b.addEventListener('click', () => { S.p = i; S.play = false; playBtn(); progEl.value = i; Lab.paint(progEl); });
    box.appendChild(b);
  });
  progEl.max = K.length - 1;
}
Lab.bindSlider('prog', x => { S.p = x; }, () => '');
Lab.bindGroup('.mode', k => { S.mode = k; S.p = 0; S.play = false; buildSteps(); progEl.value = 0; Lab.paint(progEl); playBtn(); });
function playBtn() { const b = $('play'); b.setAttribute('aria-pressed', String(S.play)); b.textContent = S.play ? '❚❚ 暫停' : '▶ 自動播放'; }
$('play').addEventListener('click', () => { if (S.p >= seq().length - 1) S.p = 0; S.play = !S.play; playBtn(); });

function ui() {
  const K = seq(), i = Math.min(Math.round(S.p), K.length - 1), k = K[i];
  $('desc').innerHTML = `<b>${k.name}</b>：${k.txt}`;
  $('progVal').textContent = k.name;
  $('cells').textContent = k.cnt[0] + ' 個';
  $('chrom').textContent = k.cnt[1] + ' 條';
  $('chromatid').textContent = k.cnt[2] === 2 ? '2 條染色分體' : '1 條';
  [...$('steps').children].forEach((b, j) => b.setAttribute('aria-pressed', String(j === i)));
}
window.cellSim = S;
</script>
<script src="lesson.js" defer></script>
</body>
</html>
