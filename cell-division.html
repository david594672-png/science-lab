<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

window.__cellReady = true;

const $ = id => document.getElementById(id);
const V3 = (x, y, z = 0) => new THREE.Vector3(x, y, z);
const S = THREE.MathUtils.smoothstep;
const clamp = THREE.MathUtils.clamp;
const ease = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const COLORS = { blue: 0x3b82f6, red: 0xef4444 };

/* =========================================================
   場景：明亮醫學實驗室
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
$('scene').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = (() => {
  const c = document.createElement('canvas');
  c.width = 2; c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#e3eedb'); grad.addColorStop(1, '#f6faf1');
  g.fillStyle = grad; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
scene.add(new THREE.HemisphereLight(0xffffff, 0xc9d9ee, 1.4));
const key = new THREE.DirectionalLight(0xffffff, 1.3);
key.position.set(5, 9, 10);
scene.add(key);
const fill = new THREE.DirectionalLight(0xdbeafe, 0.5);
fill.position.set(-8, -3, 6);
scene.add(fill);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 5;
controls.maxDistance = 40;

/* ----- 共用材質 ----- */
const jelly = (color = 0xcfe8ff, opts = {}) => new THREE.MeshPhysicalMaterial({
  color, transmission: 0.88, thickness: 0.8, roughness: 0.12, ior: 1.25, clearcoat: 1, clearcoatRoughness: 0.15,
  transparent: true, opacity: 0.85, depthWrite: false, side: THREE.DoubleSide, ...opts
});
const plastic = color => new THREE.MeshPhysicalMaterial({ color, roughness: 0.32, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.2 });
const centroMat = plastic(0xf1f5f9);

/* ----- HTML 標籤 ----- */
const labels = [];
function addLabel(mode, html, cls = '') {
  const el = document.createElement('div');
  el.className = 'tag ' + cls;
  el.innerHTML = html;
  document.body.appendChild(el);
  const L = { el, mode, pos: V3(0, 0, 0), obj: null, visible: true };
  labels.push(L);
  return L;
}
const tmpV = V3(0, 0, 0);
function placeLabels() {
  for (const L of labels) {
    if (L.mode !== mode || !L.visible) { L.el.style.display = 'none'; continue; }
    tmpV.copy(L.pos);
    if (L.obj) L.obj.localToWorld(tmpV);
    tmpV.project(camera);
    if (tmpV.z > 1) { L.el.style.display = 'none'; continue; }
    L.el.style.display = '';
    L.el.style.left = ((tmpV.x + 1) / 2 * window.innerWidth) + 'px';
    L.el.style.top = ((1 - tmpV.y) / 2 * window.innerHeight) + 'px';
  }
}

/* ----- 染色分體（膠囊管狀）與 X 形染色體 ----- */
/** 一條姐妹染色分體的路徑：中間（著絲點）向內收，兩端向外張 → 兩條合起來成 X 形 */
function chromatidPath(L, side, k = 14) {
  const pts = [];
  for (let i = 0; i < k; i++) {
    const y = -L / 2 + L * i / (k - 1);
    const u = Math.abs(y) / (L / 2);
    pts.push(V3(side * (0.07 + 0.2 * Math.pow(u, 1.6)), y, 0));
  }
  return pts;
}
function tubeFrom(pts, r) {
  const curve = new THREE.CatmullRomCurve3(pts);
  return new THREE.TubeGeometry(curve, Math.max(24, pts.length * 4), r, 10, false);
}
/** 建立一條姐妹染色分體（管 + 兩端圓帽），中心在原點 */
function makeChromatid(L, side, color, r = 0.13) {
  const g = new THREE.Group();
  const mat = plastic(color);
  const pts = chromatidPath(L, side);
  g.add(new THREE.Mesh(tubeFrom(pts, r), mat));
  for (const p of [pts[0], pts[pts.length - 1]]) {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), mat);
    cap.position.copy(p);
    g.add(cap);
  }
  return g;
}
/** X 形染色體：兩條姐妹染色分體 + 著絲點 */
function makeX(L, color) {
  const g = new THREE.Group();
  const left = makeChromatid(L, -1, color);
  const right = makeChromatid(L, 1, color);
  const cen = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 12), centroMat);
  g.add(left, right, cen);
  g.userData = { left, right, cen };
  return g;
}

/* =========================================================
   模組一：染色質 → 染色體
   ========================================================= */
const M1 = (() => {
  const group = new THREE.Group();
  const nucleusMat = jelly(0xbfdcff, { opacity: 0.55 });
  const nucleus = new THREE.Mesh(new THREE.SphereGeometry(3.6, 64, 48), nucleusMat);
  const cellMat = jelly(0xe0f2fe, { opacity: 0.35 });
  const cell = new THREE.Mesh(new THREE.SphereGeometry(5.4, 64, 48), cellMat);
  group.add(cell, nucleus);

  // 兩長兩短：每一對同源染色體一條來自父（藍）、一條來自母（紅）
  const CHROMS = [
    { L: 2.0, color: COLORS.blue, center: V3(-1.5, 0.9, 0.2), rot: 0.35, name: '長（父）' },
    { L: 2.0, color: COLORS.red,  center: V3(1.3, 1.1, -0.2), rot: -0.3, name: '長（母）' },
    { L: 1.2, color: COLORS.blue, center: V3(-1.1, -1.4, 0.3), rot: -0.4, name: '短（父）' },
    { L: 1.2, color: COLORS.red,  center: V3(1.5, -1.2, -0.1), rot: 0.25, name: '短（母）' }
  ];
  const K = 16;
  // 隨機但固定的「麵條」路徑（每次載入相同）
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const COPY_OFFSET = V3(0.11, 0.06, 0.08);

  const strands = [];   // 8 條（4 條 × 原本 + 複製）
  CHROMS.forEach(ch => {
    // 麵條：從中心附近出發的隨機漫步，總長約為濃縮後的 3.5 倍
    const noodle = [];
    let p = ch.center.clone().add(V3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5));
    let dir = V3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).normalize();
    const step = ch.L * 3.5 / (K - 1);
    for (let i = 0; i < K; i++) {
      noodle.push(p.clone());
      dir.add(V3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).multiplyScalar(1.1)).normalize();
      p = p.clone().addScaledVector(dir, step);
      if (p.length() > 3.0) p.multiplyScalar(3.0 / p.length());
    }
    const rotM = new THREE.Matrix4().makeRotationZ(ch.rot);
    [-1, 1].forEach(side => {
      const cond = chromatidPath(ch.L, side, K).map(q => q.applyMatrix4(rotM).add(ch.center));
      const noo = side === -1 ? noodle : noodle.map(q => q.clone().add(COPY_OFFSET));
      const mat = plastic(ch.color);
      const mesh = new THREE.Mesh(new THREE.BufferGeometry(), mat);
      const caps = [0, 1].map(() => { const c = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10), mat); group.add(c); return c; });
      group.add(mesh);
      strands.push({ ch, side, noo, cond, mesh, mat, caps, copy: side === 1 });
    });
    const cen = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), centroMat);
    cen.position.copy(ch.center);
    group.add(cen);
    ch.cen = cen;
  });

  const lNuc = addLabel('m1', '細胞核');
  lNuc.pos.set(-2.6, 2.9, 0);
  const lMsg = addLabel('m1', '', 'big');
  lMsg.pos.set(0, -4.4, 0);

  function stageOf(v) {
    if (v < 25) return { name: 'G1 期', s: 0, c: 0 };
    if (v < 55) return { name: 'S 期（DNA 複製）', s: (v - 25) / 30, c: 0 };
    if (v < 70) return { name: 'G2 期', s: 1, c: 0 };
    return { name: '前期（染色體濃縮）', s: 1, c: (v - 70) / 30 };
  }

  let wobbleT = 0;
  function rebuild(t = 0) {
    const v = Number($('cycle').value);
    const st = stageOf(v);
    const c = ease(st.c);
    strands.forEach((s, idx) => {
      // 複製的那一條：在 S 期沿著長度「長出來」
      const grow = s.copy ? st.s : 1;
      const n = Math.max(2, Math.round(K * grow));
      const visible = !s.copy || st.s > 0.02;
      s.mesh.visible = visible;
      s.caps.forEach(cp => { cp.visible = visible && c > 0.05; });
      if (!visible) return;
      const coil = 0.22 * Math.sin(Math.PI * c);   // 濃縮途中的螺旋摺疊
      const pts = [];
      for (let i = 0; i < n; i++) {
        const a = s.noo[i], b = s.cond[i];
        const p = a.clone().lerp(b, c);
        // 未濃縮時輕微漂動；濃縮過程加上螺旋
        const w = (1 - c) * 0.05;
        p.x += Math.sin(t * 1.3 + i * 0.7 + idx) * w + Math.cos(i * 1.9 + idx) * coil;
        p.y += Math.cos(t * 1.1 + i * 0.5 + idx) * w + Math.sin(i * 1.9 + idx) * coil;
        p.z += Math.sin(i * 1.3 + idx) * coil * 0.6;
        pts.push(p);
      }
      const r = 0.045 + 0.085 * c;
      s.mesh.geometry.dispose();
      s.mesh.geometry = tubeFrom(pts, r);
      s.caps[0].position.copy(pts[0]); s.caps[1].position.copy(pts[pts.length - 1]);
      s.caps.forEach(cp => cp.scale.setScalar(r));
    });
    CHROMS.forEach(ch => { ch.cen.visible = c > 0.65; ch.cen.scale.setScalar(S(c, 0.65, 1)); });
    // 前期後段：核膜逐漸消失
    nucleusMat.opacity = 0.55 * (1 - 0.75 * c);
    $('m1Phase').textContent = st.name;
    lMsg.el.innerHTML = c > 0.95
      ? '4 條 X 形染色體<small>每條由 2 條<b>姐妹染色分體</b>組成（二分體）</small>'
      : st.s > 0 && st.s < 1 ? 'DNA 複製中…<small>每條染色質旁長出一模一樣的副本</small>'
      : v < 25 ? '細長的染色質（像麵條）<small>兩長兩短：藍＝父系、紅＝母系</small>'
      : st.c > 0 ? '染色質螺旋、摺疊、濃縮中…<small>核膜逐漸消失</small>'
      : '複製完成，準備進入分裂<small>每條染色質都有一條相同的副本</small>';

    // 狀態監測儀
    const a = st.s >= 1 ? '4a' : st.s > 0 ? `${(2 + 2 * st.s).toFixed(1)}a` : '2a';
    monitor(st.name, [
      { k: '套數 n · DNA 含量 a', n: '2n', a, note: st.s > 0 && st.s < 1 ? 'DNA 正在複製：2a → 4a（套數不變）' : st.s >= 1 ? 'DNA 已加倍；染色體數仍是 4 條（2n）' : '每條染色質只有 1 個 DNA 分子' },
      { k: '染色體數 · 每條的分體數', n: '4', ln: '條', a: st.s >= 1 ? '2' : '1', la: '分體／條', note: '2n = 4：兩長兩短（同源成對）' }
    ]);
  }
  $('cycle').addEventListener('input', e => { paint(e.target); rebuild(wobbleT); });

  let playing = false;
  $('m1Play').addEventListener('click', () => {
    playing = !playing;
    if (playing && Number($('cycle').value) >= 100) $('cycle').value = 0;
    $('m1Play').textContent = playing ? '⏸ 暫停' : '▶ 自動播放';
  });
  function tick(t, dt) {
    wobbleT = t;
    if (playing) {
      const v = Math.min(100, Number($('cycle').value) + dt * 9);
      $('cycle').value = v; paint($('cycle'));
      if (v >= 100) { playing = false; $('m1Play').textContent = '▶ 自動播放'; }
    }
    rebuild(t);
    group.rotation.y = Math.sin(t * 0.2) * 0.15;
  }
  return { group, tick, enter: () => rebuild(wobbleT), camera: { pos: [0, 1, 14], target: [0, 0, 0] } };
})();

/* =========================================================
   模組二：中期排列對決（有絲分裂 vs 減數分裂 I）
   ========================================================= */
const M2 = (() => {
  const group = new THREE.Group();
  const POLE = 3.3;

  function makeCell(cx) {
    const cell = new THREE.Group();
    cell.position.x = cx;
    const mem = new THREE.Mesh(new THREE.SphereGeometry(2.9, 64, 48), jelly(0xd8ecff, { opacity: 0.45 }));
    mem.scale.set(1.35, 1, 1);
    const daughters = [-1, 1].map(s => {
      const d = new THREE.Mesh(new THREE.SphereGeometry(2.05, 48, 36), jelly(0xd8ecff, { opacity: 0 }));
      d.position.x = s * 2.45;
      d.visible = false;
      cell.add(d);
      return d;
    });
    cell.add(mem);
    // 中心粒（兩極）與星狀放射線
    [-1, 1].forEach(s => {
      const c = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.38, 12), plastic(0xfacc15));
      c.rotation.z = Math.PI / 2;
      c.position.x = s * POLE;
      cell.add(c);
      const rays = [];
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2;
        rays.push(V3(s * POLE, 0, 0), V3(s * POLE + Math.cos(a) * 0.6, Math.sin(a) * 0.6, Math.sin(a * 2) * 0.2));
      }
      cell.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(rays), new THREE.LineBasicMaterial({ color: 0xcaa61a, transparent: true, opacity: 0.6 })));
    });
    // 赤道板（虛線）
    const plate = new THREE.Line(new THREE.BufferGeometry().setFromPoints([V3(0, -2.6, 0), V3(0, 2.6, 0)]),
      new THREE.LineDashedMaterial({ color: 0x94a3b8, dashSize: 0.15, gapSize: 0.1 }));
    plate.computeLineDistances();
    cell.add(plate);
    group.add(cell);
    return { cell, mem, daughters, plate };
  }
  const fiberMat = new THREE.LineBasicMaterial({ color: 0x0f766e, transparent: true, opacity: 0.75 });
  function makeFiber(cell) {
    const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([V3(0, 0, 0), V3(1, 0, 0)]), fiberMat);
    cell.add(l);
    return l;
  }
  const setFiber = (l, a, b) => { l.geometry.dispose(); l.geometry = new THREE.BufferGeometry().setFromPoints([a, b]); };

  /* ----- 左：有絲分裂（4 條排成一直列） ----- */
  const mit = makeCell(-5.2);
  const MIT = [
    { L: 1.25, color: COLORS.blue, y: 1.65 }, { L: 1.25, color: COLORS.red, y: 0.55 },
    { L: 0.8, color: COLORS.blue, y: -0.55 }, { L: 0.8, color: COLORS.red, y: -1.65 }
  ].map(c => {
    // 一條 X 形染色體：左右兩條姐妹染色分體分別面向兩極，著絲點在赤道板上
    const holder = new THREE.Group();
    holder.position.y = c.y;
    mit.cell.add(holder);
    const L = makeChromatid(c.L, -1, c.color), R = makeChromatid(c.L, 1, c.color);
    const cen = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 12), centroMat);
    holder.add(L, R, cen);
    return { holder, L, R, cen, y: c.y, fibers: [makeFiber(mit.cell), makeFiber(mit.cell)] };
  });

  /* ----- 右：減數分裂 I（同源染色體兩兩並排成四分體） ----- */
  const mei = makeCell(5.2);
  // 兩對同源染色體的排列方向互相獨立（獨立分配）：長的藍在左、短的紅在左
  const PAIRS = [{ L: 1.25, y: 0.95, left: COLORS.blue, right: COLORS.red }, { L: 0.8, y: -0.95, left: COLORS.red, right: COLORS.blue }];
  const MEI = [];
  PAIRS.forEach(p => {
    [[-1, p.left], [1, p.right]].forEach(([side, color]) => {
      const x = makeX(p.L, color);
      x.position.set(side * 0.42, p.y, 0);
      mei.cell.add(x);
      MEI.push({ x, side, y: p.y, fiber: makeFiber(mei.cell) });
    });
  });

  const lMit = addLabel('m2', '有絲分裂 · 中期<small>4 條染色體排成「一直列」</small>', 'big');
  lMit.obj = mit.cell; lMit.pos.set(0, 3.55, 0);
  const lMei = addLabel('m2', '減數分裂 I · 中期<small>同源染色體「兩兩並排」（四分體）</small>', 'big');
  lMei.obj = mei.cell; lMei.pos.set(0, 3.55, 0);
  const lMitR = addLabel('m2', '', 'warn');
  lMitR.obj = mit.cell; lMitR.pos.set(0, -3.5, 0);
  const lMeiR = addLabel('m2', '', 'warn');
  lMeiR.obj = mei.cell; lMeiR.pos.set(0, -3.5, 0);

  let p = 0, target = 0;
  $('pullBtn').addEventListener('click', () => { target = 1; });
  $('resetM2').addEventListener('click', () => { target = 0; });

  function update() {
    const e = ease(p);
    // 有絲分裂：同一條 X 被拆成兩半（姐妹染色分體分離）
    MIT.forEach(m => {
      const dx = 0.16 + 2.25 * e;
      m.L.position.x = -dx + 0.07;
      m.R.position.x = dx - 0.07;
      m.cen.visible = e < 0.02;
      // 分離後分體呈 V 形被拖向兩極
      m.L.rotation.z = 0.5 * e; m.R.rotation.z = -0.5 * e;
      setFiber(m.fibers[0], V3(-POLE, 0, 0), V3(-dx, m.y, 0));
      setFiber(m.fibers[1], V3(POLE, 0, 0), V3(dx, m.y, 0));
    });
    // 減數分裂 I：整條 X 被拉向一極（同源染色體分離）
    MEI.forEach(m => {
      const x = m.side * (0.42 + 2.0 * e);
      m.x.position.x = x;
      setFiber(m.fiber, V3(m.side * POLE, 0, 0), V3(x + m.side * 0.28, m.y, 0));
    });
    // 細胞質分裂：一個細胞 → 兩個子細胞
    const split = S(p, 0.7, 1);
    [mit, mei].forEach(c => {
      c.mem.material.opacity = 0.45 * (1 - split);
      c.mem.visible = split < 0.99;
      c.daughters.forEach(d => { d.visible = split > 0.01; d.material.opacity = 0.5 * split; });
      c.plate.visible = p < 0.05;
    });
    const done = p > 0.95;
    lMitR.visible = lMeiR.visible = p > 0.05;
    lMitR.el.innerHTML = done ? '姐妹染色分體分離<small>每個子細胞：2n（4 條）· 2a</small>' : '姐妹染色分體分開中…';
    lMeiR.el.innerHTML = done ? '同源染色體分離<small>每個子細胞：n（2 條，每條仍是 X 形）· 2a</small>' : '同源染色體分開中…';

    monitor(done ? '分裂後（各一個子細胞）' : p > 0.02 ? '後期：拉扯分離中…' : '中期：準備分離', [
      { k: '有絲分裂（左）', n: done ? '2n' : '2n', a: done ? '2a' : '4a', note: done ? '套數不變，DNA 減半' : '紡錘絲黏在同一條 X 的左右兩側' },
      { k: '減數分裂 I（右）', n: done ? 'n' : '2n', a: done ? '2a' : '4a', note: done ? '套數減半！同源染色體分到不同細胞' : '紡錘絲左黏左、右黏右' }
    ]);
  }
  function tick(t, dt) {
    p += (target - p) * Math.min(1, dt * 1.6);
    if (Math.abs(target - p) < 0.002) p = target;
    update();
  }
  return { group, tick, enter: update, camera: { pos: [-1.6, 1, 20], target: [-1.6, 0, 0] } };
})();

/* =========================================================
   模組三：精卵形成的細胞質分配
   ========================================================= */
const M3 = (() => {
  const group = new THREE.Group();
  const TOP = 2.7, BOT = -2.9;
  const spermMat = () => jelly(0xbfe3ff, { opacity: 0.9 });
  const eggMat = () => jelly(0xffd6e0, { opacity: 0.9 });
  const nucMat = c => plastic(c);

  function makeCell(mat, nucColor) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 36), mat);
    const nuc = new THREE.Mesh(new THREE.SphereGeometry(0.32, 24, 16), nucMat(nucColor));
    g.add(nuc, body);
    g.userData = { body, nuc };
    group.add(g);
    return g;
  }

  /* ----- 精子：對稱分裂 2 → 4，最後變成蝌蚪狀 ----- */
  const sperm = [0, 1, 2, 3].map(() => makeCell(spermMat(), 0x6366f1));
  const tails = sperm.map(c => {
    const segs = [];
    for (let i = 0; i < 16; i++) {
      const s = new THREE.Mesh(new THREE.SphereGeometry(0.07 - i * 0.003, 10, 8), plastic(0x93c5fd));
      c.add(s);
      segs.push(s);
    }
    return segs;
  });

  /* ----- 卵：極不均等分配 → 1 卵 + 3 極體 ----- */
  const egg = makeCell(eggMat(), 0xdb2777);
  const pb1a = makeCell(eggMat(), 0xdb2777);
  const pb1b = makeCell(eggMat(), 0xdb2777);
  const pb2 = makeCell(eggMat(), 0xdb2777);
  const polar = [pb1a, pb1b, pb2];

  const lSperm = addLabel('m3', '精子形成', 'big'); lSperm.pos.set(-5.6, TOP + 1.9, 0);
  const lEgg = addLabel('m3', '卵子形成', 'big'); lEgg.pos.set(-5.6, BOT + 1.9, 0);
  const lSpermR = addLabel('m3', '', 'warn'); lSpermR.pos.set(0, TOP - 1.75, 0);
  const lEggR = addLabel('m3', '', 'warn'); lEggR.pos.set(0, BOT - 1.8, 0);
  const lPolar = addLabel('m3', '極體', ''); lPolar.pos.set(-2.6, BOT + 1.35, 0);
  const lEggName = addLabel('m3', '卵', ''); lEggName.pos.set(0.6, BOT + 1.75, 0);

  const place = (c, x, y, r) => { c.position.set(x, y, 0); c.scale.setScalar(Math.max(0.001, r)); };

  function update(t) {
    const p = ease(clamp(t, 0, 1));          // 第一次分裂
    const q = ease(clamp(t - 1, 0, 1));      // 第二次分裂
    const morph = S(t, 1.55, 2);             // 精細胞 → 精子
    const time = clock.elapsedTime;

    // 精子：大小完全相同（體積各分一半 → 半徑 × 0.794）
    const r1 = 1.3 - (1.3 - 1.03) * p;
    const r2 = r1 - (1.03 - 0.82) * q;
    sperm.forEach((c, i) => {
      const s1 = i < 2 ? -1 : 1, s2 = i % 2 ? 1 : -1;
      const x = s1 * 2.0 * p + s2 * 1.0 * q;
      place(c, x, TOP, r2 * (1 - 0.55 * morph));
      // 精子頭：拉長成橢圓
      c.userData.body.scale.set(1, 1 + 0.35 * morph, 1);
      c.userData.nuc.scale.setScalar(1 + 0.9 * morph);
      // 尾巴：擺動的長鞭毛
      // 尾巴長度以「世界單位」計算（約 1.3），再換算回細胞的區域座標
      const inv = 1 / Math.max(0.05, c.scale.x);
      tails[i].forEach((seg, k) => {
        const along = (k + 1) * 0.082 * morph;
        seg.visible = morph > 0.05;
        seg.position.set(Math.sin(time * 9 - k * 0.6) * 0.12 * (k / 16) * inv, -(1 + 0.35 * morph) - along * inv, 0);
        seg.scale.setScalar(inv * 0.9);
      });
    });

    // 卵：細胞質幾乎全部留給同一個細胞
    place(egg, 0.35 * p + 0.15 * q, BOT, 1.3 - 0.04 * p - 0.04 * q);
    const pb1x = -1.85 * p, pb1y = BOT + 0.85 * p;
    // 第一極體在第二次分裂時也一分為二
    place(pb1a, pb1x - 0.32 * q, pb1y + 0.05 * q, 0.34 * p - 0.08 * q);
    place(pb1b, pb1x + 0.32 * q, pb1y - 0.05 * q, (0.34 - 0.08) * q);
    pb1b.visible = q > 0.01;
    place(pb2, 0.5 - 1.8 * q, BOT - 0.9 * q, 0.28 * q);
    pb2.visible = q > 0.01;
    pb1a.visible = p > 0.01;
    // 極體退化：最後變得半透明
    const fade = S(t, 1.6, 2);
    polar.forEach(c => { c.userData.body.material.opacity = 0.9 - 0.6 * fade; c.userData.nuc.material.transparent = true; c.userData.nuc.material.opacity = 1 - 0.65 * fade; });
    egg.userData.body.material.emissive = new THREE.Color(0xff9fb5);
    egg.userData.body.material.emissiveIntensity = 0.12 * fade;

    lPolar.visible = p > 0.6;
    lPolar.pos.set(pb1x, pb1y + 0.75, 0);
    lEggName.visible = t > 1.9;
    const phase = t < 0.02 ? '未分裂' : t < 1 ? '第一次分裂（減數分裂 I）' : t < 1.98 ? '第二次分裂（減數分裂 II）' : '完成';
    $('m3Phase').textContent = phase;
    lSpermR.el.innerHTML = t < 0.02 ? '初級精母細胞' : t < 1.02 ? '平均分配 → 2 個次級精母細胞' : t < 1.98 ? '再平均分配 → 4 個精細胞' : '<b>4 個精子</b>，大小完全相同<small>細胞質平均分配</small>';
    lEggR.el.innerHTML = t < 0.02 ? '初級卵母細胞' : t < 1.02 ? '不均等分配 → 1 個次級卵母細胞 + 1 個極體' : t < 1.98 ? '細胞質再次集中給同一個細胞' : '<b>1 個大卵 + 3 個極體</b>（極體退化）<small>卵保留幾乎所有細胞質與養分</small>';

    const stage = t < 1 ? 0 : t < 1.98 ? 1 : 2;
    const NA = [['2n', '4a', '複製後的原始細胞'], ['n', '2a', '減數分裂 I 後：套數減半'], ['n', 'a', '減數分裂 II 後：DNA 再減半']][stage];
    monitor(phase, [
      { k: '精子這一側（每個細胞）', n: NA[0], a: NA[1], note: stage === 2 ? '4 個精子，大小相同' : NA[2] },
      { k: '卵這一側（每個細胞）', n: NA[0], a: NA[1], note: stage === 2 ? '1 個卵（大）+ 3 個極體（小）' : NA[2] }
    ]);
  }

  let playing = false;
  $('gamete').addEventListener('input', e => { paint(e.target); update(Number(e.target.value)); });
  $('m3Play').addEventListener('click', () => {
    playing = !playing;
    if (playing && Number($('gamete').value) >= 2) $('gamete').value = 0;
    $('m3Play').textContent = playing ? '⏸ 暫停' : '▶ 播放分裂過程';
  });
  function tick(t, dt) {
    if (playing) {
      const v = Math.min(2, Number($('gamete').value) + dt * 0.3);
      $('gamete').value = v; paint($('gamete'));
      if (v >= 2) { playing = false; $('m3Play').textContent = '▶ 播放分裂過程'; }
    }
    update(Number($('gamete').value));
  }
  return { group, tick, enter: () => update(Number($('gamete').value)), camera: { pos: [0, 0.5, 17], target: [0, 0, 0] } };
})();

/* =========================================================
   狀態監測儀
   ========================================================= */
let lastSig = '';
function monitor(stage, rows) {
  const sig = stage + JSON.stringify(rows);
  if (sig === lastSig) return;
  const prev = lastSig;
  lastSig = sig;
  $('monStage').textContent = stage;
  const old = [...document.querySelectorAll('.ro')].map(el => el.dataset.v);
  $('monBody').innerHTML = rows.map(r =>
    `<div class="ro" data-v="${r.n}|${r.a}"><div class="k">${r.k}</div>
      <div class="vals"><span class="v n">${r.n}<small>${r.ln ?? '套數'}</small></span><span class="v a">${r.a}<small>${r.la ?? 'DNA'}</small></span></div>
      <div class="note">${r.note}</div></div>`).join('');
  // 數值改變時閃一下，提醒學生注意
  if (prev) [...document.querySelectorAll('.ro')].forEach((el, i) => { if (old[i] && old[i] !== el.dataset.v) el.classList.add('flash'); });
}

/* =========================================================
   模式切換與共用控制
   ========================================================= */
function paint(el) { el.style.setProperty('--fill', ((el.value - el.min) / (el.max - el.min) * 100) + '%'); }
document.querySelectorAll('input[type=range]').forEach(paint);

const MODES = { m1: M1, m2: M2, m3: M3 };
Object.values(MODES).forEach(m => scene.add(m.group));
let mode = 'm1';
function resetView() {
  const c = MODES[mode].camera;
  camera.position.set(...c.pos);
  controls.target.set(...c.target);
  controls.update();
  window.MobileView?.frame(camera, controls);
}
function setMode(m) {
  mode = m;
  Object.entries(MODES).forEach(([k, v]) => { v.group.visible = k === m; });
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  document.querySelectorAll('.section').forEach(s => { s.hidden = s.dataset.mode !== m; });
  lastSig = '';
  MODES[m].enter();
  resetView();
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
$('viewBtn').addEventListener('click', resetView);
document.querySelectorAll('.collapse').forEach(b => b.addEventListener('click', () => {
  const p = $(b.dataset.target);
  const c = p.classList.toggle('collapsed');
  b.textContent = c ? '展開' : '收合';
}));

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = w < h ? 70 : 42;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

const clock = new THREE.Clock();
function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  MODES[mode].tick(clock.elapsedTime, dt);
  controls.update();
  placeLabels();
  window.MobileView?.offset(camera);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.cellSim = { setMode };   // 除錯 / 驗證用

resize();
setMode('m1');
animate();
</script>

setTimeout(() => {

    document.getElementById('scene').innerHTML = '<div class="fallback">無法載入 Three.js。<br>請確認電腦已連上網路後重新整理。</div>';
  }
}, 6000);
</script>
