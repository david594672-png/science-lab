<!DOCTYPE html>
<html lang="zh-Hant" data-subject="phy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>液體壓力、浮力與大氣壓力</title>
<link rel="stylesheet" href="lab-kit.css">
</head>
<body>
<canvas id="cv" aria-label="液體壓力、浮力與大氣壓力的模擬"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g8">← 回課程總覽</a>
  <h1>壓力與浮力</h1>
  <p class="sub">國二理化 · 力與壓力</p>

  <div class="body">
    <div class="modes" style="--n:3">
      <button class="mode" data-k="liq" aria-pressed="true">液體壓力</button>
      <button class="mode" data-k="buoy" aria-pressed="false">浮力</button>
      <button class="mode" data-k="atm" aria-pressed="false">大氣壓力</button>
    </div>

    <div data-mode="liq">
      <div class="group">
        <div class="seg" style="--n:3" id="liquid">
          <button data-k="0.8" aria-pressed="false">酒精</button>
          <button data-k="1" aria-pressed="true">水</button>
          <button data-k="1.2" aria-pressed="false">濃鹽水</button>
        </div>
        <div class="ctrl" style="margin-top:8px"><label for="depth">壓力計的深度 <output id="depthVal"></output></label><input type="range" id="depth" min="0" max="40" step="1" value="20"></div>
        <dl class="live"><dt>液體壓力 P = 深度 × 密度</dt><dd id="lp">—</dd></dl>
      </div>
    </div>

    <div data-mode="buoy" hidden>
      <div class="group">
        <div class="seg" style="--n:3" id="block">
          <button data-k="al" aria-pressed="true">鋁塊</button>
          <button data-k="wood" aria-pressed="false">木塊</button>
          <button data-k="ice" aria-pressed="false">冰塊</button>
        </div>
        <div class="ctrl" style="margin-top:8px"><label for="lower">往下放 <output id="lowerVal"></output></label><input type="range" id="lower" min="0" max="1" step="0.01" value="0"></div>
        <dl class="live">
          <dt>物體重</dt><dd id="bw">—</dd>
          <dt>彈簧秤讀數</dt><dd id="bs">—</dd>
          <dt>浮力</dt><dd id="bf">—</dd>
          <dt>溢出的水重</dt><dd id="bo">—</dd>
        </dl>
      </div>
    </div>

    <div data-mode="atm" hidden>
      <div class="group">
        <div class="ctrl"><label for="tilt">玻璃管傾斜 <output id="tiltVal"></output></label><input type="range" id="tilt" min="0" max="45" step="1" value="0"></div>
        <div class="ctrl"><label for="alt">海拔高度 <output id="altVal"></output></label><input type="range" id="alt" min="0" max="3900" step="100" value="0"></div>
        <dl class="live"><dt>水銀柱的鉛直高度</dt><dd id="hg">—</dd></dl>
      </div>
    </div>

    <div class="group"><div class="result" id="info"></div></div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script>
(() => {
  const $ = Lab.$;
  const BLK = { al: [2.7, '鋁塊', '#b8bcc8'], wood: [0.6, '木塊', '#c98a4a'], ice: [0.92, '冰塊', '#cfe9ff'] };
  const S = { mode: 'liq', rho: 1, depth: 20, blk: 'al', lower: 0, tilt: 0, alt: 0, t: 0 };
  const V = 100;                                   // 物體體積 cm³

  function drawLiq(ctx, w, h, t) {
    const tx = w * 0.18, ty = 60, tw = Math.min(260, w * 0.32), th = Math.min(h - 120, 420), px = th / 44;
    const col = S.rho < 1 ? 'rgba(200,230,255,.28)' : S.rho > 1 ? 'rgba(120,200,255,.5)' : 'rgba(95,170,255,.38)';
    const top = ty + 4 * px;
    ctx.fillStyle = col; ctx.fillRect(tx, top, tw, th - 4 * px);
    ctx.strokeStyle = 'rgba(220,235,255,.8)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx, ty + th); ctx.lineTo(tx + tw, ty + th); ctx.lineTo(tx + tw, ty); ctx.stroke();
    // 側邊三個小孔與水柱：越深噴越遠
    [10, 22, 34].forEach(d => {
      const y = top + d * px, P = d * S.rho, v = Math.sqrt(P) * 9;
      ctx.strokeStyle = 'rgba(120,190,255,.8)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(tx + tw, y);
      for (let k = 0; k <= 30; k++) { const tt = k / 30 * 1.6; ctx.lineTo(tx + tw + v * tt * 6, y + 30 * tt * tt * 3); }
      ctx.stroke();
      Lab.text(`${d} cm`, tx + tw + 8, y - 12, 'rgba(238,241,250,.6)', 12, 'left');
    });
    // 壓力計（U 形管）探頭
    const py = top + S.depth * px, gx = tx + tw * 0.4;
    Lab.line(gx, ty - 30, gx, py, '#9fb4d6', 3);
    Lab.card(gx - 14, py - 6, 28, 12, '#ff6b5e', null, 3);
    // 探頭在各方向受壓（箭頭）
    [[0, -1], [0, 1], [-1, 0], [1, 0]].forEach(([dx, dy]) => Lab.arrow(gx + dx * 50, py + dy * 40, gx + dx * 18, py + dy * 10, 'rgba(255,211,77,.8)', 2.5, 9));
    // U 形管
    const ux = w * 0.68, uy = 80, uh = 220, diff = Math.min(uh * 0.8, S.depth * S.rho * 4.5);
    ctx.strokeStyle = 'rgba(220,235,255,.8)'; ctx.lineWidth = 3;
    ctx.strokeRect(ux - 40, uy, 20, uh); ctx.strokeRect(ux + 20, uy, 20, uh); ctx.strokeRect(ux - 40, uy + uh, 80, 20);
    ctx.fillStyle = '#ff6b5e';
    ctx.fillRect(ux - 38, uy + uh / 2 + diff / 2, 16, uh / 2 - diff / 2 + 18); ctx.fillRect(ux + 22, uy + uh / 2 - diff / 2, 16, uh / 2 + diff / 2 + 18); ctx.fillRect(ux - 38, uy + uh + 2, 76, 16);
    Lab.text('U 形管壓力計', ux, uy - 16, '#eef1fa', 13);
    Lab.line(ux + 50, uy + uh / 2 - diff / 2, ux + 50, uy + uh / 2 + diff / 2, '#ffd34d', 2);
    Lab.text('高度差', ux + 58, uy + uh / 2, '#ffd34d', 13, 'left');
    $('lp').textContent = `${S.depth} × ${S.rho} = ${(S.depth * S.rho).toFixed(1)} gw/cm²`;
    $('info').innerHTML = '液體內部<b>各個方向</b>都有壓力。<b>越深壓力越大</b>，密度越大壓力也越大：P = 深度 × 密度。所以越下面的小孔，水噴得越遠；水壩也要蓋成下寬上窄。';
  }

  function drawBuoy(ctx, w, h) {
    const [rho, name, color] = BLK[S.blk], Wt = rho * V;           // gw
    const cx = w * 0.4, by = h * 0.5, bw = Math.min(280, w * 0.38), bh = h * 0.36, wl0 = by + bh * 0.25;
    const side = 60, full = side;                                    // 物體邊長（像素）
    // 物體下降：lower 0→1 對應底面從水面上方到完全沒入
    const topY0 = wl0 - side - 40, travel = side + 80;
    let yTop = topY0 + S.lower * travel;
    let sub = Math.max(0, Math.min(1, (yTop + side - wl0) / side));
    // 會浮的物體：浮起時最多沒入 rho 比例
    const floats = rho < 1;
    if (floats && sub > rho) { sub = rho; yTop = wl0 - side * (1 - rho); }
    const B = sub * V * 1;                                           // 浮力 = 排開水重（gw）
    const scale = Math.max(0, Wt - B);
    // 溢水杯
    ctx.fillStyle = 'rgba(95,170,255,.38)'; ctx.fillRect(cx - bw / 2, wl0, bw, by + bh - wl0);
    ctx.strokeStyle = 'rgba(220,235,255,.8)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx - bw / 2, by); ctx.lineTo(cx - bw / 2, by + bh); ctx.lineTo(cx + bw / 2, by + bh); ctx.lineTo(cx + bw / 2, wl0 - 4); ctx.lineTo(cx + bw / 2 + 40, wl0 + 10); ctx.stroke();
    // 量筒：收集溢出的水
    const qx = cx + bw / 2 + 60, qh = 160, qy = by + bh - qh;
    ctx.fillStyle = 'rgba(95,170,255,.45)'; const qf = B / V * qh * 0.7; ctx.fillRect(qx, by + bh - qf, 40, qf);
    ctx.strokeRect(qx, qy, 40, qh);
    Lab.text(`${B.toFixed(0)} mL`, qx + 20, qy - 14, '#9fd8ff', 13);
    // 彈簧秤
    const sx = cx, sTop = 30, sLen = 70 + scale * 0.35;
    Lab.card(sx - 16, sTop, 32, 40, '#55606e', '#fff', 4);
    ctx.strokeStyle = '#9fb4d6'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx, sTop + 40);
    for (let i = 0; i <= 12; i++) ctx.lineTo(sx + (i % 2 ? 8 : -8), sTop + 40 + (yTop - sTop - 46) * i / 12);
    ctx.lineTo(sx, yTop); ctx.stroke();
    Lab.text(`${scale.toFixed(0)} gw`, sx + 28, sTop + 20, '#ffd34d', 15, 'left', 'bold');
    // 物體
    Lab.card(cx - side / 2, yTop, side, side, color, '#fff', 4);
    Lab.text(name, cx, yTop + side / 2, '#13233f', 13, 'center', 'bold');
    if (B > 0.5) Lab.arrow(cx, yTop + side + 30, cx, yTop + side + 30 - B * 0.6, '#4fd18b', 4, 12);
    $('bw').textContent = Wt.toFixed(0) + ' gw'; $('bs').textContent = scale.toFixed(0) + ' gw';
    $('bf').textContent = B.toFixed(0) + ' gw'; $('bo').textContent = B.toFixed(0) + ' gw';
    $('info').innerHTML = `<b>浮力 = 物體重 − 在水中的彈簧秤讀數 = 排開液體的重量</b>（阿基米德原理）。<br>${floats ? `${name}密度 ${rho} g/cm³，<b>比水小會浮起來</b>：浮力 = 物重時就不再下沉，彈簧秤讀數變 0。` : `${name}密度 ${rho} g/cm³，比水大會沉；完全沒入後浮力不再變大。`}`;
  }

  function drawAtm(ctx, w, h) {
    const p = 76 * Math.exp(-S.alt / 8400);           // cmHg（近似）
    const bx = w * 0.42, by = h - 80, px = Math.min(5, (h - 200) / 100);
    // 水銀槽
    ctx.fillStyle = '#c8ccd6'; ctx.fillRect(bx - 120, by - 30, 240, 30);
    ctx.strokeStyle = 'rgba(220,235,255,.8)'; ctx.lineWidth = 3; ctx.strokeRect(bx - 120, by - 50, 240, 50);
    // 玻璃管（可傾斜）
    const a = S.tilt * Math.PI / 180, L = 100 * px, colLen = p * px / Math.cos(a);
    ctx.save(); ctx.translate(bx, by - 20); ctx.rotate(a);
    ctx.fillStyle = '#c8ccd6'; ctx.fillRect(-9, -colLen, 18, colLen);
    ctx.strokeStyle = 'rgba(220,235,255,.85)'; ctx.strokeRect(-11, -L, 22, L);
    Lab.text('真空', 0, -L + 18, 'rgba(238,241,250,.7)', 11);
    ctx.restore();
    // 鉛直高度標示
    const topY = by - 20 - p * px;
    Lab.line(bx - 160, by - 30, bx - 160, topY, '#ffd34d', 2);
    Lab.line(bx - 170, topY, bx + Math.tan(a) * p * px, topY, 'rgba(255,211,77,.5)', 1.5, [5, 5]);
    Lab.text(`${p.toFixed(1)} cm`, bx - 170, (by + topY) / 2, '#ffd34d', 15, 'right', 'bold');
    // 大氣壓箭頭
    for (let i = -2; i <= 2; i++) if (i) Lab.arrow(bx + i * 40, by - 110, bx + i * 40, by - 56, 'rgba(92,200,255,.7)', 3, 10);
    Lab.text('大氣壓力', bx + 90, by - 120, '#9fd8ff', 13);
    $('hg').textContent = p.toFixed(1) + ' cmHg';
    $('info').innerHTML = `<b>托里切利實驗</b>：大氣壓力把水銀撐高約 <b>76 cm</b>（1 大氣壓）。管子傾斜時水銀柱變長，但<b>鉛直高度不變</b>；換粗細不同的管子也一樣。<br>海拔越高，空氣越稀薄，大氣壓力越小${S.alt >= 3900 ? '（玉山頂約 48 cmHg）' : ''}。`;
  }

  Lab.init({ draw(ctx, w, h, dt, t) { S.mode === 'liq' ? drawLiq(ctx, w, h, t) : S.mode === 'buoy' ? drawBuoy(ctx, w, h) : drawAtm(ctx, w, h); } });
  Lab.bindGroup('.mode', k => { S.mode = k; Lab.showMode(k); });
  Lab.bindGroup('#liquid button', k => { S.rho = Number(k); });
  Lab.bindGroup('#block button', k => { S.blk = k; });
  Lab.bindSlider('depth', v => (S.depth = v), v => v + ' cm');
  Lab.bindSlider('lower', v => (S.lower = v), v => Math.round(v * 100) + '%');
  Lab.bindSlider('tilt', v => (S.tilt = v), v => v + '°');
  Lab.bindSlider('alt', v => (S.alt = v), v => v + ' m');
  window.pressSim = S;
})();
</script>
<script src="lesson.js" defer></script>
</body>
</html>
