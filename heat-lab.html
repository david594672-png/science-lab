<!DOCTYPE html>
<html lang="zh-Hant" data-subject="phy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>溫度與熱</title>
<link rel="stylesheet" href="lab-kit.css">
</head>
<body>
<canvas id="cv" aria-label="比熱、熱平衡與物態變化的加熱實驗模擬"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g8">← 回課程總覽</a>
  <h1>溫度與熱</h1>
  <p class="sub">國二理化 · 溫度與熱</p>

  <div class="body">
    <div class="modes" style="--n:3">
      <button class="mode" data-k="sh" aria-pressed="true">比熱</button>
      <button class="mode" data-k="eq" aria-pressed="false">熱平衡</button>
      <button class="mode" data-k="ph" aria-pressed="false">冰的加熱</button>
    </div>

    <div data-mode="sh">
      <div class="group">
        <p class="note">兩個燒杯放在<b>相同的加熱器</b>上，每秒得到一樣多的熱量。</p>
        <div class="ctrl"><label for="mA">水的質量 <output id="mAVal"></output></label><input type="range" id="mA" min="50" max="300" step="10" value="100"></div>
        <div class="seg" style="--n:3" id="matB">
          <button data-k="oil" aria-pressed="true">沙拉油</button>
          <button data-k="sand" aria-pressed="false">沙子</button>
          <button data-k="water" aria-pressed="false">水</button>
        </div>
        <div class="ctrl" style="margin-top:8px"><label for="mB">右杯質量 <output id="mBVal"></output></label><input type="range" id="mB" min="50" max="300" step="10" value="100"></div>
      </div>
    </div>

    <div data-mode="eq" hidden>
      <div class="group">
        <div class="ctrl"><label for="m1">熱水質量 <output id="m1Val"></output></label><input type="range" id="m1" min="50" max="300" step="10" value="100"></div>
        <div class="ctrl"><label for="t1">熱水溫度 <output id="t1Val"></output></label><input type="range" id="t1" min="40" max="90" step="1" value="80"></div>
        <div class="ctrl"><label for="m2">冷水質量 <output id="m2Val"></output></label><input type="range" id="m2" min="50" max="300" step="10" value="200"></div>
        <div class="ctrl"><label for="t2">冷水溫度 <output id="t2Val"></output></label><input type="range" id="t2" min="5" max="35" step="1" value="20"></div>
      </div>
    </div>

    <div data-mode="ph" hidden>
      <div class="group"><p class="note">從 −20°C 的冰開始，用穩定的火加熱。注意看溫度<b>不上升</b>的兩段。</p></div>
    </div>

    <div class="group">
      <div class="row"><button class="btn primary grow" id="go">▶ 開始</button><button class="btn" id="reset">重來</button></div>
      <div class="result" id="out" style="margin-top:10px"></div>
    </div>

    <div class="group">
      <p class="note"><b>熱量 H = M × S × ΔT</b>（質量 × 比熱 × 溫度變化）。比熱越大，越不容易升溫（水的比熱 1 cal/g°C，很大）。冷熱物體接觸時，熱由高溫流向低溫，直到<b>溫度相同（熱平衡）</b>；不計散失時，<b>放出的熱 = 吸收的熱</b>。</p>
    </div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script>
(() => {
  const $ = Lab.$;
  const SPEC = { water: [1, '水', '#5cc8ff'], oil: [0.47, '沙拉油', '#ffd166'], sand: [0.2, '沙子', '#d9b48f'] };
  const P = 60;                                       // 加熱器功率（cal/s，示意）
  const S = { mode: 'sh', run: false, t: 0, mA: 100, mB: 100, mat: 'oil', TA: 20, TB: 20, histA: [], histB: [],
              m1: 100, t1: 80, m2: 200, t2: 20, T1: 80, T2: 20, h1: [], h2: [],
              Q: 0, ph: [], heatT: -20 };
  function reset() {
    S.run = false; S.t = 0; S.TA = S.TB = 20; S.histA = []; S.histB = [];
    S.T1 = S.t1; S.T2 = S.t2; S.h1 = []; S.h2 = []; S.Q = 0; S.ph = []; S.heatT = -20;
    $('go').textContent = '▶ 開始';
  }
  // 冰（100 g）加熱：溫度由累積熱量決定（冰比熱 0.5、熔化熱 80、汽化熱 540，單位 cal/g）
  function iceTemp(Q) {
    const m = 100, q1 = m * 0.5 * 20, q2 = q1 + m * 80, q3 = q2 + m * 100, q4 = q3 + m * 540;
    if (Q < q1) return [-20 + Q / (m * 0.5), '冰（固態）升溫'];
    if (Q < q2) return [0, '冰熔化成水：吸熱但溫度不變（0°C）'];
    if (Q < q3) return [(Q - q2) / m, '水（液態）升溫'];
    if (Q < q4) return [100, '水沸騰：吸熱但溫度不變（100°C）'];
    return [100 + (Q - q4) / (m * 0.48), '水蒸氣升溫'];
  }

  function beaker(ctx, x, y, w, h, fill, T, label, solid) {
    ctx.fillStyle = fill; ctx.fillRect(x, y + h * 0.25, w, h * 0.75);
    if (solid) { ctx.fillStyle = 'rgba(0,0,0,.15)'; for (let i = 0; i < 40; i++) ctx.fillRect(x + (i * 37) % w, y + h * 0.3 + (i * 53) % (h * 0.65), 3, 3); }
    ctx.strokeStyle = 'rgba(220,235,255,.75)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y); ctx.stroke();
    // 溫度計
    const tx = x + w - 18, ty = y - 30, th = h + 10;
    Lab.card(tx - 5, ty, 10, th, 'rgba(255,255,255,.12)', 'rgba(255,255,255,.4)', 5);
    const f = Math.max(0, Math.min(1, (T + 20) / 140));
    Lab.card(tx - 3, ty + th - f * th, 6, f * th, '#ff6b5e', null, 3);
    Lab.text(T.toFixed(1) + '°C', x + w / 2, y + h + 22, '#eef1fa', 16, 'center', 'bold');
    Lab.text(label, x + w / 2, y - 14, 'rgba(238,241,250,.75)', 14);
  }
  function flame(ctx, x, y, on, t) {
    Lab.card(x - 40, y, 80, 14, '#55606e', null, 4);
    if (!on) return;
    for (let i = -1; i <= 1; i++) {
      const h = 22 + 6 * Math.sin(t * 12 + i * 2);
      ctx.fillStyle = 'rgba(255,140,60,.9)'; ctx.beginPath(); ctx.ellipse(x + i * 22, y - h / 2, 8, h / 2, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  function draw(ctx, w, h, dt, t) {
    const chartY = h * 0.52, chartH = h - chartY - 16;
    if (S.mode === 'sh') {
      if (S.run && S.TA < 98 && S.TB < 98) {
        S.t += dt * 5;
        S.TA += P * dt * 5 / (S.mA * SPEC.water[0]);
        S.TB += P * dt * 5 / (S.mB * SPEC[S.mat][0]);
        if ((S.histA.length < 1 || S.t - S.histA.length * 2 > 0)) { S.histA.push(S.TA); S.histB.push(S.TB); }
      }
      const bw = Math.min(170, w * 0.28), by = 60, bh = chartY - by - 60;
      beaker(ctx, w * 0.25 - bw / 2, by, bw, bh, 'rgba(92,200,255,.3)', S.TA, `水 ${S.mA} g`);
      const sp = SPEC[S.mat];
      beaker(ctx, w * 0.68 - bw / 2, by, bw, bh, sp[2] + '55', S.TB, `${sp[1]} ${S.mB} g`, S.mat === 'sand');
      flame(ctx, w * 0.25, by + bh + 32, S.run, t); flame(ctx, w * 0.68, by + bh + 32, S.run, t);
      Lab.chart(20, chartY + 10, w - 40, chartH - 10, [{ data: S.histA, color: '#5cc8ff', n: 60 }, { data: S.histB, color: sp[2], n: 60 }], { min: 0, max: 100, xLabel: '加熱時間 →', yLabel: '溫度（°C）' });
    } else if (S.mode === 'eq') {
      if (S.run) {
        S.t += dt;
        const k = 1.2 * dt, H = k * (S.T1 - S.T2) * 60;   // 每次傳的熱
        S.T1 -= H / S.m1; S.T2 += H / S.m2;
        if (S.h1.length < 120 && Math.floor(S.t * 4) > S.h1.length) { S.h1.push(S.T1); S.h2.push(S.T2); }
      }
      const bw = Math.min(220, w * 0.34), by = 70, bh = chartY - by - 50;
      // 大杯冷水中放小杯熱水
      beaker(ctx, w * 0.45 - bw / 2, by, bw, bh, 'rgba(92,200,255,.28)', S.T2, `冷水 ${S.m2} g`);
      const sw = bw * 0.42, sh = bh * 0.6;
      ctx.fillStyle = 'rgba(255,107,94,.4)'; ctx.fillRect(w * 0.45 - sw / 2 - 20, by + bh - sh, sw, sh);
      ctx.strokeStyle = 'rgba(255,200,190,.9)'; ctx.lineWidth = 2; ctx.strokeRect(w * 0.45 - sw / 2 - 20, by + bh - sh, sw, sh);
      Lab.text(`熱水 ${S.m1} g：${S.T1.toFixed(1)}°C`, w * 0.45 - 20, by + bh - sh - 14, '#ffb3a8', 14, 'center', 'bold');
      if (S.run && S.T1 - S.T2 > 0.5) Lab.arrow(w * 0.45 - 20 + sw / 2, by + bh - sh / 2, w * 0.45 - 20 + sw / 2 + 50, by + bh - sh / 2, '#ffa64d', 4, 12);
      Lab.chart(20, chartY + 10, w - 40, chartH - 10, [{ data: S.h1, color: '#ff6b5e', n: 120 }, { data: S.h2, color: '#5cc8ff', n: 120 }], { min: 0, max: 100, xLabel: '時間 →', yLabel: '溫度（°C）' });
    } else {
      if (S.run) { S.Q += dt * 900; const [T] = iceTemp(S.Q); S.heatT = T; if (Math.floor(S.Q / 600) > S.ph.length && S.ph.length < 140) S.ph.push(T); }
      const [T, stage] = iceTemp(S.Q);
      const bw = Math.min(200, w * 0.32), by = 70, bh = chartY - by - 60, bx = w * 0.4 - bw / 2;
      const iceLeft = Math.max(0, Math.min(1, 1 - (S.Q - 1000) / 8000)), waterLeft = Math.max(0, Math.min(1, 1 - (S.Q - 19000) / 54000));
      ctx.fillStyle = 'rgba(92,200,255,.3)'; ctx.fillRect(bx, by + bh * (1 - 0.6 * waterLeft), bw, bh * 0.6 * waterLeft);
      for (let i = 0; i < 9 * iceLeft; i++) { ctx.fillStyle = 'rgba(230,245,255,.9)'; ctx.fillRect(bx + 12 + (i % 3) * (bw / 3.4), by + bh - 40 - Math.floor(i / 3) * 34, bw / 4, 28); }
      if (T >= 100 && S.run) for (let i = 0; i < 10; i++) Lab.circle(bx + 20 + (i * 47) % (bw - 30), by + bh * 0.5 + ((t * 120 + i * 30) % (bh * 0.4)), 4, null, '#fff', 1.5);
      ctx.strokeStyle = 'rgba(220,235,255,.75)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx, by + bh); ctx.lineTo(bx + bw, by + bh); ctx.lineTo(bx + bw, by); ctx.stroke();
      flame(ctx, w * 0.4, by + bh + 30, S.run, t);
      Lab.text(T.toFixed(1) + '°C', bx + bw + 60, by + bh / 2, '#ff8a7a', 26, 'center', 'bold');
      Lab.text(stage, w * 0.4, by - 20, '#ffd166', 15, 'center', 'bold');
      Lab.chart(20, chartY + 10, w - 40, chartH - 10, [{ data: S.ph, color: '#ffa64d', n: 140 }], { min: -25, max: 125, xLabel: '加熱時間 →', yLabel: '溫度（°C）', ref: { v: 0, label: '0°C 熔點' } });
    }
  }

  Lab.init({
    draw,
    ui() {
      if (S.mode === 'sh') {
        const sp = SPEC[S.mat];
        $('out').innerHTML = `相同時間吸收相同熱量 H。<br>水：ΔT = ${(S.TA - 20).toFixed(1)}°C；${sp[1]}：ΔT = ${(S.TB - 20).toFixed(1)}°C<br>${sp[1]}的比熱 ${sp[0]} cal/g°C，${sp[0] < 1 && S.mA === S.mB ? '比水小，所以<b>升溫比較快</b>。' : '比較時記得質量也要一樣。'}`;
      } else if (S.mode === 'eq') {
        const Tf = (S.m1 * S.t1 + S.m2 * S.t2) / (S.m1 + S.m2);
        $('out').innerHTML = `熱水放熱 = 冷水吸熱<br>${S.m1} × (${S.t1} − T) = ${S.m2} × (T − ${S.t2})<br>算出平衡溫度 T = <b>${Tf.toFixed(1)}°C</b>（現在：熱水 ${S.T1.toFixed(1)}°C、冷水 ${S.T2.toFixed(1)}°C）`;
      } else {
        $('out').innerHTML = `${iceTemp(S.Q)[1]}。<br>已吸收熱量約 <b>${(S.Q / 1000).toFixed(1)} 千卡</b>。熔化、沸騰時吸收的熱用來<b>改變狀態</b>，所以溫度不變。`;
      }
    }
  });
  $('go').addEventListener('click', () => { S.run = !S.run; $('go').textContent = S.run ? '❚❚ 暫停' : '▶ 繼續'; });
  $('reset').addEventListener('click', reset);
  Lab.bindGroup('.mode', k => { S.mode = k; Lab.showMode(k); reset(); });
  Lab.bindGroup('#matB button', k => { S.mat = k; reset(); });
  [['mA', 'g'], ['mB', 'g'], ['m1', 'g'], ['m2', 'g'], ['t1', '°C'], ['t2', '°C']].forEach(([id, u]) => Lab.bindSlider(id, v => { S[id] = v; reset(); }, v => v + ' ' + u));
  window.heatSim = S;
})();
</script>
<script src="lesson.js" defer></script>
</body>
</html>
