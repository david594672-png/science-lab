<!DOCTYPE html>
<html lang="zh-Hant" data-subject="earth">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>颱風過境的風向變化</title>
<link rel="stylesheet" href="lab-kit.css">
<style>
  .log { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .log span { font-size: .8rem; padding: 3px 9px; border-radius: 999px; background: rgba(var(--accent-rgb), .14); border: 1px solid rgba(var(--accent-rgb), .4); }
</style>
</head>
<body>
<canvas id="cv" aria-label="颱風經過台灣時各地風向變化的地圖模擬"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g9">← 回課程總覽</a>
  <h1>颱風過境的風向</h1>
  <p class="sub">國三地科 · 千變萬化的天氣 ｜ <a class="back" href="typhoon-3d.html" style="display:inline">颱風構造 →</a></p>

  <div class="body">
    <div class="group">
      <div class="group-title">颱風路徑</div>
      <div class="chips" style="--n:3" id="track">
        <button class="btn" data-k="n" aria-pressed="false">從北部<br>海面經過</button>
        <button class="btn" data-k="c" aria-pressed="true">穿過<br>台灣中部</button>
        <button class="btn" data-k="s" aria-pressed="false">從南部<br>海面經過</button>
      </div>
    </div>
    <div class="group">
      <div class="group-title">觀察的測站</div>
      <div class="chips" style="--n:4" id="station">
        <button class="btn" data-k="0" aria-pressed="true">台北</button>
        <button class="btn" data-k="1" aria-pressed="false">台中</button>
        <button class="btn" data-k="2" aria-pressed="false">花蓮</button>
        <button class="btn" data-k="3" aria-pressed="false">高雄</button>
      </div>
    </div>
    <div class="group">
      <div class="ctrl">
        <label for="prog">颱風位置 <output id="progVal"></output></label>
        <input type="range" id="prog" min="0" max="1" step="0.005" value="0.15">
      </div>
      <div class="row"><button class="btn primary grow" id="play">▶ 颱風前進</button></div>
      <dl class="live" style="margin-top:10px">
        <dt>測站風向</dt><dd id="dir">—</dd>
        <dt>風速（示意）</dt><dd id="spd">—</dd>
      </dl>
      <div class="group-title" style="margin-top:12px">風向紀錄</div>
      <div class="log" id="log"></div>
    </div>
    <div class="group">
      <label class="sw"><input type="checkbox" id="field" checked><span class="track"></span>顯示各地的風</label>
      <p class="note">北半球颱風的風是<b>逆時針</b>吹向中心。所以同一個颱風，在颱風<b>不同方位</b>的地方，吹的風向不一樣；颱風移動時，測站的風向也會跟著<b>轉變</b>。風向是指風<b>吹來</b>的方向，例如「北風」是從北方吹來的風。</p>
    </div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script>
(() => {
  const $ = Lab.$;
  const OUT = [[121.5, 25.3], [121.9, 25.1], [122.0, 24.9], [121.8, 24.6], [121.6, 24.0], [121.4, 23.3], [121.2, 22.8], [120.9, 22.3], [120.85, 21.9], [120.7, 22.1], [120.6, 22.4], [120.3, 22.6], [120.15, 23.0], [120.1, 23.5], [120.2, 24.0], [120.5, 24.5], [120.8, 24.8], [121.0, 25.05], [121.3, 25.2]];
  const ST = [['台北', 121.56, 25.04], ['台中', 120.68, 24.15], ['花蓮', 121.6, 23.98], ['高雄', 120.3, 22.63]];
  const TRACK = { n: [[125.5, 25.6], [117.5, 26.6]], c: [[125.5, 23.0], [117.5, 24.8]], s: [[125.5, 20.9], [117.5, 22.3]] };
  const S = { track: 'c', st: 0, p: 0.15, play: false, log: [], lastDir: '' };
  const RM = 0.7;                              // 最大風速半徑（度）
  let W = 600, H = 500, sc = 60, ox = 0, oy = 0;
  const LON0 = 121.5, LAT0 = 23.8;
  const X = lon => ox + (lon - LON0) * sc, Y = lat => oy - (lat - LAT0) * sc;

  function center() { const [a, b] = TRACK[S.track]; return [a[0] + (b[0] - a[0]) * S.p, a[1] + (b[1] - a[1]) * S.p]; }
  // 風：逆時針切線 + 向內 20°，速度示意
  function wind(lon, lat) {
    const [cx, cy] = center(), dx = lon - cx, dy = lat - cy, r = Math.hypot(dx, dy) || 1e-6;
    const tx = -dy / r, ty = dx / r, ix = -dx / r, iy = -dy / r, k = 0.34;
    const v = r < RM ? r / RM : Math.pow(RM / r, 0.7);
    return [(tx * 0.94 + ix * k) * v, (ty * 0.94 + iy * k) * v, v];
  }
  const NAMES = ['北', '東北', '東', '東南', '南', '西南', '西', '西北'];
  function dirName(wx, wy) {                     // 風從哪裡吹來
    const from = Math.atan2(-wx, -wy);            // 以北為 0、往東為正
    return NAMES[Math.round(((from * 180 / Math.PI) + 360) % 360 / 45) % 8] + '風';
  }

  function draw(ctx, w, h, dt, t) {
    W = w; H = h; sc = Math.min(w / 9, h / 7.5); ox = w * 0.5; oy = h * 0.5;
    if (S.play) { S.p = Math.min(1, S.p + dt * 0.05); if (S.p >= 1) { S.play = false; playBtn(); } const el = $('prog'); el.value = S.p; Lab.paint(el); }
    // 海
    ctx.fillStyle = '#123a5c'; ctx.fillRect(0, 0, w, h);
    // 經緯線
    for (let lon = 117; lon <= 126; lon++) Lab.line(X(lon), 0, X(lon), h, 'rgba(255,255,255,.06)', 1);
    for (let lat = 20; lat <= 28; lat++) Lab.line(0, Y(lat), w, Y(lat), 'rgba(255,255,255,.06)', 1);
    // 台灣
    ctx.beginPath(); OUT.forEach(([lo, la], i) => (i ? ctx.lineTo(X(lo), Y(la)) : ctx.moveTo(X(lo), Y(la)))); ctx.closePath();
    ctx.fillStyle = '#4f8a4a'; ctx.fill(); ctx.strokeStyle = '#9fd18a'; ctx.lineWidth = 2; ctx.stroke();
    // 中央山脈
    ctx.strokeStyle = 'rgba(40,70,35,.8)'; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(X(121.55), Y(24.7)); ctx.lineTo(X(121.0), Y(23.5)); ctx.lineTo(X(120.8), Y(22.3)); ctx.stroke();
    // 路徑
    const [a, b] = TRACK[S.track];
    Lab.line(X(a[0]), Y(a[1]), X(b[0]), Y(b[1]), 'rgba(255,200,120,.6)', 2, [8, 8]);
    // 風場
    if ($('field').checked) {
      for (let lon = 117.75; lon < 126; lon += 0.75) for (let lat = 20.5; lat < 27.5; lat += 0.75) {
        const [wx, wy, v] = wind(lon, lat), L = 10 + 26 * v, x = X(lon), y = Y(lat);
        Lab.arrow(x, y, x + wx / (v || 1) * L, y - wy / (v || 1) * L, `rgba(180,220,255,${0.25 + 0.6 * v})`, 1.6, 7);
      }
    }
    // 颱風
    const [cx, cy] = center(), px = X(cx), py = Y(cy), rr = RM * sc;
    ctx.save(); ctx.translate(px, py); ctx.rotate(-t * 1.5);
    for (let arm = 0; arm < 3; arm++) {
      ctx.beginPath();
      for (let k = 0; k < 40; k++) { const th = arm * 2.1 + k * 0.09, r = 8 + k * rr * 0.05; ctx.lineTo(Math.cos(th) * r, -Math.sin(th) * r); }
      ctx.strokeStyle = 'rgba(240,245,255,.8)'; ctx.lineWidth = 6; ctx.stroke();
    }
    ctx.restore();
    Lab.circle(px, py, 6, '#ff6b5e');
    Lab.circle(px, py, rr, null, 'rgba(255,107,94,.4)', 1.5);
    // 測站與風向標
    ST.forEach((s, i) => {
      const x = X(s[1]), y = Y(s[2]), on = i === S.st;
      Lab.circle(x, y, on ? 7 : 4, on ? '#ffd34d' : '#fff');
      Lab.text(s[0], x + 10, y - 10, on ? '#ffd34d' : '#eef1fa', on ? 15 : 12, 'left', 'bold');
    });
    const s = ST[S.st], [wx, wy, v] = wind(s[1], s[2]);
    const x = X(s[1]), y = Y(s[2]), Lr = 30 + 40 * v;
    Lab.arrow(x - wx / (v || 1) * Lr, y + wy / (v || 1) * Lr, x, y, '#ffd34d', 5, 16);
    S.now = { name: dirName(wx, wy), v };
    // 紀錄風向變化
    if (S.now.name !== S.lastDir) { S.lastDir = S.now.name; S.log.push(S.now.name); if (S.log.length > 10) S.log.shift(); renderLog(); }
    // 方位
    Lab.text('N ↑', w - 30, 24, 'rgba(238,241,250,.6)', 14);
  }
  function renderLog() { $('log').innerHTML = S.log.map(d => `<span>${d}</span>`).join(''); }

  Lab.init({
    draw,
    ui() {
      if (!S.now) return;
      $('dir').textContent = S.now.name;
      $('spd').textContent = S.now.v > 0.75 ? '非常強' : S.now.v > 0.45 ? '強' : S.now.v > 0.25 ? '中等' : '弱';
      $('progVal').textContent = S.p < 0.4 ? '接近中' : S.p < 0.6 ? '最接近台灣' : '遠離中';
    }
  });
  function clearLog() { S.log = []; S.lastDir = ''; renderLog(); }
  function playBtn() { $('play').textContent = S.play ? '❚❚ 暫停' : '▶ 颱風前進'; }
  Lab.bindGroup('#track .btn', k => { S.track = k; S.p = 0.05; clearLog(); const el = $('prog'); el.value = S.p; Lab.paint(el); });
  Lab.bindGroup('#station .btn', k => { S.st = Number(k); clearLog(); });
  Lab.bindSlider('prog', v => { S.p = v; }, () => '');
  $('play').addEventListener('click', () => { if (S.p >= 1) { S.p = 0; clearLog(); } S.play = !S.play; playBtn(); });
  window.typhoonWind = S;
})();
</script>
<script src="lesson.js" defer></script>
</body>
</html>
