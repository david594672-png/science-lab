<style>

    --accent: #3b8f6e;
    --blue: #3f7be8;
    --red: #e5484d;
    --green: #22a35a;
    --gold: #e9a800;
    --track: #dfe5e1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;

  #scene { position: absolute; inset: 0; }
  #scene canvas { display: block; touch-action: none; }

  .glass {
    background: var(--card); backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid rgba(255,255,255,.8); box-shadow: 0 20px 50px rgba(40,70,55,.12), 0 2px 6px rgba(40,70,55,.05);
  }
  .collapse {
    position: absolute; top: 16px; right: 14px; z-index: 2; cursor: pointer; border: none;
    font: inherit; font-size: .76rem; font-weight: 600; color: var(--accent);
    background: rgba(59,143,110,.12); border-radius: 999px; padding: 4px 12px;
  }
  .collapsed .body { display: none; }

  /* 左：控制面板 */
  .panel { position: absolute; top: 18px; left: 18px; width: 300px; max-height: calc(100vh - 36px); overflow-y: auto; z-index: 10; border-radius: 26px; padding: 18px; }
  .panel.collapsed { width: auto; min-width: 240px; }
  .back { font-size: .78rem; color: var(--accent); text-decoration: none; }
  .title { font-size: 1.15rem; font-weight: 700; margin-top: 6px; padding-right: 62px; }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 14px 0 12px; }
  .tab {
    font: inherit; font-size: .8rem; font-weight: 700; padding: 9px 6px; cursor: pointer; line-height: 1.3;
    border: none; border-radius: 12px; background: rgba(118,118,128,.12); color: var(--ink);
    transition: background .2s, color .2s, box-shadow .2s;
  }
  .tab.on { background: #fff; color: var(--accent); box-shadow: 0 3px 10px rgba(0,0,0,.1); }
  .section[hidden] { display: none; }
  .desc { font-size: .8rem; color: var(--ink-soft); line-height: 1.65; margin-bottom: 10px; }

  .btn {

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 10px; border-radius: 999px; cursor: pointer; outline: none;
    background: linear-gradient(90deg, #cfe3d8, #3b8f6e); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.2); }

  .data .dt { font-size: .74rem; font-weight: 800; letter-spacing: .12em; color: var(--accent); padding-right: 60px; }
  .card { background: rgba(255,255,255,.82); border-radius: 16px; padding: 10px 12px; margin-top: 8px; font-size: .8rem; line-height: 1.55; }
  .card .h { font-size: .7rem; font-weight: 700; color: var(--ink-soft); margin-bottom: 4px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-variant-numeric: tabular-nums; }
  .kv b { text-align: right; font-weight: 800; }

  canvas.chart { width: 100%; height: 150px; display: block; border-radius: 12px; background: #fff; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .72rem; font-weight: 700; color: #fff; }

  .tag {
    position: absolute; z-index: 5; pointer-events: none; transform: translate(-50%, -50%);
    font-size: .74rem; font-weight: 700; padding: 3px 10px; border-radius: 12px; white-space: nowrap;

  @media (max-width: 760px), (max-width: 1100px) and (orientation: portrait) {

    .hint { display: none; }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

window.__kinReady = true;
const $ = id => document.getElementById(id);
const V3 = (x, y, z = 0) => new THREE.Vector3(x, y, z);
const UP = V3(0, 1, 0);
const G = 9.8;

/* =========================================================
   Soft 3D 黏土場景
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
$('scene').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe6edf6);
scene.add(new THREE.HemisphereLight(0xffffff, 0xc9d6cd, 1.25));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(-6, 14, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 12, bottom: -12, near: 1, far: 50 });
sun.shadow.radius = 4;
scene.add(sun);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 150);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 4;
controls.maxDistance = 45;

const clay = (color, extra = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.5, metalness: 0.05, clearcoat: 0.2, ...extra });
const shadowed = m => { m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); return m; };

// 共用地板（莫蘭迪綠的圓角大板）
const board = new THREE.Mesh(new RoundedBoxGeometry(30, 0.5, 18, 6, 0.24), clay(0xd2ded5));
board.position.y = -0.25;
board.receiveShadow = true;
scene.add(board);

/** 圓潤小車（車頭朝 +x） */
function makeCar(color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new RoundedBoxGeometry(1.3, 0.45, 0.75, 5, 0.18), clay(color));
  body.position.y = 0.42;
  const cabin = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 0.42, 8, 16), clay(0xffffff));
  cabin.rotation.z = Math.PI / 2;
  cabin.position.set(-0.08, 0.72, 0);
  g.add(body, cabin);
  for (const [x, z] of [[0.42, 0.38], [-0.42, 0.38], [0.42, -0.38], [-0.42, -0.38]]) {
    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.14, 24), clay(0x3a3f44));
    w.rotation.x = Math.PI / 2;
    w.position.set(x, 0.18, z);
    g.add(w);
  }
  return shadowed(g);
}

/** 圓潤向量箭頭：預設指向 +y，用 setArrow 指定起點、方向、長度 */
function makeArrow(color, r = 0.07) {
  const g = new THREE.Group();
  const mat = clay(color, { emissive: color, emissiveIntensity: 0.25 });
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 16), mat);
  const head = new THREE.Mesh(new THREE.ConeGeometry(r * 2.6, r * 4.5, 24), mat);
  const base = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), mat);
  g.add(shaft, head, base);
  g.userData = { shaft, head, hl: r * 4.5 };
  return shadowed(g);
}
function setArrow(A, origin, dir, len) {
  if (len < 0.03) { A.visible = false; return; }
  A.visible = true;
  const { shaft, head, hl } = A.userData;
  const h = Math.min(hl, len * 0.5), sl = Math.max(0.001, len - h);
  shaft.scale.y = sl; shaft.position.y = sl / 2;
  head.scale.setScalar(h / hl); head.position.y = sl + h / 2;
  A.position.copy(origin);
  A.quaternion.setFromUnitVectors(UP, dir.clone().normalize());
}

/* ----- 標籤 ----- */
const labels = [];
function addLabel(mode, html = '', style = '') {
  const el = document.createElement('div');
  el.className = 'tag';
  el.innerHTML = html;
  if (style) el.style.cssText += style;
  document.body.appendChild(el);
  const L = { el, mode, pos: V3(0, 0, 0), visible: true };
  labels.push(L);
  return L;
}
const tmpV = V3(0, 0, 0);
function placeLabels() {
  for (const L of labels) {
    if (L.mode !== mode || !L.visible) { L.el.style.display = 'none'; continue; }
    tmpV.copy(L.pos).project(camera);
    if (tmpV.z > 1) { L.el.style.display = 'none'; continue; }
    L.el.style.display = '';
    L.el.style.left = ((tmpV.x + 1) / 2 * window.innerWidth) + 'px';
    L.el.style.top = ((1 - tmpV.y) / 2 * window.innerHeight) + 'px';
  }
}
function banner(text, ms = 2500) {
  $('banner').innerHTML = text;
  $('banner').classList.add('show');
  clearTimeout(banner.t);
  if (ms) banner.t = setTimeout(() => $('banner').classList.remove('show'), ms);
}
const hideBanner = () => $('banner').classList.remove('show');

/* ----- 手刻圖表 ----- */
function drawChart(canvas, pts, o) {
  const dpr = Math.min(window.devicePixelRatio, 2);
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W) return;
  if (canvas.width !== W * dpr) { canvas.width = W * dpr; canvas.height = H * dpr; }
  const g = canvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const L = 36, R = 10, T = 12, B = 24;
  const X = t => L + (W - L - R) * t / o.xmax;
  const Y = v => T + (H - T - B) * (1 - (v - o.ymin) / (o.ymax - o.ymin));
  g.font = '10px -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif';
  g.strokeStyle = '#eef1ef'; g.fillStyle = '#8a8f8c'; g.lineWidth = 1;
  for (let k = 0; k * o.xstep <= o.xmax + 1e-9; k++) {
    const i = Math.round(k * o.xstep * 100) / 100;           // 避免 0.4×3 = 1.2000000002 這類浮點誤差
    g.beginPath(); g.moveTo(X(i), T); g.lineTo(X(i), H - B); g.stroke(); g.fillText(i, X(i) - 3, H - B + 13);
  }
  for (let v = o.ymin; v <= o.ymax + 1e-9; v += o.ystep) { g.beginPath(); g.moveTo(L, Y(v)); g.lineTo(W - R, Y(v)); g.stroke(); g.fillText(Math.round(v * 10) / 10, 4, Y(v) + 3); }
  g.strokeStyle = '#9aa29d'; g.lineWidth = 1.4;
  g.beginPath(); g.moveTo(L, T); g.lineTo(L, H - B); g.lineTo(W - R, H - B); g.stroke();
  if (o.ymin < 0) { g.strokeStyle = '#c8cec9'; g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(W - R, Y(0)); g.stroke(); }
  g.fillStyle = '#4a4f4c'; g.font = '700 11px -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif';
  g.fillText(o.ylabel, L + 4, T + 10);
  g.fillText(o.xlabel, W - R - 34, H - B - 4);
  if (pts.length > 1) {
    g.strokeStyle = o.color; g.lineWidth = 3; g.lineJoin = 'round'; g.lineCap = 'round';
    g.beginPath();
    pts.forEach((p, i) => (i ? g.lineTo : g.moveTo).call(g, X(p[0]), Y(p[1])));
    g.stroke();
    const last = pts[pts.length - 1];
    g.fillStyle = o.color; g.beginPath(); g.arc(X(last[0]), Y(last[1]), 4.5, 0, Math.PI * 2); g.fill();
  }
}
const fmt = (v, d = 2) => (Math.abs(v) < 1e-9 ? 0 : v).toFixed(d);

/* =========================================================
   模組一：位移 vs 路徑長（雙車競速）
   ========================================================= */
const M1 = (() => {
  const group = new THREE.Group();
  const A = V3(-6, 0, 0), B = V3(6, 0, 0);
  const T = 4;                                           // 兩車都花 4 秒
  const straight = new THREE.LineCurve3(A.clone().setY(0.06), B.clone().setY(0.06));
  const sPts = [];
  for (let i = 0; i <= 48; i++) { const x = -6 + 12 * i / 48; sPts.push(V3(x, 0.06, -3.0 * Math.sin(2 * Math.PI * (x + 6) / 12))); }
  const sCurve = new THREE.CatmullRomCurve3(sPts);
  const DISP = A.distanceTo(B), PATH_S = sCurve.getLength();

  // 軌道（淡）與尾跡（亮，逐步顯示）
  const track = (cv, color) => {
    const m = new THREE.Mesh(new THREE.TubeGeometry(cv, 200, 0.22, 12, false), clay(color, { transparent: true, opacity: 0.35 }));
    m.receiveShadow = true; group.add(m);
  };
  track(straight, 0x9fbdf5); track(sCurve, 0xf5a3a6);
  const trail = (cv, color) => {
    const m = new THREE.Mesh(new THREE.TubeGeometry(cv, 300, 0.09, 10, false), clay(color, { emissive: color, emissiveIntensity: 0.35 }));
    m.position.y = 0.08; group.add(m);
    m.geometry.setDrawRange(0, 0);
    return m;
  };
  const trailB = trail(straight, 0x3f7be8), trailR = trail(sCurve, 0xe5484d);
  // 起點、終點旗桿
  [['A', A], ['B', B]].forEach(([n, p]) => {
    const pole = new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 1.6, 6, 12), clay(0xffffff));
    pole.position.copy(p).add(V3(0, 0.9, 0));
    const flag = new THREE.Mesh(new RoundedBoxGeometry(0.7, 0.45, 0.06, 3, 0.03), clay(n === 'A' ? 0x3b8f6e : 0xf2b84b));
    flag.position.copy(p).add(V3(0.38, 1.45, 0));
    group.add(shadowed(pole), shadowed(flag));
    const L = addLabel('m1', n, 'font-size:.95rem'); L.pos.copy(p).add(V3(0, 2.15, 0));
  });
  const carB = makeCar(0x3f7be8), carR = makeCar(0xe5484d);
  group.add(carB, carR);
  // 位移向量（終點後出現）：兩車的位移都是 A → B
  const dispArrow = makeArrow(0x8b5cf6, 0.1);
  group.add(dispArrow);
  dispArrow.visible = false;
  const lDisp = addLabel('m1', '位移 = 12 m（兩車相同！）', 'color:#7c3aed'); lDisp.pos.set(0, 1.9, 0.6); lDisp.visible = false;
  const lB = addLabel('m1', '藍車：直線', 'color:#3f7be8'); lB.pos.set(-1.5, 0.6, 0.9);
  const lR = addLabel('m1', '紅車：S 型彎路', 'color:#e5484d'); lR.pos.set(-3.0, 0.6, -3.6);

  let t = 0, running = false;

    $('m3kv').innerHTML = `<span>時間 t</span><b>${fmt(t)} s</b><span>高度 y</span><b>${fmt(Math.max(0, y - R))} m</b>
      <span>速度 v = v₀ − gt</span><b>${fmt(v)} m/s</b><span>加速度 a</span><b>−9.8 m/s²（向下）</b>`;
    drawChart($('vt3'), samples, { xmax: 2.4, xstep: 0.4, ymin: -12, ymax: 12, ystep: 6, color: '#22a35a', ylabel: 'v (m/s)', xlabel: 't (s)' });
  }

  $('m3Throw').addEventListener('click', () => start('throw'));

/* =========================================================

  const lTimer = addLabel('m4', '打點計時器（每 0.2 秒打一點）'); lTimer.pos.set(TIMER_X, 2.0, 0.4);

  const car = makeCar(0x3f7be8);
  group.add(car);
  // 紙帶（跟著小車移動），點就打在紙帶上

  const paper = new THREE.Mesh(new RoundedBoxGeometry(TAPE_LEN, 0.02, 0.5, 2, 0.008), clay(0xffffff, { transparent: true, opacity: 0.8 }));
  paper.position.x = -TAPE_LEN / 2;
  paper.receiveShadow = true;
  tape.add(paper);
  group.add(tape);
  const dotGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.03, 16), dotMat = clay(0x111111);
  const dots = [];
  // 測量尺
  const measure = new THREE.Group();
  const mLine = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1, 10), clay(0xf97316, { emissive: 0xf97316, emissiveIntensity: 0.4 }));
  mLine.rotation.z = Math.PI / 2;
  const mEnds = [0, 1].map(() => { const e = new THREE.Mesh(new THREE.SphereGeometry(0.07, 14, 10), clay(0xf97316)); measure.add(e); return e; });
  measure.add(mLine);
  measure.visible = false;
  tape.add(measure);
  const lMeasure = addLabel('m4', '', 'color:#c2410c;border:1.5px solid #f97316');
  lMeasure.visible = false;

  let motion = 'uniform', t = 0, running = false, paused = false, nextTick = 0, strikeT = 0, startX = TIMER_X + 1.1;
  const xAt = tt => { const M = MOTIONS[motion]; return startX + M.v0 * tt + 0.5 * M.a * tt * tt; };   // S = v0t + ½at²
  function clearDots() { dots.forEach(d => tape.remove(d)); dots.length = 0; }
  function reset() {
    motion = $('tapeMode').value; t = 0; running = false; paused = false; nextTick = 0; clearDots();
    measure.visible = false; lMeasure.visible = false;
    $('m4Pause').textContent = '⏸ 暫停';
    update(0);
  }
  function update(dt) {
    if (running && !paused) {
      t += dt * 0.6;                                       // 稍微放慢，看得清楚打點
      while (t >= nextTick - 1e-9) {                       // 每 0.2 秒打一點：點留在紙帶當時經過打點器的位置
        const d = new THREE.Mesh(dotGeo, dotMat);

    }
    const M = MOTIONS[motion];
    $('m4kv').innerHTML = `<span>運動方式</span><b>${motion === 'uniform' ? '等速' : '加速度'}</b><span>時間 t</span><b>${fmt(t)} s</b>
      <span>已打點數</span><b>${dots.length} 點</b><span>小車速度</span><b>${fmt((M.v0 + M.a * t) * CM, 1)} cm/s</b>`;
    // 長條圖
    const c = $('bars'), dpr = Math.min(window.devicePixelRatio, 2), W = c.clientWidth, H = c.clientHeight;
    if (W) {
      if (c.width !== W * dpr) { c.width = W * dpr; c.height = H * dpr; }
      const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
      const max = Math.max(3.5, ...sp), n = Math.max(12, sp.length), bw = (W - 16) / n;
      g.fillStyle = '#8a8f8c'; g.font = '10px -apple-system, "PingFang TC", sans-serif';
      sp.forEach((v, i) => {
        const h = (H - 26) * v / max;
        g.fillStyle = motion === 'uniform' ? '#3f7be8' : '#e5484d';
        g.beginPath(); g.roundRect(8 + i * bw + 1, H - 14 - h, bw - 2, h, 3); g.fill();
      });
      g.fillStyle = '#4a4f4c'; g.fillText(sp.length ? `最後一段：${fmt(sp[sp.length - 1], 1)} cm` : '尚未打點', 8, 12);
    }
    $('m4tip').innerHTML = motion === 'uniform'
      ? '<b>等速</b>：每 0.2 秒走的距離都一樣 → 點的間距<b>完全相等</b>。'
      : '<b>加速度</b>：速度越來越快 → 每 0.2 秒走得越來越遠 → 點的間距<b>越來越大</b>（而且每次增加的量相同）。';
  }

  /* ----- 暫停後：在紙帶上拖曳測量 ----- */
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let measuring = false, mStart = 0;
  const tapeLocalX = e => {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObject(paper)[0];
    if (!hit) return null;
    let lx = tape.worldToLocal(hit.point.clone()).x;
    // 靠近黑點時自動吸附
    let best = null;
    dots.forEach(d => { if (Math.abs(d.position.x - lx) < 0.12 && (!best || Math.abs(d.position.x - lx) < Math.abs(best.position.x - lx))) best = d; });
    return best ? best.position.x : lx;
  };
  const showMeasure = (a, b) => {
    const len = Math.abs(b - a);
    measure.visible = len > 0.01;
    mLine.scale.y = len; mLine.position.set((a + b) / 2, 0.12, 0);
    mEnds[0].position.set(a, 0.12, 0); mEnds[1].position.set(b, 0.12, 0);
    const between = dots.filter(d => d.position.x > Math.min(a, b) - 1e-6 && d.position.x < Math.max(a, b) + 1e-6).length;
    const intervals = Math.max(0, between - 1);
    lMeasure.visible = len > 0.01;
    lMeasure.pos.copy(tape.localToWorld(V3((a + b) / 2, 0.6, 0)));
    lMeasure.el.innerHTML = `${fmt(len * CM, 1)} cm${intervals ? `｜${intervals} 個間隔 = ${fmt(intervals * TICK, 1)} 秒` : ''}`;
  };
  renderer.domElement.addEventListener('pointerdown', e => {
    if (mode !== 'm4' || (running && !paused)) return;
    const x = tapeLocalX(e);
    if (x === null) return;
    e.stopImmediatePropagation();
    measuring = true; mStart = x; controls.enabled = false;
    renderer.domElement.setPointerCapture(e.pointerId);
    showMeasure(x, x);
  }, { capture: true });
  renderer.domElement.addEventListener('pointermove', e => {
    if (!measuring) return;
    const x = tapeLocalX(e);
    if (x !== null) showMeasure(mStart, x);
  });
  const endMeasure = () => { measuring = false; controls.enabled = true; };
  renderer.domElement.addEventListener('pointerup', endMeasure);
  renderer.domElement.addEventListener('pointercancel', endMeasure);

  $('m4Go').addEventListener('click', () => { if (!running) { reset(); running = true; } else if (paused) { paused = false; $('m4Pause').textContent = '⏸ 暫停'; } });
  $('m4Pause').addEventListener('click', () => {
    if (!running && !dots.length) return;
    paused = !paused;
    $('m4Pause').textContent = paused ? '▶ 繼續' : '⏸ 暫停';
    if (paused) banner('已暫停：用滑鼠在紙帶上拖曳，測量兩點的距離', 3000);
  });
  $('m4Reset').addEventListener('click', reset);
  $('tapeMode').addEventListener('change', reset);
  return { group, update, enter: () => { $('dataBody').innerHTML = ''; reset(); }, camera: { pos: [2.6, 8.5, 13], target: [2.6, 0.2, 0.4] }, spacings, start: m => { $('tapeMode').value = m; reset(); running = true; }, get dots() { return dots; } };
})();

/* =========================================================
   模式切換與主迴圈
   ========================================================= */
const MODES = { m1: M1, m2: M2, m3: M3, m4: M4 };
Object.values(MODES).forEach(m => { m.group.visible = false; scene.add(m.group); });
let mode = 'm1';

function resetView() {
  const c = MODES[mode].camera;
  const pos = V3(...c.pos), tgt = V3(...c.target);
  if (!window.MobileView?.isMobile()) {
    // 桌機：讓場景置中在左右兩個面板之間
    const visW = 2 * pos.distanceTo(tgt) * Math.tan(camera.fov * Math.PI / 360) * camera.aspect;
    const lp = $('panel'), rp = $('data');
    const left = lp.classList.contains('collapsed') ? 0 : lp.getBoundingClientRect().right;
    const right = rp.classList.contains('collapsed') ? 0 : window.innerWidth - rp.getBoundingClientRect().left;
    const shift = (right - left) / 2 / window.innerWidth * visW;
    pos.x += shift; tgt.x += shift;
  }
  camera.position.copy(pos);
  controls.target.copy(tgt);
  controls.update();
  // 直式手機：①②④ 是很長的水平軌道，要退更遠；③ 是直立的，退一點就夠
  window.MobileView?.frame(camera, controls, mode === 'm3' ? 1.9 : 1.65);
}
function setMode(m) {
  mode = m;
  Object.entries(MODES).forEach(([k, v]) => { v.group.visible = k === m; });
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  document.querySelectorAll('.section').forEach(s => { s.hidden = s.dataset.mode !== m; });
  hideBanner();
  MODES[m].enter();
  resetView();
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
$('viewBtn').addEventListener('click', resetView);
document.querySelectorAll('.collapse').forEach(b => b.addEventListener('click', () => {
  const p = $(b.dataset.target);
  const c = p.classList.toggle('collapsed');
  b.textContent = c ? '展開' : '收合';
}));

function resize() {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.fov = 40;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

const clock = new THREE.Clock();
function frame(dt) {
  MODES[mode].update(dt);
  controls.update();
  placeLabels();
  window.MobileView?.offset(camera);
  renderer.render(scene, camera);
}
function animate() { frame(Math.min(clock.getDelta(), 0.05)); requestAnimationFrame(animate); }

window.kin = { M1, M2, M3, M4, setMode, frame, camera, controls, scene };   // 除錯 / 驗證用

resize();
setMode('m1');
animate();
</script>

<script>
setTimeout(() => {
  if (!window.__kinReady) {
    document.getElementById('scene').innerHTML = '<div class="fallback">無法載入 Three.js。<br>請確認電腦已連上網路後重新整理。</div>';
  }
}, 6000);
</script>
<script src="lesson.js" defer></script>
</body>
</html>
