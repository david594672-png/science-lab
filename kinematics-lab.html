<!DOCTYPE html>
<html lang="zh-Hant" data-subject="phy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>直線運動</title>
<link rel="stylesheet" href="lab-kit.css">
</head>
<body>
<canvas id="cv" aria-label="小車直線運動與位置、速度、加速度圖形"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g9">← 回課程總覽</a>
  <h1>直線運動</h1>
  <p class="sub">國三理化 · 直線運動（等速度、等加速度）</p>

  <div class="body">
    <div class="group">
      <div class="group-title">選一種運動</div>
      <div class="chips" style="--n:4" id="preset">
        <button class="btn" data-k="rest" aria-pressed="false">靜止</button>
        <button class="btn" data-k="uni" aria-pressed="true">等速</button>
        <button class="btn" data-k="acc" aria-pressed="false">加速</button>
        <button class="btn" data-k="dec" aria-pressed="false">減速</button>
      </div>
      <div class="ctrl" style="margin-top:8px"><label for="v0">初速度 <output id="v0Val"></output></label><input type="range" id="v0" min="0" max="10" step="0.5" value="4"></div>
      <div class="ctrl"><label for="a">加速度 <output id="aVal"></output></label><input type="range" id="a" min="-2" max="2" step="0.25" value="0"></div>
      <div class="row"><button class="btn primary grow" id="go">▶ 出發</button><button class="btn" id="reset">重來</button></div>
    </div>
    <div class="group">
      <dl class="live">
        <dt>時間 t</dt><dd id="t">—</dd>
        <dt>位置 x</dt><dd id="x">—</dd>
        <dt>速度 v</dt><dd id="v">—</dd>
      </dl>
      <label class="sw" style="margin-top:6px"><input type="checkbox" id="area" checked><span class="track"></span>v－t 圖下的面積 = 位移</label>
    </div>
    <div class="group">
      <p class="note">紙帶上的點每 <b>0.5 秒</b>打一個：點的間隔<b>一樣</b>是等速度；間隔<b>越來越大</b>是加速；<b>越來越小</b>是減速。<br>x－t 圖的<b>斜率</b>是速度；v－t 圖的斜率是加速度，<b>面積</b>是位移。</p>
    </div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script>
(() => {
  const $ = Lab.$;
  const PRE = { rest: [0, 0], uni: [4, 0], acc: [0, 1.5], dec: [8, -1.5] };
  const S = { v0: 4, a: 0, run: false, t: 0, x: 0, v: 4, dots: [], hist: [] };
  const TMAX = 10, XMAX = 60;
  function reset() { S.run = false; S.t = 0; S.x = 0; S.v = S.v0; S.dots = [0]; S.hist = [[0, 0, S.v0]]; $('go').textContent = '▶ 出發'; }

  function graph(ctx, x, y, w, h, title, ymin, ymax, idx, color, areaOn) {
    Lab.glass(x, y, w, h, 12);
    const px = x + 40, py = y + 30, pw = w - 54, ph = h - 54;
    const X = t => px + t / TMAX * pw, Y = v => py + ph - (v - ymin) / (ymax - ymin) * ph;
    for (let i = 1; i <= 4; i++) Lab.line(px, py + ph * (i - 1) / 4, px + pw, py + ph * (i - 1) / 4, 'rgba(238,241,250,.07)', 1);
    for (let t = 2; t <= TMAX; t += 2) Lab.line(X(t), py, X(t), py + ph, 'rgba(238,241,250,.05)', 1);
    Lab.line(px, Y(0), px + pw, Y(0), 'rgba(238,241,250,.4)', 1.2); Lab.line(px, py, px, py + ph, 'rgba(238,241,250,.4)', 1.2);
    Lab.circle(x + 16, y + 15, 4, color);
    Lab.text(title, x + 26, y + 15, '#eef1fa', 13, 'left', 'bold');
    Lab.text('t（s）', px + pw + 8, py + ph + 26, 'rgba(238,241,250,.5)', 11, 'right');
    Lab.text(String(ymax), px - 6, py, 'rgba(238,241,250,.4)', 10, 'right');
    for (let t = 2; t <= TMAX; t += 2) Lab.text(String(t), X(t), Y(0) + 11, 'rgba(238,241,250,.4)', 10);
    if (S.hist.length < 2) return;
    if (areaOn) {
      ctx.fillStyle = Lab.lg(0, py, 0, py + ph, [Lab.alpha(color, .45), Lab.alpha(color, .12)]); ctx.beginPath(); ctx.moveTo(X(0), Y(0));
      S.hist.forEach(p => ctx.lineTo(X(p[0]), Y(p[idx]))); ctx.lineTo(X(S.t), Y(0)); ctx.closePath(); ctx.fill();
      Lab.text(`面積 = ${S.x.toFixed(1)} m`, X(S.t / 2), Y(0) - 14, '#fff', 12, 'center', 'bold');
    }
    ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = 10;
    ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.beginPath();
    S.hist.forEach((p, i) => (i ? ctx.lineTo(X(p[0]), Y(p[idx])) : ctx.moveTo(X(p[0]), Y(p[idx]))));
    ctx.stroke(); ctx.restore();
    const lp = S.hist[S.hist.length - 1];
    Lab.circle(X(lp[0]), Y(lp[idx]), 5, '#fff', color, 2.5);
  }

  function scene(ctx, w, top, bot) {
    // 天空與遠山
    ctx.fillStyle = Lab.lg(0, top, 0, bot, ['#16325e', '#2f6aa3', '#7fb3d9']); ctx.fillRect(0, top, w, bot - top);
    Lab.circle(w * 0.82, top + 34, 18, Lab.rg(w * 0.82, top + 34, 4, 40, ['rgba(255,244,200,1)', 'rgba(255,230,150,.35)', 'rgba(255,230,150,0)']));
    Lab.circle(w * 0.82, top + 34, 13, '#fff6d0');
    Lab.cloud(w * 0.2, top + 52, 0.7, 0.55); Lab.cloud(w * 0.55, top + 40, 0.5, 0.45);
    ctx.fillStyle = '#3b6b7a'; ctx.beginPath(); ctx.moveTo(0, bot - 30);
    for (let x = 0; x <= w; x += 20) ctx.lineTo(x, bot - 40 - 24 * Math.sin(x / 140) - 12 * Math.sin(x / 47 + 1));
    ctx.lineTo(w, bot); ctx.lineTo(0, bot); ctx.fill();
    ctx.fillStyle = '#3f8a5a'; ctx.beginPath(); ctx.moveTo(0, bot - 18);
    for (let x = 0; x <= w; x += 20) ctx.lineTo(x, bot - 22 - 8 * Math.sin(x / 90 + 2));
    ctx.lineTo(w, bot); ctx.lineTo(0, bot); ctx.fill();
  }

  function draw(ctx, w, h, dt) {
    if (S.run && S.t < TMAX) {
      const d = Math.min(dt, TMAX - S.t);
      S.t += d;
      const vNew = S.v + S.a * d;
      if (S.a < 0 && vNew <= 0) { S.x += S.v * S.v / (-2 * S.a) * (S.v > 0 ? 1 : 0); S.v = 0; S.a = 0; }
      else { S.x += (S.v + vNew) / 2 * d; S.v = vNew; }
      S.hist.push([S.t, S.x, S.v]);
      if (Math.floor(S.t / 0.5) >= S.dots.length) S.dots.push(S.x);
      if (S.t >= TMAX || S.x > XMAX) { S.run = false; $('go').textContent = '▶ 出發'; }
    }
    // 場景：天空、道路、里程樁
    const roadY = 150, tx0 = 70, tx1 = w - 50, X = x => tx0 + Math.min(x, XMAX) / XMAX * (tx1 - tx0);
    scene(ctx, w, 0, roadY);
    ctx.fillStyle = Lab.lg(0, roadY, 0, roadY + 34, ['#4a4f5c', '#2c303a']); ctx.fillRect(0, roadY, w, 34);
    Lab.line(0, roadY + 1, w, roadY + 1, '#c9ced8', 2);
    Lab.line(0, roadY + 17, w, roadY + 17, 'rgba(255,214,90,.8)', 2, [18, 14]);
    for (let m = 0; m <= XMAX; m += 10) {
      const mx = X(m);
      Lab.line(mx, roadY - 2, mx, roadY - 26, '#e8ecf3', 3);
      Lab.card(mx - 17, roadY - 44, 34, 18, '#1f8a4c', '#eaf7ee', 4);
      Lab.text(m + ' m', mx, roadY - 35, '#fff', 11, 'center', 'bold');
    }
    // 起跑線（棋盤格）
    for (let i = 0; i < 2; i++) for (let j = 0; j < 6; j++) { ctx.fillStyle = (i + j) % 2 ? '#111' : '#f4f4f4'; ctx.fillRect(tx0 - 6 + i * 6, roadY + 2 + j * 5.3, 6, 5.3); }
    const cx = X(S.x);
    Lab.car(cx - 36, roadY + 14, 0.62, '#4f8cff', S.x / 0.35);   // 以車頭對準位置
    if (Math.abs(S.v) > 0.05) Lab.force(cx + 10, roadY - 62, cx + 10 + S.v * 9, roadY - 62, '#ffd34d', `v = ${S.v.toFixed(1)} m/s`, 4);
    if (Math.abs(S.a) > 0.01 && S.v > 0.01) Lab.force(cx - 10, roadY - 106, cx - 10 + S.a * 22, roadY - 106, '#ffa64d', `a = ${S.a.toFixed(2)}`, 3);
    // 打點計時器與紙帶
    const py = roadY + 66;
    Lab.card(8, py - 22, 52, 44, Lab.lg(0, py - 22, 0, py + 22, ['#6d7487', '#3c4252']), '#9aa3b8', 6);
    Lab.circle(34, py, 6, S.run && (S.t * 4 % 1) < 0.3 ? '#ff6b5e' : '#552', '#222', 1.5);
    Lab.text('打點器', 34, py + 30, 'rgba(238,241,250,.55)', 10);
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
    Lab.card(60, py - 13, Math.max(10, cx - 60), 26, Lab.lg(0, py - 13, 0, py + 13, ['#fbf5e4', '#e9dfc4']), null, 2);
    ctx.restore();
    S.dots.forEach((x, i) => { if (X(x) <= cx) { Lab.circle(X(x), py, 3.6, '#1a2238'); if (i && i % 2 === 0) Lab.text((i / 2) + 's', X(x), py + 22, 'rgba(238,241,250,.45)', 9); } });
    Lab.text('紙帶（每 0.5 秒打一點）', w - 20, py - 26, 'rgba(238,241,250,.6)', 12, 'right');
    // 三張圖
    const gy = py + 44, gh = Math.max(120, (h - gy - 30) * 0.6), gw = (w - 50) / 2;
    graph(ctx, 20, gy, gw, gh, '位置 x－t', 0, XMAX, 1, '#4fd18b');
    graph(ctx, 30 + gw, gy, gw, gh, '速度 v－t', 0, 12, 2, '#5fa2ff', $('area').checked);
    const ga = gy + gh + 12;
    if (ga + 80 < h) {
      const ah = h - ga - 10;
      Lab.glass(20, ga, w - 40, ah, 12);
      const mid = ga + ah / 2 + 8;
      Lab.circle(36, ga + 15, 4, '#ffa64d');
      Lab.text('加速度 a－t', 46, ga + 15, '#eef1fa', 13, 'left', 'bold');
      Lab.line(58, mid, w - 30, mid, 'rgba(238,241,250,.4)', 1.2);
      Lab.text('0', 50, mid, 'rgba(238,241,250,.4)', 10, 'right');
      const yA = mid - S.a / 2 * (ah / 2 - 18), xe = 58 + (w - 90) * Math.min(1, S.t / TMAX || 0.001);
      ctx.fillStyle = 'rgba(255,166,77,.18)'; ctx.fillRect(58, Math.min(mid, yA), xe - 58, Math.abs(yA - mid));
      ctx.save(); ctx.shadowColor = '#ffa64d'; ctx.shadowBlur = 10; Lab.line(58, yA, xe, yA, '#ffa64d', 3); ctx.restore();
      Lab.text(`a = ${S.a.toFixed(2)} m/s²${S.a === 0 ? '（等速度或靜止）' : ''}`, w - 40, ga + 15, '#ffa64d', 13, 'right', 'bold');
    }
  }

  Lab.init({
    draw,
    ui() { $('t').textContent = S.t.toFixed(1) + ' s'; $('x').textContent = S.x.toFixed(1) + ' m'; $('v').textContent = S.v.toFixed(1) + ' m/s'; }
  });
  const setSl = (id, v) => { const el = $(id); el.value = v; el.dispatchEvent(new Event('input')); };
  Lab.bindSlider('v0', v => { S.v0 = v; reset(); }, v => v + ' m/s');
  Lab.bindSlider('a', v => { S.a = v; S.aSet = v; reset(); }, v => v + ' m/s²');
  Lab.bindGroup('#preset .btn', k => { setSl('v0', PRE[k][0]); setSl('a', PRE[k][1]); });
  $('go').addEventListener('click', () => { if (S.t >= TMAX || S.x > XMAX) { S.a = S.aSet ?? S.a; reset(); } S.run = !S.run; $('go').textContent = S.run ? '❚❚ 暫停' : '▶ 繼續'; });
  $('reset').addEventListener('click', () => { S.a = S.aSet ?? S.a; reset(); });
  window.kinSim = S;
})();
</script>
<script src="lesson.js" defer></script>
</body>
</html>
