<!DOCTYPE html>
<html lang="zh-Hant" data-subject="phy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>牛頓運動定律</title>
<link rel="stylesheet" href="lab-kit.css">
</head>
<body>
<canvas id="cv" aria-label="慣性、F = ma 與作用力反作用力的模擬"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g9">← 回課程總覽</a>
  <h1>牛頓運動定律</h1>
  <p class="sub">國三理化 · 力與運動</p>

  <div class="body">
    <div class="modes" style="--n:3">
      <button class="mode" data-k="inertia" aria-pressed="true">第一定律<br>慣性</button>
      <button class="mode" data-k="fma" aria-pressed="false">第二定律<br>F = ma</button>
      <button class="mode" data-k="pair" aria-pressed="false">第三定律<br>作用反作用</button>
    </div>

    <div data-mode="inertia">
      <div class="group">
        <div class="row"><button class="btn primary grow" id="busGo">公車起動</button><button class="btn grow" id="busStop">緊急煞車</button></div>
        <div class="row"><button class="btn grow" id="busReset">重來</button></div>
      </div>
    </div>

    <div data-mode="fma" hidden>
      <div class="group">
        <div class="ctrl"><label for="F">拉力 F <output id="FVal"></output></label><input type="range" id="F" min="0" max="12" step="1" value="6"></div>
        <div class="ctrl"><label for="m">小車質量 m <output id="mVal"></output></label><input type="range" id="m" min="1" max="6" step="0.5" value="2"></div>
        <div class="row"><button class="btn primary grow" id="pull">▶ 拉動小車</button><button class="btn" id="mark">記錄這一點</button></div>
        <dl class="live" style="margin-top:8px"><dt>加速度 a = F ÷ m</dt><dd id="acc">—</dd><dt>速度</dt><dd id="spd">—</dd></dl>
      </div>
    </div>

    <div data-mode="pair" hidden>
      <div class="group">
        <div class="ctrl"><label for="mA">左邊的人 <output id="mAVal"></output></label><input type="range" id="mA" min="30" max="90" step="5" value="40"></div>
        <div class="ctrl"><label for="mB">右邊的人 <output id="mBVal"></output></label><input type="range" id="mB" min="30" max="90" step="5" value="80"></div>
        <div class="row"><button class="btn primary grow" id="push">互推一下</button><button class="btn" id="pairReset">重來</button></div>
        <dl class="live" style="margin-top:8px"><dt>互推的力</dt><dd>大小相等、方向相反</dd><dt>左／右速度</dt><dd id="pv">—</dd></dl>
      </div>
    </div>

    <div class="group"><div class="result" id="info"></div></div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script>
(() => {
  const $ = Lab.$;
  const S = { mode: 'inertia', bus: { v: 0, a: 0, lean: 0, turn: 0, x: 0, ball: 0, ballV: 0, msg: '' }, F: 6, m: 2, cart: { x: 0, v: 0, run: false }, pts: [], mA: 40, mB: 80, p: { xa: 0, xb: 0, va: 0, vb: 0, t: -1 } };

  function drawInertia(ctx, w, h, dt) {
    const b = S.bus;
    // 公車加速度：起動、煞車
    b.v = Math.max(0, b.v + b.a * dt); if (b.a > 0 && b.v > 8) b.a = 0; if (b.a < 0 && b.v === 0) b.a = 0;
    b.x = (b.x + b.v * dt * 30) % 200;
    // 乘客與吊環向「加速度的反方向」傾
    const target = -b.a * 0.09 + b.turn * 0.0;
    b.lean += (target - b.lean) * Math.min(1, dt * 6);
    // 地板上的球：沒有摩擦，相對公車往加速度反方向滾
    b.ballV += -b.a * dt * 40; b.ball += b.ballV * dt; if (Math.abs(b.ball) > 220) { b.ball = Math.sign(b.ball) * 220; b.ballV = 0; }
    const cx = w * 0.45, gy = h * 0.6, bw = Math.min(560, w * 0.8);
    // 路面
    for (let i = -1; i < w / 200 + 1; i++) Lab.line(i * 200 - b.x, gy + 70, i * 200 - b.x + 100, gy + 70, 'rgba(255,255,255,.4)', 4);
    Lab.card(cx - bw / 2, gy - 160, bw, 200, 'rgba(95,162,255,.18)', '#9fc4ff', 18);
    Lab.circle(cx - bw / 2 + 80, gy + 46, 26, '#13233f', '#9fb4d6', 4); Lab.circle(cx + bw / 2 - 80, gy + 46, 26, '#13233f', '#9fb4d6', 4);
    // 吊環
    for (const dx of [-120, 0, 120]) { const ax = cx + dx, ay = gy - 150, L = 50; Lab.line(ax, ay, ax + Math.sin(b.lean) * L, ay + Math.cos(b.lean) * L, '#cfd8e6', 2); Lab.circle(ax + Math.sin(b.lean) * L, ay + Math.cos(b.lean) * L + 8, 8, null, '#cfd8e6', 3); }
    // 乘客（站著，腳固定、上身傾斜）
    const px = cx - 40, py = gy + 30;
    ctx.save(); ctx.translate(px, py); ctx.rotate(b.lean * 1.4);
    Lab.line(0, 0, 0, -70, '#ffd9a8', 8); Lab.circle(0, -84, 14, '#ffd9a8'); Lab.line(0, -60, 22, -40, '#ffd9a8', 6);
    ctx.restore();
    // 球
    Lab.circle(cx + 60 + b.ball, gy + 22, 12, '#ff6b5e');
    Lab.text(`車速 ${b.v.toFixed(1)}`, cx + bw / 2 - 20, gy - 140, '#eef1fa', 14, 'right');
    if (b.a) Lab.arrow(cx, gy - 190, cx + Math.sign(b.a) * 80, gy - 190, '#4fd18b', 4, 14), Lab.text('公車加速度方向', cx + Math.sign(b.a) * 40, gy - 210, '#4fd18b', 13);
    $('info').innerHTML = b.msg || '<b>慣性定律</b>：物體不受外力（或合力為 0）時，<b>靜者恆靜、動者恆做等速度直線運動</b>。按按鈕看看乘客和地上的球。';
  }
  function drawFma(ctx, w, h, dt) {
    const c = S.cart, a = S.F / S.m;
    if (c.run) { c.v += a * dt; c.x += c.v * dt * 30; if (c.x > w * 0.55) c.run = false; }
    const gy = h * 0.32, x0 = 60 + c.x;
    Lab.line(30, gy + 30, w - 30, gy + 30, 'rgba(255,255,255,.35)', 2);
    const cw = 60 + S.m * 12;
    Lab.card(x0, gy - 20, cw, 44, '#5fa2ff', '#fff', 6);
    Lab.circle(x0 + 14, gy + 24, 8, '#13233f', '#9fb4d6', 2); Lab.circle(x0 + cw - 14, gy + 24, 8, '#13233f', '#9fb4d6', 2);
    Lab.text(`${S.m} kg`, x0 + cw / 2, gy + 2, '#fff', 14, 'center', 'bold');
    if (S.F) Lab.arrow(x0 + cw, gy, x0 + cw + S.F * 10, gy, '#ff8a5c', 5, 14);
    Lab.text(`F = ${S.F} N`, x0 + cw + S.F * 5, gy - 22, '#ff8a5c', 14, 'center', 'bold');
    // a－F 圖（不同質量用不同顏色）
    const gx = 40, gyy = gy + 80, gw = w - 80, gh = h - gyy - 20;
    Lab.card(gx, gyy, gw, gh, 'rgba(255,255,255,.03)', 'rgba(255,255,255,.12)', 6);
    const X = F => gx + 40 + F / 12 * (gw - 60), Y = a => gyy + gh - 26 - a / 12 * (gh - 46);
    Lab.line(gx + 40, gyy + gh - 26, gx + gw - 10, gyy + gh - 26, 'rgba(255,255,255,.4)', 1.5); Lab.line(gx + 40, gyy + 10, gx + 40, gyy + gh - 26, 'rgba(255,255,255,.4)', 1.5);
    Lab.text('拉力 F（N）→', gx + gw - 14, gyy + gh - 10, 'rgba(238,241,250,.6)', 12, 'right');
    Lab.text('加速度 a（m/s²）', gx + 46, gyy + 18, 'rgba(238,241,250,.6)', 12, 'left');
    const hue = m => `hsl(${(m * 60) % 360},80%,65%)`;
    S.pts.forEach(([F, m]) => Lab.circle(X(F), Y(F / m), 6, hue(m)));
    Lab.circle(X(S.F), Y(a), 8, null, '#fff', 2);
    $('acc').textContent = a.toFixed(2) + ' m/s²'; $('spd').textContent = c.v.toFixed(1) + ' m/s';
    $('info').innerHTML = '<b>F = ma</b>：質量一定時，加速度和外力<b>成正比</b>；外力一定時，加速度和質量<b>成反比</b>。記錄幾個點看看：同一個質量的點會排成一條通過原點的直線。';
  }
  function drawPair(ctx, w, h, dt) {
    const p = S.p;
    if (p.t >= 0) {
      p.t += dt;
      if (p.t < 0.3) { const F = 120; p.va -= F / S.mA * dt; p.vb += F / S.mB * dt; }
      p.xa += p.va * dt * 40; p.xb += p.vb * dt * 40;
    }
    const gy = h * 0.55, cx = w * 0.45;
    ctx.fillStyle = 'rgba(200,230,255,.15)'; ctx.fillRect(0, gy, w, 40);
    Lab.text('溜冰場（幾乎沒有摩擦）', 20, gy + 60, 'rgba(238,241,250,.5)', 12, 'left');
    const person = (x, m, color) => { const s = 0.7 + m / 150; Lab.circle(x, gy - 110 * s, 16 * s, '#ffd9a8'); Lab.card(x - 18 * s, gy - 92 * s, 36 * s, 60 * s, color, null, 8); Lab.line(x - 8, gy - 32 * s, x - 10, gy, color, 7); Lab.line(x + 8, gy - 32 * s, x + 10, gy, color, 7); Lab.text(m + ' kg', x, gy + 20, '#eef1fa', 13); };
    const xa = cx - 40 + p.xa, xb = cx + 40 + p.xb;
    person(Math.max(30, xa), S.mA, '#5fa2ff'); person(Math.min(w - 30, xb), S.mB, '#ff8a5c');
    if (p.t >= 0 && p.t < 0.6) {
      Lab.arrow(cx, gy - 150, cx - 90, gy - 150, '#5cc8ff', 5, 16); Lab.arrow(cx, gy - 150, cx + 90, gy - 150, '#ff8a5c', 5, 16);
      Lab.text('B 推 A', cx - 50, gy - 172, '#5cc8ff', 14, 'center', 'bold'); Lab.text('A 推 B', cx + 50, gy - 172, '#ff8a5c', 14, 'center', 'bold');
    }
    $('pv').textContent = `${Math.abs(p.va).toFixed(2)} ／ ${p.vb.toFixed(2)} m/s`;
    $('info').innerHTML = '<b>作用力與反作用力</b>：A 推 B 時，B 也同時推 A，兩力<b>大小相等、方向相反</b>，作用在<b>不同物體</b>上。質量小的人得到的加速度比較大，所以滑得比較快。';
  }

  Lab.init({ draw(ctx, w, h, dt) { S.mode === 'inertia' ? drawInertia(ctx, w, h, dt) : S.mode === 'fma' ? drawFma(ctx, w, h, dt) : drawPair(ctx, w, h, dt); } });
  const b = S.bus;
  $('busGo').addEventListener('click', () => { b.a = 3; b.msg = '公車<b>突然起動</b>：乘客的身體想保持<b>靜止</b>，所以<b>往後倒</b>；地上的球往後滾。'; });
  $('busStop').addEventListener('click', () => { if (b.v < 1) b.v = 8; b.a = -6; b.msg = '公車<b>緊急煞車</b>：乘客的身體想保持<b>原來的速度</b>繼續往前，所以<b>往前傾</b>；球往前滾。這就是要繫安全帶的原因。'; });
  $('busReset').addEventListener('click', () => { Object.assign(b, { v: 0, a: 0, lean: 0, x: 0, ball: 0, ballV: 0, msg: '' }); });
  Lab.bindSlider('F', v => (S.F = v), v => v + ' N');
  Lab.bindSlider('m', v => (S.m = v), v => v + ' kg');
  $('pull').addEventListener('click', () => { S.cart = { x: 0, v: 0, run: true }; });
  $('mark').addEventListener('click', () => { S.pts.push([S.F, S.m]); });
  Lab.bindSlider('mA', v => (S.mA = v), v => v + ' kg');
  Lab.bindSlider('mB', v => (S.mB = v), v => v + ' kg');
  $('push').addEventListener('click', () => { S.p = { xa: 0, xb: 0, va: 0, vb: 0, t: 0 }; });
  $('pairReset').addEventListener('click', () => { S.p = { xa: 0, xb: 0, va: 0, vb: 0, t: -1 }; });
  Lab.bindGroup('.mode', k => { S.mode = k; Lab.showMode(k); });
  window.newtonSim = S;
})();
</script>
<script src="lesson.js" defer></script>
</body>
</html>
