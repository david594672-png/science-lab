<!DOCTYPE html>
<html lang="zh-Hant" data-subject="phy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>牛頓運動定律</title>
<link rel="stylesheet" href="lab-kit.css">
</head>
<body>
<canvas id="cv" aria-label="慣性、F = ma 與作用力反作用力的模擬"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g9">← 回課程總覽</a>
  <h1>牛頓運動定律</h1>
  <p class="sub">國三理化 · 力與運動</p>

  <div class="body">
    <div class="modes" style="--n:3">
      <button class="mode" data-k="inertia" aria-pressed="true">第一定律<br>慣性</button>
      <button class="mode" data-k="fma" aria-pressed="false">第二定律<br>F = ma</button>
      <button class="mode" data-k="pair" aria-pressed="false">第三定律<br>作用反作用</button>
    </div>

    <div data-mode="inertia">
      <div class="group">
        <div class="row"><button class="btn primary grow" id="busGo">公車起動</button><button class="btn grow" id="busStop">緊急煞車</button></div>
        <div class="row"><button class="btn grow" id="busReset">重來</button></div>
      </div>
    </div>

    <div data-mode="fma" hidden>
      <div class="group">
        <div class="ctrl"><label for="F">拉力 F <output id="FVal"></output></label><input type="range" id="F" min="0" max="12" step="1" value="6"></div>
        <div class="ctrl"><label for="m">小車質量 m <output id="mVal"></output></label><input type="range" id="m" min="1" max="6" step="0.5" value="2"></div>
        <div class="row"><button class="btn primary grow" id="pull">▶ 拉動小車</button><button class="btn" id="mark">記錄這一點</button></div>
        <dl class="live" style="margin-top:8px"><dt>加速度 a = F ÷ m</dt><dd id="acc">—</dd><dt>速度</dt><dd id="spd">—</dd></dl>
      </div>
    </div>

    <div data-mode="pair" hidden>
      <div class="group">
        <div class="ctrl"><label for="mA">左邊的人 <output id="mAVal"></output></label><input type="range" id="mA" min="30" max="90" step="5" value="40"></div>
        <div class="ctrl"><label for="mB">右邊的人 <output id="mBVal"></output></label><input type="range" id="mB" min="30" max="90" step="5" value="80"></div>
        <div class="row"><button class="btn primary grow" id="push">互推一下</button><button class="btn" id="pairReset">重來</button></div>
        <dl class="live" style="margin-top:8px"><dt>互推的力</dt><dd>大小相等、方向相反</dd><dt>左／右速度</dt><dd id="pv">—</dd></dl>
      </div>
    </div>

    <div class="group"><div class="result" id="info"></div></div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script>
(() => {
  const $ = Lab.$;
  const S = { mode: 'inertia', bus: { v: 0, a: 0, lean: 0, turn: 0, x: 0, ball: 0, ballV: 0, msg: '' }, F: 6, m: 2, cart: { x: 0, v: 0, run: false }, pts: [], mA: 40, mB: 80, p: { xa: 0, xb: 0, va: 0, vb: 0, t: -1 } };

  // 街景建築（固定亂數，畫面才不會閃）
  const BLD = []; { let r = 7; const rnd = () => ((r = (r * 9301 + 49297) % 233280) / 233280); for (let i = 0, x = 0; i < 14; i++) { const bw = 60 + rnd() * 70; BLD.push({ x, w: bw, h: 80 + rnd() * 150, c: ['#2b3f63', '#334a73', '#3a3f66', '#2d5163'][i % 4] }); x += bw + 8; } }
  const BLD_W = BLD.reduce((m, q) => Math.max(m, q.x + q.w + 8), 0);

  function street(ctx, w, gy, dist) {
    ctx.fillStyle = Lab.lg(0, 0, 0, gy, ['#0f1a33', '#23365e', '#40618f']); ctx.fillRect(0, 0, w, gy);
    for (const [par, sc, al] of [[0.25, 0.55, 0.6], [0.6, 1, 1]]) {
      const off = (dist * par) % BLD_W;
      for (let k = -1; k <= Math.ceil(w / BLD_W) + 1; k++) BLD.forEach(q => {
        const x = q.x + k * BLD_W - off, bh = q.h * sc;
        if (x > w || x + q.w < 0) return;
        ctx.globalAlpha = al; ctx.fillStyle = q.c; ctx.fillRect(x, gy - 40 - bh, q.w, bh);
        if (par > 0.5) for (let wy = gy - 40 - bh + 12; wy < gy - 52; wy += 18) for (let wx = x + 8; wx < x + q.w - 10; wx += 16) { ctx.fillStyle = ((q.x + wx - x) * 7 + wy * 3 | 0) % 5 ? 'rgba(255,220,140,.55)' : 'rgba(255,255,255,.08)'; ctx.fillRect(wx, wy, 8, 10); }
        ctx.globalAlpha = 1;
      });
    }
    // 人行道與馬路
    ctx.fillStyle = '#5b6170'; ctx.fillRect(0, gy - 40, w, 14);
    ctx.fillStyle = Lab.lg(0, gy - 26, 0, gy + 60, ['#3a3e48', '#22252c']); ctx.fillRect(0, gy - 26, w, 400);
    const off = dist % 120;
    for (let x = -off; x < w; x += 120) { ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(x, gy + 34, 60, 5); }
  }

  function drawInertia(ctx, w, h, dt) {
    const b = S.bus;
    // 公車加速度：起動、煞車
    b.v = Math.max(0, b.v + b.a * dt); if (b.a > 0 && b.v > 8) b.a = 0; if (b.a < 0 && b.v === 0) b.a = 0;
    b.x += b.v * dt * 30;
    // 乘客向「加速度的反方向」傾
    const target = -b.a * 0.09;
    b.lean += (target - b.lean) * Math.min(1, dt * 6);
    // 地板上的球：沒有摩擦，相對公車往加速度反方向滾
    b.ballV += -b.a * dt * 40; b.ball += b.ballV * dt; if (Math.abs(b.ball) > 200) { b.ball = Math.sign(b.ball) * 200; b.ballV = 0; }
    const gy = Math.min(h * 0.72, h - 90), cx = w * 0.47, bw = Math.min(600, w * 0.84), bh = 210, x0 = cx - bw / 2, top = gy - 26 - bh;
    street(ctx, w, gy, b.x);
    // 公車車身
    Lab.shadow(cx, gy + 4, bw * 0.55, 10, 0.55);
    Lab.rr(x0, top, bw, bh, 22);
    ctx.fillStyle = Lab.lg(0, top, 0, top + bh, ['#ffd25e', '#f2a93b', '#c97b1c']); ctx.fill();
    ctx.strokeStyle = '#7a4a10'; ctx.lineWidth = 2; ctx.stroke();
    // 車內（剖面）
    const ix = x0 + 26, iy = top + 22, iw = bw - 70, ih = bh - 74, floor = iy + ih;
    Lab.rr(ix, iy, iw, ih, 12); ctx.fillStyle = Lab.lg(0, iy, 0, floor, ['#dbe9f7', '#b9cde2']); ctx.fill();
    ctx.strokeStyle = '#5b4a2b'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#7d8799'; ctx.fillRect(ix + 2, floor - 8, iw - 4, 6);
    Lab.line(ix + 10, iy + 18, ix + iw - 10, iy + 18, '#8f9bb0', 4);
    // 車頭擋風玻璃與車燈
    ctx.fillStyle = Lab.lg(x0 + bw - 40, 0, x0 + bw, 0, ['#9cc3e6', '#4d7aa8']); Lab.rr(x0 + bw - 38, top + 24, 28, ih - 30, 8); ctx.fill();
    Lab.circle(x0 + bw - 12, top + bh - 40, 7, '#fff7c2');
    Lab.circle(x0 + 10, top + bh - 40, 6, '#ff5b4b');
    ctx.fillStyle = '#2d6fb3'; ctx.fillRect(x0 + 4, top + bh - 34, bw - 8, 8);
    Lab.pill(`車速 ${b.v.toFixed(1)} m/s`, x0 + bw - 80, top - 30, '#ffd25e', 13);
    // 吊環
    for (const dx of [-0.32, 0.02, 0.36]) {
      const ax = cx + dx * bw, ay = iy + 18, L = 34, ex = ax + Math.sin(b.lean) * L, ey = ay + Math.cos(b.lean) * L;
      Lab.line(ax, ay, ex, ey, '#5d6a80', 3); Lab.circle(ex + Math.sin(b.lean) * 9, ey + 9, 9, null, '#3d8bfd', 4);
    }
    // 乘客（腳固定在地板、上身隨慣性傾斜）
    const L = b.lean * 1.4;
    Lab.person(cx - bw * 0.14, floor - 7, 0.92, { lean: L, hand: [Math.sin(L) * 36 + 8, Math.cos(L) * 34], hand2: [Math.sin(L) * 36 - 4, Math.cos(L) * 34], shirt: '#3fb68b' });
    // 球
    Lab.shadow(cx + bw * 0.2 + b.ball, floor - 7, 12, 3);
    Lab.ball(cx + bw * 0.2 + b.ball, floor - 19, 12, '#ff6b5e');
    // 輪子
    const spin = b.x / 28;
    [x0 + bw * 0.18, x0 + bw * 0.82].forEach(wx => { Lab.circle(wx, gy - 26, 34, '#1d2230'); Lab.wheel(wx, gy - 26, 26, spin); });
    if (b.a) Lab.force(cx, top - 30, cx + Math.sign(b.a) * 90, top - 30, '#4fd18b', b.a > 0 ? '公車加速' : '公車減速');
    $('info').innerHTML = b.msg || '<b>慣性定律</b>：物體不受外力（或合力為 0）時，<b>靜者恆靜、動者恆做等速度直線運動</b>。按按鈕看看乘客和地上的球。';
  }

  function drawFma(ctx, w, h, dt) {
    const c = S.cart, a = S.F / S.m;
    const tx0 = 40, tx1 = w - 40, gy = Math.max(150, h * 0.3);
    if (c.run) { c.v += a * dt; c.x += c.v * dt * 30; if (c.x > (tx1 - tx0) * 0.62) c.run = false; }
    // 實驗桌與軌道
    ctx.fillStyle = Lab.lg(0, 0, 0, gy + 50, ['#0f1830', '#17233f']); ctx.fillRect(0, 0, w, gy + 50);
    ctx.fillStyle = Lab.lg(0, gy + 14, 0, gy + 50, ['#8a5a32', '#5c3a1e']); ctx.fillRect(0, gy + 14, w, 36);
    ctx.fillStyle = Lab.lg(0, gy, 0, gy + 14, ['#c9d1de', '#7d879a']); ctx.fillRect(tx0, gy, tx1 - tx0, 14);
    for (let x = tx0; x <= tx1; x += 20) Lab.line(x, gy, x, gy + ((x - tx0) % 100 ? 5 : 10), '#3b4252', 1);
    const cw = 96, x0 = tx0 + 20 + c.x, by = gy - 12;
    // 小車＋砝碼（每塊 1 kg）
    Lab.shadow(x0 + cw / 2, gy, cw * 0.5, 5);
    Lab.rr(x0, by - 26, cw, 26, 6); ctx.fillStyle = Lab.lg(0, by - 26, 0, by, ['#7fb0ff', '#3d6fd1']); ctx.fill();
    ctx.strokeStyle = '#1f3f80'; ctx.lineWidth = 1.5; ctx.stroke();
    for (let i = 0; i < S.m; i++) {
      const bx = x0 + 10 + (i % 4) * 20, byy = by - 26 - 14 - Math.floor(i / 4) * 14;
      Lab.rr(bx, byy, 18, 13, 3); ctx.fillStyle = Lab.lg(0, byy, 0, byy + 13, ['#ffe28a', '#c99a2e']); ctx.fill(); ctx.strokeStyle = '#7a5a12'; ctx.lineWidth = 1; ctx.stroke();
    }
    Lab.text(`${S.m} kg`, x0 + cw / 2, by - 13, '#fff', 13, 'center', 'bold');
    Lab.wheel(x0 + 18, gy - 6, 7, c.x / 7); Lab.wheel(x0 + cw - 18, gy - 6, 7, c.x / 7);
    if (S.F) Lab.force(x0 + cw, by - 14, x0 + cw + S.F * 9, by - 14, '#ff8a5c', `F = ${S.F} N`);
    if (c.run || c.v) Lab.text(`a = ${a.toFixed(2)} m/s²`, x0 + cw / 2, by - 60 - Math.floor((S.m - 1) / 4) * 14, '#ffd34d', 14, 'center', 'bold');
    // a－F 圖：每種質量一種顏色，並畫出通過原點的直線 a = F/m
    const gx = 30, gyy = gy + 66, gw = w - 60, gh = h - gyy - 16;
    Lab.glass(gx, gyy, gw, gh, 14);
    const ox = gx + 50, oy = gyy + gh - 32, pw = gw - 70, ph = gh - 64;
    const X = F => ox + F / 12 * pw, Y = acc => oy - acc / 12 * ph;
    for (let i = 1; i <= 6; i++) { Lab.line(ox, Y(i * 2), ox + pw, Y(i * 2), 'rgba(238,241,250,.06)', 1); Lab.text(String(i * 2), ox - 8, Y(i * 2), 'rgba(238,241,250,.4)', 10, 'right'); }
    for (let i = 1; i <= 6; i++) { Lab.line(X(i * 2), oy, X(i * 2), oy - ph, 'rgba(238,241,250,.06)', 1); Lab.text(String(i * 2), X(i * 2), oy + 12, 'rgba(238,241,250,.4)', 10); }
    Lab.line(ox, oy, ox + pw, oy, 'rgba(238,241,250,.45)', 1.5); Lab.line(ox, oy, ox, oy - ph, 'rgba(238,241,250,.45)', 1.5);
    Lab.text('拉力 F（N）', ox + pw, oy + 26, 'rgba(238,241,250,.6)', 12, 'right');
    Lab.text('加速度 a（m/s²）', gx + 14, gyy + 16, '#eef1fa', 13, 'left', 'bold');
    const hue = m => `hsl(${(m * 67) % 360},80%,65%)`;
    const masses = [...new Set(S.pts.map(q => q[1]))];
    masses.forEach((m, i) => {
      const Fe = Math.min(12, 12 * m);
      ctx.save(); ctx.globalAlpha = 0.5; Lab.line(X(0), Y(0), X(Fe), Y(Fe / m), hue(m), 2, [6, 5]); ctx.restore();
      Lab.circle(gx + gw - 110, gyy + 18 + i * 18, 5, hue(m)); Lab.text(`${m} kg`, gx + gw - 98, gyy + 18 + i * 18, hue(m), 12, 'left', 'bold');
    });
    S.pts.forEach(([F, m]) => { ctx.save(); ctx.shadowColor = hue(m); ctx.shadowBlur = 10; Lab.circle(X(F), Y(F / m), 6, hue(m), '#fff', 1.5); ctx.restore(); });
    Lab.circle(X(S.F), Y(a), 9, null, '#fff', 2);
    $('acc').textContent = a.toFixed(2) + ' m/s²'; $('spd').textContent = c.v.toFixed(1) + ' m/s';
    $('info').innerHTML = '<b>F = ma</b>：質量一定時，加速度和外力<b>成正比</b>；外力一定時，加速度和質量<b>成反比</b>。記錄幾個點看看：同一個質量的點會排成一條通過原點的直線。';
  }

  function drawPair(ctx, w, h, dt) {
    const p = S.p;
    if (p.t >= 0) {
      p.t += dt;
      if (p.t < 0.3) { const F = 120; p.va -= F / S.mA * dt; p.vb += F / S.mB * dt; }
      p.xa += p.va * dt * 40; p.xb += p.vb * dt * 40;
    }
    const gy = Math.min(h * 0.62, h - 120), cx = w * 0.47;
    // 溜冰場：看台、圍板、冰面
    ctx.fillStyle = Lab.lg(0, 0, 0, gy - 80, ['#121a33', '#1d2a4d']); ctx.fillRect(0, 0, w, gy - 80);
    for (let r = 0; r < 5; r++) for (let x = (r % 2) * 9; x < w; x += 18) Lab.circle(x, gy - 160 + r * 14, 5, `hsla(${(x * 13 + r * 50) % 360},45%,55%,.35)`);
    ctx.fillStyle = Lab.lg(0, gy - 80, 0, gy - 40, ['#f4f6fb', '#c9d3e3']); ctx.fillRect(0, gy - 80, w, 40);
    ['#e2574c', '#3d8bfd', '#2fb57c', '#f2a93b'].forEach((c2, i) => { ctx.fillStyle = c2; ctx.fillRect(i * w / 4 + 20, gy - 72, w / 4 - 40, 22); });
    ctx.fillStyle = '#e2574c'; ctx.fillRect(0, gy - 42, w, 3);
    ctx.fillStyle = Lab.lg(0, gy - 40, 0, h, ['#cfe6f7', '#9cc6e6', '#7fb0d8']); ctx.fillRect(0, gy - 40, w, h - gy + 40);
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1;
    for (let i = 0; i < 9; i++) { const sx = (i * 137) % w; ctx.beginPath(); ctx.moveTo(sx, gy + 10 + (i * 29) % 60); ctx.quadraticCurveTo(sx + 60, gy + 30 + (i * 17) % 50, sx + 130, gy + 12 + (i * 41) % 60); ctx.stroke(); }
    Lab.line(cx, gy - 40, cx, h, 'rgba(226,87,76,.5)', 3);
    const pushing = p.t >= 0 && p.t < 0.35;
    const skater = (x, m, shirt, dir) => {
      const s = 0.8 + m / 160, reach = pushing || p.t < 0 ? 34 : 14;
      Lab.person(x, gy + 30, s, { lean: dir * (pushing ? 0.12 : 0), hand: [dir * reach, 18], hand2: [dir * (reach - 6), 22], shirt, pants: '#2b3555', face: dir });
      Lab.card(x - 26, gy + 42, 52, 22, 'rgba(255,255,255,.85)', shirt, 11); Lab.text(m + ' kg', x, gy + 53, '#1d2a4d', 12, 'center', 'bold');
    };
    const xa = Math.max(40, cx - 46 + p.xa), xb = Math.min(w - 40, cx + 46 + p.xb);
    skater(xa, S.mA, '#4f8cff', 1); skater(xb, S.mB, '#ff8a5c', -1);
    if (pushing) {
      Lab.force(cx - 4, gy - 110, cx - 100, gy - 110, '#3d8bfd', 'B 推 A');
      Lab.force(cx + 4, gy - 110, cx + 100, gy - 110, '#ff8a5c', 'A 推 B');
    }
    if (p.t > 0.35) {
      Lab.force(xa, gy + 86, xa + p.va * 30, gy + 86, '#3d8bfd', `${Math.abs(p.va).toFixed(2)} m/s`, 4);
      Lab.force(xb, gy + 86, xb + p.vb * 30, gy + 86, '#ff8a5c', `${p.vb.toFixed(2)} m/s`, 4);
    }
    $('pv').textContent = `${Math.abs(p.va).toFixed(2)} ／ ${p.vb.toFixed(2)} m/s`;
    $('info').innerHTML = '<b>作用力與反作用力</b>：A 推 B 時，B 也同時推 A，兩力<b>大小相等、方向相反</b>，作用在<b>不同物體</b>上。質量小的人得到的加速度比較大，所以滑得比較快。';
  }

  Lab.init({ draw(ctx, w, h, dt) { S.mode === 'inertia' ? drawInertia(ctx, w, h, dt) : S.mode === 'fma' ? drawFma(ctx, w, h, dt) : drawPair(ctx, w, h, dt); } });
  const b = S.bus;
  $('busGo').addEventListener('click', () => { b.a = 3; b.msg = '公車<b>突然起動</b>：乘客的身體想保持<b>靜止</b>，所以<b>往後倒</b>；地上的球往後滾。'; });
  $('busStop').addEventListener('click', () => { if (b.v < 1) b.v = 8; b.a = -6; b.msg = '公車<b>緊急煞車</b>：乘客的身體想保持<b>原來的速度</b>繼續往前，所以<b>往前傾</b>；球往前滾。這就是要繫安全帶的原因。'; });
  $('busReset').addEventListener('click', () => { Object.assign(b, { v: 0, a: 0, lean: 0, ball: 0, ballV: 0, msg: '' }); });
  Lab.bindSlider('F', v => (S.F = v), v => v + ' N');
  Lab.bindSlider('m', v => (S.m = v), v => v + ' kg');
  $('pull').addEventListener('click', () => { S.cart = { x: 0, v: 0, run: true }; });
  $('mark').addEventListener('click', () => { S.pts.push([S.F, S.m]); });
  Lab.bindSlider('mA', v => (S.mA = v), v => v + ' kg');
  Lab.bindSlider('mB', v => (S.mB = v), v => v + ' kg');
  $('push').addEventListener('click', () => { S.p = { xa: 0, xb: 0, va: 0, vb: 0, t: 0 }; });
  $('pairReset').addEventListener('click', () => { S.p = { xa: 0, xb: 0, va: 0, vb: 0, t: -1 }; });
  Lab.bindGroup('.mode', k => { S.mode = k; Lab.showMode(k); });
  window.newtonSim = S;
})();
</script>
<script src="lesson.js" defer></script>
</body>
</html>
