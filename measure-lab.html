<!DOCTYPE html>
<html lang="zh-Hant" data-subject="phy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>測量與估計值</title>
<link rel="stylesheet" href="lab-kit.css">
<style>
  .answer { display: flex; gap: 8px; align-items: center; }
  .answer input { flex: 1; min-height: 46px; padding: 0 12px; font-size: 1.05rem; border-radius: 8px; border: 1px solid var(--border); background: rgba(255,255,255,.06); color: var(--white); }
  .rec { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .rec span { font-size: .82rem; padding: 3px 9px; border-radius: 6px; background: rgba(var(--accent-rgb), .14); }
</style>
</head>
<body>
<canvas id="cv" aria-label="用直尺量長度、用量筒量體積的模擬"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g8">← 回課程總覽</a>
  <h1>測量與估計值</h1>
  <p class="sub">國二理化 · 科學方法與基本測量</p>

  <div class="body">
    <div class="modes" style="--n:2">
      <button class="mode" data-k="len" aria-pressed="true">量長度</button>
      <button class="mode" data-k="vol" aria-pressed="false">量體積</button>
    </div>

    <div data-mode="len">
      <div class="group">
        <div class="group-title">直尺的最小刻度</div>
        <div class="seg" style="--n:2" id="ruler">
          <button data-k="1" aria-pressed="false">1 cm</button>
          <button data-k="0.1" aria-pressed="true">1 mm（0.1 cm）</button>
        </div>
        <div class="row" style="margin-top:8px"><button class="btn grow" id="newObj">換一支鉛筆</button></div>
      </div>
      <div class="group">
        <div class="group-title">讀出長度（cm），要記到估計值</div>
        <div class="answer"><input id="ans" type="number" step="any" inputmode="decimal" placeholder="例如 12.36"><button class="btn primary" id="check">檢查</button></div>
        <div class="result" id="feedback" style="margin-top:8px">鉛筆左端對齊 0。看右端落在哪兩條刻度之間，再<b>估計多一位</b>。</div>
        <div class="rec" id="rec"></div>
        <dl class="live" style="margin-top:6px"><dt>多次測量的平均</dt><dd id="avg">—</dd></dl>
      </div>
    </div>

    <div data-mode="vol" hidden>
      <div class="group">
        <div class="ctrl">
          <label for="eye">眼睛的位置 <output id="eyeVal"></output></label>
          <input type="range" id="eye" min="-1" max="1" step="0.05" value="0">
        </div>
        <div class="row"><button class="btn primary grow" id="drop">放入石頭</button><button class="btn" id="takeout">拿出</button></div>
        <dl class="live" style="margin-top:10px">
          <dt>水面讀數（平視）</dt><dd id="v1">—</dd>
          <dt>你讀到的</dt><dd id="v2">—</dd>
          <dt>石頭體積（排水法）</dt><dd id="v3">—</dd>
        </dl>
        <div class="result" id="volNote" style="margin-top:8px"></div>
      </div>
    </div>

    <div class="group">
      <p class="note">測量值 = <b>準確值 + 一位估計值</b>，再加上<b>單位</b>。例如最小刻度 1 mm 的尺，要記到 0.01 cm。估計值每個人可能不同，所以要<b>多次測量取平均</b>來減少誤差。</p>
    </div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script>
(() => {
  const $ = Lab.$;
  const S = { mode: 'len', unit: 0.1, len: 12.37, rec: [], eye: 0, rock: false, water: 42, rockV: 0 };
  function newPencil() { S.len = Math.round((6 + Math.random() * 11) * 1000) / 1000; S.rec = []; renderRec(); $('feedback').innerHTML = '鉛筆左端對齊 0。看右端落在哪兩條刻度之間，再<b>估計多一位</b>。'; $('ans').value = ''; }

  function drawRuler(ctx, w, h) {
    const x0 = 40, x1 = w - 30, y = h * 0.42, cmMax = 20, px = (x1 - x0) / cmMax;
    // 鉛筆
    const pl = S.len * px;
    ctx.fillStyle = '#ffc94d'; ctx.fillRect(x0, y - 46, pl - 26, 26);
    ctx.fillStyle = '#f2d2a6'; ctx.beginPath(); ctx.moveTo(x0 + pl - 26, y - 46); ctx.lineTo(x0 + pl, y - 33); ctx.lineTo(x0 + pl - 26, y - 20); ctx.fill();
    ctx.fillStyle = '#333'; ctx.beginPath(); ctx.moveTo(x0 + pl - 8, y - 38); ctx.lineTo(x0 + pl, y - 33); ctx.lineTo(x0 + pl - 8, y - 28); ctx.fill();
    ctx.fillStyle = '#e66'; ctx.fillRect(x0, y - 46, 14, 26);
    // 尺
    Lab.card(x0 - 14, y - 8, x1 - x0 + 28, 74, '#e9eef7', null, 4);
    ctx.strokeStyle = '#13233f';
    for (let i = 0; i <= cmMax * 10; i++) {
      const isCm = i % 10 === 0, isHalf = i % 5 === 0;
      if (!isCm && S.unit === 1) continue;
      const x = x0 + i / 10 * px, L = isCm ? 26 : isHalf ? 18 : 11;
      ctx.lineWidth = isCm ? 2 : 1; ctx.beginPath(); ctx.moveTo(x, y - 8); ctx.lineTo(x, y - 8 + L); ctx.stroke();
      if (isCm) Lab.text(String(i / 10), x, y + 32, '#13233f', 14, 'center', 'bold');
    }
    Lab.text('cm', x1 + 2, y + 52, '#13233f', 12, 'right');
    // 放大鏡：鉛筆尖附近
    const zx = Math.min(w - 170, Math.max(170, x0 + pl)), zy = h * 0.78, R = Math.min(110, h * 0.2), zoom = 6;
    ctx.save(); ctx.beginPath(); ctx.arc(zx, zy, R, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = '#e9eef7'; ctx.fillRect(zx - R, zy - R, 2 * R, 2 * R);
    const cx = S.len;                                   // 放大中心（cm）
    const X = cm => zx + (cm - cx) * px * zoom;
    ctx.fillStyle = '#ffc94d'; ctx.fillRect(zx - R, zy - R * 0.55, X(S.len) - (zx - R), R * 0.3);
    ctx.fillStyle = '#333'; ctx.beginPath(); ctx.moveTo(X(S.len) - 40, zy - R * 0.55); ctx.lineTo(X(S.len), zy - R * 0.4); ctx.lineTo(X(S.len) - 40, zy - R * 0.25); ctx.fill();
    ctx.strokeStyle = '#13233f';
    for (let i = Math.floor((cx - 2) * 10); i <= (cx + 2) * 10; i++) {
      const isCm = i % 10 === 0;
      if (!isCm && S.unit === 1) continue;
      const x = X(i / 10), L = isCm ? R * 0.6 : i % 5 === 0 ? R * 0.42 : R * 0.28;
      ctx.lineWidth = isCm ? 3 : 1.5; ctx.beginPath(); ctx.moveTo(x, zy - R * 0.1); ctx.lineTo(x, zy - R * 0.1 + L); ctx.stroke();
      if (isCm) Lab.text(String(i / 10), x, zy + R * 0.62, '#13233f', 16, 'center', 'bold');
    }
    ctx.restore();
    Lab.circle(zx, zy, R, null, '#5fa2ff', 4);
    Lab.text('放大看筆尖', zx, zy - R - 14, '#9fc4ff', 13);
  }

  function drawCylinder(ctx, w, h) {
    const cx = w * 0.42, top = 60, bot = h - 60, cw = 90, Hc = bot - top, maxV = 100;
    const Y = v => bot - v / maxV * (Hc - 30);
    const level = S.water + (S.rock ? S.rockV : 0);
    // 水
    ctx.fillStyle = 'rgba(95,162,255,.35)'; ctx.fillRect(cx - cw / 2, Y(level), cw, bot - Y(level));
    // 凹液面
    ctx.strokeStyle = '#9fd0ff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx - cw / 2, Y(level) - 6); ctx.quadraticCurveTo(cx, Y(level) + 6, cx + cw / 2, Y(level) - 6); ctx.stroke();
    // 量筒
    ctx.strokeStyle = 'rgba(220,235,255,.8)'; ctx.lineWidth = 3; ctx.strokeRect(cx - cw / 2, top, cw, Hc);
    for (let v = 0; v <= maxV; v += 2) {
      const y = Y(v), L = v % 10 === 0 ? 26 : 12;
      Lab.line(cx - cw / 2, y, cx - cw / 2 + L, y, 'rgba(220,235,255,.8)', v % 10 === 0 ? 2 : 1);
      if (v % 10 === 0) Lab.text(String(v), cx - cw / 2 + 30, y, '#dbe7ff', 13, 'left');
    }
    Lab.text('mL', cx - cw / 2 + 30, top - 14, '#dbe7ff', 12, 'left');
    // 石頭
    if (S.rock) { ctx.fillStyle = '#8a8f99'; ctx.beginPath(); ctx.ellipse(cx, bot - 22, 30, 18, 0.2, 0, Math.PI * 2); ctx.fill(); }
    // 眼睛與視線
    const eyeY = Y(level) - S.eye * 140, ex = cx - cw / 2 - 170;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(ex, eyeY, 22, 13, 0, 0, Math.PI * 2); ctx.fill();
    Lab.circle(ex + 6, eyeY, 7, '#13233f');
    // 視線對準凹液面最低點；讀數是視線穿過「靠眼睛這一側」刻度的位置
    const tx = cx, ty = Y(level), sx = cx - cw / 2;
    const sy = eyeY + (ty - eyeY) * (sx - ex) / (tx - ex);
    Lab.line(ex + 20, eyeY, tx, ty, S.eye === 0 ? '#4fd18b' : '#ff6b5e', 2, [6, 5]);
    Lab.circle(sx, sy, 5, S.eye === 0 ? '#4fd18b' : '#ff6b5e');
    S.read = (bot - sy) / (Hc - 30) * maxV;
    Lab.text(S.eye > 0.05 ? '俯視（由上往下看）' : S.eye < -0.05 ? '仰視（由下往上看）' : '平視：視線與凹液面最低處同高', ex, eyeY - 30, '#eef1fa', 13);
  }

  Lab.init({
    draw(ctx, w, h) { if (S.mode === 'len') drawRuler(ctx, w, h); else drawCylinder(ctx, w, h); },
    ui() {
      if (S.mode !== 'vol') return;
      const level = S.water + (S.rock ? S.rockV : 0);
      $('v1').textContent = level.toFixed(1) + ' mL';
      $('v2').textContent = S.read.toFixed(1) + ' mL';
      $('v3').textContent = S.rock ? `${level.toFixed(1)} − ${S.water.toFixed(1)} = ${S.rockV.toFixed(1)} mL` : '先放入石頭';
      $('volNote').innerHTML = Math.abs(S.eye) < 0.05 ? '讀數正確：視線要和<b>凹液面最低處</b>保持水平。'
        : S.eye > 0 ? '<b>俯視</b>時讀數會<b>偏大</b>。' : '<b>仰視</b>時讀數會<b>偏小</b>。';
    }
  });

  function renderRec() {
    $('rec').innerHTML = S.rec.map(v => `<span>${v.toFixed(S.unit === 1 ? 1 : 2)} cm</span>`).join('');
    $('avg').textContent = S.rec.length ? (S.rec.reduce((a, b) => a + b, 0) / S.rec.length).toFixed(S.unit === 1 ? 2 : 3) + ' cm' : '—';
  }
  $('check').addEventListener('click', () => {
    const raw = $('ans').value.trim(), v = Number(raw);
    if (!raw || isNaN(v)) { $('feedback').innerHTML = '請輸入數字。'; return; }
    const dec = (raw.split('.')[1] || '').length, need = S.unit === 1 ? 1 : 2;
    const truth = S.len, sure = Math.floor(truth / S.unit + 1e-9) * S.unit;
    const okRange = Math.abs(v - truth) <= S.unit * 0.3 + 1e-9;
    let msg;
    if (dec !== need) msg = `位數不對：最小刻度 ${S.unit === 1 ? '1 cm' : '1 mm'}，要記到 <b>${need === 1 ? '0.1' : '0.01'} cm</b>（準確值再加一位估計值）。`;
    else if (!okRange) msg = `再看清楚：筆尖在 <b>${sure.toFixed(need - 1)}</b> 和 <b>${(sure + S.unit).toFixed(need - 1)}</b> cm 之間。`;
    else { msg = `很好！準確值 <b>${sure.toFixed(need - 1)}</b> cm，最後一位 <b>${raw.slice(-1)}</b> 是估計值。實際約 ${truth.toFixed(3)} cm。`; S.rec.push(v); renderRec(); }
    $('feedback').innerHTML = msg;
  });
  $('newObj').addEventListener('click', newPencil);
  Lab.bindGroup('#ruler button', k => { S.unit = Number(k); S.rec = []; renderRec(); });
  Lab.bindGroup('.mode', k => { S.mode = k; Lab.showMode(k); });
  Lab.bindSlider('eye', v => { S.eye = Math.abs(v) < 0.05 ? 0 : v; }, v => (Math.abs(v) < 0.05 ? '平視' : v > 0 ? '偏上（俯視）' : '偏下（仰視）'));
  $('drop').addEventListener('click', () => { S.rockV = Math.round((8 + Math.random() * 22) * 5) / 5; S.rock = true; });
  $('takeout').addEventListener('click', () => { S.rock = false; });
  window.measureSim = S;
})();
</script>
<script src="lesson.js" defer></script>
</body>
</html>
