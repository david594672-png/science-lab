<!DOCTYPE html>
<html lang="zh-Hant" data-subject="earth">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台灣的地震</title>
<link rel="stylesheet" href="lab-kit.css">
<style>
  table { width: 100%; border-collapse: collapse; font-size: .84rem; font-variant-numeric: tabular-nums; }
  th, td { padding: 5px 4px; text-align: right; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  td.hit { color: var(--accent); font-weight: 700; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="cv" aria-label="台灣地震的震源、震央與地震波 3D 模型"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g9">← 回課程總覽</a>
  <h1>台灣的地震</h1>
  <p class="sub">國三地科 · 板塊運動與地震</p>

  <div class="body">
    <div class="group">
      <div class="ctrl">
        <label for="mag">規模 <output id="magVal"></output></label>
        <input type="range" id="mag" min="4" max="7.6" step="0.1" value="6.5">
      </div>
      <div class="ctrl">
        <label for="depth">震源深度 <output id="depthVal"></output></label>
        <input type="range" id="depth" min="5" max="70" step="1" value="15">
      </div>
      <p class="note">點地圖上的位置可以改變<b>震央</b>。</p>
      <div class="row" style="margin-top:8px"><button class="btn primary grow" id="go">發生地震！</button></div>
    </div>

    <div class="group">
      <div class="group-title">各地的震度（同一個地震，規模只有一個，震度各地不同）</div>
      <table>
        <thead><tr><th>地點</th><th>距離</th><th>P 波到達</th><th>S 波到達</th><th>震度</th></tr></thead>
        <tbody id="tbl"></tbody>
      </table>
    </div>

    <div class="group">
      <label class="sw"><input type="checkbox" id="showPlates" checked><span class="track"></span>板塊運動方向</label>
      <p class="note">台灣位在<b>歐亞板塊</b>和<b>菲律賓海板塊</b>的交界，兩個板塊互相擠壓，所以地震很多。地震波中 <b>P 波</b>較快、先到；<b>S 波</b>較慢，但搖晃通常比較大。</p>
    </div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script type="module">
import { start3D, THREE } from './lab3d.js';
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const $ = id => document.getElementById(id);
const K = 4, KM = 111 / K;                         // 1 單位 ≈ 27.75 km
const LON0 = 121, LAT0 = 23.7, TOP = 0, THICK = 3;
const geo2 = (lon, lat) => [(lon - LON0) * K, -(lat - LAT0) * K];
const S = { mag: 6.5, depth: 15, epi: [121.7, 23.85], t: -1 };

const L = start3D({ background: 0x0b1626, camera: [3, 14, 13], target: [0, -0.5, -0.5], minDist: 8, maxDist: 45, frame, ui, tap });
const { scene, renderer } = L;
renderer.localClippingEnabled = true;

// 地殼方塊（海底）＋ 海面
const block = new THREE.Mesh(new THREE.BoxGeometry(16, THICK, 22), [
  L.mat(0x7a5a3e), L.mat(0x7a5a3e), L.mat(0x1d4f7a, { transparent: true, opacity: 0.9 }), L.mat(0x4a3526), L.mat(0x8a6646), L.mat(0x8a6646)
]);
block.position.y = TOP - THICK / 2; scene.add(block);
// 地層線
for (let i = 1; i < 4; i++) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(16.02, 0.03, 22.02), L.glow(0x5a4030));
  m.position.y = TOP - i * THICK / 4; scene.add(m);
}
/// 台灣島：用高度函數做出有起伏的地形（中央山脈、雪山、海岸山脈），高度誇大以便觀察
const OUT = [[121.5, 25.3], [121.9, 25.1], [122.0, 24.9], [121.8, 24.6], [121.6, 24.0], [121.4, 23.3], [121.2, 22.8], [120.9, 22.3], [120.85, 21.9], [120.7, 22.1], [120.6, 22.4], [120.3, 22.6], [120.15, 23.0], [120.1, 23.5], [120.2, 24.0], [120.5, 24.5], [120.8, 24.8], [121.0, 25.05], [121.3, 25.2]];
const segDist = (px, py, ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay, u = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy))); return Math.hypot(px - ax - u * dx, py - ay - u * dy); };
const lineDist = (lo, la, P) => { let d = 1e9; for (let i = 0; i < P.length - 1; i++) d = Math.min(d, segDist(lo, la, ...P[i], ...P[i + 1])); return d; };
function coastDist(lo, la) {                       // 到海岸的距離（度），島內為正
  let inside = false, d = 1e9;
  for (let i = 0, j = OUT.length - 1; i < OUT.length; j = i++) {
    const [xi, yi] = OUT[i], [xj, yj] = OUT[j];
    if ((yi > la) !== (yj > la) && lo < (xj - xi) * (la - yi) / (yj - yi) + xi) inside = !inside;
    d = Math.min(d, segDist(lo, la, xi, yi, xj, yj));
  }
  return inside ? d : -d;
}
const RIDGE = [[121.55, 24.75], [121.2, 24.1], [121.0, 23.5], [120.85, 22.6], [120.8, 22.1]];
const SNOW = [[121.1, 24.75], [121.25, 24.35]];
const COASTAL = [[121.5, 23.95], [121.3, 23.3], [121.15, 22.85]];
function elev(lo, la) {
  const c = coastDist(lo, la);
  if (c < 0) return -0.12;
  const g = (d, s) => Math.exp(-((d / s) ** 2));
  const m = 1.05 * g(lineDist(lo, la, RIDGE), 0.2) + 0.55 * g(lineDist(lo, la, SNOW), 0.14) + 0.3 * g(lineDist(lo, la, COASTAL), 0.06);
  const inland = Math.min(1, c / 0.12);
  return 0.04 + 0.85 * m * inland * inland * (3 - 2 * inland) + 0.012 * Math.sin(lo * 37) * Math.sin(la * 41) * inland;
}
const NX = 110, NZ = 180, LO0 = 119.95, LO1 = 122.15, LA0 = 21.75, LA1 = 25.45;
const tg = new THREE.PlaneGeometry((LO1 - LO0) * K, (LA1 - LA0) * K, NX, NZ);
tg.rotateX(-Math.PI / 2);
{
  const pos = tg.attributes.position, col = new Float32Array(pos.count * 3), c = new THREE.Color();
  const cx = ((LO0 + LO1) / 2 - LON0) * K, cz = -((LA0 + LA1) / 2 - LAT0) * K;
  const stops = [[0, 0x7cb866], [0.2, 0x4f9a4a], [0.45, 0x3f7a3c], [0.7, 0x7d7448], [0.95, 0xa89a82]];
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i) + cx, z = pos.getZ(i) + cz, lo = x / K + LON0, la = -z / K + LAT0, hgt = elev(lo, la);
    pos.setXYZ(i, x, TOP + hgt, z);
    let k = 0; while (k < stops.length - 2 && hgt > stops[k + 1][0]) k++;
    const f = Math.max(0, Math.min(1, (hgt - stops[k][0]) / (stops[k + 1][0] - stops[k][0])));
    c.set(stops[k][1]).lerp(new THREE.Color(stops[k + 1][1]), f);
    const cd = coastDist(lo, la); if (cd >= 0 && cd < 0.02) c.set(0xd9c99a);   // 沙灘
    col.set([c.r, c.g, c.b], i * 3);
  }
  tg.setAttribute('color', new THREE.BufferAttribute(col, 3));
  tg.computeVertexNormals();
}
const isl = new THREE.Mesh(tg, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, flatShading: false }));
scene.add(isl);
// 淺海：沿岸一圈較亮的海水
{
  const shape = new THREE.Shape(OUT.map(([lo, la]) => { const [x, z] = geo2(lo, la); return new THREE.Vector2(x, -z); }));
  const halo = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ color: 0x5fb6d9, transparent: true, opacity: 0.35, depthWrite: false }));
  halo.rotation.x = -Math.PI / 2; halo.position.y = TOP + 0.005; halo.scale.set(1.04, 1.02, 1);
  scene.add(halo);
}

// 城市
const CITY = [['台北', 121.56, 25.04], ['台中', 120.68, 24.15], ['花蓮', 121.6, 23.98], ['台東', 121.15, 22.76], ['高雄', 120.3, 22.63]];
CITY.forEach(c => {
  const [x, z] = geo2(c[1], c[2]);
  c.pos = V(x, TOP + Math.max(0, elev(c[1], c[2])) + 0.14, z);
  const dot = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.25, 12), L.glow(0xffffff));
  dot.position.copy(c.pos); scene.add(dot); c.dot = dot;
  c.lbl = L.label(c[0], c.pos.clone().add(V(0, 0.55, 0)));
});

// 震源、震央
const hypo = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 12), L.glow(0xff5d5d));
const epi = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.06, 8, 24), L.glow(0xffd34d));
epi.rotation.x = Math.PI / 2;
const drop = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineDashedMaterial({ color: 0xffd34d, dashSize: 0.15, gapSize: 0.1 }));
scene.add(hypo, epi, drop);
L.label('震源', () => hypo.position.clone().add(V(0.7, -0.2, 0)));
L.label('震央', () => epi.position.clone().add(V(0, 0.6, 0)));
// 地震波：P 波、S 波（地表以下）
const clip = [new THREE.Plane(V(0, -1, 0), TOP + 0.01)];
const wave = c => new THREE.Mesh(new THREE.SphereGeometry(1, 40, 24), new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false, clippingPlanes: clip }));
const pW = wave(0x5cc8ff), sW = wave(0xff8a5c);
scene.add(pW, sW);
const pLbl = L.label('P 波', () => pW.position.clone().add(V(pW.scale.x * 0.7, -pW.scale.x * 0.5, 0)));
const sLbl = L.label('S 波', () => sW.position.clone().add(V(-sW.scale.x * 0.7, -sW.scale.x * 0.5, 0)));

// 板塊
const plateA = L.arrow(0xffa64d, 0.6, 0.45), plateB = L.arrow(0x5cc8ff, 0.6, 0.45);
plateA.point(V(-7.5, TOP + 0.4, 2), V(-4.5, TOP + 0.4, 1.5));
plateB.point(V(7.5, TOP + 0.4, 5), V(4.2, TOP + 0.4, 2.5));
const plateLbls = [L.label('歐亞板塊', V(-6.5, TOP + 1, 3)), L.label('菲律賓海板塊', V(6.5, TOP + 1, 6))];

function place() {
  const [x, z] = geo2(...S.epi);
  epi.position.set(x, TOP + Math.max(0, elev(...S.epi)) + 0.15, z);
  hypo.position.set(x, TOP - S.depth / KM, z);
  drop.geometry.setFromPoints([epi.position, hypo.position]); drop.computeLineDistances();
  pW.position.copy(hypo.position); sW.position.copy(hypo.position);
}
place();

// 震度（簡化公式，示意用）
function dist(c) { return c.pos.distanceTo(hypo.position) * KM; }
function intensity(c) { const R = Math.max(5, dist(c)); return Math.max(0, Math.min(7, 2.2 + 1.1 * S.mag - 3 * Math.log10(R))); }
const LV = i => (i < 0.5 ? '0' : i < 4.5 ? String(Math.round(i)) : i < 5 ? '5弱' : i < 5.5 ? '5強' : i < 6 ? '6弱' : i < 6.5 ? '6強' : '7');
const VP = 6, VS = 3.5, SPEED = 8;                 // km/s、模擬時間倍率

function frame(dt, t) {
  const showP = $('showPlates').checked;
  plateA.visible = plateB.visible = showP; plateLbls.forEach(l => (l.show = showP));
  if (S.t >= 0) S.t += dt * SPEED;
  const rP = S.t * VP / KM, rS = S.t * VS / KM;
  pW.visible = sW.visible = S.t >= 0 && rS < 30;
  pLbl.show = sLbl.show = pW.visible;
  pW.scale.setScalar(Math.max(0.01, rP)); sW.scale.setScalar(Math.max(0.01, rS));
  // 城市搖晃
  CITY.forEach(c => {
    const d = dist(c), arrivedS = S.t >= 0 && S.t * VS >= d, arrivedP = S.t >= 0 && S.t * VP >= d;
    const amp = arrivedS ? intensity(c) / 7 * 0.12 : arrivedP ? intensity(c) / 7 * 0.04 : 0;
    const fade = arrivedS ? Math.max(0, 1 - (S.t - d / VS) / 40) : 1;
    c.dot.position.x = c.pos.x + Math.sin(t * 40) * amp * fade;
    c.dot.material.color.set(arrivedS ? 0xff6b5e : arrivedP ? 0x5cc8ff : 0xffffff);
  });
  hypo.scale.setScalar(1 + 0.3 * Math.sin(t * 6));
}

function tap(x, y) {
  const hit = L.pick(x, y, [isl, block]);
  if (!hit || hit.point.y < TOP - 0.05) return;
  S.epi = [hit.point.x / K + LON0, -hit.point.z / K + LAT0];
  S.t = -1; place();
}
Lab.bindSlider('mag', v => { S.mag = v; }, v => v.toFixed(1));
Lab.bindSlider('depth', v => { S.depth = v; S.t = -1; place(); }, v => v + ' km' + (v <= 30 ? '（極淺層）' : v <= 70 ? '（淺層）' : ''));
$('go').addEventListener('click', () => { S.t = 0; });

function ui() {
  $('tbl').innerHTML = CITY.map(c => {
    const d = dist(c), tp = d / VP, ts = d / VS, now = S.t;
    return `<tr><td>${c[0]}</td><td>${d.toFixed(0)} km</td><td class="${now >= tp ? 'hit' : ''}">${tp.toFixed(0)} 秒</td><td class="${now >= ts ? 'hit' : ''}">${ts.toFixed(0)} 秒</td><td>${now >= ts ? LV(intensity(c)) + ' 級' : '—'}</td></tr>`;
  }).join('');
}
window.quakeSim = S;
</script>
<script src="lesson.js" defer></script>
</body>
</html>
