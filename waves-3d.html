<!DOCTYPE html>
<html lang="zh-Hant" data-subject="phy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>橫波與縱波</title>
<link rel="stylesheet" href="lab-kit.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="cv" aria-label="橫波與縱波介質粒子振動的 3D 模型"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g8">← 回課程總覽</a>
  <h1>橫波與縱波</h1>
  <p class="sub">國二理化 · 波動與聲音</p>

  <div class="body">
    <div class="group">
      <div class="seg" style="--n:3" id="show">
        <button data-k="both" aria-pressed="true">一起看</button>
        <button data-k="t" aria-pressed="false">橫波</button>
        <button data-k="l" aria-pressed="false">縱波</button>
      </div>
    </div>
    <div class="group">
      <div class="ctrl">
        <label for="f">頻率 <output id="fVal"></output></label>
        <input type="range" id="f" min="0.2" max="1.5" step="0.05" value="0.5">
      </div>
      <div class="ctrl">
        <label for="A">振幅 <output id="AVal"></output></label>
        <input type="range" id="A" min="0.2" max="1" step="0.05" value="0.6">
      </div>
      <div class="row"><button class="btn grow" id="pause">❚❚ 暫停</button><button class="btn grow" id="slow">慢動作</button></div>
      <dl class="live" style="margin-top:10px">
        <dt>波速（固定）</dt><dd>4.0 格/秒</dd>
        <dt>波長 λ = v ÷ f</dt><dd id="lam">—</dd>
      </dl>
    </div>
    <div class="group">
      <label class="sw"><input type="checkbox" id="mark" checked><span class="track"></span>標出一個粒子（紅色）</label>
      <label class="sw"><input type="checkbox" id="lamMark" checked><span class="track"></span>標出一個波長</label>
      <label class="sw"><input type="checkbox" id="pulseDir" checked><span class="track"></span>波前進方向</label>
    </div>
    <div class="group">
      <p class="note"><b>橫波</b>：粒子振動方向和波前進方向<b>垂直</b>，有波峰、波谷（例：繩波、光）。<br><b>縱波</b>：粒子振動方向和波前進方向<b>平行</b>，有疏部、密部（例：聲波）。<br>不論哪一種，<b>粒子只在原地來回振動</b>，傳出去的是能量和波形。</p>
    </div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script type="module">
import { start3D, THREE } from './lab3d.js';
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const $ = id => document.getElementById(id);
const S = { show: 'both', f: 0.5, A: 0.6, play: true, slow: false, t: 0 };
const N = 48, X0 = -12, DX = 0.5, VEL = 4;

const L = start3D({ background: 0x081226, camera: [-0.5, 3, 20], target: [-0.5, 0, 0], minDist: 6, maxDist: 40, pan: true, frame, ui });
const { scene } = L;

// 藍圖格線地板
const grid = new THREE.GridHelper(30, 30, 0x2c4a80, 0x16284a);
grid.position.y = -3.4; scene.add(grid);

function row(y, color) {
  const g = new THREE.Group(); g.position.y = y; scene.add(g);
  const balls = [];
  for (let i = 0; i < N; i++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.17, 16, 12), L.mat(color, { roughness: 0.3 }));
    g.add(m); balls.push(m);
  }
  // 平衡位置的細線
  const eq = new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(X0, 0, 0), V(X0 + (N - 1) * DX, 0, 0)]), new THREE.LineDashedMaterial({ color: 0x3a5f9e, dashSize: 0.2, gapSize: 0.2 }));
  eq.computeLineDistances(); g.add(eq);
  // 連接彈簧（線）
  const spring = new THREE.Line(new THREE.BufferGeometry().setFromPoints(balls.map(() => V())), new THREE.LineBasicMaterial({ color: 0x5fa2ff, transparent: true, opacity: 0.5 }));
  g.add(spring);
  // 波長標示
  const bar = new THREE.Group(); g.add(bar);
  const barLine = new THREE.Mesh(new THREE.BoxGeometry(1, 0.05, 0.05), L.glow(0xffd34d)); bar.add(barLine);
  const capA = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.4, 0.05), L.glow(0xffd34d)), capB = capA.clone(); bar.add(capA, capB);
  return { g, balls, spring, bar, barLine, capA, capB };
}
const T = row(2, 0x5fa2ff), Lg = row(-1.8, 0x9fd0ff);
const tLbl = L.label('橫波（繩波）', V(X0 - 0.5, 3.4, 0), 'big');
const lLbl = L.label('縱波（彈簧、聲波）', V(X0 - 0.5, -0.4, 0), 'big');
const lamT = L.label('', () => T.bar.getWorldPosition(V(0, 0, 0)).add(V(0, 0.45, 0)));
const lamL = L.label('', () => Lg.bar.getWorldPosition(V(0, 0, 0)).add(V(0, 0.45, 0)));
const dirA = L.arrow(0xffa64d, 0.5, 0.35);
const crestLbl = L.label('波峰', null, 'plain'), troughLbl = L.label('波谷', null, 'plain');
const densLbl = L.label('密部', null, 'plain'), rareLbl = L.label('疏部', null, 'plain');
const MARK = 20;

function frame(dt) {
  if (S.play) S.t += dt * (S.slow ? 0.3 : 1);
  const k = 2 * Math.PI * S.f / VEL, w = 2 * Math.PI * S.f, lam = VEL / S.f;
  const showT = S.show !== 'l', showL = S.show !== 't';
  T.g.visible = showT; Lg.g.visible = showL; tLbl.show = showT; lLbl.show = showL;
  T.g.position.y = S.show === 'both' ? 2 : 0; Lg.g.position.y = S.show === 'both' ? -1.8 : 0;
  tLbl.where = V(X0 + 2.5, T.g.position.y + 1.6, 0); lLbl.where = V(X0 + 3.3, Lg.g.position.y + 1.1, 0);
  // 波從左往右傳；左端還沒傳到的粒子不動
  const front = S.t * VEL;
  const disp = x => { const d = x - X0; return d > front ? 0 : Math.sin(w * S.t - k * d); };
  const ptsT = [], ptsL = [];
  for (let i = 0; i < N; i++) {
    const x = X0 + i * DX, s = disp(x);
    T.balls[i].position.set(x, s * S.A * 1.4, 0); ptsT.push(T.balls[i].position.clone());
    Lg.balls[i].position.set(x + s * S.A * 0.45, 0, 0); ptsL.push(Lg.balls[i].position.clone());
    const red = $('mark').checked && i === MARK;
    T.balls[i].material.color.set(red ? 0xff4d4d : 0x5fa2ff);
    Lg.balls[i].material.color.set(red ? 0xff4d4d : 0x9fd0ff);
    T.balls[i].scale.setScalar(red ? 1.5 : 1); Lg.balls[i].scale.setScalar(red ? 1.5 : 1);
  }
  T.spring.geometry.setFromPoints(ptsT); Lg.spring.geometry.setFromPoints(ptsL);
  // 波長：從某個波峰到下一個波峰
  const showLam = $('lamMark').checked && front > X0 + lam + 12;
  [[T, lamT, 1.9], [Lg, lamL, 0.9]].forEach(([r, lb, y]) => {
    r.bar.visible = showLam; lb.show = showLam && r.g.visible;
    if (!showLam) return;
    // 找第一個在 x > -6 的波峰相位位置
    let xc = X0 + ((w * S.t - Math.PI / 2) / k) % lam;
    while (xc < -7) xc += lam;
    r.bar.position.set(xc + lam / 2, y, 0);
    r.barLine.scale.x = lam; r.capA.position.x = -lam / 2; r.capB.position.x = lam / 2;
    lb.set(`λ = ${lam.toFixed(1)} 格`);
  });
  // 波峰／波谷、疏部／密部標示
  const near = (target) => { for (let i = 8; i < N - 2; i++) { const x = X0 + i * DX; if (x > front) break; const ph = ((w * S.t - k * (x - X0)) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI); if (Math.abs(ph - target) < 0.2) return x; } return null; };
  const xc = near(Math.PI / 2), xt = near(3 * Math.PI / 2), xd = near(0), xr = near(Math.PI);
  crestLbl.show = showT && xc != null; if (xc != null) crestLbl.where = V(xc, T.g.position.y + S.A * 1.4 + 0.5, 0);
  troughLbl.show = showT && xt != null; if (xt != null) troughLbl.where = V(xt, T.g.position.y - S.A * 1.4 - 0.5, 0);
  densLbl.show = showL && xd != null; if (xd != null) densLbl.where = V(xd, Lg.g.position.y - 0.6, 0);
  rareLbl.show = showL && xr != null; if (xr != null) rareLbl.where = V(xr, Lg.g.position.y - 0.6, 0);
  dirA.visible = $('pulseDir').checked;
  dirA.point(V(X0 + 4, -3.2, 0), V(X0 + 10, -3.2, 0));
}

Lab.bindGroup('#show button', k => { S.show = k; });
Lab.bindSlider('f', v => { S.f = v; S.t = 0; }, v => v.toFixed(2) + ' Hz');
Lab.bindSlider('A', v => { S.A = v; }, v => v.toFixed(2));
$('pause').addEventListener('click', e => { S.play = !S.play; e.currentTarget.textContent = S.play ? '❚❚ 暫停' : '▶ 繼續'; });
$('slow').addEventListener('click', e => { S.slow = !S.slow; e.currentTarget.setAttribute('aria-pressed', String(S.slow)); });
function ui() { $('lam').textContent = (VEL / S.f).toFixed(1) + ' 格'; }
window.waveSim = S;
</script>
<script src="lesson.js" defer></script>
</body>
</html>
