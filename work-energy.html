<!DOCTYPE html>
<html lang="zh-Hant" data-subject="phy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>功與能</title>
<link rel="stylesheet" href="lab-kit.css">
</head>
<body>
<canvas id="cv" aria-label="作功與力學能守恆的模擬"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g9">← 回課程總覽</a>
  <h1>功與能</h1>
  <p class="sub">國三理化 · 功與能</p>

  <div class="body">
    <div class="modes" style="--n:2">
      <button class="mode" data-k="work" aria-pressed="true">作功</button>
      <button class="mode" data-k="energy" aria-pressed="false">力學能守恆</button>
    </div>

    <div data-mode="work">
      <div class="group">
        <div class="seg" style="--n:3" id="case">
          <button data-k="push" aria-pressed="true">水平推</button>
          <button data-k="lift" aria-pressed="false">往上提</button>
          <button data-k="carry" aria-pressed="false">提著走</button>
        </div>
        <div class="ctrl" style="margin-top:8px"><label for="wF">施力 F <output id="wFVal"></output></label><input type="range" id="wF" min="5" max="50" step="5" value="20"></div>
        <div class="row"><button class="btn primary grow" id="wGo">▶ 移動 4 公尺</button><button class="btn" id="wReset">重來</button></div>
        <dl class="live" style="margin-top:8px"><dt>移動距離</dt><dd id="ws">—</dd><dt>功 W</dt><dd id="wW">—</dd></dl>
      </div>
    </div>

    <div data-mode="energy" hidden>
      <div class="group">
        <div class="ctrl"><label for="h0">起始高度 <output id="h0Val"></output></label><input type="range" id="h0" min="2" max="10" step="0.5" value="8"></div>
        <label class="sw"><input type="checkbox" id="fric"><span class="track"></span>軌道有摩擦</label>
        <div class="row"><button class="btn primary grow" id="eGo">▶ 放開小球</button><button class="btn" id="eReset">重來</button></div>
      </div>
    </div>

    <div class="group"><div class="result" id="info"></div></div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script>
(() => {
  const $ = Lab.$;
  const g = 9.8, M = 1;
  const S = { mode: 'work', case: 'push', F: 20, s: 0, run: false, h0: 8, fric: false, u: 0, v: 0, eRun: false, heat: 0 };
  // 軌道：x 從 0 到 1，高度 y(x)（公尺）
  const track = x => S.h0 * Math.pow(Math.cos(Math.PI * x), 2) * (x < 0.5 ? 1 : 1.2);   // 右邊比起點高一點
  const LEN = 24;                                       // 軌道水平長度（公尺）

  function room(ctx, w, gy) {
    // 倉庫：牆面、磚紋、木地板
    ctx.fillStyle = Lab.lg(0, 0, 0, gy, ['#1b2440', '#2a3558']); ctx.fillRect(0, 0, w, gy);
    ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 1;
    for (let y = gy - 24, r = 0; y > 0; y -= 24, r++) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); for (let x = (r % 2) * 30; x < w; x += 60) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 24); ctx.stroke(); } }
    ctx.fillStyle = Lab.lg(0, gy, 0, gy + 120, ['#9a6a3d', '#5f3d20']); ctx.fillRect(0, gy, w, 400);
    for (let y = gy + 14; y < gy + 400; y += 16) Lab.line(0, y, w, y, 'rgba(0,0,0,.18)', 1);
    Lab.line(0, gy, w, gy, '#c79a68', 2);
  }

  function drawWork(ctx, w, h, dt) {
    if (S.run) { S.s = Math.min(4, S.s + dt * 1.5); if (S.s >= 4) S.run = false; }
    const gy = Math.min(h * 0.66, h - 130), px = 170, sc = Math.min(120, (w - 300) / 4.4), c = S.case, K = 1.35;
    // 算手要伸到 (tx,ty) 時，相對肩膀的位置（person 的 hand 參數以 s 為單位）
    const reach = (x, L, tx, ty) => [(tx - x - Math.sin(L) * 44 * K) / K, (ty - (gy - 52 * K - Math.cos(L) * 44 * K)) / K];
    room(ctx, w, gy);
    // 地上的尺
    for (let m = 0; m <= 4; m++) { const x = px + m * sc; Lab.line(x, gy + 6, x, gy + 18, '#ffe9c7', 2); Lab.text(m + ' m', x, gy + 30, '#ffe9c7', 12, 'center', 'bold'); }
    Lab.line(px, gy + 12, px + 4 * sc, gy + 12, 'rgba(255,233,199,.6)', 2);
    const CW = 96, CH = 82;
    let bx = px, by = gy;                       // 箱子底邊中心
    if (c !== 'lift') bx = px + S.s * sc;
    if (c === 'lift') by = gy - S.s * Math.min(sc, (gy - 150) / 4);
    if (c === 'carry') by = gy - 52;
    if (c === 'push') {
      const x = bx - CW / 2 - 52;
      Lab.person(x, gy, K, { lean: 0.38, hand: reach(x, 0.38, bx - CW / 2, gy - 52), hand2: reach(x, 0.38, bx - CW / 2 - 4, gy - 66), walk: S.s * 5, shirt: '#3fb68b' });
      Lab.crate(bx, by, CW, CH, '10 kg');
      Lab.force(bx, by - CH / 2, bx + 30 + S.F * 2.4, by - CH / 2, '#ff8a5c', `F = ${S.F} N`);
    } else if (c === 'lift') {
      // 起重架：絞盤＋繩子，等速往上提
      const fx = bx, top = 70;
      Lab.line(fx - 90, top, fx + 90, top, '#8a93a8', 8); Lab.line(fx - 84, top, fx - 84, gy, '#6c7488', 6); Lab.line(fx + 84, top, fx + 84, gy, '#6c7488', 6);
      Lab.circle(fx, top + 4, 14, Lab.rg(fx, top + 4, 2, 14, ['#dfe5ef', '#6c7488']), '#3b4252', 2);
      Lab.line(fx, top + 18, fx, by - CH, '#e8e1cf', 2.5);
      Lab.crate(bx, by, CW, CH, '10 kg');
      Lab.force(bx + CW / 2 + 22, by - CH / 2, bx + CW / 2 + 22, by - CH / 2 - 40 - S.F * 2, '#ff8a5c', `F = ${S.F} N`);
    } else {
      const x = bx - 36;
      Lab.person(x, gy, K, { lean: 0.05, hand: reach(x, 0.05, bx - 20, gy - 70), hand2: reach(x, 0.05, bx - 24, gy - 76), walk: S.s * 5, shirt: '#3fb68b' });
      Lab.crate(bx + 6, gy - 64, CW * 0.75, CH * 0.75, '10 kg');
      Lab.force(bx + 6, gy - 64 - CH * 0.75 - 6, bx + 6, gy - 64 - CH * 0.75 - 46 - S.F * 2, '#ff8a5c', `F = ${S.F} N`);
    }
    // 位移箭頭
    if (S.s > 0.05) {
      if (c === 'lift') Lab.force(bx - CW / 2 - 40, gy, bx - CW / 2 - 40, by, '#4fd18b', '位移');
      else Lab.force(px, gy + 52, bx, gy + 52, '#4fd18b', `位移 ${S.s.toFixed(1)} m`);
    }
    if (c === 'carry' && S.s > 0.3) Lab.pill('力 ⟂ 位移 → 不作功', bx + 6, gy - 250, '#ffd34d', 13);
    const Wk = c === 'carry' ? 0 : S.F * S.s;
    $('ws').textContent = S.s.toFixed(1) + ' m'; $('wW').textContent = c === 'carry' ? '0 J（力和位移垂直）' : `${S.F} × ${S.s.toFixed(1)} = ${Wk.toFixed(0)} J`;
    $('info').innerHTML = c === 'carry'
      ? '提著箱子<b>水平走</b>：手的力向上，位移水平，<b>力和位移互相垂直</b>，所以手對箱子<b>沒有作功</b>（雖然會累）。'
      : '<b>功 W = 力 F × 沿力方向的位移 S</b>，單位是<b>焦耳（J）</b>，1 J = 1 N × 1 m。物體要在<b>力的方向上</b>移動，力才有作功。';
  }

  function drawEnergy(ctx, w, h, dt) {
    const x0 = 96, x1 = w - 40, top = 40, base = Math.min(h * 0.6, h - 190);
    const X = u => x0 + u * (x1 - x0), Y = y => base - y / 12 * (base - top);
    // 天空與地面
    ctx.fillStyle = Lab.lg(0, 0, 0, base, ['#132449', '#2c5d92', '#79b0d8']); ctx.fillRect(0, 0, w, base + 4);
    Lab.cloud(w * 0.3, 70, 0.6, 0.4); Lab.cloud(w * 0.7, 50, 0.5, 0.35);
    // 軌道下方的支撐土丘
    ctx.beginPath(); ctx.moveTo(X(0), base + 4);
    for (let i = 0; i <= 200; i++) { const u = i / 200; ctx.lineTo(X(u), Y(track(u)) + 6); }
    ctx.lineTo(X(1), base + 4); ctx.closePath();
    ctx.fillStyle = Lab.lg(0, top, 0, base, ['#4caf6e', '#2f7a4a', '#1f5634']); ctx.fill();
    ctx.fillStyle = Lab.lg(0, base, 0, h, ['#1f5634', '#0f2a1c']); ctx.fillRect(0, base + 4, w, h);
    // 枕木與鐵軌
    for (let i = 0; i <= 80; i++) {
      const u = i / 80, du = 1e-3, xx = X(u), yy = Y(track(u));
      const dx = X(u + du) - X(u - du), dy = Y(track(u + du)) - Y(track(u - du)), L = Math.hypot(dx, dy);
      Lab.line(xx, yy, xx - dy / L * 10, yy + dx / L * 10, '#6b4a2b', 4);
    }
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 4;
    ctx.strokeStyle = '#d8dee8'; ctx.lineWidth = 4; ctx.beginPath();
    for (let i = 0; i <= 200; i++) { const u = i / 200; i ? ctx.lineTo(X(u), Y(track(u))) : ctx.moveTo(X(u), Y(track(u))); }
    ctx.stroke(); ctx.restore();
    // 高度尺
    Lab.line(x0 - 36, Y(0), x0 - 36, Y(12), 'rgba(255,255,255,.5)', 2);
    for (let m = 0; m <= 12; m += 2) { Lab.line(x0 - 42, Y(m), x0 - 30, Y(m), 'rgba(255,255,255,.6)', 1.5); Lab.text(m + ' m', x0 - 46, Y(m), 'rgba(238,241,250,.75)', 11, 'right'); }
    Lab.line(x0 - 30, Y(S.h0), x1, Y(S.h0), 'rgba(255,211,77,.55)', 1.5, [6, 6]);
    Lab.pill('起始高度', x1 - 40, Y(S.h0) - 14, '#ffd34d', 12);
    // 小球運動：沿軌道，用能量求速率
    if (S.eRun) {
      const E = M * g * S.h0 - S.heat;
      const y = track(S.u), ke = Math.max(0, E - M * g * y);
      let sp = Math.sqrt(2 * ke / M);
      const du = 1e-3, slope = (track(S.u + du) - track(S.u - du)) / (2 * du) / LEN;
      const ds = sp * dt / Math.sqrt(1 + slope * slope);
      S.dir = S.dir || 1;
      S.u += S.dir * ds / LEN;
      if (S.fric) S.heat += 0.25 * M * g * ds * 0.12;
      if (S.u >= 1) { S.u = 1; S.dir = -1; }
      if (S.u <= 0) { S.u = 0; S.dir = 1; }
      if (ke < 0.02 && Math.abs(slope) < 1e-3 && S.fric) S.eRun = false;
      // 到達不了更高處時反向
      if (M * g * track(S.u + S.dir * 0.003) > E) S.dir *= -1;
      S.v = sp;
    }
    const by = track(S.u);
    Lab.ball(X(S.u), Y(by) - 15, 15, '#ff6b5e');
    if (S.fric && S.heat > 0.5) for (let i = 0; i < 4; i++) Lab.circle(X(S.u) - S.dir * (8 + i * 7), Y(by) - 2 - i * 3, 2.5 - i * 0.4, `rgba(255,${180 - i * 30},80,${0.7 - i * 0.15})`);
    // 能量長條
    const PE = M * g * by, KE = Math.max(0, M * g * S.h0 - S.heat - PE), H = S.heat, tot = M * g * S.h0;
    const gx = 20, gw = Math.min(520, w - 40), gyy = base + 22, rows = [['位能 U', PE, '#5fa2ff'], ['動能 K', KE, '#ff8a5c'], ['熱能（摩擦）', H, '#ffd34d'], ['力學能 U + K', PE + KE, '#c58bff'], ['總能量', tot, '#4fd18b']];
    Lab.glass(gx, gyy, gw, rows.length * 30 + 20, 12);
    const bw = gw - 200;
    rows.forEach(([n, v, c], i) => {
      const y = gyy + 14 + i * 30;
      Lab.text(n, gx + 14, y + 9, '#eef1fa', 13, 'left', 'bold');
      Lab.card(gx + 120, y, bw, 18, 'rgba(255,255,255,.06)', null, 9);
      const L = Math.max(0, v / (g * 10) * bw);
      if (L > 1) { Lab.rr(gx + 120, y, Math.min(bw, L), 18, 9); ctx.fillStyle = Lab.lg(gx + 120, 0, gx + 120 + bw, 0, [Lab.shade(c, -0.25), c, Lab.shade(c, 0.3)]); ctx.fill(); }
      Lab.text(v.toFixed(1) + ' J', gx + 130 + bw, y + 9, c, 13, 'left', 'bold');
    });
    $('info').innerHTML = S.fric
      ? '有摩擦時，一部分力學能變成<b>熱能</b>，小球回不到原來的高度，最後停下來；但<b>總能量仍然守恆</b>。'
      : '<b>力學能 = 動能 + 位能</b>。沒有摩擦時，往下滑位能變動能、往上爬動能變位能，<b>力學能保持不變</b>，小球能回到<b>原來的高度</b>。';
  }

  Lab.init({ draw(ctx, w, h, dt) { S.mode === 'work' ? drawWork(ctx, w, h, dt) : drawEnergy(ctx, w, h, dt); } });
  Lab.bindGroup('.mode', k => { S.mode = k; Lab.showMode(k); });
  Lab.bindGroup('#case button', k => { S.case = k; S.s = 0; S.run = false; });
  Lab.bindSlider('wF', v => (S.F = v), v => v + ' N');
  $('wGo').addEventListener('click', () => { S.s = 0; S.run = true; });
  $('wReset').addEventListener('click', () => { S.s = 0; S.run = false; });
  const eReset = () => { S.u = 0; S.v = 0; S.heat = 0; S.dir = 1; S.eRun = false; };
  Lab.bindSlider('h0', v => { S.h0 = v; eReset(); }, v => v + ' m');
  $('fric').addEventListener('change', e => { S.fric = e.target.checked; eReset(); });
  $('eGo').addEventListener('click', () => { eReset(); S.u = 0.02; S.eRun = true; });
  $('eReset').addEventListener('click', eReset);
  window.weSim = S;
})();
</script>
<script src="lesson.js" defer></script>
</body>
</html>
