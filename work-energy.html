<!DOCTYPE html>
<html lang="zh-Hant" data-subject="phy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>功與能</title>
<link rel="stylesheet" href="lab-kit.css">
</head>
<body>
<canvas id="cv" aria-label="作功與力學能守恆的模擬"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g9">← 回課程總覽</a>
  <h1>功與能</h1>
  <p class="sub">國三理化 · 功與能</p>

  <div class="body">
    <div class="modes" style="--n:2">
      <button class="mode" data-k="work" aria-pressed="true">作功</button>
      <button class="mode" data-k="energy" aria-pressed="false">力學能守恆</button>
    </div>

    <div data-mode="work">
      <div class="group">
        <div class="seg" style="--n:3" id="case">
          <button data-k="push" aria-pressed="true">水平推</button>
          <button data-k="lift" aria-pressed="false">往上提</button>
          <button data-k="carry" aria-pressed="false">提著走</button>
        </div>
        <div class="ctrl" style="margin-top:8px"><label for="wF">施力 F <output id="wFVal"></output></label><input type="range" id="wF" min="5" max="50" step="5" value="20"></div>
        <div class="row"><button class="btn primary grow" id="wGo">▶ 移動 4 公尺</button><button class="btn" id="wReset">重來</button></div>
        <dl class="live" style="margin-top:8px"><dt>移動距離</dt><dd id="ws">—</dd><dt>功 W</dt><dd id="wW">—</dd></dl>
      </div>
    </div>

    <div data-mode="energy" hidden>
      <div class="group">
        <div class="ctrl"><label for="h0">起始高度 <output id="h0Val"></output></label><input type="range" id="h0" min="2" max="10" step="0.5" value="8"></div>
        <label class="sw"><input type="checkbox" id="fric"><span class="track"></span>軌道有摩擦</label>
        <div class="row"><button class="btn primary grow" id="eGo">▶ 放開小球</button><button class="btn" id="eReset">重來</button></div>
      </div>
    </div>

    <div class="group"><div class="result" id="info"></div></div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script>
(() => {
  const $ = Lab.$;
  const g = 9.8, M = 1;
  const S = { mode: 'work', case: 'push', F: 20, s: 0, run: false, h0: 8, fric: false, u: 0, v: 0, eRun: false, heat: 0 };
  // 軌道：x 從 0 到 1，高度 y(x)（公尺）
  const track = x => S.h0 * Math.pow(Math.cos(Math.PI * x), 2) * (x < 0.5 ? 1 : 1.2);   // 右邊比起點高一點
  const LEN = 24;                                       // 軌道水平長度（公尺）

  function drawWork(ctx, w, h, dt) {
    if (S.run) { S.s = Math.min(4, S.s + dt * 1.5); if (S.s >= 4) S.run = false; }
    const gy = h * 0.6, px = 70, sc = Math.min(110, (w - 200) / 5);
    Lab.line(20, gy, w - 20, gy, 'rgba(255,255,255,.4)', 2);
    for (let m = 0; m <= 4; m++) { Lab.line(px + m * sc, gy, px + m * sc, gy + 10, 'rgba(255,255,255,.4)', 1.5); Lab.text(m + ' m', px + m * sc, gy + 22, 'rgba(238,241,250,.5)', 12); }
    const c = S.case;
    let bx = px, by = gy;
    if (c === 'push' || c === 'carry') bx = px + S.s * sc;
    if (c === 'lift') by = gy - S.s * sc * 0.6;
    if (c === 'carry') by = gy - 70;
    // 人
    if (c !== 'lift') {
      const hx = bx - 50; Lab.circle(hx, gy - 130, 14, '#ffd9a8'); Lab.line(hx, gy - 116, hx, gy - 60, '#ffd9a8', 8); Lab.line(hx, gy - 60, hx - 10, gy, '#ffd9a8', 6); Lab.line(hx, gy - 60, hx + 10, gy, '#ffd9a8', 6);
      Lab.line(hx, gy - 100, c === 'carry' ? bx : bx - 10, c === 'carry' ? by - 30 : gy - 40, '#ffd9a8', 5);
    }
    Lab.card(bx - 10, by - 60, 70, 60, '#c98a4a', '#ffd9a8', 4);
    Lab.text('10 kg', bx + 25, by - 30, '#fff', 13, 'center', 'bold');
    // 力與位移箭頭
    const fx = c === 'push' ? [bx - 10, by - 30, bx - 10 - S.F * 2.4, by - 30] : [bx + 25, by - 60, bx + 25, by - 60 - S.F * 2.4];
    if (c === 'push') Lab.arrow(fx[2], fx[1], fx[0], fx[1], '#ff8a5c', 5, 14); else Lab.arrow(fx[0], fx[1], fx[2], fx[3], '#ff8a5c', 5, 14);
    Lab.text(`力 F = ${S.F} N`, c === 'push' ? fx[2] : bx + 70, c === 'push' ? by - 70 : by - 60 - S.F * 1.2, '#ff8a5c', 14, 'center', 'bold');
    if (S.s > 0.05) {
      if (c === 'lift') Lab.arrow(bx + 90, gy, bx + 90, by, '#4fd18b', 4, 12); else Lab.arrow(px + 25, gy + 44, bx + 25, gy + 44, '#4fd18b', 4, 12);
      Lab.text('位移', c === 'lift' ? bx + 116 : (px + bx) / 2 + 25, c === 'lift' ? (gy + by) / 2 : gy + 64, '#4fd18b', 13);
    }
    const Wk = c === 'carry' ? 0 : S.F * S.s;
    $('ws').textContent = S.s.toFixed(1) + ' m'; $('wW').textContent = c === 'carry' ? '0 J（力和位移垂直）' : `${S.F} × ${S.s.toFixed(1)} = ${Wk.toFixed(0)} J`;
    $('info').innerHTML = c === 'carry'
      ? '提著箱子<b>水平走</b>：手的力向上，位移水平，<b>力和位移互相垂直</b>，所以手對箱子<b>沒有作功</b>（雖然會累）。'
      : '<b>功 W = 力 F × 沿力方向的位移 S</b>，單位是<b>焦耳（J）</b>，1 J = 1 N × 1 m。物體要在<b>力的方向上</b>移動，力才有作功。';
  }

  function drawEnergy(ctx, w, h, dt) {
    const x0 = 40, x1 = w - 40, top = 40, base = h * 0.62;
    const X = u => x0 + u * (x1 - x0), Y = y => base - y / 12 * (base - top);
    // 軌道
    ctx.strokeStyle = '#9fc4ff'; ctx.lineWidth = 5; ctx.beginPath();
    for (let i = 0; i <= 200; i++) { const u = i / 200; i ? ctx.lineTo(X(u), Y(track(u))) : ctx.moveTo(X(u), Y(track(u))); }
    ctx.stroke();
    Lab.line(x0, Y(S.h0), x1, Y(S.h0), 'rgba(255,211,77,.35)', 1, [6, 6]);
    Lab.text('起始高度', x1, Y(S.h0) - 10, '#ffd34d', 12, 'right');
    // 小球運動：沿軌道，用能量求速率
    if (S.eRun) {
      const E = M * g * S.h0 - S.heat;
      const y = track(S.u), ke = Math.max(0, E - M * g * y);
      let sp = Math.sqrt(2 * ke / M);
      const du = 1e-3, slope = (track(S.u + du) - track(S.u - du)) / (2 * du) / LEN;
      const ds = sp * dt / Math.sqrt(1 + slope * slope);
      S.dir = S.dir || 1;
      S.u += S.dir * ds / LEN;
      if (S.fric) S.heat += 0.25 * M * g * ds * 0.12;
      if (S.u >= 1) { S.u = 1; S.dir = -1; }
      if (S.u <= 0) { S.u = 0; S.dir = 1; }
      if (ke < 0.02 && Math.abs(slope) < 1e-3 && S.fric) S.eRun = false;
      // 到達不了更高處時反向
      if (M * g * track(S.u + S.dir * 0.003) > E) S.dir *= -1;
      S.v = sp;
    }
    const by = track(S.u);
    Lab.circle(X(S.u), Y(by) - 14, 14, '#ff6b5e', '#fff', 2);
    // 能量長條
    const PE = M * g * by, KE = Math.max(0, M * g * S.h0 - S.heat - PE), H = S.heat, tot = M * g * S.h0;
    const bx = x0, bw = Math.min(380, w - 80), byy = base + 40;
    [['位能 U', PE, '#5fa2ff'], ['動能 K', KE, '#ff8a5c'], ['熱能（摩擦）', H, '#ffd34d'], ['總能量', tot, '#4fd18b']].forEach(([n, v, c], i) => {
      const y = byy + i * 34;
      Lab.text(n, bx, y + 10, '#eef1fa', 13, 'left');
      Lab.card(bx + 110, y, bw, 20, 'rgba(255,255,255,.06)', null, 4);
      Lab.card(bx + 110, y, Math.max(0, v / (g * 10) * bw), 20, c, null, 4);
      Lab.text(v.toFixed(1) + ' J', bx + 120 + bw, y + 10, c, 13, 'left');
    });
    $('info').innerHTML = S.fric
      ? '有摩擦時，一部分力學能變成<b>熱能</b>，小球回不到原來的高度，最後停下來；但<b>總能量仍然守恆</b>。'
      : '<b>力學能 = 動能 + 位能</b>。沒有摩擦時，往下滑位能變動能、往上爬動能變位能，<b>力學能保持不變</b>，小球能回到<b>原來的高度</b>。';
  }

  Lab.init({ draw(ctx, w, h, dt) { S.mode === 'work' ? drawWork(ctx, w, h, dt) : drawEnergy(ctx, w, h, dt); } });
  Lab.bindGroup('.mode', k => { S.mode = k; Lab.showMode(k); });
  Lab.bindGroup('#case button', k => { S.case = k; S.s = 0; S.run = false; });
  Lab.bindSlider('wF', v => (S.F = v), v => v + ' N');
  $('wGo').addEventListener('click', () => { S.s = 0; S.run = true; });
  $('wReset').addEventListener('click', () => { S.s = 0; S.run = false; });
  const eReset = () => { S.u = 0; S.v = 0; S.heat = 0; S.dir = 1; S.eRun = false; };
  Lab.bindSlider('h0', v => { S.h0 = v; eReset(); }, v => v + ' m');
  $('fric').addEventListener('change', e => { S.fric = e.target.checked; eReset(); });
  $('eGo').addEventListener('click', () => { eReset(); S.u = 0.02; S.eRun = true; });
  $('eReset').addEventListener('click', eReset);
  window.weSim = S;
})();
</script>
<script src="lesson.js" defer></script>
</body>
</html>
