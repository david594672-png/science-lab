<!DOCTYPE html>
<html lang="zh-Hant" data-subject="bio">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>心臟與血液循環</title>
<link rel="stylesheet" href="lab-kit.css">
<style>
  .phase { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 8px; }
  .phase span { text-align: center; font-size: .78rem; padding: 6px 2px; border-radius: 10px; background: rgba(255,255,255,.05); color: var(--muted); }
  .phase span.on { background: rgba(var(--accent-rgb), .2); color: var(--white); font-weight: 700; }
  .legend { display: flex; gap: 14px; font-size: .84rem; margin-top: 8px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="cv" aria-label="心臟四個腔室與體循環、肺循環的 3D 模型"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g7">← 回課程總覽</a>
  <h1>心臟與血液循環</h1>
  <p class="sub">國一生物 · 生物的運輸與防禦</p>

  <div class="body">
    <div class="modes" style="--n:3">
      <button class="mode" data-k="all" aria-pressed="true">完整循環</button>
      <button class="mode" data-k="pul" aria-pressed="false">只看<br>肺循環</button>
      <button class="mode" data-k="sys" aria-pressed="false">只看<br>體循環</button>
    </div>

    <div class="group">
      <div class="result" id="route"></div>
      <div class="legend"><span><i style="background:#ff4d5e"></i>充氧血</span><span><i style="background:#4d7dff"></i>缺氧血</span></div>
    </div>

    <div class="group">
      <div class="group-title">心跳</div>
      <div class="ctrl">
        <label for="bpm">心跳速率 <output id="bpmVal"></output></label>
        <input type="range" id="bpm" min="20" max="120" step="5" value="40">
      </div>
      <div class="row"><button class="btn grow" id="play" aria-pressed="true">❚❚ 暫停</button></div>
      <div class="phase" id="phase"><span>心房收縮</span><span>心室收縮</span><span>舒張</span></div>
    </div>

    <div class="group">
      <div class="group-title">要看哪些部分</div>
      <label class="sw"><input type="checkbox" id="lShell" checked><span class="track"></span>心臟外壁</label>
      <label class="sw"><input type="checkbox" id="lValve" checked><span class="track"></span>瓣膜</label>
      <label class="sw"><input type="checkbox" id="lVessel" checked><span class="track"></span>血管</label>
      <label class="sw"><input type="checkbox" id="lFlow" checked><span class="track"></span>血液流動</label>
      <label class="sw"><input type="checkbox" id="lLabel" checked><span class="track"></span>名稱</label>
      <div class="row"><button class="btn grow" id="onlyValve">只看瓣膜</button><button class="btn grow" id="showAll">全部顯示</button></div>
    </div>

    <div class="group">
      <div class="group-title">點一下心臟的部位</div>
      <div class="result" id="info">點腔室、瓣膜或血管，看它的功能。</div>
    </div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script type="module">
import { start3D, THREE } from './lab3d.js';
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const RED = new THREE.Color(0xff4d5e), BLUE = new THREE.Color(0x4d7dff);
const S = { mode: 'all', bpm: 40, play: true, t: 0 };

const L = start3D({ background: 0x08140f, camera: [0, 0.6, 11.5], target: [0, 0, 0], minDist: 5, maxDist: 22, frame, ui, tap });
const { scene } = L;
const $ = id => document.getElementById(id);
const pickables = [];
const INFO = {};

// ---------- 腔室：圖上左邊是身體的右邊 ----------
const CH = {
  RA: { pos: V(-0.95, 0.75, 0.1),  r: 0.62, c: 0x6d86d9, name: '右心房', txt: '收集全身回來的<b>缺氧血</b>（由大靜脈流入），再送到右心室。' },
  RV: { pos: V(-0.55, -0.7, 0.35), r: 0.78, c: 0x5872c9, name: '右心室', txt: '把缺氧血打進<b>肺動脈</b>送到肺，壁比左心室薄，因為肺很近。' },
  LA: { pos: V(0.95, 0.8, -0.2),   r: 0.6,  c: 0xd9707c, name: '左心房', txt: '收集從肺回來的<b>充氧血</b>（由肺靜脈流入），再送到左心室。' },
  LV: { pos: V(0.6, -0.75, 0.05),  r: 0.9,  c: 0xc95564, name: '左心室', txt: '把充氧血打進<b>主動脈</b>送到全身。壁<b>最厚</b>，因為要把血送得最遠。' }
};
for (const [k, c] of Object.entries(CH)) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(c.r, 32, 20), L.mat(c.c, { transparent: true, opacity: 0.92 }));
  m.position.copy(c.pos);
  m.scale.set(1, k[1] === 'V' ? 1.25 : 0.9, 0.9);
  m.userData.key = k; c.mesh = m; c.base = m.scale.clone();
  scene.add(m); pickables.push(m);
  INFO[k] = `<b>${c.name}</b>：${c.txt}`;
  c.lbl = L.label(c.name, () => c.mesh.position.clone().add(V(0, 0, c.r + 0.4)));
}
// 外壁（半透明）
const shell = new THREE.Mesh(new THREE.SphereGeometry(1.75, 40, 28), L.mat(0xe0707e, { transparent: true, opacity: 0.18, depthWrite: false }));
shell.scale.set(1.05, 1.25, 0.85); shell.rotation.z = -0.25;
scene.add(shell);
// 中隔
const septum = new THREE.Mesh(new THREE.BoxGeometry(0.08, 2.6, 1.1), L.mat(0xf0c2b6));
septum.position.set(0.05, -0.05, 0.1); septum.rotation.z = -0.22;
scene.add(septum);

// ---------- 瓣膜 ----------
const VALVES = [
  { key: 'tri',  name: '房室瓣（右）', at: V(-0.78, 0.05, 0.25), kind: 'av', txt: '在右心房和右心室之間，<b>防止血液倒流</b>回心房。心室收縮時關上。' },
  { key: 'mit',  name: '房室瓣（左）', at: V(0.8, 0.05, -0.08),  kind: 'av', txt: '在左心房和左心室之間，心室收縮時關上，血才不會倒流回心房。' },
  { key: 'pulv', name: '半月瓣（肺動脈）', at: V(-0.25, 0.55, 0.75), kind: 'sl', txt: '在右心室和肺動脈之間。心室收縮時打開，舒張時關上，防止血倒流回心室。' },
  { key: 'aov',  name: '半月瓣（主動脈）', at: V(0.25, 0.45, 0.3),  kind: 'sl', txt: '在左心室和主動脈之間。心室收縮時打開，舒張時關上。' }
];
const valveGroup = new THREE.Group(); scene.add(valveGroup);
VALVES.forEach(v => {
  const g = new THREE.Group(); g.position.copy(v.at);
  const leafs = [];
  for (let i = 0; i < 3; i++) {
    const leaf = new THREE.Mesh(new THREE.CircleGeometry(0.3, 16, 0, Math.PI * 2 / 3), L.mat(0xffd27a, { side: THREE.DoubleSide, emissive: 0x8a5a00, depthTest: false, transparent: true }));
    leaf.renderOrder = 10;
    const pivot = new THREE.Group(); pivot.rotation.z = i * Math.PI * 2 / 3; pivot.add(leaf); leaf.rotation.z = 0;
    g.add(pivot); leafs.push(leaf);
    leaf.userData.key = v.key; pickables.push(leaf);
  }
  g.lookAt(v.kind === 'av' ? v.at.clone().add(V(0, -1, 0.2)) : v.at.clone().add(V(0, 1, 0)));
  v.leafs = leafs; v.g = g; valveGroup.add(g);
  INFO[v.key] = `<b>${v.name}</b>：${v.txt}`;
  v.lbl = L.label(v.name, () => g.getWorldPosition(V(0, 0, 0)).add(V(v.kind === 'av' ? (v.at.x < 0 ? -1.3 : 1.3) : 0, 0, 0.3)));
});

// ---------- 肺與全身 ----------
function organ(pos, color, name, sx = 1, sy = 1) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.9, 24, 16), L.mat(color, { transparent: true, opacity: 0.55 }));
  m.position.copy(pos); m.scale.set(sx, sy, 0.7); scene.add(m);
  L.label(name, () => pos.clone().add(V(0, -0.2, 0.9)), 'big');
  return m;
}
organ(V(-3.4, 2.4, -0.4), 0xf2a3b3, '肺（右）', 0.9, 1.3);
organ(V(3.4, 2.4, -0.4), 0xf2a3b3, '肺（左）', 0.9, 1.3);
organ(V(0, -4.1, -0.3), 0xd9b48f, '全身組織（微血管）', 2.6, 0.55);

// ---------- 血管路徑：兩條 8 字形迴路（經右肺／左肺） ----------
const SEG = {
  heartR: [V(-0.95, 1.6, -0.3), V(-0.95, 0.85, 0.1), V(-0.6, -0.2, 0.3), V(-0.5, -0.9, 0.4)],          // 大靜脈→右心房→右心室
  pa:     [V(-0.3, 0.2, 0.7), V(-0.15, 1.5, 0.5), V(0, 2.2, 0.2)],                                      // 肺動脈
  toLungR: [V(-1.2, 2.5, 0), V(-2.6, 2.6, -0.3), V(-3.2, 2.2, -0.3)],
  backLungR: [V(-3.0, 1.6, -0.6), V(-1.5, 1.4, -0.8), V(0.4, 1.3, -0.7)],
  toLungL: [V(1.2, 2.5, 0), V(2.6, 2.6, -0.3), V(3.2, 2.2, -0.3)],
  backLungL: [V(3.0, 1.6, -0.6), V(1.9, 1.4, -0.7)],
  heartL: [V(1.0, 0.9, -0.3), V(0.85, 0.0, -0.05), V(0.6, -0.9, 0.05), V(0.45, -0.3, 0.2)],            // 左心房→左心室→
  aorta:  [V(0.3, 0.7, 0.2), V(0.35, 2.0, 0.1), V(0.9, 2.3, -0.5), V(1.25, 1.4, -0.9), V(1.2, -1.8, -0.9), V(0.9, -3.6, -0.4)],
  body:   [V(0, -4.1, 0.2), V(-0.9, -3.6, -0.4)],
  vc:     [V(-1.4, -1.8, -0.7), V(-1.3, 0.2, -0.6)]
};
const loopR = [...SEG.heartR, ...SEG.pa, ...SEG.toLungR, ...SEG.backLungR, ...SEG.heartL, ...SEG.aorta, ...SEG.body, ...SEG.vc];
const loopL = [...SEG.heartR, ...SEG.pa, ...SEG.toLungL, ...SEG.backLungL, ...SEG.heartL, ...SEG.aorta, ...SEG.body, ...SEG.vc];
const curves = [new THREE.CatmullRomCurve3(loopR, true, 'centripetal'), new THREE.CatmullRomCurve3(loopL, true, 'centripetal')];
// 找出「到肺」和「到全身」在曲線上的位置，用來換顏色
function uNear(curve, p) { let best = 0, bd = 1e9; for (let i = 0; i <= 400; i++) { const d = curve.getPointAt(i / 400).distanceTo(p); if (d < bd) { bd = d; best = i / 400; } } return best; }
const marks = curves.map((c, i) => ({ lung: uNear(c, i ? V(3.2, 2.2, -0.3) : V(-3.2, 2.2, -0.3)), body: uNear(c, V(0, -4.1, 0.2)) }));
const oxy = (k, u) => { const m = marks[k]; return u > m.lung && u < m.body; };

// 血管管子：依含氧狀態上色
const vessels = new THREE.Group(); scene.add(vessels);
const vesselLabels = [];
function tubeFor(points, color, name, key, txt, at = 0.5) {
  const c = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  const m = new THREE.Mesh(new THREE.TubeGeometry(c, 40, 0.16, 10), L.mat(color, { transparent: true, opacity: 0.55, depthWrite: false }));
  m.userData.key = key; vessels.add(m); pickables.push(m);
  if (name) {
    INFO[key] = `<b>${name}</b>：${txt}`;
    vesselLabels.push(L.label(name, () => c.getPointAt(at).add(V(0, 0.25, 0.35))));
  }
  return m;
}
const VES = {
  pa:   tubeFor([...SEG.pa, ...SEG.toLungR], 0x4d7dff, '肺動脈', 'pa', '從右心室把<b>缺氧血</b>送到肺。是動脈，但裡面流的是缺氧血！', 0.62),
  paL:  tubeFor([SEG.pa[2], ...SEG.toLungL], 0x4d7dff, '', 'pa', ''),
  pv:   tubeFor([...SEG.backLungR, SEG.heartL[0]], 0xff4d5e, '肺靜脈', 'pv', '把肺裡的<b>充氧血</b>送回左心房。是靜脈，但流的是充氧血！', 0.18),
  pvL:  tubeFor([...SEG.backLungL, SEG.heartL[0]], 0xff4d5e, '', 'pv', ''),
  ao:   tubeFor(SEG.aorta, 0xff4d5e, '主動脈', 'ao', '人體最粗的動脈，把左心室打出的<b>充氧血</b>送往全身。'),
  vc:   tubeFor([SEG.body[1], ...SEG.vc, SEG.heartR[0], SEG.heartR[1]], 0x4d7dff, '大靜脈', 'vc', '把全身回來的<b>缺氧血</b>送回右心房。')
};

// ---------- 血液粒子 ----------
const N = 170;
const blood = new THREE.InstancedMesh(new THREE.SphereGeometry(0.075, 8, 6), new THREE.MeshBasicMaterial(), N);
const P = Array.from({ length: N }, (_, i) => ({ k: i % 2, u: Math.random() }));
scene.add(blood);
const dummy = new THREE.Object3D(), col = new THREE.Color();

// ---------- 每一幀 ----------
function phaseAt(f) { return f < 0.15 ? 0 : f < 0.5 ? 1 : 2; }   // 心房收縮、心室收縮、舒張
function frame(dt) {
  if (S.play) S.t += dt * S.bpm / 60;
  const f = S.t % 1, ph = phaseAt(f);
  // 腔室跳動
  const atr = ph === 0 ? 1 - 0.12 * Math.sin((f / 0.15) * Math.PI) : 1;
  const ven = ph === 1 ? 1 - 0.16 * Math.sin(((f - 0.15) / 0.35) * Math.PI) : 1;
  for (const [k, c] of Object.entries(CH)) c.mesh.scale.copy(c.base).multiplyScalar(k[1] === 'A' ? atr : ven);
  shell.scale.set(1.05 * (0.6 + 0.4 * ven), 1.25 * (0.6 + 0.4 * ven), 0.85);
  // 瓣膜：葉片張開（往外翻）或關閉（平的）
  VALVES.forEach(v => {
    const open = v.kind === 'av' ? ph !== 1 : ph === 1;
    v.leafs.forEach(l => { l.rotation.x = THREE.MathUtils.lerp(l.rotation.x, open ? 1.2 : 0, Math.min(1, dt * 14)); });
  });
  // 血流：心室收縮時流得快
  const speed = S.play ? (ph === 1 ? 0.11 : 0.035) * S.bpm / 40 : 0;
  const showFlow = $('lFlow').checked;
  blood.visible = showFlow;
  P.forEach((p, i) => {
    p.u = (p.u + speed * dt) % 1;
    const c = curves[p.k], o = oxy(p.k, p.u);
    const inPul = p.u < marks[p.k].lung + 0.12 && p.u > 0.08;
    const dim = (S.mode === 'pul' && !inPul && !(p.u > marks[p.k].lung && p.u < marks[p.k].lung + 0.2)) ||
                (S.mode === 'sys' && inPul);
    dummy.position.copy(c.getPointAt(p.u));
    dummy.scale.setScalar(dim ? 0.001 : 1);
    dummy.updateMatrix();
    blood.setMatrixAt(i, dummy.matrix);
    blood.setColorAt(i, col.copy(o ? RED : BLUE));
  });
  blood.instanceMatrix.needsUpdate = true;
  blood.instanceColor.needsUpdate = true;
  // 圖層
  shell.visible = $('lShell').checked;
  valveGroup.visible = $('lValve').checked;
  vessels.visible = $('lVessel').checked;
  const showL = $('lLabel').checked;
  VALVES.forEach(v => { v.lbl.show = !shell.visible && valveGroup.visible; });
  vesselLabels.forEach(l => { l.show = vessels.visible; });
  for (const c of Object.values(CH)) c.mesh.material.opacity = shell.visible ? 0.92 : 0.3;
  document.getElementById('labels').style.visibility = showL ? '' : 'hidden';
  // 模式：淡化不相關的血管
  const pul = ['pa', 'paL', 'pv', 'pvL'], sys = ['ao', 'vc'];
  for (const [k, m] of Object.entries(VES)) {
    const on = S.mode === 'all' || (S.mode === 'pul' ? pul.includes(k) : sys.includes(k));
    m.material.opacity = on ? 0.6 : 0.08;
  }
}

const ROUTE = {
  all: '<b>體循環</b>：左心室 → 主動脈 → 全身微血管 → 大靜脈 → 右心房<br><b>肺循環</b>：右心室 → 肺動脈 → 肺部微血管 → 肺靜脈 → 左心房',
  pul: '<b>肺循環</b>：右心室 → 肺動脈 → 肺 → 肺靜脈 → 左心房<br>在肺部微血管<b>放出二氧化碳、得到氧</b>，缺氧血變成充氧血。',
  sys: '<b>體循環</b>：左心室 → 主動脈 → 全身 → 大靜脈 → 右心房<br>在全身微血管<b>把氧和養分交給細胞</b>，充氧血變成缺氧血。'
};
Lab.bindGroup('.mode', k => { S.mode = k; $('route').innerHTML = ROUTE[k]; });
Lab.bindSlider('bpm', x => { S.bpm = x; }, x => x + ' 次/分（放慢）');
$('play').addEventListener('click', e => {
  S.play = !S.play;
  e.currentTarget.setAttribute('aria-pressed', String(S.play));
  e.currentTarget.textContent = S.play ? '❚❚ 暫停' : '▶ 繼續跳動';
});
const setLayers = on => ['lShell', 'lValve', 'lVessel', 'lFlow', 'lLabel'].forEach(id => { $(id).checked = on.includes(id); });
$('onlyValve').addEventListener('click', () => { setLayers(['lValve', 'lLabel']); L.fly([0, 0.8, 6.5], [0, 0.2, 0]); });
$('showAll').addEventListener('click', () => { setLayers(['lShell', 'lValve', 'lVessel', 'lFlow', 'lLabel']); L.fly([0, 0.6, 11.5], [0, 0, 0]); });

function tap(x, y) {
  const visible = pickables.filter(m => { let o = m; while (o) { if (!o.visible) return false; o = o.parent; } return true; });
  const hit = L.pick(x, y, visible);
  if (hit && INFO[hit.object.userData.key]) $('info').innerHTML = INFO[hit.object.userData.key];
}
const phaseEls = [...$('phase').children];
function ui() {
  const ph = phaseAt(S.t % 1);
  phaseEls.forEach((e, i) => e.classList.toggle('on', i === ph));
}
window.heartSim = S;
</script>
<script src="lesson.js" defer></script>
</body>
</html>
