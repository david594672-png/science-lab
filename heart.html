<!DOCTYPE html>
<html lang="zh-Hant" data-subject="bio">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>心臟與血液循環</title>
<link rel="stylesheet" href="lab-kit.css">
<style>
  .phase { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 8px; }
  .phase span { text-align: center; font-size: .78rem; padding: 6px 2px; border-radius: 10px; background: rgba(255,255,255,.05); color: var(--muted); }
  .phase span.on { background: rgba(var(--accent-rgb), .2); color: var(--white); font-weight: 700; }
  .legend { display: flex; gap: 14px; font-size: .84rem; margin-top: 8px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="cv" aria-label="心臟四個腔室與體循環、肺循環的 3D 模型"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g7">← 回課程總覽</a>
  <h1>心臟與血液循環</h1>
  <p class="sub">國一生物 · 生物的運輸與防禦</p>

  <div class="body">
    <div class="seg" style="--n:2;margin-bottom:10px" id="viewSeg">
      <button data-k="3d" aria-pressed="true">3D 心臟</button>
      <button data-k="map" aria-pressed="false">循環路線圖</button>
    </div>
    <div class="modes" style="--n:3">
      <button class="mode" data-k="all" aria-pressed="true">完整循環</button>
      <button class="mode" data-k="pul" aria-pressed="false">只看<br>肺循環</button>
      <button class="mode" data-k="sys" aria-pressed="false">只看<br>體循環</button>
    </div>

    <div class="group">
      <div class="result" id="route"></div>
      <div class="legend"><span><i style="background:#ff4d5e"></i>充氧血</span><span><i style="background:#4d7dff"></i>缺氧血</span></div>
    </div>

    <div class="group">
      <div class="group-title">心跳</div>
      <div class="ctrl">
        <label for="bpm">心跳速率 <output id="bpmVal"></output></label>
        <input type="range" id="bpm" min="20" max="120" step="5" value="40">
      </div>
      <div class="row"><button class="btn grow" id="play" aria-pressed="true">❚❚ 暫停</button></div>
      <div class="phase" id="phase"><span>心房收縮</span><span>心室收縮</span><span>舒張</span></div>
    </div>

    <div class="group only3d">
      <div class="group-title">要看哪些部分</div>
      <label class="sw"><input type="checkbox" id="lShell" checked><span class="track"></span>心臟外壁</label>
      <label class="sw"><input type="checkbox" id="lValve" checked><span class="track"></span>瓣膜</label>
      <label class="sw"><input type="checkbox" id="lVessel" checked><span class="track"></span>血管</label>
      <label class="sw"><input type="checkbox" id="lFlow" checked><span class="track"></span>血液流動</label>
      <label class="sw"><input type="checkbox" id="lLabel" checked><span class="track"></span>名稱</label>
      <div class="row"><button class="btn grow" id="onlyValve">只看瓣膜</button><button class="btn grow" id="showAll">全部顯示</button></div>
    </div>

    <div class="group only3d">
      <div class="group-title">點一下心臟的部位</div>
      <div class="result" id="info">點腔室、瓣膜或血管，看它的功能。</div>
    </div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script type="module">
import { start3D, THREE } from './lab3d.js';
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const RED = new THREE.Color(0xff4d5e), BLUE = new THREE.Color(0x4d7dff);
const S = { mode: 'all', bpm: 40, play: true, t: 0 };

const L = start3D({ background: 0x08140f, camera: [0, 0.6, 11.5], target: [0, 0, 0], minDist: 5, maxDist: 22, frame, ui, tap });
const { scene } = L;
const $ = id => document.getElementById(id);
const pickables = [];
const INFO = {};

// ---------- 腔室：圖上左邊是身體的右邊 ----------
const CH = {
  RA: { pos: V(-0.95, 0.75, 0.1),  r: 0.62, c: 0x6d86d9, name: '右心房', txt: '收集全身回來的<b>缺氧血</b>（由大靜脈流入），再送到右心室。' },
  RV: { pos: V(-0.55, -0.7, 0.35), r: 0.78, c: 0x5872c9, name: '右心室', txt: '把缺氧血打進<b>肺動脈</b>送到肺，壁比左心室薄，因為肺很近。' },
  LA: { pos: V(0.95, 0.8, -0.2),   r: 0.6,  c: 0xd9707c, name: '左心房', txt: '收集從肺回來的<b>充氧血</b>（由肺靜脈流入），再送到左心室。' },
  LV: { pos: V(0.6, -0.75, 0.05),  r: 0.9,  c: 0xc95564, name: '左心室', txt: '把充氧血打進<b>主動脈</b>送到全身。壁<b>最厚</b>，因為要把血送得最遠。' }
};
for (const [k, c] of Object.entries(CH)) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(c.r, 32, 20), L.mat(c.c, { transparent: true, opacity: 0.92 }));
  m.position.copy(c.pos);
  m.scale.set(1, k[1] === 'V' ? 1.25 : 0.9, 0.9);
  m.userData.key = k; c.mesh = m; c.base = m.scale.clone();
  scene.add(m); pickables.push(m);
  INFO[k] = `<b>${c.name}</b>：${c.txt}`;
  c.lbl = L.label(c.name, () => c.mesh.position.clone().add(V(0, 0, c.r + 0.4)));
}
// 外壁（半透明）
const shell = new THREE.Mesh(new THREE.SphereGeometry(1.75, 40, 28), L.mat(0xe0707e, { transparent: true, opacity: 0.18, depthWrite: false }));
shell.scale.set(1.05, 1.25, 0.85); shell.rotation.z = -0.25;
scene.add(shell);
// 中隔
const septum = new THREE.Mesh(new THREE.BoxGeometry(0.08, 2.6, 1.1), L.mat(0xf0c2b6));
septum.position.set(0.05, -0.05, 0.1); septum.rotation.z = -0.22;
scene.add(septum);

// ---------- 瓣膜 ----------
const VALVES = [
  { key: 'tri',  name: '房室瓣（右）', at: V(-0.78, 0.05, 0.25), kind: 'av', txt: '在右心房和右心室之間，<b>防止血液倒流</b>回心房。心室收縮時關上。' },
  { key: 'mit',  name: '房室瓣（左）', at: V(0.8, 0.05, -0.08),  kind: 'av', txt: '在左心房和左心室之間，心室收縮時關上，血才不會倒流回心房。' },
  { key: 'pulv', name: '半月瓣（肺動脈）', at: V(-0.25, 0.55, 0.75), kind: 'sl', txt: '在右心室和肺動脈之間。心室收縮時打開，舒張時關上，防止血倒流回心室。' },
  { key: 'aov',  name: '半月瓣（主動脈）', at: V(0.25, 0.45, 0.3),  kind: 'sl', txt: '在左心室和主動脈之間。心室收縮時打開，舒張時關上。' }
];
const valveGroup = new THREE.Group(); scene.add(valveGroup);
VALVES.forEach(v => {
  const g = new THREE.Group(); g.position.copy(v.at);
  const leafs = [];
  for (let i = 0; i < 3; i++) {
    const leaf = new THREE.Mesh(new THREE.CircleGeometry(0.3, 16, 0, Math.PI * 2 / 3), L.mat(0xffd27a, { side: THREE.DoubleSide, emissive: 0x8a5a00, depthTest: false, transparent: true }));
    leaf.renderOrder = 10;
    const pivot = new THREE.Group(); pivot.rotation.z = i * Math.PI * 2 / 3; pivot.add(leaf); leaf.rotation.z = 0;
    g.add(pivot); leafs.push(leaf);
    leaf.userData.key = v.key; pickables.push(leaf);
  }
  g.lookAt(v.kind === 'av' ? v.at.clone().add(V(0, -1, 0.2)) : v.at.clone().add(V(0, 1, 0)));
  v.leafs = leafs; v.g = g; valveGroup.add(g);
  INFO[v.key] = `<b>${v.name}</b>：${v.txt}`;
  v.lbl = L.label(v.name, () => g.getWorldPosition(V(0, 0, 0)).add(V(v.kind === 'av' ? (v.at.x < 0 ? -1.3 : 1.3) : 0, 0, 0.3)));
});

// ---------- 肺與全身 ----------
function organ(pos, color, name, sx = 1, sy = 1) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.9, 24, 16), L.mat(color, { transparent: true, opacity: 0.55 }));
  m.position.copy(pos); m.scale.set(sx, sy, 0.7); scene.add(m);
  L.label(name, () => pos.clone().add(V(0, -0.2, 0.9)), 'big');
  return m;
}
organ(V(-3.4, 2.4, -0.4), 0xf2a3b3, '肺（右）', 0.9, 1.3);
organ(V(3.4, 2.4, -0.4), 0xf2a3b3, '肺（左）', 0.9, 1.3);
organ(V(0, -4.1, -0.3), 0xd9b48f, '全身組織（微血管）', 2.6, 0.55);

// ---------- 血管路徑：兩條 8 字形迴路（經右肺／左肺） ----------
const SEG = {
  heartR: [V(-0.95, 1.6, -0.3), V(-0.95, 0.85, 0.1), V(-0.6, -0.2, 0.3), V(-0.5, -0.9, 0.4)],          // 大靜脈→右心房→右心室
  pa:     [V(-0.3, 0.2, 0.7), V(-0.15, 1.5, 0.5), V(0, 2.2, 0.2)],                                      // 肺動脈
  toLungR: [V(-1.2, 2.5, 0), V(-2.6, 2.6, -0.3), V(-3.2, 2.2, -0.3)],
  backLungR: [V(-3.0, 1.6, -0.6), V(-1.5, 1.4, -0.8), V(0.4, 1.3, -0.7)],
  toLungL: [V(1.2, 2.5, 0), V(2.6, 2.6, -0.3), V(3.2, 2.2, -0.3)],
  backLungL: [V(3.0, 1.6, -0.6), V(1.9, 1.4, -0.7)],
  heartL: [V(1.0, 0.9, -0.3), V(0.85, 0.0, -0.05), V(0.6, -0.9, 0.05), V(0.45, -0.3, 0.2)],            // 左心房→左心室→
  aorta:  [V(0.3, 0.7, 0.2), V(0.35, 2.0, 0.1), V(0.9, 2.3, -0.5), V(1.25, 1.4, -0.9), V(1.2, -1.8, -0.9), V(0.9, -3.6, -0.4)],
  body:   [V(0, -4.1, 0.2), V(-0.9, -3.6, -0.4)],
  vc:     [V(-1.4, -1.8, -0.7), V(-1.3, 0.2, -0.6)]
};
const loopR = [...SEG.heartR, ...SEG.pa, ...SEG.toLungR, ...SEG.backLungR, ...SEG.heartL, ...SEG.aorta, ...SEG.body, ...SEG.vc];
const loopL = [...SEG.heartR, ...SEG.pa, ...SEG.toLungL, ...SEG.backLungL, ...SEG.heartL, ...SEG.aorta, ...SEG.body, ...SEG.vc];
const curves = [new THREE.CatmullRomCurve3(loopR, true, 'centripetal'), new THREE.CatmullRomCurve3(loopL, true, 'centripetal')];
// 找出「到肺」和「到全身」在曲線上的位置，用來換顏色
function uNear(curve, p) { let best = 0, bd = 1e9; for (let i = 0; i <= 400; i++) { const d = curve.getPointAt(i / 400).distanceTo(p); if (d < bd) { bd = d; best = i / 400; } } return best; }
const marks = curves.map((c, i) => ({ lung: uNear(c, i ? V(3.2, 2.2, -0.3) : V(-3.2, 2.2, -0.3)), body: uNear(c, V(0, -4.1, 0.2)) }));
const oxy = (k, u) => { const m = marks[k]; return u > m.lung && u < m.body; };

// 血管管子：依含氧狀態上色
const vessels = new THREE.Group(); scene.add(vessels);
const vesselLabels = [];
function tubeFor(points, color, name, key, txt, at = 0.5) {
  const c = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  const m = new THREE.Mesh(new THREE.TubeGeometry(c, 40, 0.16, 10), L.mat(color, { transparent: true, opacity: 0.55, depthWrite: false }));
  m.userData.key = key; vessels.add(m); pickables.push(m);
  if (name) {
    INFO[key] = `<b>${name}</b>：${txt}`;
    vesselLabels.push(L.label(name, () => c.getPointAt(at).add(V(0, 0.25, 0.35))));
  }
  return m;
}
const VES = {
  pa:   tubeFor([...SEG.pa, ...SEG.toLungR], 0x4d7dff, '肺動脈', 'pa', '從右心室把<b>缺氧血</b>送到肺。是動脈，但裡面流的是缺氧血！', 0.62),
  paL:  tubeFor([SEG.pa[2], ...SEG.toLungL], 0x4d7dff, '', 'pa', ''),
  pv:   tubeFor([...SEG.backLungR, SEG.heartL[0]], 0xff4d5e, '肺靜脈', 'pv', '把肺裡的<b>充氧血</b>送回左心房。是靜脈，但流的是充氧血！', 0.18),
  pvL:  tubeFor([...SEG.backLungL, SEG.heartL[0]], 0xff4d5e, '', 'pv', ''),
  ao:   tubeFor(SEG.aorta, 0xff4d5e, '主動脈', 'ao', '人體最粗的動脈，把左心室打出的<b>充氧血</b>送往全身。'),
  vc:   tubeFor([SEG.body[1], ...SEG.vc, SEG.heartR[0], SEG.heartR[1]], 0x4d7dff, '大靜脈', 'vc', '把全身回來的<b>缺氧血</b>送回右心房。')
};

// ---------- 血液粒子 ----------
const N = 170;
const blood = new THREE.InstancedMesh(new THREE.SphereGeometry(0.075, 8, 6), new THREE.MeshBasicMaterial(), N);
const P = Array.from({ length: N }, (_, i) => ({ k: i % 2, u: Math.random() }));
scene.add(blood);
const dummy = new THREE.Object3D(), col = new THREE.Color();

// ---------- 每一幀 ----------
function phaseAt(f) { return f < 0.15 ? 0 : f < 0.5 ? 1 : 2; }   // 心房收縮、心室收縮、舒張
function frame(dt) {
  if (S.play) S.t += dt * S.bpm / 60;
  const f = S.t % 1, ph = phaseAt(f);
  // 腔室跳動
  const atr = ph === 0 ? 1 - 0.12 * Math.sin((f / 0.15) * Math.PI) : 1;
  const ven = ph === 1 ? 1 - 0.16 * Math.sin(((f - 0.15) / 0.35) * Math.PI) : 1;
  for (const [k, c] of Object.entries(CH)) c.mesh.scale.copy(c.base).multiplyScalar(k[1] === 'A' ? atr : ven);
  shell.scale.set(1.05 * (0.6 + 0.4 * ven), 1.25 * (0.6 + 0.4 * ven), 0.85);
  // 瓣膜：葉片張開（往外翻）或關閉（平的）
  VALVES.forEach(v => {
    const open = v.kind === 'av' ? ph !== 1 : ph === 1;
    v.leafs.forEach(l => { l.rotation.x = THREE.MathUtils.lerp(l.rotation.x, open ? 1.2 : 0, Math.min(1, dt * 14)); });
  });
  // 血流：心室收縮時流得快
  const speed = S.play ? (ph === 1 ? 0.11 : 0.035) * S.bpm / 40 : 0;
  const showFlow = $('lFlow').checked;
  blood.visible = showFlow;
  P.forEach((p, i) => {
    p.u = (p.u + speed * dt) % 1;
    const c = curves[p.k], o = oxy(p.k, p.u);
    const inPul = p.u < marks[p.k].lung + 0.12 && p.u > 0.08;
    const dim = (S.mode === 'pul' && !inPul && !(p.u > marks[p.k].lung && p.u < marks[p.k].lung + 0.2)) ||
                (S.mode === 'sys' && inPul);
    dummy.position.copy(c.getPointAt(p.u));
    dummy.scale.setScalar(dim ? 0.001 : 1);
    dummy.updateMatrix();
    blood.setMatrixAt(i, dummy.matrix);
    blood.setColorAt(i, col.copy(o ? RED : BLUE));
  });
  blood.instanceMatrix.needsUpdate = true;
  blood.instanceColor.needsUpdate = true;
  // 圖層
  shell.visible = $('lShell').checked;
  valveGroup.visible = $('lValve').checked;
  vessels.visible = $('lVessel').checked;
  const showL = $('lLabel').checked;
  VALVES.forEach(v => { v.lbl.show = !shell.visible && valveGroup.visible; });
  vesselLabels.forEach(l => { l.show = vessels.visible; });
  for (const c of Object.values(CH)) c.mesh.material.opacity = shell.visible ? 0.92 : 0.3;
  document.getElementById('labels').style.visibility = showL ? '' : 'hidden';
  // 模式：淡化不相關的血管
  const pul = ['pa', 'paL', 'pv', 'pvL'], sys = ['ao', 'vc'];
  for (const [k, m] of Object.entries(VES)) {
    const on = S.mode === 'all' || (S.mode === 'pul' ? pul.includes(k) : sys.includes(k));
    m.material.opacity = on ? 0.6 : 0.08;
  }
}

const ROUTE = {
  all: '<b>體循環</b>：左心室 → 主動脈 → 全身微血管 → 大靜脈 → 右心房<br><b>肺循環</b>：右心室 → 肺動脈 → 肺部微血管 → 肺靜脈 → 左心房',
  pul: '<b>肺循環</b>：右心室 → 肺動脈 → 肺 → 肺靜脈 → 左心房<br>在肺部微血管<b>放出二氧化碳、得到氧</b>，缺氧血變成充氧血。',
  sys: '<b>體循環</b>：左心室 → 主動脈 → 全身 → 大靜脈 → 右心房<br>在全身微血管<b>把氧和養分交給細胞</b>，充氧血變成缺氧血。'
};
Lab.bindGroup('.mode', k => { S.mode = k; $('route').innerHTML = ROUTE[k]; });
Lab.bindSlider('bpm', x => { S.bpm = x; }, x => x + ' 次/分（放慢）');
$('play').addEventListener('click', e => {
  S.play = !S.play;
  e.currentTarget.setAttribute('aria-pressed', String(S.play));
  e.currentTarget.textContent = S.play ? '❚❚ 暫停' : '▶ 繼續跳動';
});
const setLayers = on => ['lShell', 'lValve', 'lVessel', 'lFlow', 'lLabel'].forEach(id => { $(id).checked = on.includes(id); });
$('onlyValve').addEventListener('click', () => { setLayers(['lValve', 'lLabel']); L.fly([0, 0.8, 6.5], [0, 0.2, 0]); });
$('showAll').addEventListener('click', () => { setLayers(['lShell', 'lValve', 'lVessel', 'lFlow', 'lLabel']); L.fly([0, 0.6, 11.5], [0, 0, 0]); });

function tap(x, y) {
  const visible = pickables.filter(m => { let o = m; while (o) { if (!o.visible) return false; o = o.parent; } return true; });
  const hit = L.pick(x, y, visible);
  if (hit && INFO[hit.object.userData.key]) $('info').innerHTML = INFO[hit.object.userData.key];
}
const phaseEls = [...$('phase').children];
function ui() {
  const ph = phaseAt(S.t % 1);
  phaseEls.forEach((e, i) => e.classList.toggle('on', i === ph));
}

// =========================================================
// 循環路線圖（2D）：把心臟、肺、全身組織畫成一張路線圖，血液沿著管子流動
// 座標先在 1000×600 的設計圖上排好，畫的時候再縮放到畫布大小
// =========================================================
const cv2 = document.createElement('canvas');
cv2.id = 'cv2'; cv2.setAttribute('aria-label', '體循環與肺循環的路線圖動畫');
cv2.style.cssText = 'position:fixed;left:0;top:0;display:none;z-index:1';
document.body.insertBefore(cv2, document.body.firstChild);
const c2 = cv2.getContext('2d');

// 血液走的路線：每一段 [名稱, 點, 氧氣（1 充氧、0 缺氧、'down' 由充氧變缺氧、'up' 由缺氧變充氧）, 屬於哪個循環]
const SEGS = [
  ['主動脈', [[640, 420], [640, 545], [270, 545], [270, 470]], 1, 'sys'],
  ['小動脈', [[270, 470], [270, 335]], 1, 'sys'],
  ['微血管', [[270, 335], [270, 295]], 'down', 'sys'],
  ['小靜脈', [[270, 295], [270, 160]], 0, 'sys'],
  ['大靜脈', [[270, 160], [270, 38], [500, 38], [500, 140]], 0, 'sys'],
  ['右心', [[500, 140], [500, 420]], 0, 'heart'],
  ['肺動脈', [[500, 420], [500, 500], [900, 500], [900, 450]], 0, 'pul'],
  ['肺', [[900, 450], [900, 150]], 'up', 'pul'],
  ['肺靜脈', [[900, 150], [900, 62], [640, 62], [640, 140]], 1, 'pul'],
  ['左心', [[640, 140], [640, 420]], 1, 'heart']
];
// 把每段切成等長的小點，方便血球沿路移動
const PATH = [];
SEGS.forEach(([name, pts, ox, loop], si) => {
  for (let i = 0; i < pts.length - 1; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[i + 1], len = Math.hypot(bx - ax, by - ay);
    PATH.push({ si, ax, ay, bx, by, len, i, n: pts.length - 1 });
  }
});
const TOTAL = PATH.reduce((t, p) => t + p.len, 0);
function at(d) {
  d = ((d % TOTAL) + TOTAL) % TOTAL;
  for (const p of PATH) {
    if (d <= p.len) {
      const f = d / p.len, x = p.ax + (p.bx - p.ax) * f, y = p.ay + (p.by - p.ay) * f;
      const seg = SEGS[p.si], prog = (p.i + f) / p.n;
      const ox = seg[2] === 'down' ? 1 - prog : seg[2] === 'up' ? prog : seg[2];
      return { x, y, ox, loop: seg[3] };
    }
    d -= p.len;
  }
  return { x: 0, y: 0, ox: 0, loop: 'sys' };
}
const oxCol = (ox, a = 1) => `rgba(${Math.round(77 + (232 - 77) * ox)},${Math.round(125 - 60 * ox)},${Math.round(255 - 180 * ox)},${a})`;
const CELLS = Array.from({ length: 110 }, (_, i) => ({ d: i / 110 * TOTAL }));
// 每一段的起點在路線上的距離，用來找出瓣膜的位置
const SEG_D = []; { let d = 0; SEGS.forEach(([, pts], i) => { SEG_D[i] = d; for (let j = 0; j < pts.length - 1; j++) d += Math.hypot(pts[j + 1][0] - pts[j][0], pts[j + 1][1] - pts[j][1]); }); }
const segAt = d => { let i = SEGS.length - 1; while (i > 0 && SEG_D[i] > d) i--; return i; };
const SI = name => SEGS.findIndex(x => x[0] === name);
// 瓣膜：房室瓣在心臟段往下 132（y = 272）；半月瓣在心室出口（肺動脈、主動脈的起點）
const VAL = { rAV: SEG_D[SI('右心')] + 132, lAV: SEG_D[SI('左心')] + 132, rSL: SEG_D[SI('肺動脈')], lSL: TOTAL };
// 血液在各段的速度：心室收縮時動脈衝很快（脈搏），微血管最慢
function speedAt(d, ph) {
  const name = SEGS[segAt(d)][0];
  if (name === '右心' || name === '左心') {
    const inAtrium = d - SEG_D[segAt(d)] < 132;
    if (inAtrium) return ph === 0 ? 220 : 90;            // 心房收縮時把血擠進心室
    return ph === 1 ? 340 : 70;                          // 心室收縮時把血射出去
  }
  if (name === '主動脈' || name === '肺動脈') return ph === 1 ? 300 : 90;
  if (name === '小動脈') return ph === 1 ? 150 : 90;
  if (name === '微血管') return 40;
  if (name === '肺') return 60;
  return 85;                                             // 靜脈：慢慢流回心臟
}
// 移動血球：瓣膜關著就過不去，在瓣膜前面排隊；血球之間不重疊
function moveCells(dt, ph) {
  const avShut = ph === 1, slShut = ph !== 1, k = S.bpm / 40;
  CELLS.forEach(c => {
    const p = c.d, q = p + speedAt(p, ph) * dt * k;
    let lim = Infinity;
    const block = (B, shut) => { if (!shut) return; const b = B <= p + 0.01 ? B + TOTAL : B; if (q >= b) lim = Math.min(lim, b - 3); };
    block(VAL.rAV, avShut); block(VAL.lAV, avShut); block(VAL.rSL, slShut); block(VAL.lSL, slShut);
    c.d = Math.min(q, lim) % TOTAL;
  });
  const arr = [...CELLS].sort((a, b) => a.d - b.d), GAP = 11;
  for (let i = arr.length - 1; i >= 0; i--) {
    const ahead = i === arr.length - 1 ? arr[0].d + TOTAL : arr[i + 1].d;
    if (arr[i].d > ahead - GAP) arr[i].d = ahead - GAP;
  }
}

function drawRoute(dt, t) {
  const r = $('cv').getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  if (cv2.width !== Math.round(r.width * dpr) || cv2.height !== Math.round(r.height * dpr)) { cv2.width = Math.round(r.width * dpr); cv2.height = Math.round(r.height * dpr); }
  Object.assign(cv2.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
  const k = Math.min(r.width / 1010, r.height / 690), ox0 = (r.width - 1000 * k) / 2, oy0 = (r.height - 640 * k) / 2 + 10 * k;
  const ctx = c2; Lab.ctx = ctx;                       // 借用 lab-kit 的繪圖工具
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = Lab.rg(r.width / 2, r.height / 2, 0, Math.max(r.width, r.height) * 0.7, ['#10261c', '#08140f']); ctx.fillRect(0, 0, r.width, r.height);
  ctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * ox0, dpr * oy0);
  const f = S.t % 1, ph = phaseAt(f);
  const dim = loop => (S.mode === 'pul' && loop === 'sys') || (S.mode === 'sys' && loop === 'pul');

  // --- 全身組織、肺（方塊） ---
  const box = (x, y, w, h, fill, stroke, a = 1) => { ctx.globalAlpha = a; Lab.rr(x, y, w, h, 18); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = stroke; ctx.lineWidth = 4; ctx.stroke(); ctx.globalAlpha = 1; };
  const aSys = dim('sys') ? 0.25 : 1, aPul = dim('pul') ? 0.25 : 1;
  box(20, 150, 150, 320, 'rgba(255,170,90,.08)', '#e8935a', aSys);
  ctx.globalAlpha = aSys;
  ['全身', '組織', '器官'].forEach((s2, i) => Lab.text(s2, 95, 250 + i * 50, '#f2a46b', 36, 'center', 'bold'));
  // 微血管網：小靜脈（上，藍）、小動脈（下，紅），中間是網狀的微血管
  Lab.rr(205, 150, 130, 330, 16); ctx.setLineDash([10, 8]); ctx.strokeStyle = '#c98a4a'; ctx.lineWidth = 3; ctx.stroke(); ctx.setLineDash([]);
  box(220, 165, 100, 125, oxCol(0, 0.85), '#6f9bff', aSys);
  box(220, 340, 100, 125, oxCol(1, 0.85), '#ff6b78', aSys);
  ctx.globalAlpha = aSys;
  ctx.strokeStyle = 'rgba(255,190,200,.8)'; ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(230 + i * 20, 340); ctx.bezierCurveTo(222 + i * 20 + 10 * Math.sin(i), 318, 238 + i * 20, 312, 230 + i * 20, 290); ctx.stroke(); }
  Lab.pill('微血管', 270, 315, '#ffd166', 16);
  ctx.globalAlpha = 1;
  // 肺：下面進缺氧血（藍），上面出充氧血（紅）
  ctx.globalAlpha = aPul;
  Lab.rr(840, 150, 120, 300, 22); ctx.fillStyle = Lab.lg(0, 150, 0, 450, [oxCol(1, 0.9), oxCol(0.5, 0.8), oxCol(0, 0.9)]); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3; ctx.stroke();
  for (let i = 0; i < 9; i++) Lab.circle(860 + (i % 3) * 40, 200 + Math.floor(i / 3) * 80, 14 + 2 * Math.sin(t * 2 + i), null, 'rgba(255,255,255,.25)', 2);   // 肺泡
  ctx.globalAlpha = 1;

  // --- 血管（粗管子） ---
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  SEGS.forEach(([name, pts, ox, loop]) => {
    if (loop === 'heart' || name === '肺' || name === '微血管' || name === '小動脈' || name === '小靜脈') return;
    ctx.globalAlpha = dim(loop) ? 0.18 : 1;
    const o = typeof ox === 'number' ? ox : 0.5;
    ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 34; ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
    const pulse = (name === '主動脈' || name === '肺動脈') && ph === 1 ? 6 * Math.sin(((f - 0.15) / 0.35) * Math.PI) : 0;
    if (pulse > 0.5) { ctx.save(); ctx.shadowColor = oxCol(o); ctx.shadowBlur = 18; }
    ctx.strokeStyle = oxCol(o, 0.95); ctx.lineWidth = 26 + pulse; ctx.stroke();
    if (pulse > 0.5) ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 6; ctx.stroke();
    ctx.globalAlpha = 1;
  });

  // --- 心臟：四個腔室跟著心跳收縮 ---
  const atr = ph === 0 ? 1 - 0.1 * Math.sin((f / 0.15) * Math.PI) : 1;
  const ven = ph === 1 ? 1 - 0.12 * Math.sin(((f - 0.15) / 0.35) * Math.PI) : 1;
  Lab.rr(430, 95, 280, 360, 50); ctx.fillStyle = 'rgba(180,40,60,.18)'; ctx.fill(); ctx.strokeStyle = '#c23a4c'; ctx.lineWidth = 6; ctx.stroke();
  Lab.line(570, 100, 570, 450, '#c23a4c', 6);
  const chamber = (cx, cy, s, ox, name, wall = 3) => {
    const w = 110 * s, h = 112 * s;
    Lab.rr(cx - w / 2, cy - h / 2, w, h, 24); ctx.fillStyle = oxCol(ox, 0.35); ctx.fill(); ctx.strokeStyle = oxCol(ox, 0.9); ctx.lineWidth = wall; ctx.stroke();
    NAMES.push([cx, cy, ox, name]);
  };
  const NAMES = [];
  chamber(500, 200, atr, 0, '右心房'); chamber(500, 362, ven, 0, '右心室');
  chamber(640, 200, atr, 1, '左心房'); chamber(640, 362, ven, 1, '左心室', 9);
  // 房室之間的瓣膜：心室收縮時關閉，其餘時候打開讓血往下流
  const avOpen = ph !== 1, slOpen = ph === 1;
  const valve = (x, y, open, col) => {
    const a = open ? 1.2 : 0.15;
    [-1, 1].forEach(s2 => { ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(x + s2 * 26, y); ctx.lineTo(x + s2 * 26 - s2 * Math.cos(a) * 24, y + Math.sin(a) * 24); ctx.stroke(); });
  };
  valve(500, 272, avOpen, '#ff8f9b'); valve(640, 272, avOpen, '#ff8f9b');
  valve(500, 432, slOpen, '#ffd166'); valve(640, 432, slOpen, '#ffd166');

  // --- 血球 ---

  CELLS.forEach(c => {
    const p = at(c.d);
    if (dim(p.loop)) return;
    // 紅血球：中間凹下去的圓盤

    Lab.circle(p.x, p.y, 3, oxCol(p.ox * 0.85, 1));
  });
  // 腔室名稱、瓣膜說明蓋在血球上面，才看得清楚
  ctx.globalAlpha = aPul; Lab.card(870, 278, 60, 44, 'rgba(120,60,110,.9)', 'rgba(255,255,255,.5)', 12); Lab.text('肺', 900, 300, '#fff', 30, 'center', 'bold');
  ctx.globalAlpha = aSys;
  [['小靜脈', 225, 0], ['小動脈', 405, 1]].forEach(([n, y, o]) => { Lab.card(222, y - 17, 96, 34, oxCol(o, 0.95), 'rgba(255,255,255,.5)', 10); Lab.text(n, 270, y, '#fff', 19, 'center', 'bold'); });
  ctx.globalAlpha = 1;
  NAMES.forEach(([cx, cy, ox, name]) => { Lab.card(cx - 50, cy - 19, 100, 38, oxCol(ox, 0.95), 'rgba(255,255,255,.5)', 10); Lab.text(name, cx, cy, '#fff', 21, 'center', 'bold'); });
  Lab.pill(avOpen ? '房室瓣 開' : '房室瓣 關', 570, 272, avOpen ? '#7dffb0' : '#ff8f9b', 15);
  Lab.pill(slOpen ? '半月瓣 開' : '半月瓣 關', 570, 438, slOpen ? '#7dffb0' : '#ff8f9b', 15);
  Lab.text('壁最厚', 640, 400, 'rgba(255,220,225,.85)', 13, 'center', 'bold');
  // 心跳的三個時期：說明血液現在怎麼走
  const PH = [
    ['① 心房收縮', '房室瓣開、半月瓣關：心房把血擠進心室'],
    ['② 心室收縮', '房室瓣關（防止血倒流回心房）、半月瓣開：血被射進主動脈和肺動脈'],
    ['③ 舒張', '心房心室都放鬆、半月瓣關：靜脈的血流回心房，心房的血慢慢流進心室']
  ][ph];
  Lab.card(170, 578, 800, 50, 'rgba(8,20,15,.85)', ph === 1 ? '#ffd166' : 'rgba(255,255,255,.3)', 14);
  Lab.text(PH[0], 240, 603, ph === 1 ? '#ffd166' : '#7dffb0', 19, 'center', 'bold');
  Lab.text(PH[1], 590, 603, '#eef1fa', 16, 'center', 'bold');
  if (ph === 1) Lab.pill('脈搏：動脈被撐大', 455, 505, '#ffd166', 14);
  // 前進方向的小箭頭
  [[640, 500, 0, 1], [420, 545, -1, 0], [270, 90, 0, -1], [400, 38, 1, 0], [700, 500, 1, 0], [780, 62, -1, 0]].forEach(([x, y, dx, dy]) => {
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.moveTo(x + dx * 9, y + dy * 9); ctx.lineTo(x - dy * 7 - dx * 6, y + dx * 7 - dy * 6); ctx.lineTo(x + dy * 7 - dx * 6, y - dx * 7 - dy * 6); ctx.fill();
  });
  // --- 氣體交換：O₂、CO₂ 飄動 ---
  const gas = (x0, y0, x1, y1, txt, col, ph0, a) => { const g = (t * 0.6 + ph0) % 1; ctx.globalAlpha = a * Math.sin(g * Math.PI); Lab.text(txt, x0 + (x1 - x0) * g, y0 + (y1 - y0) * g, col, 16, 'center', 'bold'); ctx.globalAlpha = 1; };
  if (!dim('sys')) { gas(225, 315, 150, 300, 'O₂', '#ff9aa6', 0, 1); gas(150, 340, 225, 330, 'CO₂', '#9ec0ff', 0.5, 1); }
  if (!dim('pul')) { gas(915, 280, 990, 260, 'CO₂', '#9ec0ff', 0.2, 1); gas(990, 330, 915, 310, 'O₂', '#ff9aa6', 0.7, 1); }

  // --- 血管名稱 ---
  const tag = (s2, x, y, ox, loop) => { ctx.globalAlpha = dim(loop) ? 0.3 : 1; Lab.card(x - 52, y - 18, 104, 36, oxCol(ox, 1), 'rgba(255,255,255,.6)', 10); Lab.text(s2, x, y, '#fff', 20, 'center', 'bold'); ctx.globalAlpha = 1; };
  tag('主動脈', 455, 545, 1, 'sys'); tag('大靜脈', 385, 38, 0, 'sys'); tag('肺動脈', 760, 500, 0, 'pul'); tag('肺靜脈', 770, 62, 1, 'pul');
  // 循環名稱
  if (S.mode !== 'pul') Lab.text('體循環', 110, 525, 'rgba(255,170,120,.85)', 22, 'center', 'bold');
  if (S.mode !== 'sys') Lab.text('肺循環', 900, 545, 'rgba(160,200,255,.9)', 22, 'center', 'bold');
  Lab.text('（面對著人看，心臟的「右」在畫面左邊）', 570, 472, 'rgba(238,241,250,.55)', 13, 'center');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

// 切換「3D 心臟」和「循環路線圖」
let view = '3d', last = performance.now();
function loop2(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (view === 'map') { const keep = Lab.ctx; drawRoute(dt, now / 1000); Lab.ctx = keep; }
  requestAnimationFrame(loop2);
}
requestAnimationFrame(loop2);
Lab.bindGroup('#viewSeg button', k => {
  view = k;
  cv2.style.display = k === 'map' ? 'block' : 'none';
  $('cv').style.visibility = k === 'map' ? 'hidden' : '';
  const lb = document.getElementById('labels'); if (lb) lb.style.display = k === 'map' ? 'none' : '';
  document.querySelectorAll('.only3d').forEach(el => { el.hidden = k === 'map'; });
});
window.heartSim = S;
