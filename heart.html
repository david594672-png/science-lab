<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心臟與雙循環模擬器</title>
<style>
  :root {
    --bg: #eef3f7;
    --ink: #1d1d1f;
    --ink-soft: #6e6e73;
    --card: rgba(255,255,255,.62);
    --accent: #e0557a;
    --blue: #3f7be8;
    --red: #e5484d;
    --gold: #e9a800;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #scene { position: absolute; inset: 0; }
  #scene canvas { display: block; }

  .glass {
    background: var(--card); backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid rgba(255,255,255,.8); box-shadow: 0 20px 50px rgba(40,60,80,.12), 0 2px 6px rgba(40,60,80,.05);
  }
  .panel { position: absolute; top: 18px; left: 18px; width: 320px; max-height: calc(100vh - 36px); overflow-y: auto; z-index: 10; border-radius: 26px; padding: 18px; }
  .panel.collapsed { width: auto; min-width: 250px; }
  .panel.collapsed .body { display: none; }
  .collapse {
    position: absolute; top: 18px; right: 16px; z-index: 2; cursor: pointer; border: none;
    font: inherit; font-size: .76rem; font-weight: 600; color: var(--accent);
    background: rgba(224,85,122,.1); border-radius: 999px; padding: 4px 12px;
  }
  .back { font-size: .78rem; color: var(--accent); text-decoration: none; }
  .title { font-size: 1.15rem; font-weight: 700; margin-top: 6px; padding-right: 62px; }
  .sub { font-size: .78rem; color: var(--ink-soft); }

  .box { background: rgba(255,255,255,.78); border-radius: 18px; padding: 12px 14px; margin-top: 10px; font-size: .82rem; line-height: 1.6; }
  .box .h { font-size: .72rem; font-weight: 700; color: var(--ink-soft); letter-spacing: .04em; margin-bottom: 6px; }

  /* 三種模式 */
  .modes { display: grid; gap: 6px; }
  .mode {
    display: flex; align-items: center; gap: 10px; text-align: left; cursor: pointer;
    font: inherit; font-size: .86rem; font-weight: 700; padding: 10px 12px; border-radius: 14px;
    border: 1.5px solid transparent; background: rgba(118,118,128,.1); color: var(--ink);
    transition: background .2s, border-color .2s;
  }
  .mode span { font-size: 1.15rem; }
  .mode.on { background: #fff; border-color: var(--accent); box-shadow: 0 4px 12px rgba(224,85,122,.18); }

  .rate { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .rate .v { font-size: 1.4rem; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .rate .v small { font-size: .74rem; color: var(--ink-soft); font-weight: 600; margin-left: 2px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 12px; border-radius: 999px; cursor: pointer; outline: none;
    background: linear-gradient(90deg, #b9d6ff 0%, #ffc2d1 50%, #e0557a 100%); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
  input[type=range]::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: #fff; border: none; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
  input[type=range]:focus-visible { box-shadow: 0 0 0 4px rgba(224,85,122,.3); }
  .scale { display: flex; justify-content: space-between; font-size: .7rem; color: var(--ink-soft); margin-top: 6px; }

  .phases { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .phase { text-align: center; font-size: .72rem; font-weight: 700; padding: 7px 2px; border-radius: 12px; background: rgba(118,118,128,.1); color: var(--ink-soft); transition: background .2s, color .2s; }
  .phase.on { background: var(--accent); color: #fff; }
  .valves { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .valve { border-radius: 12px; padding: 7px 10px; background: rgba(255,255,255,.9); font-size: .74rem; }
  .valve b { display: block; font-size: .9rem; }
  .valve b.open { color: #16a34a; } .valve b.shut { color: #94a3b8; }

  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .btn { border: none; border-radius: 14px; padding: 10px; cursor: pointer; font: inherit; font-size: .84rem; font-weight: 700; color: var(--accent); background: rgba(224,85,122,.1); }
  .btn:hover { background: rgba(224,85,122,.18); }
  .btn.primary { color: #fff; background: var(--accent); box-shadow: 0 6px 16px rgba(224,85,122,.3); }

  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 10px; font-size: .76rem; }
  .legend div { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 50%; flex: none; }

  /* 上方提示牌與右下觀念卡 */
  .warn {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%); z-index: 9;
    padding: 10px 18px; border-radius: 18px; font-size: .9rem; font-weight: 700; white-space: nowrap;
    background: rgba(255,248,225,.92); border: 1.5px solid #f5b83d; color: #7a4b00; box-shadow: 0 8px 22px rgba(245,184,61,.25);
  }
  @media (min-width: 761px) { .warn { left: calc(50% + 170px); } }
  .tip {
    position: absolute; right: 18px; bottom: 18px; z-index: 9; width: 330px; border-radius: 22px; padding: 14px 16px;
    transform: translateY(10px); opacity: 0; transition: opacity .35s, transform .35s;
  }
  .tip.show { opacity: 1; transform: none; }
  .tip .t { font-size: .95rem; font-weight: 800; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .tip p { font-size: .8rem; line-height: 1.65; }
  .tip .eq { margin-top: 8px; padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,.85); font-size: .8rem; font-weight: 700; text-align: center; }
  .tip .x { position: absolute; top: 10px; right: 12px; border: none; background: none; font-size: 1rem; cursor: pointer; color: var(--ink-soft); }

  .tag {
    position: absolute; z-index: 5; pointer-events: none; transform: translate(-50%, -50%);
    font-size: .74rem; font-weight: 600; padding: 4px 10px; border-radius: 12px; white-space: nowrap;
    background: rgba(255,255,255,.86); color: var(--ink); box-shadow: 0 4px 12px rgba(0,0,0,.08);
  }
  .tag.b { color: var(--blue); } .tag.r { color: var(--red); } .tag.big { font-size: .82rem; font-weight: 800; }
  .tag.ex { background: rgba(255,255,255,.95); border: 1.5px solid currentColor; }
  .hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 5; font-size: .74rem; color: rgba(29,29,31,.45); }
  .fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--ink-soft); line-height: 1.8; }

  /* 3D 立體 / 循環示意圖 切換 */
  .views { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin-top: 12px; border-radius: 16px; background: rgba(118,118,128,.14); }
  .view-btn { border: none; font: inherit; font-size: .86rem; font-weight: 700; min-height: 42px; border-radius: 12px; background: transparent; color: var(--ink-soft); cursor: pointer; }
  .view-btn.on { background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); }

  /* 圖層開關 */
  .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .presets .btn { margin: 0; }
  .layers { display: flex; flex-wrap: wrap; gap: 6px; }
  .layer {
    display: inline-flex; align-items: center; gap: 5px; cursor: pointer; font: inherit; font-size: .78rem; font-weight: 600;
    min-height: 36px; padding: 5px 11px; border-radius: 999px; color: var(--ink-soft);
    border: 1.5px solid rgba(118,118,128,.25); background: rgba(255,255,255,.6);
  }
  .layer[aria-pressed="true"] { color: var(--ink); background: #fff; border-color: var(--accent); }
  .layer::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid currentColor; }
  .layer[aria-pressed="true"]::before { background: var(--accent); border-color: var(--accent); }

  /* 循環示意圖（平面） */
  #diagram { position: absolute; inset: 0; z-index: 1; display: none; padding: 70px 24px 20px 360px; background: var(--bg); }
  #diagram svg { width: 100%; height: 100%; display: block; }
  body.flat #diagram { display: block; }
  body.flat #scene, body.flat .hint, body.flat .tag, body.flat .only3d { display: none !important; }
  #diagram text { font-family: inherit; font-weight: 800; }
  @media (max-width: 760px), (max-width: 1100px) and (orientation: portrait) {
    #diagram { padding: 56px 6px 46vh 6px; }
  }

  @media (max-width: 760px) {
    .warn { top: 8px; left: 8px; right: 8px; transform: none; white-space: normal; font-size: .78rem; padding: 7px 12px; text-align: center; }
    .tip { left: 8px; right: 8px; width: auto; top: 56px; bottom: auto; padding: 10px 14px; }
    .tip p { font-size: .72rem; line-height: 1.55; }
    .tip .t { font-size: .85rem; margin-bottom: 4px; }
    .tip .eq { font-size: .72rem; padding: 5px 8px; margin-top: 6px; }
  }
</style>
<script src="mobile.js"></script>

<div id="scene"></div>

<aside class="panel glass" id="panel">

  <div class="body">

      <button class="view-btn on" data-view="3d" role="tab" aria-selected="true">3D 立體</button>

</aside>

<aside class="tip glass" id="tip" aria-live="polite">

  <div class="t" id="tipTitle"></div>
  <p id="tipText"></p>
  <div class="eq" id="tipEq" hidden></div>
</aside>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

window.__heartReady = true;
const $ = id => document.getElementById(id);
const V3 = (x, y, z = 0) => new THREE.Vector3(x, y, z);
const S = THREE.MathUtils.smoothstep;

/* =========================================================
   場景與材質（Soft 3D 果凍黏土風）
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
$('scene').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef3f7);
scene.add(new THREE.AmbientLight(0xffffff, 0.75));
scene.add(new THREE.HemisphereLight(0xffffff, 0xd6dde6, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.1);
sun.position.set(-6, 12, 10);

{

    p.setXYZ(i, p.getX(i) * HEART.rx * taper, y * HEART.ry, p.getZ(i) * HEART.rz * (1 - 0.15 * S(-y, 0, 1)));

  return { x: HEART.rx * base * k, z: HEART.rz * base * (1 - 0.15 * S(-u, 0, 1)) };
};

function makeValve(center, width, up) {
  const g = new THREE.Group();
  g.position.copy(center);
  const flaps = [-1, 1].map(s => {
    const pivot = new THREE.Group();
    pivot.position.x = s * width / 2;
    const leaf = new THREE.Mesh(new RoundedBoxGeometry(width / 2, 0.07, width * 0.9, 4, 0.03), valveMat);
    leaf.position.x = -s * width / 4;
    leaf.castShadow = true;
    pivot.add(leaf);
    g.add(pivot);
    return { pivot, s };
  });
  heart.add(reg('valves', g));
  return { g, flaps, up, open: 0 };
}

/** 微血管網：多條細分支，顏色由一端漸變到另一端 */
function capillaryBed(y, fromX, toX, fromColor, toColor) {
  const branches = [];
  for (let i = 0; i < 6; i++) {
    const z = (i - 2.5) * 0.42;
    const pts = [];
    for (let k = 0; k <= 8; k++) {
      const t = k / 8;
      const x = fromX + (toX - fromX) * t;
      const spread = Math.sin(Math.PI * t);                       // 中間散開、兩端匯聚
      pts.push(V3(x, y + Math.sin(t * Math.PI * 3 + i) * 0.18 * spread, z * spread));
    }
    const cv = curve(pts);
    const geo = new THREE.TubeGeometry(cv, 80, 0.07, 10, false);
    // 頂點顏色：由缺氧（藍）漸變到充氧（紅）或反之
    const pos = geo.attributes.position, col = [];
    for (let j = 0; j < pos.count; j++) {
      const t = (pos.getX(j) - fromX) / (toX - fromX);
      const c = fromColor.clone().lerp(toColor, THREE.MathUtils.clamp(t, 0, 1));
      col.push(c.r, c.g, c.b);
    }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    scene.add(reg('beds', new THREE.Mesh(geo, clay(0xffffff, { vertexColors: true, transparent: true, opacity: 0.85 }))));
    branches.push(cv);
  }
  // 發光平台：微血管交換區
  const pad = new THREE.Mesh(new RoundedBoxGeometry(Math.abs(toX - fromX) + 1.2, 0.08, 3.4, 4, 0.04),
    new THREE.MeshPhysicalMaterial({ color: 0xffffff, emissive: 0xfff1d6, emissiveIntensity: 0.5, transparent: true, opacity: 0.35, roughness: 0.4 }));
  pad.position.set((fromX + toX) / 2, y - 0.45, 0);
  pad.receiveShadow = true;
  scene.add(reg('beds', pad));
  return branches;
}

function textSprite(text, color, w = 2.0) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 180;
  const g = c.getContext('2d');
  g.font = '900 120px "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let i = 8; i > 0; i--) { g.fillStyle = 'rgba(0,0,0,0.05)'; g.fillText(text, 256 + i * 1.2, 92 + i * 1.6); }
  g.lineWidth = 14; g.strokeStyle = '#fff'; g.lineJoin = 'round'; g.strokeText(text, 256, 90);
  g.fillStyle = color; g.fillText(text, 256, 90);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
  s.scale.set(w, w * 180 / 512, 1);
  s.renderOrder = 20;
  return s;
}

/* =========================================================
   心動週期（相位 φ ∈ [0,1)）
   ========================================================= */
const PHASE = {
  avOpen: p => p < 0.15 || p > 0.6,
  slOpen: p => p > 0.22 && p < 0.55,
  name: p => p < 0.15 ? 'atrial' : p < 0.55 ? 'ventricular' : 'diastole'
};
const bump = (p, a, b) => (p > a && p < b) ? Math.sin(Math.PI * (p - a) / (b - a)) : 0;

/* =========================================================
   血液粒子：沿雙循環不斷流動，碰到關閉的瓣膜就在腔室等待
   ---------------------------------------------------------
   一圈：右心房 →(三尖瓣)→ 右心室 →(肺動脈瓣)→ 肺動脈 → 肺微血管 → 肺靜脈
        → 左心房 →(二尖瓣)→ 左心室 →(主動脈瓣)→ 主動脈 → 組織微血管 → 腔靜脈 → 右心房
   ========================================================= */
const CHAMBER = {
  RA: { c: V3(-1.15, 1.35, 0), s: V3(0.7, 0.45, 0.6) }, RV: { c: V3(-1.05, -0.75, 0), s: V3(0.65, 0.6, 0.6) },
  LA: { c: V3(1.15, 1.35, 0), s: V3(0.7, 0.45, 0.6) },  LV: { c: V3(1.05, -0.75, 0), s: V3(0.65, 0.6, 0.6) }
};
const randIn = ch => {
  const d = V3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize().multiplyScalar(Math.cbrt(Math.random()));
  return ch.c.clone().add(V3(d.x * ch.s.x, d.y * ch.s.y, d.z * ch.s.z));
};
const sample = (cv, n) => Array.from({ length: n + 1 }, (_, i) => cv.getPointAt(i / n));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function lap() {
  const W = [];
  const add = (p, extra = {}) => W.push({ p, ...extra });
  add(randIn(CHAMBER.RA), { pool: true });
  add(VALVES.tri.g.position.clone().add(V3(0, 0.15, 0)), { gate: 'av' });
  add(VALVES.tri.g.position.clone().add(V3(0, -0.3, 0)));
  add(randIn(CHAMBER.RV), { pool: true });
  add(V3(-0.6, 0.2, 0.9));
  sample(PATHS.pa, 10).forEach((p, i) => add(p, i === 0 ? { gate: 'sl', fast: true } : { fast: true }));
  sample(pick(LUNG_BEDS), 16).forEach((p, i) => add(p, { bed: 'lung', t: i / 16 }));
  sample(PATHS.pv, 8).forEach(p => add(p, { fast: true }));
  add(randIn(CHAMBER.LA), { pool: true });
  add(VALVES.mit.g.position.clone().add(V3(0, 0.15, 0)), { gate: 'av' });
  add(VALVES.mit.g.position.clone().add(V3(0, -0.3, 0)));
  add(randIn(CHAMBER.LV), { pool: true });
  add(V3(0.6, 0.2, 0.9));
  sample(PATHS.ao, 16).forEach((p, i) => add(p, i === 0 ? { gate: 'sl', fast: true } : { fast: true }));
  sample(pick(BODY_BEDS), 16).forEach((p, i) => add(p, { bed: 'body', t: i / 16 }));
  sample(PATHS.vc, 12).forEach(p => add(p, { fast: true }));
  return W;
}

const N = 90;
const pGeo = new THREE.SphereGeometry(0.11, 14, 10);
const particles = [];
for (let i = 0; i < N; i++) {
  const mat = new THREE.MeshStandardMaterial({ color: BLUE, emissive: BLUE, emissiveIntensity: 1.1, roughness: 0.3 });
  const m = new THREE.Mesh(pGeo, mat);
  scene.add(reg('blood', m));
  const route = lap();
  const idx = Math.floor(Math.random() * (route.length - 1));
  // 依開場位置決定含氧量：肺之後到組織之前是充氧血
  const lungEnd = route.findIndex(w => w.bed === 'lung' && w.t >= 0.99);
  const bodyStart = route.findIndex(w => w.bed === 'body');
  const pt = { m, mat, route, idx, o: idx > lungEnd && idx < bodyStart ? 1 : 0, seed: Math.random() * 10 };
  m.position.copy(route[idx].p);
  particles.push(pt);
}

function stepParticles(dt, phase, speedK) {
  const av = PHASE.avOpen(phase), sl = PHASE.slOpen(phase);
  const ven = bump(phase, 0.22, 0.55), atr = bump(phase, 0, 0.15);
  const t = performance.now() / 1000;
  for (const pt of particles) {
    const wp = pt.route[pt.idx];
    if (wp.gate && !(wp.gate === 'av' ? av : sl)) {
      pt.m.position.x += Math.sin(t * 2 + pt.seed) * 0.0015;
      pt.m.position.y += Math.cos(t * 2.3 + pt.seed) * 0.0015;
      continue;
    }
    let v = (wp.fast ? 2.4 : wp.bed ? 1.1 : 1.2) * speedK;
    if (wp.gate === 'sl' || (wp.fast && pt.idx < pt.route.length / 2 + 20)) v *= 1 + 2 * ven;
    if (wp.gate === 'av' || wp.pool) v *= 1 + 1.5 * atr;
    const d = wp.p.clone().sub(pt.m.position);
    const step = v * dt;
    if (d.length() <= step) {
      pt.m.position.copy(wp.p);
      // 經過微血管時含氧量逐漸改變：肺 → 變紅，組織 → 變藍
      if (wp.bed === 'lung') pt.o = Math.max(pt.o, wp.t);
      if (wp.bed === 'body') pt.o = Math.min(pt.o, 1 - wp.t);
      pt.idx++;
      if (pt.idx >= pt.route.length) { pt.route = lap(); pt.idx = 0; }
    } else pt.m.position.addScaledVector(d.normalize(), step);
    pt.mat.color.copy(BLUE).lerp(RED, pt.o);
    pt.mat.emissive.copy(pt.mat.color);
  }
}

};
const exPool = [];
function spawnEx(type, from, to, life = 2.2) {
  const m = new THREE.Mesh(EX[type].geo, EX[type].mat);
  m.position.copy(from);
  if (type === 'glu') m.rotation.x = Math.PI / 2;
  scene.add(m);
  exPool.push({ m, from: from.clone(), to: to.clone(), age: 0, life, spin: Math.random() * 2 });
}
const bedPoint = beds => pick(beds).getPointAt(0.2 + Math.random() * 0.6);
let spawnAcc = 0;
function stepExchange(dt) {
  spawnAcc += dt;
  const interval = mode === 'glucose' ? 0.07 : 0.11;
  while (spawnAcc > interval) {
    spawnAcc -= interval;
    if (mode === 'gas') {
      // 肺：O₂ 從肺泡進入微血管；CO₂ 從微血管離開、被呼出
      const a = pick(alveoli).position.clone();
      spawnEx('o2', a, bedPoint(LUNG_BEDS));
      const c = bedPoint(LUNG_BEDS);
      spawnEx('co2', c, c.clone().add(V3((Math.random() - 0.5) * 2, 2.6 + Math.random(), (Math.random() - 0.5) * 2)));
      // 組織：O₂ 從微血管進入細胞；CO₂ 從細胞進入微血管
      spawnEx('o2', bedPoint(BODY_BEDS), pick(cells).position.clone());
      spawnEx('co2', pick(cells).position.clone(), bedPoint(BODY_BEDS));
    } else if (mode === 'glucose') {
      // 葡萄糖：大量從組織微血管釋放、進入組織細胞
      spawnEx('glu', bedPoint(BODY_BEDS), pick(cells).position.clone().add(V3(0, 0.1, 0)), 1.8);
      spawnEx('glu', bedPoint(BODY_BEDS), pick(cells).position.clone().add(V3(0, 0.1, 0)), 1.8);
    }
  }
  for (let i = exPool.length - 1; i >= 0; i--) {
    const e = exPool[i];
    e.age += dt;
    const k = e.age / e.life;
    if (k >= 1 || (mode === 'flow')) { scene.remove(e.m); exPool.splice(i, 1); continue; }
    const ease = k * k * (3 - 2 * k);
    e.m.position.copy(e.from).lerp(e.to, ease);
    e.m.position.y += Math.sin(k * Math.PI) * 0.25;            // 微微飄起的弧線
    e.m.scale.setScalar(Math.min(1, k * 6) * (1 - S(k, 0.82, 1)));
    e.m.rotation.y += dt * (1 + e.spin);
  }
}

/* =========================================================
   觀念提示卡
   ========================================================= */
const TIPS = {
  flow: {
    t: '🩸 雙循環', eq: '',
    p: '<b style="color:#3f7be8">肺循環</b>：右心室 → 肺動脈 → 肺 → 肺靜脈 → 左心房。<br><b style="color:#e5484d">體循環</b>：左心室 → 主動脈 → 全身 → 上、下腔靜脈 → 右心房。<br>兩個循環在心臟交會，形成 8 字形。'
  },
  gas: {
    t: '🫁 氣體交換',
    p: '<b>肺泡</b>：O₂ 擴散進入血液、CO₂ 離開血液被呼出 → 血液由<b style="color:#3f7be8">藍</b>變<b style="color:#e5484d">紅</b>。<br><b>組織</b>：O₂ 從血液擴散進入細胞、細胞產生的 CO₂ 進入血液 → 血液由<b style="color:#e5484d">紅</b>變<b style="color:#3f7be8">藍</b>。',
    eq: '氣體總是由「濃度高」往「濃度低」的地方擴散'
  },
  glucose: {
    t: '🍬 葡萄糖交換',
    p: '小腸吸收的葡萄糖由血液運送到全身，從<b>微血管</b>進入<b>組織細胞</b>。細胞利用葡萄糖和氧氣進行<b>細胞呼吸</b>，釋放能量，同時產生二氧化碳。',
    eq: '葡萄糖 ＋ 氧 → 二氧化碳 ＋ 水 ＋ 能量'
  }
};
function showTip(m) {
  const T = TIPS[m];
  $('tipTitle').textContent = T.t;
  $('tipText').innerHTML = T.p;
  $('tipEq').hidden = !T.eq;
  $('tipEq').textContent = T.eq;
  $('tip').classList.remove('show');
  void $('tip').offsetWidth;          // 重新播放彈出動畫
  $('tip').classList.add('show');
  // 手機畫面小：提示卡 6 秒後自動收起，不擋住心臟
  clearTimeout(showTip.timer);
  if (window.matchMedia('(max-width: 760px)').matches) showTip.timer = setTimeout(() => $('tip').classList.remove('show'), 6000);
}
$('tipClose').addEventListener('click', () => $('tip').classList.remove('show'));

/* =========================================================
   UI 與主迴圈
   ========================================================= */
let mode = 'flow', bpm = 40, playing = true, phase = 0.6;
document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => {
  mode = b.dataset.mode;
  document.querySelectorAll('.mode').forEach(x => x.classList.toggle('on', x === b));
  showTip(mode);
}));
$('bpm').addEventListener('input', e => { bpm = Number(e.target.value); $('bpmVal').innerHTML = `${bpm}<small>次/分</small>`; });
$('playBtn').addEventListener('click', () => { playing = !playing; $('playBtn').textContent = playing ? '⏸ 暫停' : '▶ 播放'; });
$('collapse').addEventListener('click', () => {
  const c = $('panel').classList.toggle('collapsed');
  $('collapse').textContent = c ? '展開' : '收合';
});

let closeView = false;     // 「只看瓣膜」時拉近到心臟
function resetView() {
  const pos = closeView ? V3(0, 1.6, 15) : V3(0, 2.2, 29), tgt = closeView ? V3(0, 0.3, 0) : V3(0, 0.5, 0);
  const panel = $('panel');
  if (!window.MobileView?.isMobile() && !panel.classList.contains('collapsed')) {
    const visW = 2 * pos.distanceTo(tgt) * Math.tan(camera.fov * Math.PI / 360) * camera.aspect;
    const shift = -(panel.getBoundingClientRect().right / 2) / window.innerWidth * visW;
    pos.x += shift; tgt.x += shift;
  }
  camera.position.copy(pos);
  controls.target.copy(tgt);
  controls.update();
  window.MobileView?.frame(camera, controls, 0.8);
}
$('viewBtn').addEventListener('click', resetView);

/* ----- 圖層開關 ----- */
function applyLayers() {
  Object.entries(LAYERS).forEach(([k, L]) => L.objs.forEach(o => { o.visible = layerOn[k]; }));
  document.querySelectorAll('.layer').forEach(b => b.setAttribute('aria-pressed', String(layerOn[b.dataset.k])));
}
$('layers').innerHTML = Object.entries(LAYERS).map(([k, L]) =>
  `<button class="layer" data-k="${k}" aria-pressed="true">${L.name}</button>`).join('');
$('layers').addEventListener('click', e => {
  const b = e.target.closest('.layer');
  if (!b) return;
  layerOn[b.dataset.k] = !layerOn[b.dataset.k];
  applyLayers();
});
function setLayers(keys, close) {
  Object.keys(layerOn).forEach(k => { layerOn[k] = keys.includes(k); });
  applyLayers();
  closeView = close;
  resetView();
}
$('onlyValves').addEventListener('click', () => setLayers(['valves', 'blood', 'names'], true));
$('allLayers').addEventListener('click', () => setLayers(Object.keys(LAYERS), false));

/* ----- 3D 立體 / 循環示意圖 ----- */
let view = '3d';
document.querySelectorAll('.view-btn').forEach(b => b.addEventListener('click', () => {
  view = b.dataset.view;
  document.querySelectorAll('.view-btn').forEach(x => {
    x.classList.toggle('on', x === b);
    x.setAttribute('aria-selected', String(x === b));
  });
  document.body.classList.toggle('flat', view === 'flat');
}));

/* =========================================================
   循環示意圖的血流：沿一條 8 字形折線前進
   小動脈 → 微血管 → 小靜脈 → 大靜脈 → 右心房 →(房室瓣)→ 右心室 →(半月瓣)→ 肺動脈 → 肺
   → 肺靜脈 → 左心房 →(房室瓣)→ 左心室 →(半月瓣)→ 主動脈 → 小動脈
   ========================================================= */
const DG = (() => {
  const P = [[250,380],[250,130],[250,50],[470,50],[470,240],[470,390],[470,455],[900,455],[900,380],[900,140],
             [900,50],[630,50],[630,240],[630,390],[630,530],[250,530],[250,380]];
  const cum = [0];
  for (let i = 1; i < P.length; i++) cum.push(cum[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
  const TOTAL = cum[cum.length - 1];
  const GATES = [{ s: cum[4], v: 'av' }, { s: cum[5], v: 'sl' }, { s: cum[12], v: 'av' }, { s: cum[13], v: 'sl' }];
  const at = s => {
    let i = 1;
    while (i < cum.length - 1 && cum[i] < s) i++;
    const t = (s - cum[i - 1]) / (cum[i] - cum[i - 1]);
    const [x0, y0] = P[i - 1], [x1, y1] = P[i];
    return { x: x0 + (x1 - x0) * t, y: y0 + (y1 - y0) * t, dx: Math.sign(x1 - x0), dy: Math.sign(y1 - y0) };
  };
  // 含氧量：微血管（小動脈→小靜脈）由紅變藍；肺由藍變紅
  const oxy = s => s < cum[1] ? 1 - s / cum[1] : s < cum[8] ? 0 : s < cum[9] ? (s - cum[8]) / (cum[9] - cum[8]) : 1;
  const colorOf = o => '#' + BLUE.clone().lerp(RED, o).getHexString();

  const NS = 'http://www.w3.org/2000/svg';
  const g = document.getElementById('dgBlood');
  const dots = Array.from({ length: 64 }, (_, i) => {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('r', 8);
    c.setAttribute('stroke', '#fff');
    c.setAttribute('stroke-width', 2.5);
    g.appendChild(c);
    return { c, s: (i / 64) * TOTAL, off: (Math.random() - 0.5) * 14 };
  });
  const valves = [...document.querySelectorAll('#dgValves line')].map(el => {
    const [hx, hy] = el.dataset.h.split(',').map(Number);
    return { el, v: el.dataset.v, hx, hy, s: Number(el.dataset.s), len: el.dataset.v === 'av' ? 24 : 14 };
  });
  const chambers = Object.fromEntries([...document.querySelectorAll('#dgChambers rect')].map(r => [r.dataset.c, r]));
  document.getElementById('dgChambers').setAttribute('opacity', 1);

  function step(dt, phase, speedK) {
    const open = { av: PHASE.avOpen(phase), sl: PHASE.slOpen(phase) };
    const ven = bump(phase, 0.22, 0.55), atr = bump(phase, 0, 0.15);
    const v = 120 * speedK * (1 + 1.2 * ven);
    for (const d of dots) {
      let ns = d.s + v * dt;
      for (const gt of GATES) {           // 碰到關閉的瓣膜就在腔室裡等
        if (!open[gt.v] && d.s <= gt.s - 3 && ns > gt.s - 3) ns = gt.s - 3 - Math.abs(d.off) * 0.4;
      }
      if (ns < d.s) ns = d.s;               // 排隊時不往回退
      if (ns >= TOTAL) ns -= TOTAL;
      d.s = ns;
      const p = at(d.s);
      // 沿著前進方向的垂直方向錯開，管子裡看起來有好幾排
      d.c.setAttribute('cx', (p.x - p.dy * d.off).toFixed(1));
      d.c.setAttribute('cy', (p.y + p.dx * d.off).toFixed(1));
      d.c.setAttribute('fill', colorOf(oxy(d.s)));
    }
    // 瓣膜：關閉時水平擋住通道，打開時往血流方向（下方）擺開
    valves.forEach(w => {
      const k = w.v === 'av' ? VALVES.tri.open : VALVES.pul.open;
      const a = k * 1.2;                                     // 最多約 70°
      const x2 = w.hx + w.s * w.len * Math.cos(a), y2 = w.hy + w.len * Math.sin(a);
      w.el.setAttribute('x2', x2.toFixed(1)); w.el.setAttribute('y2', y2.toFixed(1));
    });
    // 腔室收縮時微微變色
    chambers.RA.setAttribute('fill-opacity', 0.14 * atr); chambers.LA.setAttribute('fill-opacity', 0.14 * atr);
    chambers.RV.setAttribute('fill-opacity', 0.16 * ven); chambers.LV.setAttribute('fill-opacity', 0.16 * ven);
  }
  return { step, dots, TOTAL };
})();

let lastPhase = '';
function updateUI() {
  const n = PHASE.name(phase);
  if (n !== lastPhase) {
    lastPhase = n;
    document.querySelectorAll('.phase').forEach(el => el.classList.toggle('on', el.dataset.p === n));
  }
  const av = PHASE.avOpen(phase), sl = PHASE.slOpen(phase);
  $('avState').textContent = av ? '打開 ▼' : '關閉'; $('avState').className = av ? 'open' : 'shut';
  $('slState').textContent = sl ? '打開 ▲' : '關閉'; $('slState').className = sl ? 'open' : 'shut';
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = 40;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

const clock = new THREE.Clock();
function animate() {
  frame(Math.min(clock.getDelta(), 0.05));
  requestAnimationFrame(animate);
}
/** 單一幀的所有更新（也供測試直接呼叫） */
function frame(dt) {
  if (playing) phase = (phase + dt * bpm / 60) % 1;
  // 心跳：心房收縮（上半部）→ 心室收縮（整顆、較強）
  const atr = bump(phase, 0, 0.15), ven = bump(phase, 0.22, 0.55);
  heart.scale.set(1 - 0.03 * atr - 0.07 * ven, 1 - 0.02 * atr - 0.05 * ven, 1 - 0.03 * atr - 0.07 * ven);
  const avT = PHASE.avOpen(phase) ? 1 : 0, slT = PHASE.slOpen(phase) ? 1 : 0;
  [['tri', avT], ['mit', avT], ['pul', slT], ['aor', slT]].forEach(([k, tg]) => {
    const v = VALVES[k];
    const rate = tg < v.open ? 22 : 7;
    setValve(v, v.open + (tg - v.open) * Math.min(1, dt * rate * Math.max(0.35, bpm / 60)));
  });
  updateUI();
  if (view === 'flat') {                 // 示意圖模式：只更新平面圖，不畫 3D
    if (playing) DG.step(dt, phase, 0.6 + bpm / 60);
    return;
  }
  if (playing) {
    stepParticles(dt, phase, 0.6 + bpm / 60);
    stepExchange(dt);
    alveoli.forEach((a, i) => a.scale.setScalar(1 + 0.06 * Math.sin(clock.elapsedTime * 1.4 + i)));   // 肺泡呼吸起伏
  }
  controls.update();
  placeLabels();
  window.MobileView?.offset(camera);
  renderer.render(scene, camera);
}

window.heartSim = { DG, LAYERS, layerOn, PHASE, get phase() { return phase; }, set phase(v) { phase = v; }, VALVES, particles, frame, exPool, setMode: m => document.querySelector(`.mode[data-mode="${m}"]`).click() };

resize();
resetView();
showTip('flow');
animate();
</script>

setTimeout(() => {
  if (!window.__heartReady) {
    document.getElementById('scene').innerHTML = '<div class="fallback">無法載入 Three.js。<br>請確認電腦已連上網路後重新整理。</div>';
  }
}, 6000);
</script>
