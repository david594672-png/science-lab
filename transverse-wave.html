<!DOCTYPE html>
<html lang="zh-Hant" data-subject="phy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>連續週期波與質點運動</title>
<link rel="stylesheet" href="lab-kit.css">
<style>#cv { cursor: grab; touch-action: none; }</style>
</head>
<body>
<canvas id="cv" aria-label="繩波上質點運動的模擬，可左右拖動波形"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g8">← 回課程總覽</a>
  <h1>連續週期波</h1>
  <p class="sub">波動與聲音 · 波的傳播與質點運動</p>

  <div class="body">
    <div class="group">
      <div class="row"><button class="btn primary grow" id="play">❚❚ 暫停</button></div>
      <p class="note" style="margin-top:8px">按住畫面<b>左右拖動</b>，就能自己把波推前推後。<b>輕點</b>一個質點可以追蹤它。</p>
    </div>
    <div class="group">
      <div class="ctrl"><label for="f">頻率 f <output id="fVal"></output></label><input type="range" id="f" min="0.2" max="1.2" step="0.05" value="0.5"></div>
      <div class="ctrl"><label for="A">振幅 A <output id="AVal"></output></label><input type="range" id="A" min="20" max="80" step="5" value="50"></div>
      <div class="ctrl"><label for="v">波速 v <output id="vVal"></output></label><input type="range" id="v" min="100" max="300" step="10" value="200"></div>
      <dl class="live">
        <dt>波速 v ＝ 頻率 f × 波長 λ</dt><dd id="vfl">—</dd>
        <dt>波長 λ（畫面上量）</dt><dd id="lam">—</dd>
        <dt>週期 T ＝ <span class="frac"><span>1</span><span>f</span></span></dt><dd id="per">—</dd>
      </dl>
    </div>
    <div class="group">
      <label class="sw"><input type="checkbox" id="vel" checked><span class="track"></span>質點速度方向（箭頭）</label>
      <label class="sw"><input type="checkbox" id="lamMark" checked><span class="track"></span>標出波長</label>
      <label class="sw"><input type="checkbox" id="next"><span class="track"></span>顯示質點接下來的位置</label>
      <label class="sw"><input type="checkbox" id="graph" checked><span class="track"></span>追蹤質點的位移－時間圖</label>
    </div>
    <div class="group">
      <p class="note">波往右傳時，每個質點只在原地<b>上下振動</b>。判斷質點往上或往下：看它<b>前面（左邊、波來的方向）</b>的質點在哪裡——下一刻它會變成前面質點現在的樣子。波峰、波谷的質點速度為 0；在平衡位置時速度最大。</p>
    </div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script>
(() => {
  const $ = Lab.$;
  const S = { f: 0.5, A: 50, v: 200, phase: 0, play: true, sel: 14, hist: [], drag: null };
  const N = 44;
  const PX = 10;                                  // 畫面比例：10 像素代表 1 cm
  let W = 600, H = 400, x0 = 30, dx = 12, y0 = 200;
  const k = () => 2 * Math.PI * S.f / S.v;
  const yAt = x => S.A * Math.sin(S.phase - k() * (x - x0));          // 往右傳
  const vAt = x => S.A * Math.cos(S.phase - k() * (x - x0));           // 速度（比例）

  function draw(ctx, w, h, dt) {
    W = w; H = h; x0 = 30; dx = (w - 60) / (N - 1); y0 = S.graphOn ? h * 0.36 : h * 0.48;
    S.graphOn = $('graph').checked;
    if (S.play && !S.drag) { S.phase += 2 * Math.PI * S.f * dt; }
    // 平衡線
    Lab.line(x0 - 10, y0, w - 20, y0, 'rgba(95,162,255,.35)', 1, [6, 6]);
    // 繩子
    ctx.strokeStyle = 'rgba(95,162,255,.6)'; ctx.lineWidth = 2; ctx.beginPath();
    for (let x = x0; x <= w - 30; x += 3) { const y = y0 - yAt(x); x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();
    // 接下來的位置：1/8 週期後的波形（虛線）與質點（空心圈）
    if ($('next').checked) {
      const nx = x => S.A * Math.sin(S.phase + Math.PI / 4 - k() * (x - x0));
      ctx.strokeStyle = 'rgba(255,209,102,.6)'; ctx.lineWidth = 2; ctx.setLineDash([7, 6]); ctx.beginPath();
      for (let x = x0; x <= w - 30; x += 3) { const y = y0 - nx(x); x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
      ctx.stroke(); ctx.setLineDash([]);
      for (let i = 0; i < N; i++) {
        const x = x0 + i * dx, y1 = y0 - yAt(x), y2 = y0 - nx(x);
        if (Math.abs(y2 - y1) > 4) Lab.line(x, y1, x, y2, 'rgba(255,209,102,.35)', 1.5);
        Lab.circle(x, y2, 6, null, '#ffd166', 2);
      }
      Lab.pill('黃色虛線、空心圈：再過 1/8 個週期的位置', w / 2, y0 + S.A + 90, '#ffd166', 13);
    }
    // 質點
    for (let i = 0; i < N; i++) {
      const x = x0 + i * dx, y = y0 - yAt(x), sel = i === S.sel;
      if ($('vel').checked && i % 3 === 1 && !sel) {
        const vv = vAt(x) / S.A;
        if (Math.abs(vv) > 0.15) Lab.arrow(x, y, x, y - vv * 34, 'rgba(255,211,77,.85)', 2.5, 9);
      }
      Lab.circle(x, y, sel ? 10 : 6, sel ? '#ff5d5d' : '#9fc4ff');
    }
    // 選取質點的速度與軌跡
    const sx = x0 + S.sel * dx, sy = y0 - yAt(sx);
    Lab.line(sx, y0 - S.A - 14, sx, y0 + S.A + 14, 'rgba(255,93,93,.4)', 1.5, [4, 4]);
    if ($('vel').checked) { const vv = vAt(sx) / S.A; if (Math.abs(vv) > 0.05) Lab.arrow(sx, sy, sx, sy - vv * 44, '#ffd34d', 4, 12); }
    // 波長標示
    if ($('lamMark').checked) {
      const lam = S.v / S.f;
      let xc = x0 + ((S.phase - Math.PI / 2) / k()) % lam; while (xc < x0 + 20) xc += lam;
      if (xc + lam < w - 30) {
        const yy = y0 - S.A - 30;
        Lab.line(xc, yy, xc + lam, yy, '#ffd34d', 2);
        Lab.line(xc, yy - 8, xc, yy + 8, '#ffd34d', 2); Lab.line(xc + lam, yy - 8, xc + lam, yy + 8, '#ffd34d', 2);
        Lab.text(`一個波長 λ ＝ ${(lam / PX).toFixed(1)} cm`, xc + lam / 2, yy - 14, '#ffd34d', 14, 'center', 'bold');
      }
    }
    // 比例尺：10 cm
    { const bx = x0, by = y0 + S.A + 46; Lab.line(bx, by, bx + 10 * PX, by, '#eef1fa', 2); Lab.line(bx, by - 6, bx, by + 6, '#eef1fa', 2); Lab.line(bx + 10 * PX, by - 6, bx + 10 * PX, by + 6, '#eef1fa', 2); Lab.text('10 cm', bx + 5 * PX, by + 16, '#eef1fa', 12); }
    if (!S.dragged) Lab.pill('👆 按住畫面左右拖，可以自己把波往前、往後推', w / 2, y0 - S.A - 70, '#ffd166', 14);
    if (S.drag) Lab.pill('拖動中：波跟著你的手指前進或後退', w / 2, y0 - S.A - 70, '#ffd166', 14);
    Lab.arrow(w - 150, y0 + S.A + 46, w - 60, y0 + S.A + 46, '#ffa64d', 3, 12);
    Lab.text('波前進方向', w - 105, y0 + S.A + 66, '#ffa64d', 13);
    // y-t 圖
    if (S.graphOn) {
      if (S.play || S.drag) { S.hist.push(yAt(sx) / PX); if (S.hist.length > 240) S.hist.shift(); }
      const gy = h * 0.66, gh = h - gy - 14;
      Lab.chart(20, gy, w - 40, gh, [{ data: S.hist, color: '#ff5d5d', n: 240 }], { min: -9, max: 9, xLabel: '時間 →', yLabel: '紅色質點的位移（cm）', ref: { v: 0, label: '平衡位置' } });
    }
  }

  Lab.init({
    draw,
    // 按下去先記位置：手指有左右移動就是「拖動波」，沒移動就是「點選質點」
    down(x, y) { S.press = { x, y, x0: x, moved: false }; $('cv').style.cursor = 'grabbing'; return true; },
    move(x) {
      const p = S.press; if (!p) return;
      if (!p.moved && Math.abs(x - p.x0) > 6) { p.moved = true; S.drag = true; S.dragged = true; }
      if (p.moved) { S.phase += k() * (x - p.x); p.x = x; }     // 往右拖，波就往右（前）走
    },
    up() {
      const p = S.press; S.press = null; S.drag = null; $('cv').style.cursor = 'grab';
      if (!p || p.moved) return;
      for (let i = 0; i < N; i++) { const px = x0 + i * dx, py = y0 - yAt(px); if (Math.hypot(px - p.x0, py - p.y) < 22) { S.sel = i; S.hist = []; return; } }
    },
    ui() {
      const lam = S.v / S.f / PX;
      $('vfl').textContent = `${S.f.toFixed(2)} Hz × ${lam.toFixed(1)} cm ＝ ${(S.v / PX).toFixed(0)} cm/s`;
      $('lam').textContent = lam.toFixed(1) + ' cm';
      $('per').innerHTML = `<span class="frac"><span>1</span><span>${S.f.toFixed(2)}</span></span> ＝ ${(1 / S.f).toFixed(2)} 秒`;
    }
  });
  $('play').addEventListener('click', e => { S.play = !S.play; e.currentTarget.textContent = S.play ? '❚❚ 暫停' : '▶ 播放'; });
  Lab.bindSlider('f', v => { S.f = v; }, v => v.toFixed(2) + ' Hz');
  Lab.bindSlider('A', v => { S.A = v; }, v => (v / PX).toFixed(1) + ' cm');
  Lab.bindSlider('v', v => { S.v = v; }, v => (v / PX).toFixed(0) + ' cm/s');
  window.waveSim = S;
})();
</script>
<script src="lesson.js" defer></script>
</body>
</html>
