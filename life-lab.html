    resp: [['鼻', V(0.4, 3.35, 0.5)], ['氣管', V(0.45, 2.35, 0.15)], ['支氣管', V(0.55, 1.85, 0.2)], ['肺', V(-0.9, 1.6, 0.2)], ['橫膈', V(0.95, 0.75, 0.1)]],
    defense: [['皮膚（第一道防線）', V(-1.6, 2.5, 0)], ['扁桃腺', V(0.5, 3.0, 0.3)], ['淋巴結', V(0.6, 2.7, 0.1)], ['胸腺', V(-0.6, 1.98, 0.2)], ['脾臟', V(0.95, 0.95, -0.1)], ['淋巴管', V(1.65, 0.4, 0.1)]]
  };
  return S.sys === 'all' ? Object.keys(SYS).map(k => [SYS[k].name, { digest: V(0.95, 0.4, 0.3), circ: V(0.7, 1.7, 0.3), nerve: V(0.6, 3.9, 0), resp: V(-0.95, 1.7, 0.3), defense: V(-1.6, 2.65, 0) }[k], 'big']) : L2[S.sys];
}
const BODYCAM = { all: [[0, 0.4, 11.5], [0, 0.2, 0]], digest: [[0.3, 1.0, 5.6], [0, 1.0, 0]], circ: [[0.4, 0.4, 11], [0, 0.3, 0]], nerve: [[0.4, 0.4, 11], [0, 0.3, 0]], resp: [[0.3, 2.0, 5.0], [0, 2.0, 0]], defense: [[0.4, 0.6, 10], [0, 0.6, 0]], plant: [[0, -0.6, 9.5], [0, -1.0, 0]] };
function flyCam([p, t]) { const f = Math.max(1, 1.05 / (L.W / L.H)); L.fly(p.map((v, i) => t[i] + (v - t[i]) * f), t, 0.9); }
function applyBody() {
  clearDetail(); PICKD.length = 0;
  const animal = S.kind === 'animal';
  body.visible = animal; plant.visible = !animal; stage.visible = true;
  if (animal) {
    for (const k of Object.keys(SYS)) setFade(SG[k], S.sys === 'all' || S.sys === k ? 1 : 0.06);
    skinRim.uniforms.color.value.set(S.sys === 'defense' ? 0x7dff9a : 0x58b8ff); skinRim.uniforms.intensity.value = S.sys === 'defense' ? 1.0 : 0.5;
    flyCam(BODYCAM[S.sys]);
  } else {
    setFade(PG.veg, S.grp === 'rep' ? 0.12 : 1); setFade(PG.rep, S.grp === 'veg' ? 0.12 : 1);
    flyCam(BODYCAM.plant);
  }
  setLabels(bodyLabels());
}
function go(view) {
  S.view = view; selectGlow(null);
  if (view === 'body') applyBody();
  else {
    body.visible = false; plant.visible = false; stage.visible = false; PICKD.length = 0;
    if (view === 'organ') showDetail(organView(S.organ), 1.3);
    else if (view === 'tissue') showDetail(TB[ORG[S.organ].tissue](), 0.95);
    else if (view === 'cell') showDetail(CB[TISSUE[ORG[S.organ].tissue].cell](), 0.95);
  }
  renderUI();
}
function levelIndex() {
  const animal = S.kind === 'animal';
  if (S.view === 'body') return animal ? (S.sys === 'all' ? 0 : 1) : 0;
  return (animal ? 2 : 1) + ['organ', 'tissue', 'cell'].indexOf(S.view);
}
function renderUI() {
  const animal = S.kind === 'animal', lv = LEVELS[S.kind], li = levelIndex();
  $('sysGroup').hidden = !animal || S.view !== 'body'; $('grpGroup').hidden = animal || S.view !== 'body';
  document.querySelectorAll('#sysBtns .btn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === S.sys)));
  const o = S.organ && ORG[S.organ];
  const reach = i => i <= li || !!o || (animal && i === 1);
  $('crumbs').innerHTML = lv.map((t, i) => `<button data-i="${i}" class="${i === li ? 'now' : i < li ? 'on' : ''}" ${reach(i) ? '' : 'disabled'}>${t}</button>`).join('');
  $('upBtn').disabled = li === 0;
  let down = '', info = '';
  if (S.view === 'body') {
    if (animal) {
      info = S.sys === 'all' ? '人體由許多<b>器官系統</b>一起合作組成，這就是<b>個體</b>。選一個器官系統來看。' : `<b>${SYS[S.sys].name}</b>：${SYS[S.sys].info}`;
      down = o ? `放大看${o.name} →` : (S.sys !== 'all' ? `放大看${ORG[SYS[S.sys].zoom].name} →` : '選一個系統');
    } else {
      info = '一株菜豆就是一個<b>個體</b>。<b>營養器官</b>（根、莖、葉）負責吸收、運輸、製造養分；<b>生殖器官</b>（花、果實、種子）負責繁殖後代。植物<b>沒有器官系統</b>。';
      down = o ? `放大看${o.name} →` : '先點一個器官';
    }
    if (o) info += `<br><br><b>${o.name}</b>：${o.info}`;
  } else if (S.view === 'organ') { info = `<b>器官：${o.name}</b>。${o.info}`; down = `看${o.name}的組織 →`; }
  else if (S.view === 'tissue') { const t = TISSUE[o.tissue]; info = `<b>組織：${t.name}</b>。${t.info}<br>形態、功能相似的細胞聚在一起，就是組織。`; down = `看${CELL[t.cell].name} →`; }
  else { const c = CELL[TISSUE[o.tissue].cell]; info = `<b>細胞：${c.name}</b>。${c.info}<br>細胞是生物構造和功能的基本單位。`; down = '已經是最小的層次'; }
  $('downBtn').textContent = down;
  $('downBtn').disabled = S.view === 'cell' || (S.view === 'body' && !o && (!animal || S.sys === 'all'));
  $('levelInfo').innerHTML = info;
}
// 沒有組織資料的器官，往下放大時改看同一個系統的代表器官
function zoomable() { if (S.organ && !ORG[S.organ].tissue) S.organ = S.kind === 'animal' ? SYS[ORG[S.organ].sys].zoom : 'leaf'; }
function down() {
  if (S.view === 'body') { if (!S.organ && S.kind === 'animal' && S.sys !== 'all') S.organ = SYS[S.sys].zoom; if (!S.organ) return; go('organ'); }
  else if (S.view === 'organ') { zoomable(); go('tissue'); }
  else if (S.view === 'tissue') go('cell');
}
function up() {
  if (S.view === 'cell') go('tissue');
  else if (S.view === 'tissue') go('organ');
  else if (S.view === 'organ') go('body');
  else if (S.kind === 'animal' && S.sys !== 'all') { S.sys = 'all'; S.organ = null; go('body'); }
}
$('downBtn').addEventListener('click', down);
$('upBtn').addEventListener('click', up);
$('crumbs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const i = +b.dataset.i, animal = S.kind === 'animal';
  if (animal && i === 0) { S.sys = 'all'; S.organ = null; return go('body'); }
  if (animal && i === 1) { if (S.sys === 'all') S.sys = S.organ ? ORG[S.organ].sys : 'digest'; return go('body'); }
  if (!animal && i === 0) return go('body');
  const v = ['organ', 'tissue', 'cell'][i - (animal ? 2 : 1)];
  if (!S.organ && animal) S.organ = SYS[S.sys === 'all' ? 'digest' : S.sys].zoom;
  if (v !== 'organ') zoomable();
  go(v);
});
document.querySelectorAll('#sysBtns .btn').forEach(b => b.addEventListener('click', () => { S.sys = b.dataset.k; S.organ = null; go('body'); }));
Lab.bindGroup('#grpSeg button', k => { S.grp = k; S.organ = null; if (S.mode === 'level' && S.kind === 'plant') go('body'); });
Lab.bindGroup('#kindSeg button', k => { S.kind = k; S.organ = null; if (S.mode === 'level') go('body'); });
function showCellMode() {
  body.visible = false; plant.visible = false; stage.visible = false; PICKD.length = 0; selectGlow(null);
  showDetail(CB[S.cellKind === 'animal' ? 'animalDemo' : 'plantDemo']());
  $('partInfo').textContent = '點一下細胞裡的構造。拖曳可以轉動，兩指可以放大。';
}
Lab.bindGroup('#cellSeg button', k => { S.cellKind = k; if (S.mode === 'cell') showCellMode(); });
Lab.bindGroup('.mode', k => { S.mode = k; Lab.showMode(k); if (k === 'cell') showCellMode(); else { S.view = 'body'; go('body'); } });

/* ================= 點選 ================= */
const ray = new THREE.Raycaster();
function hitsAt(x, y, objs) { ray.setFromCamera(new THREE.Vector2(x / L.W * 2 - 1, -(y / L.H) * 2 + 1), L.camera); return ray.intersectObjects(objs, true); }
const shown = o => { let p = o; while (p) { if (!p.visible) return false; p = p.parent; } return true; };
const PRIORITY = { nucleus: 0, mito: 0, chloro: 0, starch: 0, golgi: 0, stripe: 1, vacuole: 1, pigment: 1, hair: 1, dendrite: 1, axon: 1, er: 1, wall: 2, membrane: 3, cytoplasm: 4 };
function tap(x, y) {
  if (S.view === 'body' && S.mode === 'level') {
    const ok = key => {
      if (!key || !ORG[key]) return false;
      if (S.kind === 'animal') return key === 'skin' && S.sys !== 'defense' ? false : (S.sys === 'all' || ORG[key].sys === S.sys);
      return S.grp === 'all' || ORG[key].grp === S.grp;
    };
    const hit = hitsAt(x, y, PICK.filter(shown)).find(h => ok(h.object.userData.key));
    if (!hit) return;
    const key = hit.object.userData.key;
    if (S.kind === 'animal' && S.sys === 'all') S.sys = ORG[key].sys;
    S.organ = key;
    let obj = hit.object; while (obj.parent && !PICK.includes(obj)) obj = obj.parent;
    selectGlow(obj); setLabels(bodyLabels()); renderUI(); return;
  }
  const hits = hitsAt(x, y, PICKD).map(h => { let o = h.object; while (o && !o.userData.part) o = o.parent; return o && PART[o.userData.part] ? { h, o } : null; }).filter(Boolean);
  if (!hits.length) return;
  hits.sort((a, b) => (PRIORITY[a.o.userData.part] ?? 2) - (PRIORITY[b.o.userData.part] ?? 2) || a.h.distance - b.h.distance);
  let o = hits[0].o;
  if (['membrane', 'cytoplasm'].includes(o.userData.part)) {   // 點在邊緣算細胞膜、點在中間算細胞質
    const f = hits[0].h.face, n = f ? f.normal.clone().transformDirection(hits[0].h.object.matrixWorld) : null;
    const want = n && Math.abs(n.dot(ray.ray.direction)) < 0.45 ? 'membrane' : 'cytoplasm', alt = hits.find(e => e.o.userData.part === want);
    if (alt) o = alt.o;
  }
  const p = PART[o.userData.part];
  selectGlow(o);
  const html = `<b>${p[0]}</b>：${p[1]}`;
  if (S.mode === 'cell') $('partInfo').innerHTML = html; else $('levelInfo').innerHTML = html + '<br><br>' + $('levelInfo').innerHTML.split('<br><br>').pop();
}

/* ================= 每一幀 ================= */
const tv = new THREE.Vector3(), selBox = new THREE.Box3();
function frame(dt) {
  S.time += dt;
  scene.getObjectByName('dust').rotation.y += dt * 0.01;
  if (selGlow.userData.obj) {
    selBox.setFromObject(selGlow.userData.obj); const r = selBox.getSize(tv).length();
    selBox.getCenter(selGlow.position); selGlow.scale.setScalar(Math.min(6, r * 1.6 + 0.3)); selGlow.material.opacity = 0.45 + Math.sin(S.time * 4) * 0.2;
  }
  if (detailUpdate) detailUpdate(dt, S.time);
  if (body.visible) {
    const on = k => S.sys === 'all' || S.sys === k;
    if (on('digest')) { const u = (S.time * 0.07) % 1, seg = Math.min(3, Math.floor(u * 4)), f = u * 4 - seg; DIG.food.position.copy(DIG.path[seg].getPointAt(seg === 1 ? Math.min(1, f * 1.3) : f)); DIG.food.visible = true; } else DIG.food.visible = false;
    CIRC.heart.scale.setScalar(1 + Math.max(0, Math.sin(S.time * Math.PI * 2 * 1.2)) * 0.06);
    CIRC.flows.forEach(f => { f.u = (f.u + dt * 0.18) % 1; f.s.position.copy(f.c.getPointAt(f.u)); f.s.visible = on('circ'); });
    NERV.pulses.forEach(p => { p.u = (p.u + dt * 0.45) % 1; p.s.position.copy(p.c.getPointAt(p.u)); p.s.material.opacity = on('nerve') ? 0.95 : 0; });
    const b = Math.sin(S.time * 1.4);
    RESP.lungs.scale.set(1 + 0.035 * b, 1 + 0.045 * b, 1 + 0.035 * b); RESP.dia.position.y = 0.68 - 0.05 * b;
    RESP.air.forEach(a => { const u = (S.time * 0.2 + a.k) % 1; a.s.position.copy(RESP.curve.getPointAt(Math.cos(S.time * 1.4) > 0 ? u : 1 - u)); a.s.visible = on('resp'); });
    DEF.cells.forEach(c => { c.u = (c.u + dt * 0.12) % 1; c.s.position.copy(c.c.getPointAt(c.u)); c.s.visible = on('defense'); });
  }
  if (plant.visible) plant.rotation.y = Math.sin(S.time * 0.15) * 0.15;
}
function ui() {}

window.life = { S, go, ORG };   // 除錯／驗證用
go('body');
