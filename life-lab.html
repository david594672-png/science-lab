<!DOCTYPE html>
<html lang="zh-Hant" data-subject="bio">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>生命的特性</title>
<link rel="stylesheet" href="lab-kit.css">
</head>
<body>
<canvas id="cv" aria-label="生命的特性互動畫面"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g7">← 回課程總覽</a>
  <h1>生命的特性</h1>
  <p class="sub">國一生物 · 生命現象、組成層次與細胞</p>

  <div class="body">
    <div class="modes" style="--n:3">
      <button class="mode" data-k="judge" aria-pressed="true">是不是<br>生物？</button>
      <button class="mode" data-k="level">組成層次</button>
      <button class="mode" data-k="cell">細胞構造</button>
    </div>

    <!-- 模式一：是不是生物 -->
    <div data-mode="judge">
      <div class="group">
        <div class="group-title">選一個東西</div>
        <div class="chips" style="--n:4" id="things"></div>
      </div>
      <div class="group">
        <div class="row">
          <button class="btn primary grow" id="revealBtn">逐項檢查生命現象</button>
        </div>
        <div class="result" id="verdict">先猜猜看：它是不是生物？再按上面的按鈕逐項檢查。</div>
      </div>
      <div class="group">
        <p class="note">判斷是不是生物，要<b>綜合</b>看：是否由<b>細胞</b>構成、能不能<b>代謝、生長、感應、生殖</b>。只符合其中一兩項（例如火會「長大」）不算生物。</p>
      </div>
    </div>

    <!-- 模式二：組成層次 -->
    <div data-mode="level" hidden>
      <div class="group">
        <div class="seg" style="--n:2" id="kindSeg">
          <button data-k="animal" aria-pressed="true">動物（人）</button>
          <button data-k="plant" aria-pressed="false">植物</button>
        </div>
      </div>
      <div class="group">
        <div class="ctrl">
          <label for="zoom">放大程度 <output id="zoomVal"></output></label>
          <input type="range" id="zoom" min="0" max="4" step="1" value="0">
        </div>
        <div class="result" id="levelInfo"></div>
      </div>
      <div class="group">
        <p class="note">由小到大：<b>細胞 → 組織 → 器官 → 器官系統 → 個體</b>。植物沒有「器官系統」這一層，器官直接組成個體。</p>
      </div>
    </div>

    <!-- 模式三：細胞構造 -->
    <div data-mode="cell" hidden>
      <div class="group">
        <div class="seg" style="--n:2" id="cellSeg">
          <button data-k="animal" aria-pressed="true">動物細胞</button>
          <button data-k="plant" aria-pressed="false">植物細胞</button>
        </div>
      </div>
      <div class="group">
        <div class="group-title">點畫面上的構造看功能</div>
        <div class="result" id="partInfo">點一下細胞裡的構造。</div>
      </div>
      <div class="group">
        <p class="note">植物細胞比動物細胞多了<b>細胞壁、葉綠體</b>，而且有<b>大型液胞</b>。動物和植物細胞都有細胞膜、細胞核、細胞質、粒線體。</p>
      </div>
    </div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script>
(() => {
  const { $ } = Lab;
  const TRAITS = ['由細胞構成', '代謝（吸收、利用能量）', '生長', '感應（對刺激反應）', '生殖（產生後代）'];
  // 每項：1 有、0 沒有、0.5 只有像（不算真的）
  const THINGS = [
    { k: 'cat', emoji: '🐱', name: '貓', t: [1, 1, 1, 1, 1], v: '是生物', why: '五項生命現象都有。' },
    { k: 'seed', emoji: '🌰', name: '休眠的種子', t: [1, 1, 1, 1, 1], v: '是生物', why: '看起來不動，但種子由細胞構成，仍在進行很微弱的代謝，條件適合就會發芽、長大。' },
    { k: 'mimosa', emoji: '🌿', name: '含羞草', t: [1, 1, 1, 1, 1], v: '是生物', why: '植物也會感應：含羞草被碰觸，葉子會合起來。' },
    { k: 'yeast', emoji: '🍞', name: '酵母菌', t: [1, 1, 1, 1, 1], v: '是生物', why: '單細胞生物，一個細胞就能完成所有生命現象（會讓麵包發酵）。' },
    { k: 'fire', emoji: '🔥', name: '火焰', t: [0, 0.5, 0.5, 0, 0.5], v: '不是生物', why: '火會「消耗燃料、變大、蔓延」，只是很像代謝、生長、生殖；它不是由細胞構成，也不會對刺激產生反應。' },
    { k: 'crystal', emoji: '🧂', name: '鹽的結晶', t: [0, 0, 0.5, 0, 0], v: '不是生物', why: '結晶會「長大」，但只是外面一直堆積，不是由細胞吸收養分生長。' },
    { k: 'robot', emoji: '🤖', name: '機器人', t: [0, 0.5, 0, 0.5, 0], v: '不是生物', why: '用電、有感測器，看起來像代謝與感應，但沒有細胞、不會自己生長或生殖。' },
    { k: 'virus', emoji: '🦠', name: '病毒', t: [0, 0, 0, 0, 0.5], v: '介於生物與非生物之間', why: '病毒沒有細胞構造，自己不能代謝；只有進入其他生物的細胞，才能利用宿主複製出新病毒。' }
  ];
  const S = { mode: 'judge', thing: THINGS[0], shown: 0, revealT: 0, kind: 'animal', zoom: 0, zoomAnim: 0, cell: 'animal', part: null, t: 0 };

  /* ---------- 美術小工具 ---------- */
  const GOLD = '#ffd166';
  const ICONS = ['🧫', '⚡', '📈', '👆', '🐣'];                         // 五項生命現象的小圖示
  const statusCol = v => (v === 1 ? '#4fd18b' : v === 0.5 ? GOLD : '#ff5d8f');
  const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };  // 固定的亂數
  const DOTS = Array.from({ length: 60 }, (_, i) => [rnd(i) * 2 - 1, rnd(i + 100) * 2 - 1, 1 + rnd(i + 200) * 2]);  // 細胞質顆粒
  const easeBack = p => 1 + 2.7 * (p - 1) ** 3 + 1.7 * (p - 1) ** 2;   // 彈一下的動畫曲線

  /** 背景的柔和綠色光暈 */
  function backdrop(ctx, W, H, x, y, r) {
    ctx.fillStyle = Lab.rg(x, y, 0, r, ['rgba(79,209,139,.16)', 'rgba(79,209,139,.05)', 'rgba(79,209,139,0)']);
    ctx.fillRect(0, 0, W, H);
  }
  /** 有立體感的管子（消化道）：先畫暗邊，再畫本體，最後畫一條亮光 */
  function tube(ctx, path, w, col) {
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    [[w + 4, Lab.shade(col, -0.5)], [w, col], [w * 0.25, 'rgba(255,255,255,.35)']].forEach(([lw, sc]) => {
      ctx.beginPath(); path(); ctx.lineWidth = lw; ctx.strokeStyle = sc; ctx.stroke();
    });
    ctx.restore();
  }
  /** 葉子：x,y 為中心，len 半長，wid 半寬，ang 角度 */
  function leaf(ctx, x, y, len, wid, ang, veins = 0) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(-len, 0);
    ctx.quadraticCurveTo(0, -wid * 2, len, 0); ctx.quadraticCurveTo(0, wid * 2, -len, 0); ctx.closePath();
    ctx.fillStyle = Lab.lg(0, -wid, 0, wid, ['#8ff0aa', '#3fbf6a', '#237a45']); ctx.fill();
    ctx.strokeStyle = '#1d5e35'; ctx.lineWidth = 1.5; ctx.stroke();
    Lab.line(-len * 0.95, 0, len * 0.9, 0, 'rgba(230,255,235,.55)', Math.max(1.5, wid * 0.08));   // 主脈
    for (let i = 1; i <= veins; i++) {                                                        // 側脈
      const vx = -len + (i / (veins + 1)) * len * 1.8;
      [-1, 1].forEach(d => {
        ctx.beginPath(); ctx.moveTo(vx, 0); ctx.quadraticCurveTo(vx + len * 0.12, d * wid * 0.5, vx + len * 0.3, d * wid * 0.85);
        ctx.strokeStyle = 'rgba(230,255,235,.35)'; ctx.lineWidth = Math.max(1, wid * 0.04); ctx.stroke();
      });
    }
    ctx.fillStyle = 'rgba(255,255,255,.18)';                                                  // 葉面反光
    ctx.beginPath(); ctx.ellipse(-len * 0.2, -wid * 0.45, len * 0.4, wid * 0.18, -0.08, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  /** 會呼吸的金色提示圈 */
  function hintRing(ctx, x, y, r) {
    const k = 1 + Math.sin(S.t * 3) * 0.06;
    ctx.save(); ctx.shadowColor = GOLD; ctx.shadowBlur = 14; ctx.setLineDash([7, 6]);
    Lab.circle(x, y, r * k, 'rgba(255,209,102,.12)', GOLD, 3);
    ctx.restore();
  }

  /* ---------- 是不是生物 ---------- */
  $('things').innerHTML = THINGS.map((t, i) =>
    `<button class="btn" data-k="${t.k}" aria-pressed="${i === 0}" style="flex-direction:column;display:flex;align-items:center;justify-content:center;gap:2px;min-height:58px"><span style="font-size:1.3rem">${t.emoji}</span><span style="font-size:.74rem">${t.name}</span></button>`).join('');
  Lab.bindGroup('#things .btn', k => {
    S.thing = THINGS.find(t => t.k === k); S.shown = 0;
    $('verdict').textContent = `先猜猜看：「${S.thing.name}」是不是生物？再按上面的按鈕逐項檢查。`;
  });
  $('revealBtn').addEventListener('click', () => {
    if (S.shown < TRAITS.length) { S.shown = TRAITS.length; S.revealT = 0; }
    const t = S.thing;
    $('verdict').innerHTML = `<b>${t.name}：${t.v}</b><br>${t.why}`;
  });

  function drawJudge(ctx, W, H, dt) {
    if (S.shown && S.revealT < TRAITS.length + 1) S.revealT += dt * 2.2;  // 一項一項亮起來
    const th = S.thing, n = TRAITS.length, wide = W >= 640;
    // 版面：寬畫面左右兩欄（左：標本、右：檢查表），窄畫面上下排列
    let R, sx, sy, lx, lw, ly, rowH, gap, nameY, pillY;
    if (wide) {
      R = Math.min(W * 0.17, H * 0.2, 120);
      sx = W * 0.28; sy = H * 0.44;
      lx = W * 0.5; lw = Math.min(420, W * 0.47);
      gap = 10; rowH = Math.min(66, (H - 120) / n - gap);
      ly = H / 2 - (n * (rowH + gap) - gap) / 2;
      nameY = sy + R * 1.92; pillY = sy + R * 2.35;
    } else {
      R = Math.min(W * 0.18, H * 0.11, 80);
      sx = W / 2; sy = R * 1.5 + 16;
      nameY = sy + R * 1.62 + 12; pillY = nameY + 34;
      // 左邊留空給「學習任務」與全螢幕按鈕
      lw = Math.min(520, W - 80); lx = Math.max(64, (W - lw) / 2);
      gap = 8; ly = pillY + 28;
      rowH = Math.max(34, Math.min(56, (H - ly - 16) / n - gap));
    }
    backdrop(ctx, W, H, sx, sy, R * 3);

    // 標本：放在「邊緣亮、中間透明」的玻璃球裡，輕輕浮動
    const by = sy + Math.sin(S.t * 1.6) * R * 0.04;
    for (let i = 0; i < n; i++) {                                       // 外圈五段：對應五項生命現象
      const a0 = -Math.PI / 2 + i * 2 * Math.PI / n + 0.07, a1 = a0 + 2 * Math.PI / n - 0.14;
      const on = S.shown && S.revealT > i, col = on ? statusCol(th.t[i]) : 'rgba(238,241,250,.14)';
      ctx.save(); ctx.lineCap = 'round'; ctx.lineWidth = R * 0.09; ctx.strokeStyle = col;
      if (on) { ctx.shadowColor = col; ctx.shadowBlur = 14; }
      ctx.beginPath(); ctx.arc(sx, by, R * 1.18, a0, a1); ctx.stroke(); ctx.restore();
      const am = (a0 + a1) / 2;
      ctx.globalAlpha = on ? 1 : 0.35;
      Lab.text(ICONS[i], sx + Math.cos(am) * R * 1.45, by + Math.sin(am) * R * 1.45, '#fff', R * 0.2);
      ctx.globalAlpha = 1;
    }
    ctx.beginPath(); ctx.arc(sx, by, R, 0, Math.PI * 2);
    ctx.fillStyle = Lab.rg(sx, by, R * 0.2, R, ['rgba(255,255,255,.03)', 'rgba(140,240,190,.10)', 'rgba(170,255,210,.34)']);
    ctx.fill(); ctx.strokeStyle = 'rgba(210,255,230,.6)'; ctx.lineWidth = 2; ctx.stroke();
    Lab.text(th.emoji, sx, by + R * 0.05, '#fff', R * 0.95);
    ctx.fillStyle = 'rgba(255,255,255,.22)';                            // 玻璃反光
    ctx.beginPath(); ctx.ellipse(sx - R * 0.42, by - R * 0.5, R * 0.3, R * 0.13, -0.7, 0, Math.PI * 2); ctx.fill();
    Lab.text(th.name, sx, nameY, '#eef1fa', wide ? 24 : 18, 'center', 'bold');
    if (S.shown && S.revealT >= n) {                                    // 最後的判定
      const col = th.v === '是生物' ? '#4fd18b' : th.v === '不是生物' ? '#ff5d8f' : GOLD;
      const k = easeBack(Math.min(1, (S.revealT - n) * 2));
      ctx.save(); ctx.translate(sx, pillY); ctx.scale(k, k);
      ctx.shadowColor = col; ctx.shadowBlur = 18; Lab.pill(th.v, 0, 0, col, wide ? 20 : 16);
      ctx.restore();
    }

    // 檢查表：五張卡片，按下按鈕後依序亮起
    if (wide) Lab.text('生命現象檢查表', lx + 4, ly - 22, 'rgba(238,241,250,.6)', 14, 'left', 'bold');
    const fs = Math.max(13, Math.min(16, rowH * 0.28));
    TRAITS.forEach((name, i) => {
      const y = ly + i * (rowH + gap), r = rowH * 0.3, iy = y + rowH / 2;
      const on = S.shown && S.revealT > i;
      const p = on ? Math.min(1, (S.revealT - i) * 2) : 0;               // 這一張卡亮起的進度 0→1
      const v = th.t[i], col = statusCol(v);
      Lab.rr(lx, y, lw, rowH, r);
      ctx.fillStyle = Lab.lg(0, y, 0, y + rowH, ['rgba(255,255,255,.08)', 'rgba(255,255,255,.03)']); ctx.fill();
      if (p > 0) {                                                      // 由左往右刷上顏色
        ctx.save(); Lab.rr(lx, y, lw, rowH, r); ctx.clip();
        ctx.fillStyle = Lab.lg(lx, 0, lx + lw, 0, [Lab.alpha(col, 0.34), Lab.alpha(col, 0.06)]);
        ctx.fillRect(lx, y, lw * p, rowH); ctx.restore();
      }
      Lab.rr(lx, y, lw, rowH, r);
      ctx.strokeStyle = on ? Lab.alpha(col, 0.8) : 'rgba(255,255,255,.12)'; ctx.lineWidth = 1.5; ctx.stroke();
      const ir = rowH * 0.32, ix = lx + rowH * 0.52;
      Lab.circle(ix, iy, ir, Lab.rg(ix, iy, 0, ir, on ? [Lab.alpha(col, 0.55), Lab.alpha(col, 0.15)] : ['rgba(255,255,255,.14)', 'rgba(255,255,255,.04)']));
      Lab.text(ICONS[i], ix, iy + 1, '#fff', ir * 1.05);
      Lab.text(name, ix + ir + 12, iy, '#eef1fa', fs, 'left', 'bold');
      if (on) {
        const mark = v === 1 ? '✓ 有' : v === 0.5 ? '△ 只是很像' : '✗ 沒有';
        ctx.font = `bold 13px ${Lab.FONT}`;
        const pw = ctx.measureText(mark).width + 20, k = easeBack(p);
        ctx.save(); ctx.translate(lx + lw - pw / 2 - 12, iy); ctx.scale(k, k);
        Lab.pill(mark, 0, 0, col, 13); ctx.restore();
      } else Lab.text('？', lx + lw - 26, iy, 'rgba(238,241,250,.4)', 18, 'center', 'bold');
    });
  }

  /* ---------- 組成層次 ---------- */
  const LEVELS = {
    animal: [
      ['個體', '人', '一個完整的生物，能獨立生活。'],
      ['器官系統', '消化系統', '好幾個器官合作完成同一項工作，例如消化系統：口、食道、胃、小腸、大腸。'],
      ['器官', '胃', '由不同組織組成、有特定功能，例如胃可以磨碎與初步消化食物。'],
      ['組織', '肌肉組織', '形態、功能相似的細胞聚在一起，例如肌肉組織能收縮。'],
      ['細胞', '肌肉細胞', '生物構造與功能的基本單位。']
    ],
    plant: [
      ['個體', '一株植物', '一個完整的生物。'],
      ['器官', '葉', '植物沒有器官系統，器官（根、莖、葉、花、果實、種子）直接組成個體。葉是行光合作用的主要器官。'],
      ['組織', '葉肉組織', '含有很多葉綠體的細胞聚在一起，負責光合作用。'],
      ['細胞', '葉肉細胞', '有細胞壁、葉綠體和液胞的植物細胞。'],
      ['細胞', '葉肉細胞', '有細胞壁、葉綠體和液胞的植物細胞。']
    ]
  };
  Lab.bindGroup('#kindSeg button', k => { S.kind = k; const z = $('zoom'); z.max = k === 'plant' ? 3 : 4; if (+z.value > +z.max) z.value = z.max; z.dispatchEvent(new Event('input')); });
  Lab.bindSlider('zoom', v => {
    S.zoom = v;
    const [lv, ex, info] = LEVELS[S.kind][v];
    $('levelInfo').innerHTML = `<b>${lv}</b>：${ex}<br>${info}`;
  }, v => (LEVELS[S.kind][v] || [''])[0]);

  function drawLevel(ctx, W, H, dt) {
    S.zoomAnim += (S.zoom - S.zoomAnim) * Math.min(1, dt * 6);
    const levels = LEVELS[S.kind], n = S.kind === 'plant' ? 4 : 5;
    // 上方：階梯
    const stepW = Math.min(150, (W - 40) / n), sx = W / 2 - stepW * n / 2;
    for (let i = 0; i < n; i++) {
      const on = i === S.zoom, x0 = sx + i * stepW + 4, w = stepW - 8;
      ctx.save();
      if (on) { ctx.shadowColor = '#4fd18b'; ctx.shadowBlur = 16; }
      Lab.rr(x0, 18, w, 46, 23);
      ctx.fillStyle = on ? Lab.lg(0, 18, 0, 64, ['rgba(79,209,139,.5)', 'rgba(79,209,139,.2)']) : Lab.lg(0, 18, 0, 64, ['rgba(255,255,255,.08)', 'rgba(255,255,255,.03)']);
      ctx.fill(); ctx.restore();
      Lab.rr(x0, 18, w, 46, 23); ctx.strokeStyle = on ? '#4fd18b' : 'rgba(255,255,255,.12)'; ctx.lineWidth = 1.5; ctx.stroke();
      Lab.text(levels[i][0], x0 + w / 2, 42, on ? '#fff' : 'rgba(238,241,250,.6)', 15, 'center', on ? 'bold' : '');
      if (i < n - 1) Lab.text('›', sx + (i + 1) * stepW, 41, 'rgba(238,241,250,.45)', 20, 'center', 'bold');
    }
    const cx = W / 2, cy = (H + 80) / 2, size = Math.min(W, H - 100) * 0.38;
    backdrop(ctx, W, H, cx, cy, size * 1.6);
    const z = Math.round(S.zoomAnim);
    const fade = 1 - Math.min(1, Math.abs(S.zoomAnim - z) * 2);
    ctx.globalAlpha = Math.max(0.15, fade);
    (S.kind === 'animal' ? drawAnimal : drawPlant)(ctx, z, cx, cy, size);
    ctx.globalAlpha = 1;
    Lab.pill(`${levels[z][0]}：${levels[z][1]}`, cx, H - 34, '#4fd18b', 17);
  }
  /** 組織：很多形狀相似的細胞排在一起（細胞膜邊緣亮、中間透明） */
  function cellGrid(ctx, cx, cy, size, plant) {
    const n = 5, cw = size * 2 / n, ch = cw * 0.7, base = plant ? '#7ee0a0' : '#ff9fb4';
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const jx = (rnd(i * 7 + j) - 0.5) * cw * 0.06, jy = (rnd(i * 3 + j * 11) - 0.5) * ch * 0.06;   // 稍微不整齊，比較像真的
      const x = cx - size + i * cw + jx, y = cy - n * ch / 2 + j * ch + jy, w = cw - 4, h = ch - 4;
      Lab.rr(x + 2, y + 2, w, h, plant ? 4 : h * 0.4);
      ctx.fillStyle = Lab.rg(x + 2 + w / 2, y + 2 + h / 2, 0, w * 0.62, [Lab.alpha(base, 0.04), Lab.alpha(base, 0.12), Lab.alpha(base, 0.42)]);
      ctx.fill(); ctx.strokeStyle = plant ? '#4f9e4a' : Lab.alpha(base, 0.85); ctx.lineWidth = plant ? 2.5 : 1.5; ctx.stroke();
      Lab.ball(x + cw / 2, y + ch * 0.48, cw * 0.1, plant ? '#7a63d9' : '#a072e0');
      if (plant) for (let k = 0; k < 3; k++) Lab.ball(x + cw * (0.25 + k * 0.25), y + ch * 0.78, cw * 0.05, '#3fbf6a');
    }
  }
  function drawAnimal(ctx, z, cx, cy, s) {
    if (z === 0) {                                   // 人（個體）
      const ps = s * 1.75 / 124, fy = cy + s * 0.88;
      ctx.fillStyle = Lab.rg(cx, fy, 0, s * 0.6, ['rgba(79,209,139,.3)', 'rgba(79,209,139,0)']);
      ctx.beginPath(); ctx.ellipse(cx, fy, s * 0.6, s * 0.12, 0, 0, Math.PI * 2); ctx.fill();
      Lab.person(cx, fy, ps, { shirt: '#5b9cff', pants: '#2f3d63', hand: [8, 40], hand2: [-8, 40] });
      const gy = fy - 80 * ps;                        // 胃大約在這裡
      hintRing(ctx, cx + 2 * ps, gy, 13 * ps);
      Lab.text('放大看 →', cx + s * 0.55, gy, GOLD, 15, 'center', 'bold');
    } else if (z === 1) {                            // 消化系統
      // 淡淡的身體輪廓
      Lab.circle(cx, cy - s * 1.05, s * 0.16, 'rgba(255,255,255,.05)', 'rgba(255,255,255,.12)', 1.5);
      Lab.rr(cx - s * 0.62, cy - s * 0.85, s * 1.24, s * 1.6, s * 0.3);
      ctx.fillStyle = Lab.lg(0, cy - s * 0.85, 0, cy + s * 0.75, ['rgba(255,255,255,.07)', 'rgba(255,255,255,.02)']); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1.5; ctx.stroke();
      tube(ctx, () => { ctx.moveTo(cx - s * 0.45, cy + s * 0.55); ctx.lineTo(cx - s * 0.45, cy - s * 0.1); ctx.lineTo(cx + s * 0.45, cy - s * 0.1); ctx.lineTo(cx + s * 0.45, cy + s * 0.6); }, s * 0.09, '#d9849b');
      tube(ctx, () => { for (let i = 0; i <= 40; i++) { const t = i / 40, x = cx + Math.sin(t * 18) * s * 0.3, y = cy - s * 0.05 + t * s * 0.55; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } }, s * 0.045, '#ff9fb4');
      tube(ctx, () => { ctx.moveTo(cx, cy - s * 0.9); ctx.lineTo(cx, cy - s * 0.42); }, s * 0.06, '#ffb3c4');
      ctx.save(); ctx.translate(cx + s * 0.12, cy - s * 0.32); ctx.rotate(0.5);   // 胃
      ctx.beginPath(); ctx.ellipse(0, 0, s * 0.24, s * 0.16, 0, 0, Math.PI * 2);
      ctx.fillStyle = Lab.rg(0, 0, s * 0.02, s * 0.24, ['#ffc2d0', '#ff6f98', '#a8325a'], -s * 0.08, -s * 0.06); ctx.fill();
      ctx.strokeStyle = '#7a2342'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
      [['食道', cx + s * 0.2, cy - s * 0.75], ['胃', cx + s * 0.55, cy - s * 0.32], ['小腸', cx, cy + s * 0.75], ['大腸', cx + s * 0.7, cy + s * 0.2]]
        .forEach(([t, x, y]) => Lab.pill(t, x, y, GOLD, 13));
    } else if (z === 2) {                            // 胃（器官）：由不同組織組成
      const rot = -0.3, P = (r1, r2, a) => [cx + r1 * Math.cos(a) * Math.cos(rot) - r2 * Math.sin(a) * Math.sin(rot), cy + r1 * Math.cos(a) * Math.sin(rot) + r2 * Math.sin(a) * Math.cos(rot)];
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
      ctx.beginPath(); ctx.ellipse(0, 0, s * 0.7, s * 0.45, 0, 0, Math.PI * 2);
      ctx.fillStyle = Lab.rg(0, 0, s * 0.1, s * 0.72, ['#ffb3c4', '#e2577c', '#8f2a4a'], -s * 0.2, -s * 0.15); ctx.fill();
      ctx.strokeStyle = '#6e1f3a'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.save(); ctx.clip();                          // 肌肉組織的紋路
      ctx.strokeStyle = 'rgba(120,20,50,.25)'; ctx.lineWidth = 2;
      for (let i = -12; i <= 12; i++) { ctx.beginPath(); ctx.moveTo(i * s * 0.06, -s * 0.5); ctx.lineTo(i * s * 0.06 + s * 0.1, s * 0.5); ctx.stroke(); }
      ctx.restore();
      ctx.beginPath();                                 // 上皮組織（內層，有皺褶）
      for (let i = 0; i <= 96; i++) { const a = i / 96 * Math.PI * 2, w = 1 + Math.sin(a * 16) * 0.04; const x = Math.cos(a) * s * 0.55 * w, y = Math.sin(a) * s * 0.32 * w; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.closePath(); ctx.fillStyle = Lab.rg(0, 0, s * 0.1, s * 0.55, ['#ffe7c2', '#ffc08a', '#f08a6a']); ctx.fill();
      ctx.strokeStyle = GOLD; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, 0, s * 0.42, s * 0.2, 0, 0, Math.PI * 2);   // 胃腔
      ctx.fillStyle = Lab.rg(0, 0, 0, s * 0.42, ['rgba(60,10,25,.75)', 'rgba(90,20,40,.55)']); ctx.fill();
      ctx.restore();
      const [mx, my] = P(s * 0.64, s * 0.4, -0.5), [ex, ey] = P(s * 0.5, s * 0.28, 2.4);
      Lab.line(mx, my, cx + s * 0.85, cy - s * 0.55, 'rgba(255,255,255,.6)', 1.5); Lab.circle(mx, my, 4, '#fff');
      Lab.line(ex, ey, cx - s * 0.8, cy + s * 0.55, 'rgba(255,255,255,.6)', 1.5); Lab.circle(ex, ey, 4, '#fff');
      Lab.pill('肌肉組織', cx + s * 0.85, cy - s * 0.55, '#ff8fa8', 14);
      Lab.pill('上皮組織', cx - s * 0.8, cy + s * 0.55, GOLD, 14);
      Lab.text('胃由肌肉組織、上皮組織等多種組織組成', cx, cy + s * 0.8, 'rgba(238,241,250,.85)', 15);
    } else if (z === 3) cellGrid(ctx, cx, cy, s * 0.8, false);
    else drawCell(ctx, cx, cy, s * 0.8, 'animal', false);
  }
  function drawPlant(ctx, z, cx, cy, s) {
    if (z === 0) {                                   // 一株植物（個體）
      // 花盆和土
      const py = cy + s * 0.72, ph = s * 0.22;
      Lab.shadow(cx, py + ph + 4, s * 0.34, s * 0.06, 0.5);
      ctx.beginPath(); ctx.moveTo(cx - s * 0.28, py); ctx.lineTo(cx + s * 0.28, py); ctx.lineTo(cx + s * 0.2, py + ph); ctx.lineTo(cx - s * 0.2, py + ph); ctx.closePath();
      ctx.fillStyle = Lab.lg(cx - s * 0.28, 0, cx + s * 0.28, 0, ['#a8603a', '#d98a5a', '#8a4a2a']); ctx.fill();
      Lab.rr(cx - s * 0.31, py - s * 0.04, s * 0.62, s * 0.07, 4); ctx.fillStyle = Lab.lg(0, py - s * 0.04, 0, py + s * 0.03, ['#e09a6a', '#9a5532']); ctx.fill();
      ctx.fillStyle = '#4a3020'; ctx.beginPath(); ctx.ellipse(cx, py - s * 0.035, s * 0.27, s * 0.03, 0, 0, Math.PI * 2); ctx.fill();
      // 莖
      ctx.save(); ctx.lineCap = 'round';
      ctx.strokeStyle = Lab.lg(cx - 5, 0, cx + 5, 0, ['#4f8a3a', '#8fc06a', '#4f8a3a']); ctx.lineWidth = s * 0.045;
      ctx.beginPath(); ctx.moveTo(cx, py - s * 0.03); ctx.quadraticCurveTo(cx - s * 0.04, cy + s * 0.1, cx, cy - s * 0.52); ctx.stroke(); ctx.restore();
      // 葉
      [[-1, -0.3], [1, -0.1], [-1, 0.15], [1, 0.4]].forEach(([d, y]) => leaf(ctx, cx + d * s * 0.28, cy + y * s, s * 0.26, s * 0.1, d * 0.4, 0));
      // 花
      const fx = cx, fy = cy - s * 0.62;
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3 + S.t * 0.1;
        ctx.save(); ctx.translate(fx + Math.cos(a) * s * 0.08, fy + Math.sin(a) * s * 0.08); ctx.rotate(a);
        ctx.beginPath(); ctx.ellipse(0, 0, s * 0.09, s * 0.055, 0, 0, Math.PI * 2);
        ctx.fillStyle = Lab.rg(0, 0, 0, s * 0.09, ['#ffe0ea', '#ff8fa8', '#e05a80'], -s * 0.03, 0); ctx.fill(); ctx.restore();
      }
      Lab.ball(fx, fy, s * 0.055, '#ffd166');
      hintRing(ctx, cx + s * 0.28, cy - s * 0.1, s * 0.17);
      Lab.text('放大看 →', cx + s * 0.72, cy - s * 0.1, GOLD, 15, 'center', 'bold');
    } else if (z === 1) {                            // 葉（器官）
      Lab.line(cx - s * 0.78, cy, cx - s * 1.0, cy + s * 0.12, '#4f8a3a', s * 0.035);   // 葉柄
      leaf(ctx, cx, cy, s * 0.8, s * 0.38, 0, 5);
      Lab.text('植物沒有器官系統：根、莖、葉等器官直接組成個體', cx, cy + s * 0.65, GOLD, 15, 'center', 'bold');
    } else if (z === 2) cellGrid(ctx, cx, cy, s * 0.8, true);
    else drawCell(ctx, cx, cy, s * 0.8, 'plant', false);
  }

  /* ---------- 細胞構造 ---------- */
  const PARTS = {
    wall: ['細胞壁', '只有植物細胞有。在細胞膜外面，堅硬，用來支持和保護細胞。'],
    membrane: ['細胞膜', '控制物質進出細胞。'],
    nucleus: ['細胞核', '含有遺傳物質（DNA），控制細胞的生命活動。'],
    cytoplasm: ['細胞質', '細胞膜以內、細胞核以外的部分，許多化學反應在這裡進行。'],
    mito: ['粒線體', '進行呼吸作用，分解養分、釋放能量。動物、植物細胞都有。'],
    chloro: ['葉綠體', '只有植物（綠色部分）的細胞有。進行光合作用，製造養分。'],
    vacuole: ['液胞', '植物細胞的液胞很大，儲存水分和物質，讓細胞保持飽滿。']
  };
  let hits = [];
  function drawCell(ctx, cx, cy, s, kind, interactive) {
    const plant = kind === 'plant', c = ctx;
    hits = [];
    const sel = k => interactive && S.part === k;
    const glow = k => { if (sel(k)) { c.shadowColor = GOLD; c.shadowBlur = 20; } };   // 被點到的構造發金光
    // 細胞質裡的小顆粒
    const grains = () => DOTS.forEach(([u, v, r]) => {
      if (!plant && u * u + (v * 0.62 / 0.72) ** 2 > 0.6) return;
      Lab.circle(cx + u * s * 0.82, cy + v * s * 0.56, r * s * 0.006 + 0.6, 'rgba(230,255,240,.22)');
    });
    if (plant) {
      // 細胞壁：厚而堅硬
      c.save(); glow('wall');
      Lab.rr(cx - s * 0.965, cy - s * 0.685, s * 1.93, s * 1.37, 12);
      c.strokeStyle = Lab.lg(cx - s, cy - s * 0.72, cx + s, cy + s * 0.72, ['#9ad884', '#4f9e4a', '#3b7a3a']);
      c.lineWidth = s * 0.07; c.stroke(); c.restore();
      Lab.rr(cx - s, cy - s * 0.72, s * 2, s * 1.44, 15);
      c.strokeStyle = sel('wall') ? GOLD : 'rgba(25,60,30,.9)'; c.lineWidth = sel('wall') ? 3 : 1.5; c.stroke();
      // 細胞膜與細胞質：邊緣亮、中間透明
      Lab.rr(cx - s * 0.93, cy - s * 0.65, s * 1.86, s * 1.3, 10);
      c.fillStyle = Lab.rg(cx, cy, s * 0.2, s * 1.05, ['rgba(150,235,190,.05)', 'rgba(150,235,190,.10)', 'rgba(180,255,215,.30)']); c.fill();
      c.save(); glow('membrane'); c.strokeStyle = sel('membrane') ? GOLD : 'rgba(225,255,238,.85)'; c.lineWidth = sel('membrane') ? 4 : 2.5; c.stroke(); c.restore();
      hits.push(['wall', p => insideRect(p, cx - s, cy - s * 0.72, s * 2, s * 1.44) && !insideRect(p, cx - s * 0.9, cy - s * 0.62, s * 1.8, s * 1.24)]);
      hits.push(['membrane', p => insideRect(p, cx - s * 0.93, cy - s * 0.65, s * 1.86, s * 1.3) && !insideRect(p, cx - s * 0.86, cy - s * 0.58, s * 1.72, s * 1.16)]);
      grains();
      // 大型液胞
      Lab.rr(cx - s * 0.35, cy - s * 0.45, s * 0.95, s * 0.9, s * 0.3);
      c.fillStyle = Lab.rg(cx + s * 0.125, cy, s * 0.1, s * 0.6, ['rgba(120,180,255,.08)', 'rgba(120,180,255,.16)', 'rgba(150,200,255,.42)']); c.fill();
      c.save(); glow('vacuole'); c.strokeStyle = sel('vacuole') ? GOLD : 'rgba(160,205,255,.85)'; c.lineWidth = sel('vacuole') ? 3.5 : 2; c.stroke(); c.restore();
      c.fillStyle = 'rgba(255,255,255,.13)';
      c.beginPath(); c.ellipse(cx - s * 0.02, cy - s * 0.3, s * 0.2, s * 0.06, -0.25, 0, Math.PI * 2); c.fill();
      hits.push(['vacuole', p => insideRect(p, cx - s * 0.35, cy - s * 0.45, s * 0.95, s * 0.9)]);
      // 葉綠體（裡面有一疊疊的基粒）
      [[-0.75, -0.45], [-0.5, -0.45], [-0.75, -0.15], [-0.5, -0.15], [0.74, -0.45], [0.74, 0.45]].forEach(([dx, dy]) => {
        const x = cx + dx * s, y = cy + dy * s;
        c.save(); c.translate(x, y); c.rotate(0.4); glow('chloro');
        c.beginPath(); c.ellipse(0, 0, s * 0.09, s * 0.05, 0, 0, Math.PI * 2);
        c.fillStyle = Lab.lg(0, -s * 0.05, 0, s * 0.05, ['#9af5b2', '#3fbf6a', '#1f7a42']); c.fill();
        c.shadowBlur = 0; c.strokeStyle = sel('chloro') ? GOLD : '#1d5e35'; c.lineWidth = sel('chloro') ? 2.5 : 1.5; c.stroke();
        c.fillStyle = 'rgba(20,90,45,.75)';
        for (let k = -1; k <= 1; k++) c.fillRect(k * s * 0.04 - s * 0.012, -s * 0.022, s * 0.024, s * 0.044);
        c.restore();
        hits.push(['chloro', p => Math.hypot(p[0] - x, p[1] - y) < s * 0.1]);
      });
    } else {
      // 動物細胞：只有細胞膜，邊緣亮、中間透明
      c.beginPath(); c.ellipse(cx, cy, s, s * 0.72, 0, 0, Math.PI * 2);
      c.fillStyle = Lab.rg(cx, cy, s * 0.2, s * 1.02, ['rgba(255,170,190,.05)', 'rgba(255,160,185,.10)', 'rgba(255,190,205,.34)']); c.fill();
      c.save(); glow('membrane'); c.strokeStyle = sel('membrane') ? GOLD : 'rgba(255,225,232,.85)'; c.lineWidth = sel('membrane') ? 5 : 2.5; c.stroke(); c.restore();
      hits.push(['membrane', p => { const d = ((p[0] - cx) / s) ** 2 + ((p[1] - cy) / (s * 0.72)) ** 2; return d < 1.08 && d > 0.85; }]);
      grains();
    }
    // 粒線體（內膜有皺褶）
    (plant ? [[0.74, 0.02], [-0.12, 0.52]] : [[0.55, 0.35], [-0.55, 0.38], [0.6, -0.35]]).forEach(([dx, dy]) => {
      const x = cx + dx * s, y = cy + dy * s;
      c.save(); c.translate(x, y); c.rotate(-0.5); glow('mito');
      c.beginPath(); c.ellipse(0, 0, s * 0.12, s * 0.06, 0, 0, Math.PI * 2);
      c.fillStyle = Lab.lg(0, -s * 0.06, 0, s * 0.06, ['#ffc684', '#ff9f43', '#c26a1a']); c.fill();
      c.shadowBlur = 0; c.strokeStyle = sel('mito') ? GOLD : '#8a4a12'; c.lineWidth = sel('mito') ? 2.5 : 1.8; c.stroke();
      c.clip(); c.beginPath();
      for (let i = 0; i <= 8; i++) { const xx = -s * 0.1 + i * s * 0.025, yy = (i % 2 ? -1 : 1) * s * 0.035; i ? c.lineTo(xx, yy) : c.moveTo(xx, yy); }
      c.strokeStyle = 'rgba(120,60,10,.7)'; c.lineWidth = 1.5; c.stroke();
      c.restore();
      hits.push(['mito', p => Math.hypot(p[0] - x, p[1] - y) < s * 0.12]);
    });
    // 細胞核（含核仁與染色質）
    const nx = plant ? cx - s * 0.62 : cx - s * 0.1, ny = plant ? cy + s * 0.36 : cy, nr = s * 0.2;
    c.save(); glow('nucleus');
    c.beginPath(); c.arc(nx, ny, nr, 0, Math.PI * 2);
    c.fillStyle = Lab.rg(nx, ny, nr * 0.1, nr, ['rgba(220,205,255,.92)', 'rgba(160,130,250,.82)', 'rgba(100,70,200,.88)'], nx - nr * 0.35, ny - nr * 0.35); c.fill();
    c.shadowBlur = 0; c.strokeStyle = sel('nucleus') ? GOLD : '#cbb8ff'; c.lineWidth = sel('nucleus') ? 3.5 : 2; c.stroke(); c.restore();
    [[-0.4, 0.3], [-0.1, -0.45], [0.45, -0.2], [0.1, 0.5], [-0.5, -0.1]].forEach(([u, v]) => Lab.circle(nx + u * nr, ny + v * nr, nr * 0.07, 'rgba(70,40,160,.55)'));
    Lab.circle(nx + nr * 0.22, ny + nr * 0.12, nr * 0.27, Lab.rg(nx + nr * 0.22, ny + nr * 0.12, 0, nr * 0.27, ['rgba(90,55,190,.95)', 'rgba(60,30,150,.8)']));
    c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.ellipse(nx - nr * 0.4, ny - nr * 0.45, nr * 0.25, nr * 0.1, -0.7, 0, Math.PI * 2); c.fill();
    hits.push(['nucleus', p => Math.hypot(p[0] - nx, p[1] - ny) < s * 0.2]);
    hits.push(['cytoplasm', p => plant ? insideRect(p, cx - s * 0.86, cy - s * 0.58, s * 1.72, s * 1.16) : ((p[0] - cx) / s) ** 2 + ((p[1] - cy) / (s * 0.72)) ** 2 < 0.85]);
    if (interactive) {                               // 名稱標籤：被點到的那一個變金色
      const L = plant
        ? [['細胞壁', cx - s * 0.82, cy - s * 0.83, 'wall'], ['液胞', cx + s * 0.125, cy - s * 0.58, 'vacuole'], ['葉綠體', cx - s * 0.62, cy - s * 0.58, 'chloro'], ['細胞核', nx, ny - nr - 16, 'nucleus'], ['粒線體', cx + s * 0.74, cy + s * 0.15, 'mito']]
        : [['細胞膜', cx + s * 0.75, cy - s * 0.65, 'membrane'], ['細胞核', nx, ny + nr + 18, 'nucleus'], ['粒線體', cx + s * 0.55, cy + s * 0.5, 'mito'], ['細胞質', cx - s * 0.5, cy - s * 0.3, 'cytoplasm']];
      L.forEach(([t, x, y, k]) => Lab.pill(t, x, y, S.part === k ? GOLD : 'rgba(238,241,250,.85)', 13));
    }
  }
  const insideRect = (p, x, y, w, h) => p[0] > x && p[0] < x + w && p[1] > y && p[1] < y + h;
  Lab.bindGroup('#cellSeg button', k => { S.cell = k; S.part = null; $('partInfo').textContent = '點一下細胞裡的構造。'; });

  /* ---------- 主程式 ---------- */
  Lab.bindGroup('.mode', k => { S.mode = k; Lab.showMode(k); });
  Lab.init({
    draw(ctx, W, H, dt, t) {
      S.t = t;
      if (S.mode === 'judge') drawJudge(ctx, W, H, dt);
      else if (S.mode === 'level') drawLevel(ctx, W, H, dt);
      else {
        const s = Math.min(W * 0.36, H * 0.42);
        backdrop(ctx, W, H, W / 2, H / 2 + 10, s * 1.6);
        drawCell(ctx, W / 2, H / 2 + 10, s, S.cell, true);
        Lab.pill(S.cell === 'plant' ? '植物細胞' : '動物細胞', W / 2, 32, '#4fd18b', 17);
      }
    },
    down(x, y) {
      if (S.mode !== 'cell') return false;
      // 先檢查小構造，再檢查大範圍的液胞、膜、細胞質
      const order = ['nucleus', 'mito', 'chloro', 'vacuole', 'membrane', 'wall', 'cytoplasm'];
      const h = order.map(k => hits.find(([kk, f]) => kk === k && f([x, y]))).find(Boolean);
      if (!h) return false;
      S.part = h[0];
      const [n, d] = PARTS[h[0]];
      $('partInfo').innerHTML = `<b>${n}</b>：${d}`;
      return false;
    }
  });
})();
</script>
<script src="lesson.js" defer></script>
</body>
