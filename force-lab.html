<!DOCTYPE html>
<html lang="zh-Hant" data-subject="phy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>彈簧與力</title>
<link rel="stylesheet" href="lab-kit.css">
</head>
<body>
<canvas id="cv" aria-label="彈簧伸長量與力的合成模擬"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g8">← 回課程總覽</a>
  <h1>彈簧與力</h1>
  <p class="sub">國二理化 · 力與壓力</p>

  <div class="body">
    <div class="modes" style="--n:2">
      <button class="mode" data-k="hooke" aria-pressed="true">彈簧秤<br>（虎克定律）</button>
      <button class="mode" data-k="net" aria-pressed="false">力的合成<br>與平衡</button>
    </div>

    <div data-mode="hooke">
      <div class="group">
        <div class="seg" style="--n:2" id="spring">
          <button data-k="soft" aria-pressed="true">軟彈簧</button>
          <button data-k="hard" aria-pressed="false">硬彈簧</button>
        </div>
        <div class="row" style="margin-top:8px">
          <button class="btn primary grow" id="add">掛上 10 gw 砝碼</button>
          <button class="btn" id="remove">拿掉一個</button>
        </div>
        <dl class="live" style="margin-top:10px">
          <dt>拉力（砝碼重）</dt><dd id="F">—</dd>
          <dt>伸長量</dt><dd id="x">—</dd>
          <dt>彈簧狀態</dt><dd id="st">—</dd>
        </dl>
      </div>
    </div>

    <div data-mode="net" hidden>
      <div class="group">
        <div class="ctrl"><label for="f1">向左的力 F₁ <output id="f1Val"></output></label><input type="range" id="f1" min="0" max="10" step="1" value="4"></div>
        <div class="ctrl"><label for="f2">向右的力 F₂ <output id="f2Val"></output></label><input type="range" id="f2" min="0" max="10" step="1" value="6"></div>
        <div class="seg" style="--n:2" id="dir2">
          <button data-k="opp" aria-pressed="true">兩力反向</button>
          <button data-k="same" aria-pressed="false">兩力同向</button>
        </div>
        <dl class="live" style="margin-top:10px"><dt>合力</dt><dd id="net">—</dd></dl>
      </div>
    </div>

    <div class="group"><div class="result" id="info"></div></div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script>
(() => {
  const $ = Lab.$;
  const SP = { soft: { k: 0.5, limit: 80, name: '軟彈簧' }, hard: { k: 0.2, limit: 120, name: '硬彈簧' } };  // k：每 gw 伸長幾 cm
  const S = { mode: 'hooke', sp: 'soft', n: 0, damaged: { soft: 0, hard: 0 }, ext: 0, pts: { soft: [], hard: [] }, f1: 4, f2: 6, dir: 'opp', bx: 0, bv: 0 };

  function target() {
    const s = SP[S.sp], F = S.n * 10;
    const elastic = Math.min(F, s.limit) * s.k, over = Math.max(0, F - s.limit) * s.k * 2.2;
    return elastic + over + S.damaged[S.sp];
  }
  function drawHooke(ctx, w, h, dt) {
    S.ext += (target() - S.ext) * Math.min(1, dt * 6);
    const sx = w * 0.28, top = 50, px = 6.5, len0 = 140, L = len0 + S.ext * px;
    // 支架與尺
    Lab.line(sx - 80, top, sx + 80, top, '#9fb4d6', 6);
    Lab.card(sx + 70, top + 10, 46, len0 + 70 * px * 0.6 + 40, '#e9eef7', null, 4);
    for (let c = 0; c <= 40; c++) { const y = top + len0 + c * px; Lab.line(sx + 70, y, sx + 70 + (c % 5 ? 10 : 20), y, '#13233f', c % 5 ? 1 : 2); if (c % 10 === 0) Lab.text(String(c), sx + 102, y, '#13233f', 12); }
    Lab.text('cm', sx + 93, top + 22, '#13233f', 11);
    // 彈簧
    ctx.strokeStyle = S.sp === 'soft' ? '#5fa2ff' : '#ffa64d'; ctx.lineWidth = S.sp === 'soft' ? 3 : 5; ctx.beginPath();
    const coils = 18; ctx.moveTo(sx, top);
    for (let i = 0; i <= coils * 2; i++) ctx.lineTo(sx + (i % 2 ? 18 : -18) * (i && i < coils * 2 ? 1 : 0), top + 14 + (L - 28) * i / (coils * 2));
    ctx.lineTo(sx, top + L); ctx.stroke();
    // 指針與砝碼
    Lab.line(sx, top + L, sx + 72, top + L, '#ff5d5d', 2.5);
    for (let i = 0; i < S.n; i++) Lab.card(sx - 22, top + L + 4 + i * 18, 44, 16, '#b8bcc8', '#fff', 3);
    if (S.n) Lab.text(`${S.n * 10} gw`, sx - 40, top + L + 12, '#eef1fa', 13, 'right');
    // 圖：拉力－伸長量
    const gx = w * 0.5, gw = w - gx - 20, gy = 40, gh = Math.min(h - 80, 360);
    Lab.card(gx, gy, gw, gh, 'rgba(255,255,255,.03)', 'rgba(255,255,255,.12)', 6);
    const X = F => gx + 40 + F / 160 * (gw - 60), Y = x => gy + gh - 30 - x / 80 * (gh - 50);
    Lab.line(gx + 40, gy + gh - 30, gx + gw - 10, gy + gh - 30, 'rgba(255,255,255,.4)', 1.5); Lab.line(gx + 40, gy + 10, gx + 40, gy + gh - 30, 'rgba(255,255,255,.4)', 1.5);
    Lab.text('拉力（gw）→', gx + gw - 14, gy + gh - 12, 'rgba(238,241,250,.6)', 12, 'right');
    Lab.text('伸長量（cm）', gx + 46, gy + 18, 'rgba(238,241,250,.6)', 12, 'left');
    [['soft', '#5fa2ff'], ['hard', '#ffa64d']].forEach(([k, c]) => {
      const p = S.pts[k];
      ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.beginPath(); p.forEach(([F, x], i) => (i ? ctx.lineTo(X(F), Y(x)) : ctx.moveTo(X(F), Y(x)))); ctx.stroke();
      p.forEach(([F, x]) => Lab.circle(X(F), Y(x), 5, c));
      // 彈性限度
      Lab.line(X(SP[k].limit), gy + 10, X(SP[k].limit), gy + gh - 30, c + '55', 1, [4, 4]);
    });
    Lab.text('虛線：彈性限度', gx + gw - 14, gy + 18, 'rgba(238,241,250,.5)', 12, 'right');
  }
  function drawNet(ctx, w, h, dt) {
    const F1 = S.f1, F2 = S.f2, net = S.dir === 'opp' ? F2 - F1 : F1 + F2;   // 向右為正
    S.bv += net * dt * 40;                          // 光滑桌面：合力為 0 時保持原來的運動狀態
    S.bx += S.bv * dt; if (Math.abs(S.bx) > w * 0.3) { S.bx = 0; S.bv = 0; }
    const cy = h * 0.45, bx = w * 0.45 + S.bx;
    Lab.line(20, cy + 40, w - 20, cy + 40, 'rgba(255,255,255,.3)', 2);
    Lab.card(bx - 40, cy - 40, 80, 80, '#ffa64d', '#fff', 6);
    Lab.text('物體', bx, cy, '#13233f', 15, 'center', 'bold');
    const sc = 18;
    if (S.dir === 'opp') {
      if (F1) { Lab.arrow(bx - 40, cy - 10, bx - 40 - F1 * sc, cy - 10, '#5cc8ff', 5, 16); Lab.text(`F₁ = ${F1} N`, bx - 50 - F1 * sc / 2, cy - 32, '#5cc8ff', 14, 'center', 'bold'); }
      if (F2) { Lab.arrow(bx + 40, cy - 10, bx + 40 + F2 * sc, cy - 10, '#ff8a5c', 5, 16); Lab.text(`F₂ = ${F2} N`, bx + 50 + F2 * sc / 2, cy - 32, '#ff8a5c', 14, 'center', 'bold'); }
    } else {
      if (F1) { Lab.arrow(bx + 40, cy - 16, bx + 40 + F1 * sc, cy - 16, '#5cc8ff', 5, 16); Lab.text(`F₁ = ${F1} N`, bx + 50 + F1 * sc / 2, cy - 38, '#5cc8ff', 14, 'center', 'bold'); }
      if (F2) { Lab.arrow(bx + 40, cy + 12, bx + 40 + F2 * sc, cy + 12, '#ff8a5c', 5, 16); Lab.text(`F₂ = ${F2} N`, bx + 50 + F2 * sc / 2, cy + 34, '#ff8a5c', 14, 'center', 'bold'); }
    }
    // 合力
    const ny = cy + 110;
    Lab.text('合力', bx, ny - 24, '#4fd18b', 14, 'center', 'bold');
    if (net) Lab.arrow(bx, ny, bx + net * sc, ny, '#4fd18b', 6, 18); else Lab.text('0（平衡）', bx, ny, '#4fd18b', 16, 'center', 'bold');
    $('net').textContent = net === 0 ? '0 N（平衡）' : `${Math.abs(net)} N，向${net > 0 ? '右' : '左'}`;
  }

  Lab.init({
    draw(ctx, w, h, dt) { S.mode === 'hooke' ? drawHooke(ctx, w, h, dt) : drawNet(ctx, w, h, dt); },
    ui() {
      if (S.mode === 'hooke') {
        const s = SP[S.sp], F = S.n * 10;
        $('F').textContent = F + ' gw'; $('x').textContent = target().toFixed(1) + ' cm';
        const dmg = S.damaged[S.sp] > 0;
        $('st').textContent = F > s.limit ? '超過彈性限度！' : dmg ? '已永久變形' : '彈性範圍內';
        $('info').innerHTML = F > s.limit
          ? `超過<b>彈性限度</b>（${s.limit} gw）後，伸長量不再和拉力成正比；拿掉砝碼後彈簧<b>回不到原長</b>（永久變形）。`
          : `在彈性限度內，<b>伸長量和拉力成正比</b>（虎克定律）。${s.name}每 10 gw 伸長 ${(s.k * 10).toFixed(0)} cm。彈簧秤就是利用這個原理。`;
      } else {
        $('info').innerHTML = S.dir === 'opp'
          ? '兩力<b>方向相反</b>：合力 = 大力 − 小力，方向和大的力相同。兩力大小相等時合力為 0，物體保持<b>原來的運動狀態</b>（力平衡）。'
          : '兩力<b>方向相同</b>：合力 = 兩力相加，方向不變。';
      }
    }
  });
  function record() { const p = S.pts[S.sp], F = S.n * 10; if (!p.some(q => q[0] === F)) { p.push([F, target()]); p.sort((a, b) => a[0] - b[0]); } }
  $('add').addEventListener('click', () => { if (S.n < 15) { S.n++; record(); } });
  $('remove').addEventListener('click', () => {
    if (!S.n) return;
    const s = SP[S.sp], F = S.n * 10;
    if (F > s.limit) S.damaged[S.sp] = Math.max(S.damaged[S.sp], (F - s.limit) * s.k * 1.2);
    S.n--;
  });
  Lab.bindGroup('#spring button', k => { S.sp = k; S.n = 0; });
  Lab.bindGroup('.mode', k => { S.mode = k; Lab.showMode(k); });
  Lab.bindGroup('#dir2 button', k => { S.dir = k; S.bx = 0; S.bv = 0; });
  Lab.bindSlider('f1', v => { S.f1 = v; }, v => v + ' N');
  Lab.bindSlider('f2', v => { S.f2 = v; }, v => v + ' N');
  record();
  window.forceSim = S;
})();
</script>
<script src="lesson.js" defer></script>
</body>
</html>
