<!DOCTYPE html>
<html lang="zh-Hant" data-subject="chem">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>水溶液與濃度</title>
<link rel="stylesheet" href="lab-kit.css">
</head>
<body>
<canvas id="cv" aria-label="燒杯中溶解、濃度與溶解度曲線的模擬"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g8">← 回課程總覽</a>
  <h1>水溶液與濃度</h1>
  <p class="sub">國二理化 · 物質的世界（溶液）</p>

  <div class="body">
    <div class="group">
      <div class="group-title">溶質</div>
      <div class="chips" style="--n:3" id="solute">
        <button class="btn" data-k="salt" aria-pressed="true">食鹽</button>
        <button class="btn" data-k="kno3" aria-pressed="false">硝酸鉀</button>
        <button class="btn" data-k="sugar" aria-pressed="false">蔗糖</button>
      </div>
    </div>

    <div class="group">
      <div class="row">
        <button class="btn grow" data-add="1">＋1 g 溶質</button>
        <button class="btn grow" data-add="10">＋10 g 溶質</button>
      </div>
      <div class="row">
        <button class="btn grow" id="water">＋50 g 水</button>
        <button class="btn grow" id="empty">倒掉重來</button>
      </div>
      <div class="ctrl" style="margin-top:10px">
        <label for="temp">水溫 <output id="tempVal"></output></label>
        <input type="range" id="temp" min="0" max="100" step="1" value="20">
      </div>
    </div>

    <div class="group">
      <dl class="live">
        <dt>水（溶劑）</dt><dd id="w">—</dd>
        <dt>加入的溶質</dt><dd id="added">—</dd>
        <dt>溶解的溶質</dt><dd id="diss">—</dd>
        <dt>沉在杯底</dt><dd id="undiss">—</dd>
        <dt>重量百分濃度</dt><dd id="conc">—</dd>
      </dl>
      <div class="result" id="state" style="margin-top:8px"></div>
    </div>

    <div class="group">
      <p class="note"><b>重量百分濃度</b> = 溶質質量 ÷ <b>溶液</b>質量 × 100%（溶液 = 溶質 + 溶劑）。<br>在一定溫度下，溶質不能再溶解時就是<b>飽和溶液</b>。100 g 水最多能溶解的溶質克數叫<b>溶解度</b>，通常會隨溫度改變。</p>
    </div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script>
(() => {
  const $ = Lab.$;
  // 溶解度（g／100 g 水），0～100°C 每 20°C 一筆
  const SOL = {
    salt:  { name: '食鹽', color: '#eef1fa', data: [35.7, 36.0, 36.6, 37.3, 38.4, 39.8] },
    kno3:  { name: '硝酸鉀', color: '#9fd8ff', data: [13.3, 31.6, 63.9, 110, 169, 246] },
    sugar: { name: '蔗糖', color: '#ffe6a8', data: [179, 204, 238, 287, 362, 487] }
  };
  const S = { k: 'salt', water: 100, added: 0, T: 20, crystals: [], parts: [] };
  const solub = (k, T) => { const d = SOL[k].data, i = Math.min(4, Math.floor(T / 20)), f = (T - i * 20) / 20; return d[i] + (d[i + 1] - d[i]) * f; };
  const maxDiss = () => solub(S.k, S.T) * S.water / 100;
  const dissolved = () => Math.min(S.added, maxDiss());

  // 粒子：溶解的散在水中、沒溶解的堆在杯底
  for (let i = 0; i < 260; i++) S.parts.push({ x: Math.random(), y: Math.random(), vx: 0, vy: 0, ph: Math.random() * 6 });

  function draw(ctx, w, h, dt, t) {
    const bw = Math.min(260, w * 0.36), bx = w * 0.06 + 10, by = 50, bh = Math.min(h - 120, 340);
    const levelFrac = Math.min(0.92, 0.35 + S.water / 400);
    const wy = by + bh * (1 - levelFrac);
    // 燒杯
    ctx.fillStyle = 'rgba(120,190,255,.16)'; ctx.fillRect(bx, wy, bw, by + bh - wy);
    ctx.strokeStyle = 'rgba(220,235,255,.7)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(bx - 8, by); ctx.lineTo(bx, by + 6); ctx.lineTo(bx, by + bh); ctx.lineTo(bx + bw, by + bh); ctx.lineTo(bx + bw, by + 6); ctx.lineTo(bx + bw + 8, by); ctx.stroke();
    for (let k = 1; k < 5; k++) Lab.line(bx + bw - 26, by + bh - k * bh / 5, bx + bw - 6, by + bh - k * bh / 5, 'rgba(220,235,255,.4)', 1.5);
    // 溶解的粒子（數量依濃度）
    const d = dissolved(), conc = d / (d + S.water);
    const n = Math.round(Math.min(1, conc / 0.75) * S.parts.length);
    ctx.fillStyle = SOL[S.k].color;
    for (let i = 0; i < n; i++) {
      const p = S.parts[i];
      p.x = (p.x + Math.sin(t * 0.8 + p.ph) * 0.0015 + 1) % 1; p.y = (p.y + Math.cos(t * 0.7 + p.ph) * 0.0015 + 1) % 1;
      ctx.beginPath(); ctx.arc(bx + 8 + p.x * (bw - 16), wy + 8 + p.y * (by + bh - wy - 26), 2.6, 0, Math.PI * 2); ctx.fill();
    }
    // 沒溶解的晶體
    const und = S.added - d, rows = Math.min(40, Math.ceil(und / 1.5));
    for (let i = 0; i < rows; i++) {
      const cx = bx + bw / 2 + ((i * 37) % 11 - 5) * bw * 0.06, cy = by + bh - 6 - Math.floor(i / 11) * 7;
      ctx.fillStyle = SOL[S.k].color; ctx.fillRect(cx - 4, cy - 4, 8, 8);
    }
    Lab.text(`${S.water} g 水、${S.T}°C`, bx + bw / 2, by + bh + 22, 'rgba(238,241,250,.7)', 14);
    // 溫度計
    const tx = bx + bw + 30;
    Lab.card(tx - 6, by + 20, 12, bh - 20, 'rgba(255,255,255,.08)', 'rgba(255,255,255,.3)', 6);
    const th = (bh - 30) * S.T / 100;
    Lab.card(tx - 3, by + bh - 6 - th, 6, th + 2, '#ff6b5e', null, 3);
    Lab.circle(tx, by + bh, 10, '#ff6b5e');
    // 溶解度曲線
    const cx0 = tx + 50, cw = w - cx0 - 20, ch = Math.min(h - 80, 340);
    if (cw > 160) {
      const series = Object.entries(SOL).map(([k, s]) => ({ data: Array.from({ length: 101 }, (_, T) => solub(k, T)), color: k === 'salt' ? '#eef1fa' : k === 'kno3' ? '#5cc8ff' : '#ffd166' }));
      const g = Lab.chart(cx0, by, cw, ch, series, { min: 0, max: 260, xLabel: '溫度 0～100°C', yLabel: '溶解度（g／100 g 水）' });
      // 目前狀態點：每 100 g 水溶了多少
      const per100 = d / S.water * 100;
      Lab.circle(g.px + S.T / 100 * g.pw, g.Y(Math.min(260, per100)), 7, '#ff5d9e', '#fff', 2);
      let ly = by + 30;
      Object.entries(SOL).forEach(([k, s]) => { Lab.pill(s.name, g.px + 50, ly, k === 'salt' ? '#eef1fa' : k === 'kno3' ? '#5cc8ff' : '#ffd166', 12); ly += 28; });
      Lab.text('● 現在的溶液', g.px + g.pw - 4, by + 30, '#ff5d9e', 13, 'right', 'bold');
    }
  }

  Lab.init({
    draw,
    ui() {
      const d = dissolved(), und = S.added - d, conc = d / (d + S.water) * 100;
      $('w').textContent = S.water + ' g';
      $('added').textContent = S.added + ' g';
      $('diss').textContent = d.toFixed(1) + ' g';
      $('undiss').textContent = und.toFixed(1) + ' g';
      $('conc').textContent = conc.toFixed(1) + '%';
      const max = maxDiss();
      $('state').innerHTML = und > 0.05
        ? `<b>飽和溶液</b>：${S.T}°C 時 ${S.water} g 水最多只能溶 ${max.toFixed(1)} g ${SOL[S.k].name}，多的沉在杯底。<br>濃度 = ${d.toFixed(1)} ÷ (${d.toFixed(1)} + ${S.water}) × 100% = <b>${conc.toFixed(1)}%</b>`
        : `<b>未飽和溶液</b>：還可以再溶 ${(max - d).toFixed(1)} g。<br>濃度 = ${d.toFixed(1)} ÷ (${d.toFixed(1)} + ${S.water}) × 100% = <b>${conc.toFixed(1)}%</b>`;
    }
  });
  Lab.bindGroup('#solute .btn', k => { S.k = k; S.added = 0; });
  document.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => { S.added += Number(b.dataset.add); }));
  $('water').addEventListener('click', () => { S.water = Math.min(300, S.water + 50); });
  $('empty').addEventListener('click', () => { S.water = 100; S.added = 0; });
  Lab.bindSlider('temp', v => { S.T = v; }, v => v + ' °C');
  window.solSim = S;
})();
</script>
<script src="lesson.js" defer></script>
</body>
</html>
