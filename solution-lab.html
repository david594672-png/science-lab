<!DOCTYPE html>
<html lang="zh-Hant" data-subject="chem">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>水溶液與濃度</title>
<link rel="stylesheet" href="lab-kit.css">
</head>
<body>
<canvas id="cv" aria-label="燒杯中溶解、濃度與溶解度曲線的模擬"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g8">← 回課程總覽</a>
  <h1>水溶液與濃度</h1>
  <p class="sub">國二理化 · 物質的世界（溶液）</p>

  <div class="body">
    <div class="group">
      <div class="group-title">溶質</div>
      <div class="chips" style="--n:3" id="solute">
        <button class="btn" data-k="salt" aria-pressed="true">食鹽</button>
        <button class="btn" data-k="kno3" aria-pressed="false">硝酸鉀</button>
        <button class="btn" data-k="sugar" aria-pressed="false">蔗糖</button>
      </div>
    </div>

    <div class="group">
      <div class="row">
        <button class="btn grow" data-add="1">＋1 g 溶質</button>
        <button class="btn grow" data-add="10">＋10 g 溶質</button>
      </div>
      <div class="row">
        <button class="btn grow" id="water">＋50 g 水</button>
        <button class="btn grow" id="empty">倒掉重來</button>
      </div>
      <div class="ctrl" style="margin-top:10px">
        <label for="temp">水溫 <output id="tempVal"></output></label>
        <input type="range" id="temp" min="0" max="100" step="1" value="20">
      </div>
    </div>

    <div class="group">
      <dl class="live">
        <dt>水（溶劑）</dt><dd id="w">—</dd>
        <dt>加入的溶質</dt><dd id="added">—</dd>
        <dt>溶解的溶質</dt><dd id="diss">—</dd>
        <dt>沉在杯底</dt><dd id="undiss">—</dd>
        <dt>重量百分濃度</dt><dd id="conc">—</dd>
      </dl>
      <div class="result" id="state" style="margin-top:8px"></div>
    </div>

    <div class="group">
      <p class="note"><b>重量百分濃度</b> = 溶質質量 ÷ <b>溶液</b>質量 × 100%（溶液 = 溶質 + 溶劑）。<br>在一定溫度下，溶質不能再溶解時就是<b>飽和溶液</b>。100 g 水最多能溶解的溶質克數叫<b>溶解度</b>，通常會隨溫度改變。</p>
    </div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script>
(() => {
  const $ = Lab.$;
  // 溶解度（g／100 g 水），0～100°C 每 20°C 一筆
  const SOL = {
    salt:  { name: '食鹽', color: '#f4f6fb', tint: '150,200,255', line: '#eef1fa', data: [35.7, 36.0, 36.6, 37.3, 38.4, 39.8] },
    kno3:  { name: '硝酸鉀', color: '#9fd8ff', tint: '130,190,255', line: '#5cc8ff', data: [13.3, 31.6, 63.9, 110, 169, 246] },
    sugar: { name: '蔗糖', color: '#ffe6a8', tint: '190,200,210', line: '#ffd166', data: [179, 204, 238, 287, 362, 487] }
  };
  const S = { k: 'salt', water: 100, added: 0, T: 20, crystals: [], parts: [] };
  const solub = (k, T) => { const d = SOL[k].data, i = Math.min(4, Math.floor(T / 20)), f = (T - i * 20) / 20; return d[i] + (d[i + 1] - d[i]) * f; };
  const maxDiss = () => solub(S.k, S.T) * S.water / 100;
  const dissolved = () => Math.min(S.added, maxDiss());

  // 粒子：溶解的散在水中、沒溶解的堆在杯底
  for (let i = 0; i < 260; i++) S.parts.push({ x: Math.random(), y: Math.random(), vx: 0, vy: 0, ph: Math.random() * 6 });

  function draw(ctx, w, h, dt, t) {
    const bw = Math.min(230, w * 0.3), bx = 46, by = 110, bh = Math.max(200, Math.min(h - 260, 400)), bot = by + bh;
    const levelFrac = Math.min(0.9, 0.35 + S.water / 400);
    const wy = by + bh * (1 - levelFrac), ey = 9;           // ey：橢圓（立體感）半高
    const hot = (S.T - 20) / 80;
    // 實驗室背景與桌面
    ctx.fillStyle = Lab.lg(0, 0, 0, h, ['#1d1230', '#2a1a40']); ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(255,255,255,.03)'; for (let x = 0; x < w; x += 46) ctx.fillRect(x, 0, 1, bot + 40);
    const deskY = bot + 40;
    ctx.fillStyle = Lab.lg(0, deskY, 0, h, ['#3c3550', '#221d30']); ctx.fillRect(0, deskY, w, h - deskY);
    Lab.line(0, deskY, w, deskY, 'rgba(255,255,255,.18)', 2);
    // 加熱板
    const hx = bx - 16, hw = bw + 32;
    Lab.card(hx, bot + 6, hw, 34, Lab.lg(0, bot + 6, 0, bot + 40, ['#5a5f6e', '#30333d']), '#777d8f', 6);
    Lab.rr(hx + 10, bot + 6, hw - 20, 6, 3); ctx.fillStyle = hot > 0 ? `rgba(255,${120 - hot * 60},60,${0.3 + hot * 0.7})` : '#454a57'; ctx.fill();
    if (hot > 0) { ctx.save(); ctx.globalAlpha = hot * 0.6; ctx.fillStyle = Lab.rg(bx + bw / 2, bot + 6, 0, bw * 0.6, ['rgba(255,110,60,.6)', 'rgba(255,110,60,0)']); ctx.fillRect(hx, bot - 40, hw, 50); ctx.restore(); }
    Lab.circle(hx + hw - 20, bot + 26, 6, hot > 0 ? '#ff7a4d' : '#2a2d36', '#999', 1.5);
    Lab.text(`${S.T}°C`, hx + 30, bot + 26, '#eef1fa', 12, 'center', 'bold');
    // 燒杯：液體（含頂部液面橢圓）
    const tint = SOL[S.k].tint;
    const conc0 = dissolved() / (dissolved() + S.water);
    ctx.fillStyle = Lab.lg(bx, 0, bx + bw, 0, [`rgba(${tint},${0.32 + conc0 * 0.4})`, `rgba(${tint},${0.18 + conc0 * 0.3})`, `rgba(${tint},${0.36 + conc0 * 0.4})`]);
    ctx.beginPath(); ctx.moveTo(bx, wy); ctx.lineTo(bx, bot); ctx.ellipse(bx + bw / 2, bot, bw / 2, ey, 0, Math.PI, 0, true); ctx.lineTo(bx + bw, wy); ctx.ellipse(bx + bw / 2, wy, bw / 2, ey, 0, 0, Math.PI); ctx.fill();
    ctx.fillStyle = `rgba(${tint},.45)`; ctx.beginPath(); ctx.ellipse(bx + bw / 2, wy, bw / 2, ey, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.2; ctx.stroke();
    // 溶解的粒子（數量依濃度）
    const d = dissolved(), conc = d / (d + S.water);
    const n = Math.round(Math.min(1, conc / 0.75) * S.parts.length);
    const pc = SOL[S.k].color;
    for (let i = 0; i < n; i++) {
      const p = S.parts[i];
      p.x = (p.x + Math.sin(t * 0.8 + p.ph) * 0.0015 + 1) % 1; p.y = (p.y + Math.cos(t * 0.7 + p.ph) * 0.0015 + 1) % 1;
      const px = bx + 10 + p.x * (bw - 20), py = wy + 12 + p.y * (bot - wy - 26);
      ctx.fillStyle = Lab.alpha(pc, 0.85); ctx.beginPath(); ctx.arc(px, py, 2.2, 0, Math.PI * 2); ctx.fill();
    }
    // 沒溶解的晶體：一顆顆有亮面的小方塊
    const und = S.added - d, cnt = Math.min(60, Math.ceil(und / 1.2));
    for (let i = 0; i < cnt; i++) {
      const row = Math.floor(i / 12), col = i % 12, spread = (bw - 40) * (1 - row * 0.12);
      const cx = bx + bw / 2 + (col / 11 - 0.5) * spread + ((i * 7) % 5 - 2), cy = bot - 4 - row * 6 + ((i * 13) % 3);
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(((i * 37) % 10 - 5) * 0.08);
      ctx.fillStyle = Lab.shade(pc, -0.25); ctx.fillRect(-4, -4, 8, 8);
      ctx.fillStyle = Lab.shade(pc, 0.3); ctx.fillRect(-4, -4, 8, 3);
      ctx.restore();
    }
    // 玻璃：杯壁、杯口、底部、反光
    ctx.strokeStyle = 'rgba(220,235,255,.75)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx, bot); ctx.ellipse(bx + bw / 2, bot, bw / 2, ey, 0, Math.PI, 0, true); ctx.lineTo(bx + bw, by); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(bx + bw / 2, by, bw / 2, ey, 0, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(220,235,255,.55)'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx - 2, by); ctx.quadraticCurveTo(bx - 14, by - 6, bx - 10, by - 12); ctx.stroke();   // 杯嘴
    ctx.fillStyle = Lab.lg(bx, 0, bx + bw, 0, [[0, 'rgba(255,255,255,.18)'], [0.08, 'rgba(255,255,255,.04)'], [0.85, 'rgba(255,255,255,0)'], [0.93, 'rgba(255,255,255,.14)'], [1, 'rgba(255,255,255,0)']]);
    ctx.fillRect(bx, by, bw, bh);
    for (let k = 1; k <= 9; k++) { const yy = bot - k * bh / 10; Lab.line(bx + 10, yy, bx + (k % 2 ? 22 : 32), yy, 'rgba(230,240,255,.5)', 1.5); }
    // 溫度計（插在杯中）
    const tx = bx + bw - 34, ttop = by - 70, tb = bot - 26;
    Lab.card(tx - 6, ttop, 12, tb - ttop, 'rgba(255,255,255,.18)', 'rgba(255,255,255,.55)', 6);
    const th = (tb - ttop - 20) * S.T / 100;
    Lab.card(tx - 2.5, tb - 4 - th, 5, th + 4, '#ff4d4d', null, 2.5);
    Lab.circle(tx, tb, 9, Lab.rg(tx, tb, 1, 9, ['#ff9a8a', '#e02c2c'], tx - 3, tb - 3), 'rgba(255,255,255,.6)', 1.5);
    for (let k = 0; k <= 4; k++) Lab.line(tx + 6, tb - 10 - (tb - ttop - 20) * k / 4, tx + 12, tb - 10 - (tb - ttop - 20) * k / 4, 'rgba(255,255,255,.6)', 1);
    Lab.text(`${S.water} g 水`, bx + bw / 2, deskY + 22, '#eef1fa', 14, 'center', 'bold');
    // 放大鏡：微觀下溶質粒子分散在水分子之間
    const mx = bx + bw + 64, my = by + 40, mr = 44;
    if (mx + mr < w * 0.5 + 60) {
      Lab.line(bx + bw * 0.62, wy + (bot - wy) * 0.4, mx - mr * 0.7, my + mr * 0.7, 'rgba(255,255,255,.3)', 1.5, [4, 4]);
      ctx.save(); ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = 'rgba(40,80,140,.9)'; ctx.fillRect(mx - mr, my - mr, mr * 2, mr * 2);
      const nSol = Math.round(conc * 40);
      for (let i = 0; i < 26; i++) { const a = i * 2.4 + t * 0.3, r = (i * 17 % 40); const qx = mx + Math.cos(a) * r, qy = my + Math.sin(a * 1.3) * r * 0.9;
        if (i < nSol) Lab.circle(qx, qy, 4.5, pc, '#fff', 1); else { Lab.circle(qx, qy, 3.2, '#e8f2ff'); Lab.circle(qx - 3, qy + 2.5, 1.8, '#ffffff'); Lab.circle(qx + 3, qy + 2.5, 1.8, '#ffffff'); } }
      ctx.restore();
      Lab.circle(mx, my, mr, null, '#d7dde9', 5);
      Lab.text('微觀', mx, my + mr + 14, 'rgba(238,241,250,.6)', 11);
    }
    // 溶解度曲線
    const cx0 = Math.max(bx + bw + 130, w * 0.5), cw = w - cx0 - 20, ch = bot + 10;
    if (cw > 160) {
      const series = Object.entries(SOL).map(([k, s]) => ({ data: Array.from({ length: 101 }, (_, T) => solub(k, T)), color: k === S.k ? s.line : Lab.alpha(s.line, 0.3), fill: k === S.k }));
      const g = Lab.chart(cx0, 30, cw, ch, series, { min: 0, max: 260, xLabel: '溫度 0～100°C', yLabel: '溶解度（g／100 g 水）' });
      // 目前狀態點：每 100 g 水溶了多少
      const per100 = d / S.water * 100, ptx = g.px + S.T / 100 * g.pw, pty = g.Y(Math.min(260, per100));
      Lab.line(ptx, pty, ptx, g.py + g.ph, 'rgba(255,93,158,.5)', 1, [4, 4]); Lab.line(g.px, pty, ptx, pty, 'rgba(255,93,158,.5)', 1, [4, 4]);
      ctx.save(); ctx.shadowColor = '#ff5d9e'; ctx.shadowBlur = 14; Lab.circle(ptx, pty, 7, '#ff5d9e', '#fff', 2); ctx.restore();
      let ly = 62;
      Object.entries(SOL).forEach(([k, s]) => { const on = k === S.k; Lab.circle(g.px + 14, ly, 5, on ? s.line : Lab.alpha(s.line, 0.4)); Lab.text(s.name, g.px + 24, ly, on ? s.line : 'rgba(238,241,250,.4)', 12, 'left', on ? 'bold' : ''); ly += 20; });
      Lab.text('● 現在的溶液', g.px + g.pw - 4, 62, '#ff5d9e', 13, 'right', 'bold');
    }
  }

  Lab.init({
    draw,
    ui() {
      const d = dissolved(), und = S.added - d, conc = d / (d + S.water) * 100;
      $('w').textContent = S.water + ' g';
      $('added').textContent = S.added + ' g';
      $('diss').textContent = d.toFixed(1) + ' g';
      $('undiss').textContent = und.toFixed(1) + ' g';
      $('conc').textContent = conc.toFixed(1) + '%';
      const max = maxDiss();
      $('state').innerHTML = und > 0.05
        ? `<b>飽和溶液</b>：${S.T}°C 時 ${S.water} g 水最多只能溶 ${max.toFixed(1)} g ${SOL[S.k].name}，多的沉在杯底。<br>濃度 = ${d.toFixed(1)} ÷ (${d.toFixed(1)} + ${S.water}) × 100% = <b>${conc.toFixed(1)}%</b>`
        : `<b>未飽和溶液</b>：還可以再溶 ${(max - d).toFixed(1)} g。<br>濃度 = ${d.toFixed(1)} ÷ (${d.toFixed(1)} + ${S.water}) × 100% = <b>${conc.toFixed(1)}%</b>`;
    }
  });
  Lab.bindGroup('#solute .btn', k => { S.k = k; S.added = 0; });
  document.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => { S.added += Number(b.dataset.add); }));
  $('water').addEventListener('click', () => { S.water = Math.min(300, S.water + 50); });
  $('empty').addEventListener('click', () => { S.water = 100; S.added = 0; });
  Lab.bindSlider('temp', v => { S.T = v; }, v => v + ' °C');
  window.solSim = S;
})();
</script>
<script src="lesson.js" defer></script>
</body>
</html>
