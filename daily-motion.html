<!DOCTYPE html>
<html lang="zh-Hant" data-subject="earth">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>太陽與星星的周日運動</title>
<link rel="stylesheet" href="lab-kit.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="cv" aria-label="天球與太陽、星星周日運動的 3D 模型"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g9">← 回課程總覽</a>
  <h1>周日運動</h1>
  <p class="sub">國三地科 · 宇宙中的天體 ｜ <a class="back" href="moon-phases.html" style="display:inline">換看月相 →</a></p>

  <div class="body">
    <div class="modes" style="--n:2">
      <button class="mode" data-k="sun" aria-pressed="true">太陽一天<br>的路徑</button>
      <button class="mode" data-k="star" aria-pressed="false">星星繞著<br>北極星轉</button>
    </div>

    <div class="group">
      <div class="ctrl">
        <label for="hour">時間 <output id="hourVal"></output></label>
        <input type="range" id="hour" min="0" max="24" step="0.05" value="9">
      </div>
      <div class="row"><button class="btn primary grow" id="play" aria-pressed="false">▶ 讓時間走</button></div>
    </div>

    <div data-mode="sun">
      <div class="group">
        <div class="group-title">日期</div>
        <div class="seg" style="--n:4" id="season">
          <button data-k="0" aria-pressed="false">春分</button>
          <button data-k="23.5" aria-pressed="true">夏至</button>
          <button data-k="0.01" aria-pressed="false">秋分</button>
          <button data-k="-23.5" aria-pressed="false">冬至</button>
        </div>
        <label class="sw" style="margin-top:6px"><input type="checkbox" id="allPaths"><span class="track"></span>同時畫出四季路徑</label>
        <label class="sw"><input type="checkbox" id="showShadow" checked><span class="track"></span>竿子的影子</label>
      </div>
      <div class="group">
        <dl class="live">
          <dt>太陽仰角</dt><dd id="alt">—</dd>
          <dt>太陽方位</dt><dd id="az">—</dd>
          <dt>日出方位</dt><dd id="riseAz">—</dd>
          <dt>白天長度</dt><dd id="dayLen">—</dd>
          <dt>正午仰角</dt><dd id="noon">—</dd>
        </dl>
      </div>
    </div>

    <div data-mode="star" hidden>
      <div class="group">
        <label class="sw"><input type="checkbox" id="trails" checked><span class="track"></span>留下星星的軌跡</label>
        <label class="sw"><input type="checkbox" id="axis" checked><span class="track"></span>地球自轉軸（指向北極星）</label>
        <div class="row"><button class="btn grow" id="clearTrails">清除軌跡</button></div>
      </div>
      <div class="group">
        <dl class="live">
          <dt>北極星仰角</dt><dd id="polaris">—</dd>
        </dl>
      </div>
    </div>

    <div class="group">
      <div class="ctrl">
        <label for="lat">觀察地點緯度 <output id="latVal"></output></label>
        <input type="range" id="lat" min="0" max="90" step="0.5" value="23.5">
      </div>
      <div class="chips" style="--n:4">
        <button class="btn" data-lat="0">赤道</button>
        <button class="btn" data-lat="23.5">台灣</button>
        <button class="btn" data-lat="40">北京</button>
        <button class="btn" data-lat="90">北極</button>
      </div>
    </div>

    <div class="group">
      <p class="note">地球<b>由西向東自轉</b>，所以我們看到天上的太陽、星星都<b>由東向西</b>移動，這叫<b>周日運動</b>。北半球看星星，是繞著<b>北極星</b>逆時針轉；北極星的仰角約等於<b>當地緯度</b>。</p>
    </div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script type="module">
import { start3D, THREE } from './lab3d.js';

const RS = 8;                              // 天球半徑
const D2R = Math.PI / 180;
const S = { mode: 'sun', hour: 9, lat: 23.5, dec: 23.5, play: false };

const L = start3D({
  background: 0x0a1428, camera: [11, 9, 18], target: [0, 2, 0], minDist: 6, maxDist: 40,
  maxPolar: Math.PI * 0.49, ambient: 0.9, key: 0.8, frame, ui
});
const { scene } = L;
const hemi = scene.children.find(o => o.isHemisphereLight);

// 地面：圓盤 + 方位
const ground = new THREE.Mesh(new THREE.CircleGeometry(RS, 64), L.mat(0x2f5b3a, { roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
const rim = new THREE.Mesh(new THREE.TorusGeometry(RS, 0.04, 6, 128), L.glow(0x9fb07a));
rim.rotation.x = Math.PI / 2; scene.add(rim);
[['北', 0, -1], ['南', 0, 1], ['東', 1, 0], ['西', -1, 0]].forEach(([t, x, z]) => L.label(t, new THREE.Vector3(x * (RS + 0.8), 0.2, z * (RS + 0.8)), 'big'));
// 十字線
[[RS, 0], [0, RS]].forEach(([x, z]) => {
  const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-x, 0.01, -z), new THREE.Vector3(x, 0.01, z)]);
  scene.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0x9fb07a, transparent: true, opacity: 0.4 })));
});
// 觀察者和竿子
const person = new THREE.Group();
person.add(new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.7, 12), L.mat(0xffa64d)).translateY(0.35));
person.add(new THREE.Mesh(new THREE.SphereGeometry(0.17, 16, 12), L.mat(0xffe0c2)).translateY(0.85));
person.position.set(-0.6, 0, 0.5);
scene.add(person);
const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.6, 8), L.mat(0xe9e2d0));
pole.position.y = 0.8; scene.add(pole);
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.1), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.45 }));
shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.02; scene.add(shadow);

// 天球（半透明）
const dome = new THREE.Mesh(new THREE.SphereGeometry(RS, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0x6fa8ff, transparent: true, opacity: 0.06, side: THREE.DoubleSide, depthWrite: false }));
scene.add(dome);
const domeLines = new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.SphereGeometry(RS, 12, 6, 0, Math.PI * 2, 0, Math.PI / 2)),
  new THREE.LineBasicMaterial({ color: 0x6fa8ff, transparent: true, opacity: 0.12 }));
scene.add(domeLines);

// 天體方向：赤緯 dec、時角 H（正午為 0，往西為正）
function dir(dec, H, lat, out = new THREE.Vector3()) {
  const P = new THREE.Vector3(0, Math.sin(lat), -Math.cos(lat));   // 北天極
  const M = new THREE.Vector3(0, Math.cos(lat), Math.sin(lat));    // 天赤道與子午線交點（南方）
  const Wv = new THREE.Vector3(-1, 0, 0);                          // 西
  return out.copy(P).multiplyScalar(Math.sin(dec))
    .addScaledVector(M, Math.cos(dec) * Math.cos(H))
    .addScaledVector(Wv, Math.cos(dec) * Math.sin(H));
}

// 太陽
const sun = new THREE.Mesh(new THREE.SphereGeometry(0.45, 24, 16), L.glow(0xffd34d));
scene.add(sun);
const sunHalo = new THREE.Mesh(new THREE.SphereGeometry(0.75, 24, 16), L.glow(0xffa64d, { transparent: true, opacity: 0.25 }));
sun.add(sunHalo);
const sunLbl = L.label('太陽', () => sun.position.clone().add(new THREE.Vector3(0, 0.9, 0)));

// 太陽路徑（一天一圈，地平線下用虛線）
function pathLine(dec, color, opacity = 1) {
  const above = [], below = [];
  for (let i = 0; i <= 240; i++) {
    const p = dir(dec * D2R, (i / 240) * Math.PI * 2 - Math.PI, S.lat * D2R).multiplyScalar(RS);
    (p.y >= 0 ? above : below).push(p);
  }
  const g = new THREE.Group();
  const mk = (pts, dashed) => {
    if (pts.length < 2) return;
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const m = dashed ? new THREE.PointsMaterial({ color, size: 0.06, transparent: true, opacity: 0.35 })
                     : new THREE.PointsMaterial({ color, size: 0.12, transparent: true, opacity });
    g.add(new THREE.Points(geo, m));
  };
  mk(above, false); mk(below, true);
  return g;
}
const SEASONS = [[23.5, 0xff8a5c, '夏至'], [0, 0xffd34d, '春秋分'], [-23.5, 0x6fb6ff, '冬至']];
let paths = new THREE.Group(); scene.add(paths);
function rebuildPaths() {
  scene.remove(paths); paths = new THREE.Group();
  const list = $('allPaths').checked ? SEASONS : [[S.dec, 0xffd34d]];
  list.forEach(([d, c]) => paths.add(pathLine(d, c)));
  scene.add(paths);
}

// 星星
const STARS = [];
const starGroup = new THREE.Group(); scene.add(starGroup);
const trailGroup = new THREE.Group(); scene.add(trailGroup);
function makeStars() {
  starGroup.clear(); STARS.length = 0;
  const add = (dec, ra, size, color, name) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(size, 10, 8), L.glow(color));
    starGroup.add(m);
    const s = { dec: dec * D2R, ra, m, trail: [] };
    if (name) s.lbl = L.label(name, () => m.position.clone().add(new THREE.Vector3(0, 0.45, 0)));
    STARS.push(s);
  };
  add(89.3, 0, 0.16, 0xffffff, '北極星');
  // 北斗七星（示意位置）
  [[62, 11.0], [56, 11.0], [54, 11.9], [57, 12.3], [56, 12.9], [55, 13.4], [49, 13.8]].forEach(([d, h]) => add(d, h * 15 * D2R, 0.11, 0xcfe0ff));
  // 其他星星
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 70; i++) add(Math.asin(rnd() * 2 - 1) / D2R, rnd() * Math.PI * 2, 0.05 + rnd() * 0.05, 0xdfe8ff);
}
makeStars();
const axis = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
  new THREE.LineDashedMaterial({ color: 0xffa64d, dashSize: 0.3, gapSize: 0.2 }));
scene.add(axis);

const tmp = new THREE.Vector3();
function frame(dt) {
  if (S.play) {
    S.hour = (S.hour + dt * (S.mode === 'star' ? 2.4 : 1.2)) % 24;
    hourEl.value = S.hour; Lab.paint(hourEl);
  }
  const lat = S.lat * D2R;
  // 太陽
  const H = (S.hour - 12) * 15 * D2R;
  dir(S.dec * D2R, H, lat, tmp);
  sun.position.copy(tmp).multiplyScalar(RS);
  const up = tmp.y;
  sun.visible = S.mode === 'sun';
  sunLbl.show = sun.visible && up > -0.05;
  paths.visible = S.mode === 'sun';
  L.sun.position.copy(tmp).multiplyScalar(20);
  L.sun.intensity = S.mode === 'star' ? 0.05 : up > 0 ? 1.2 : 0.05;
  hemi.intensity = S.mode === 'star' ? 0.3 : 0.4 + 0.6 * THREE.MathUtils.clamp(up * 3 + 0.3, 0, 1);
  // 天空顏色
  const day = THREE.MathUtils.clamp(up * 4 + 0.3, 0, 1);
  const night = S.mode === 'star' ? 0 : day;
  scene.background.setRGB(0.04 + 0.32 * night, 0.07 + 0.45 * night, 0.16 + 0.62 * night, THREE.SRGBColorSpace);
  // 影子：和太陽方向相反，長度 = 竿高 / tan(仰角)
  const showSh = S.mode === 'sun' && $('showShadow').checked && up > 0.03;
  shadow.visible = showSh;
  if (showSh) {
    const len = Math.min(7, 1.6 * Math.sqrt(1 - up * up) / up);
    shadow.scale.set(len, 1, 1);
    shadow.rotation.set(-Math.PI / 2, 0, Math.atan2(tmp.z, -tmp.x));
    shadow.position.set(-tmp.x / Math.hypot(tmp.x, tmp.z) * len / 2, 0.02, -tmp.z / Math.hypot(tmp.x, tmp.z) * len / 2);
  }
  // 星星：恆星日約 24 小時轉一圈（示意）
  const starMode = S.mode === 'star';
  starGroup.visible = trailGroup.visible = starMode;
  axis.visible = starMode && $('axis').checked;
  if (!starMode) STARS.forEach(s => { if (s.lbl) s.lbl.show = false; });
  if (starMode) {
    const lst = S.hour * 15 * D2R;
    for (const s of STARS) {
      dir(s.dec, lst - s.ra, lat, tmp).multiplyScalar(RS * 0.98);
      s.m.position.copy(tmp);
      s.m.visible = tmp.y > 0;
      if (s.lbl) s.lbl.show = tmp.y > 0;
      if (S.play && $('trails').checked && tmp.y > 0) {
        s.trail.push(tmp.clone());
        if (s.trail.length > 400) s.trail.shift();
      }
    }
    if (S.play && $('trails').checked) drawTrails();
    axis.geometry.setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, Math.sin(lat), -Math.cos(lat)).multiplyScalar(RS * 1.08)]);
    axis.computeLineDistances();
  }
}
let trailTick = 0;
function drawTrails() {
  if (++trailTick % 6) return;
  trailGroup.clear();
  for (const s of STARS) {
    if (s.trail.length < 2) continue;
    trailGroup.add(new THREE.Points(new THREE.BufferGeometry().setFromPoints(s.trail),
      new THREE.PointsMaterial({ color: 0xbcd2ff, size: 0.13, transparent: true, opacity: 0.6 })));
  }
}
function clearTrails() { STARS.forEach(s => (s.trail = [])); trailGroup.clear(); }

// 面板
const $ = id => document.getElementById(id);
const fmtH = h => `${String(Math.floor(h) % 24).padStart(2, '0')}:${String(Math.floor(h % 1 * 60)).padStart(2, '0')}`;
const hourEl = Lab.bindSlider('hour', x => { S.hour = x; }, fmtH);
Lab.bindSlider('lat', x => { S.lat = x; rebuildPaths(); clearTrails(); }, x => x + '°N');
document.querySelectorAll('[data-lat]').forEach(b => b.addEventListener('click', () => {
  const el = $('lat'); el.value = b.dataset.lat; el.dispatchEvent(new Event('input'));
}));
Lab.bindGroup('#season button', k => { S.dec = Number(k); rebuildPaths(); });
$('allPaths').addEventListener('change', rebuildPaths);
$('clearTrails').addEventListener('click', clearTrails);
$('play').addEventListener('click', e => {
  S.play = !S.play;
  e.currentTarget.setAttribute('aria-pressed', String(S.play));
  e.currentTarget.textContent = S.play ? '❚❚ 暫停' : '▶ 讓時間走';
});
Lab.bindGroup('.mode', k => {
  S.mode = k; Lab.showMode(k); clearTrails();
  if (k === 'star') L.fly([12, 6, 16], [0, 3, -2]); else L.fly([11, 9, 18], [0, 2, 0]);
});
rebuildPaths();

const dirName = deg => ['北', '東北', '東', '東南', '南', '西南', '西', '西北'][Math.round(((deg % 360) + 360) % 360 / 45) % 8];
function ui() {
  const lat = S.lat * D2R, dec = S.dec * D2R;
  const p = dir(dec, (S.hour - 12) * 15 * D2R, lat, new THREE.Vector3());
  const alt = Math.asin(p.y) / D2R, az = Math.atan2(p.x, -p.z) / D2R;   // 方位：由北往東量
  $('alt').textContent = alt > 0 ? alt.toFixed(1) + '°' : '在地平線下';
  $('az').textContent = alt > 0 ? dirName(az) : '—';
  const c = -Math.tan(lat) * Math.tan(dec);
  if (c <= -1) { $('dayLen').textContent = '24 小時（永晝）'; $('riseAz').textContent = '不落下'; }
  else if (c >= 1) { $('dayLen').textContent = '0 小時（永夜）'; $('riseAz').textContent = '不升起'; }
  else {
    const H0 = Math.acos(c);
    $('dayLen').textContent = (H0 / D2R * 2 / 15).toFixed(1) + ' 小時';
    const r = dir(dec, -H0, lat, new THREE.Vector3());
    const raz = Math.atan2(r.x, -r.z) / D2R;
    $('riseAz').textContent = Math.abs(raz - 90) < 1 ? '正東' : raz < 90 ? '東偏北' : '東偏南';
  }
  const noon = 90 - Math.abs(S.lat - S.dec);
  $('noon').textContent = noon > 0 ? noon.toFixed(1) + '°' + (S.dec > S.lat ? '（偏北）' : '') : '—';
  $('polaris').textContent = S.lat.toFixed(1) + '°（等於緯度）';
  if (!S.play) return;
  $('hourVal').textContent = fmtH(S.hour);
}
window.daySim = S;
</script>
<script src="lesson.js" defer></script>
</body>
</html>
