<!DOCTYPE html>
<html lang="zh-Hant" data-subject="phy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>摩擦力與壓力</title>
<link rel="stylesheet" href="lab-kit.css">
</head>
<body>
<canvas id="cv" aria-label="摩擦力與固體壓力的模擬"></canvas>

<aside class="panel" id="panel" aria-label="控制面板">
  <button class="collapse" id="collapse">收合</button>
  <a class="back" href="index.html#g8">← 回課程總覽</a>
  <h1>摩擦力與壓力</h1>
  <p class="sub">國二理化 · 力與壓力 ｜ <a class="back" href="force-lab.html" style="display:inline">彈簧與力 →</a></p>

  <div class="body">
    <div class="modes" style="--n:2">
      <button class="mode" data-k="fric" aria-pressed="true">摩擦力</button>
      <button class="mode" data-k="press" aria-pressed="false">壓力</button>
    </div>

    <div data-mode="fric">
      <div class="group">
        <div class="ctrl"><label for="push">推力 <output id="pushVal"></output></label><input type="range" id="push" min="0" max="20" step="0.5" value="0"></div>
        <div class="ctrl"><label for="mass">木箱質量 <output id="massVal"></output></label><input type="range" id="mass" min="1" max="5" step="0.5" value="2"></div>
        <div class="seg" style="--n:3" id="surf">
          <button data-k="ice" aria-pressed="false">冰面</button>
          <button data-k="wood" aria-pressed="true">木板</button>
          <button data-k="sand" aria-pressed="false">砂紙</button>
        </div>
        <div class="row" style="margin-top:8px"><button class="btn grow" id="fReset">把木箱放回原位</button></div>
        <dl class="live" style="margin-top:10px">
          <dt>摩擦力</dt><dd id="fr">—</dd>
          <dt>最大靜摩擦力</dt><dd id="fmax">—</dd>
          <dt>狀態</dt><dd id="fst">—</dd>
        </dl>
      </div>
    </div>

    <div data-mode="press" hidden>
      <div class="group">
        <div class="group-title">磚塊怎麼放（一塊重 20 N）</div>
        <div class="seg" style="--n:3" id="face">
          <button data-k="flat" aria-pressed="true">平放</button>
          <button data-k="side" aria-pressed="false">側放</button>
          <button data-k="up" aria-pressed="false">直立</button>
        </div>
        <div class="ctrl" style="margin-top:8px"><label for="bricks">磚塊數 <output id="bricksVal"></output></label><input type="range" id="bricks" min="1" max="3" step="1" value="1"></div>
        <dl class="live"><dt>接觸面積</dt><dd id="area">—</dd><dt>壓力 P = F ÷ A</dt><dd id="P">—</dd></dl>
      </div>
    </div>

    <div class="group"><div class="result" id="info"></div></div>
  </div>
</aside>

<script src="lab-kit.js"></script>
<script>
(() => {
  const $ = Lab.$;
  const SURF = { ice: [0.08, 0.05, '冰面', '#cfe9ff'], wood: [0.5, 0.35, '木板', '#b98a5a'], sand: [0.8, 0.65, '砂紙', '#8a7d70'] };
  const BR = { flat: [20, 10], side: [20, 5], up: [10, 5] };   // 接觸面的長、寬（cm）
  const S = { mode: 'fric', push: 0, m: 2, surf: 'wood', x: 0, v: 0, hist: [], face: 'flat', n: 1 };
  const g = 9.8;
  function fric() {
    const [us, uk] = SURF[S.surf], N = S.m * g, fmax = us * N, fk = uk * N;
    if (Math.abs(S.v) < 1e-3) return S.push <= fmax ? [S.push, fmax, '靜止（靜摩擦力 = 推力）', false] : [fk, fmax, '開始滑動！', true];
    return [fk, fmax, '滑動中（動摩擦力）', true];
  }
  function drawFric(ctx, w, h, dt) {
    const [f, fmax, , moving] = fric();
    const a = moving ? (S.push - f) / S.m : 0;
    if (moving) { S.v = Math.max(0, S.v + a * dt); if (S.v === 0 && S.push <= fmax) S.v = 0; else S.v = Math.max(S.v, 1e-3); }
    S.x += S.v * dt * 40; if (S.x > w * 0.45) S.x = w * 0.45;
    const gy = h * 0.42, bx = w * 0.18 + S.x, bw = 90 + S.m * 10, bh = 60 + S.m * 8;
    ctx.fillStyle = SURF[S.surf][3]; ctx.fillRect(0, gy, w, 18);
    if (S.surf === 'sand') for (let x = 0; x < w; x += 6) Lab.circle(x, gy + 4 + (x * 7) % 10, 1.5, 'rgba(0,0,0,.35)');
    Lab.card(bx, gy - bh, bw, bh, '#c98a4a', '#ffd9a8', 4);
    Lab.text(`${S.m} kg`, bx + bw / 2, gy - bh / 2, '#fff', 15, 'center', 'bold');
    const sc = 9;
    if (S.push > 0) { Lab.arrow(bx - 10 - S.push * sc, gy - bh / 2, bx - 4, gy - bh / 2, '#ff8a5c', 5, 16); Lab.text(`推力 ${S.push} N`, bx - 14 - S.push * sc / 2, gy - bh / 2 - 22, '#ff8a5c', 14, 'center', 'bold'); }
    if (f > 0) { Lab.arrow(bx + bw / 2, gy + 6, bx + bw / 2 - f * sc, gy + 6, '#5cc8ff', 5, 14); Lab.text(`摩擦力 ${f.toFixed(1)} N`, bx + bw / 2 - f * sc / 2, gy + 34, '#5cc8ff', 14, 'center', 'bold'); }
    // 摩擦力－推力圖
    S.hist.push([S.push, f]); if (S.hist.length > 400) S.hist.shift();
    const cx = 30, cy = gy + 70, cw = w - 60, ch = h - cy - 20;
    if (ch > 80) {
      Lab.card(cx, cy, cw, ch, 'rgba(255,255,255,.03)', 'rgba(255,255,255,.12)', 6);
      const X = F => cx + 40 + F / 20 * (cw - 60), Y = F => cy + ch - 26 - F / 20 * (ch - 46);
      Lab.line(cx + 40, cy + ch - 26, cx + cw - 10, cy + ch - 26, 'rgba(255,255,255,.4)', 1.5); Lab.line(cx + 40, cy + 10, cx + 40, cy + ch - 26, 'rgba(255,255,255,.4)', 1.5);
      Lab.text('推力（N）→', cx + cw - 14, cy + ch - 10, 'rgba(238,241,250,.6)', 12, 'right');
      Lab.text('摩擦力（N）', cx + 46, cy + 18, 'rgba(238,241,250,.6)', 12, 'left');
      Lab.line(cx + 40, Y(fmax), cx + cw - 10, Y(fmax), 'rgba(255,211,77,.5)', 1, [5, 5]);
      Lab.text('最大靜摩擦力', cx + cw - 14, Y(fmax) - 10, '#ffd34d', 12, 'right');
      S.hist.forEach(([F, fr]) => Lab.circle(X(F), Y(fr), 3, '#5cc8ff'));
    }
  }
  function drawPress(ctx, w, h) {
    const [L, Wd] = BR[S.face], A = L * Wd, F = 20 * S.n, P = F / A;
    const sx = w * 0.5, gy = h * 0.62, sw = Math.min(w * 0.8, 520), sh = 90;
    const sink = Math.min(60, P * 14);
    // 海綿（中間凹陷）
    const bw = (S.face === 'up' ? 10 : 20) * 9, half = bw / 2;
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.moveTo(sx - sw / 2, gy); ctx.lineTo(sx - half - 30, gy);
    ctx.quadraticCurveTo(sx - half, gy + sink, sx - half, gy + sink); ctx.lineTo(sx + half, gy + sink);
    ctx.quadraticCurveTo(sx + half, gy + sink, sx + half + 30, gy); ctx.lineTo(sx + sw / 2, gy); ctx.lineTo(sx + sw / 2, gy + sh); ctx.lineTo(sx - sw / 2, gy + sh); ctx.closePath(); ctx.fill();
    for (let i = 0; i < 40; i++) Lab.circle(sx - sw / 2 + 10 + (i * 61) % (sw - 20), gy + 20 + (i * 37) % (sh - 30), 3, 'rgba(180,130,30,.5)');
    Lab.text('海綿', sx - sw / 2 + 30, gy + sh - 14, '#7a5a10', 13);
    // 磚塊
    const bh = (S.face === 'flat' ? 5 : S.face === 'side' ? 10 : 20) * 9;
    for (let i = 0; i < S.n; i++) {
      const y = gy + sink - bh * (i + 1);
      Lab.card(sx - half, y, bw, bh, '#c0573f', '#ff9a80', 3);
    }
    Lab.text(`凹陷 ${(sink / 14).toFixed(1)}`, sx + half + 50, gy + sink / 2, '#ffd166', 14, 'left', 'bold');
    $('area').textContent = `${L} × ${Wd} = ${A} cm²`;
    $('P').textContent = `${F} ÷ ${A} = ${P.toFixed(2)} N/cm²`;
  }

  Lab.init({
    draw(ctx, w, h, dt) { S.mode === 'fric' ? drawFric(ctx, w, h, dt) : drawPress(ctx, w, h); },
    ui() {
      if (S.mode === 'fric') {
        const [f, fmax, st] = fric();
        $('fr').textContent = f.toFixed(1) + ' N'; $('fmax').textContent = fmax.toFixed(1) + ' N'; $('fst').textContent = st;
        $('info').innerHTML = '推不動時，<b>靜摩擦力 = 推力</b>，會跟著推力變大；超過<b>最大靜摩擦力</b>後物體開始滑動，改受<b>動摩擦力</b>（通常比最大靜摩擦力小）。<br>接觸面越<b>粗糙</b>、物體越<b>重</b>（正向力越大），摩擦力越大。';
      } else {
        $('info').innerHTML = '<b>壓力 = 垂直作用力 ÷ 受力面積</b>。同一塊磚，<b>接觸面積越小，壓力越大</b>，海綿凹得越深。磚塊越多（力越大），壓力也越大。';
      }
    }
  });
  Lab.bindGroup('.mode', k => { S.mode = k; Lab.showMode(k); });
  Lab.bindSlider('push', v => { S.push = v; }, v => v + ' N');
  Lab.bindSlider('mass', v => { S.m = v; }, v => v + ' kg');
  Lab.bindGroup('#surf button', k => { S.surf = k; S.hist = []; });
  Lab.bindGroup('#face button', k => { S.face = k; });
  Lab.bindSlider('bricks', v => { S.n = v; }, v => v + ' 塊');
  $('fReset').addEventListener('click', () => { S.x = 0; S.v = 0; S.hist = []; const el = $('push'); el.value = 0; el.dispatchEvent(new Event('input')); });
  window.fpSim = S;
})();
</script>
<script src="lesson.js" defer></script>
</body>
</html>
